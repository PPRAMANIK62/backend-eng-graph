<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" text-anchor="start" class="ink t b">No protection</text>
  <text x="20" y="54" text-anchor="start" class="ink2 n">Requests</text>
  <line x1="130" y1="50" x2="690" y2="50" class="line"/>
  <line x1="170" y1="36" x2="170" y2="136" class="line" stroke-dasharray="4 3"/>
  <text x="170" y="152" text-anchor="middle" class="ink2 n">key expires</text>
  <line x1="570" y1="36" x2="570" y2="136" class="line" stroke-dasharray="4 3"/>
  <text x="570" y="152" text-anchor="middle" class="ink2 n">value stored (3 s later)</text>
  <rect x="130" y="108" width="560" height="26" rx="6" class="box"/>
  <text x="120" y="126" text-anchor="end" class="ink2 n">Database</text>
  <circle cx="190" cy="50" r="4" class="lost"/>
  <line x1="190" y1="56" x2="190" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="228" cy="50" r="4" class="lost"/>
  <line x1="228" y1="56" x2="228" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="266" cy="50" r="4" class="lost"/>
  <line x1="266" y1="56" x2="266" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="304" cy="50" r="4" class="lost"/>
  <line x1="304" y1="56" x2="304" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="342" cy="50" r="4" class="lost"/>
  <line x1="342" y1="56" x2="342" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="380" cy="50" r="4" class="lost"/>
  <line x1="380" y1="56" x2="380" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="418" cy="50" r="4" class="lost"/>
  <line x1="418" y1="56" x2="418" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="456" cy="50" r="4" class="lost"/>
  <line x1="456" y1="56" x2="456" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="494" cy="50" r="4" class="lost"/>
  <line x1="494" y1="56" x2="494" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <circle cx="532" cy="50" r="4" class="lost"/>
  <line x1="532" y1="56" x2="532" y2="105" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <text x="600" y="84" text-anchor="start" class="lost n">every miss queries</text>
  <text x="20" y="186" text-anchor="start" class="ink t b">With coalescing</text>
  <text x="20" y="216" text-anchor="start" class="ink2 n">Requests</text>
  <line x1="130" y1="212" x2="690" y2="212" class="line"/>
  <line x1="170" y1="198" x2="170" y2="298" class="line" stroke-dasharray="4 3"/>
  <text x="170" y="314" text-anchor="middle" class="ink2 n">key expires</text>
  <line x1="570" y1="198" x2="570" y2="298" class="line" stroke-dasharray="4 3"/>
  <text x="570" y="314" text-anchor="middle" class="ink2 n">value stored (3 s later)</text>
  <rect x="130" y="270" width="560" height="26" rx="6" class="box"/>
  <text x="120" y="288" text-anchor="end" class="ink2 n">Database</text>
  <circle cx="190" cy="212" r="4" class="focus"/>
  <circle cx="228" cy="212" r="4" class="old"/>
  <circle cx="266" cy="212" r="4" class="old"/>
  <circle cx="304" cy="212" r="4" class="old"/>
  <circle cx="342" cy="212" r="4" class="old"/>
  <circle cx="380" cy="212" r="4" class="old"/>
  <circle cx="418" cy="212" r="4" class="old"/>
  <circle cx="456" cy="212" r="4" class="old"/>
  <circle cx="494" cy="212" r="4" class="old"/>
  <circle cx="532" cy="212" r="4" class="old"/>
  <line x1="190" y1="218" x2="190" y2="267" class="focus-s" marker-end="url(#arrow)"/>
  <text x="200" y="246" text-anchor="start" class="focus n">1 query</text>
  <text x="420" y="238" text-anchor="middle" class="ink2 n">the rest wait for it, or get the old value</text>
</svg>
