  <rect x="120" y="58" width="144" height="154" rx="6" class="safe-box" fill-opacity="0"/>
  <text x="192" y="232" text-anchor="middle" class="ink n">logs agree up to index 3</text>
  <text x="20" y="136" class="ink2 n">nextIndex</text>
  <text x="624" y="136" text-anchor="middle" class="ink2 n b">11</text>
  <line x1="614" y1="132" x2="588" y2="132" class="line" marker-end="url(#arrow)"/>
  <text x="576" y="136" text-anchor="middle" class="ink2 n b">10</text>
  <line x1="566" y1="132" x2="540" y2="132" class="line" marker-end="url(#arrow)"/>
