<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe{fill:#1baf7a}
    .dash{stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe{fill:#199e70}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- left panel: majority -->
  <text x="180" y="24" text-anchor="middle" class="ink t b">1. Only a majority may elect</text>

  <rect x="20" y="40" width="320" height="96" rx="6" class="safe-box"/>
  <text x="34" y="60" class="ink n b">Side 1: 3 of 5 nodes</text>
  <rect x="34" y="72" width="80" height="30" rx="6" class="focus-box"/>
  <text x="74" y="92" text-anchor="middle" class="ink t">N2</text>
  <rect x="134" y="72" width="80" height="30" rx="6" class="box"/>
  <text x="174" y="92" text-anchor="middle" class="ink t">N3</text>
  <rect x="234" y="72" width="80" height="30" rx="6" class="box"/>
  <text x="274" y="92" text-anchor="middle" class="ink t">N4</text>
  <text x="34" y="124" class="ink n">Majority: elects N2 as the new leader</text>

  <path d="M20,154 L60,146 L100,158 L140,146 L180,158 L220,146 L260,158 L300,146 L340,154" class="lost-s"/>
  <text x="180" y="178" text-anchor="middle" class="lost n b">network partition</text>

  <rect x="20" y="190" width="320" height="96" rx="6" class="box"/>
  <text x="34" y="210" class="ink n b">Side 2: 2 of 5 nodes</text>
  <rect x="34" y="222" width="130" height="30" rx="6" class="lost-box"/>
  <text x="99" y="242" text-anchor="middle" class="ink t">N1, old leader</text>
  <rect x="184" y="222" width="80" height="30" rx="6" class="box"/>
  <text x="224" y="242" text-anchor="middle" class="ink t">N5</text>
  <text x="34" y="274" class="ink n">No majority: can't elect anyone</text>

  <text x="180" y="312" text-anchor="middle" class="lost n b">But N1 still thinks it leads.</text>

  <line x1="360" y1="20" x2="360" y2="320" class="line dash"/>

  <!-- right panel: fencing -->
  <text x="540" y="24" text-anchor="middle" class="ink t b">2. Fence the old leader</text>

  <rect x="386" y="50" width="140" height="44" rx="6" class="lost-box"/>
  <text x="456" y="69" text-anchor="middle" class="ink t">N1, old leader</text>
  <text x="456" y="86" text-anchor="middle" class="ink2 n mono">token 33</text>
  <rect x="556" y="50" width="140" height="44" rx="6" class="focus-box"/>
  <text x="626" y="69" text-anchor="middle" class="ink t">N2, new leader</text>
  <text x="626" y="86" text-anchor="middle" class="ink2 n mono">token 34</text>

  <rect x="456" y="210" width="170" height="50" rx="6" class="box"/>
  <text x="541" y="231" text-anchor="middle" class="ink t">Storage</text>
  <text x="541" y="249" text-anchor="middle" class="ink2 n">highest token seen: 34</text>

  <line x1="620" y1="96" x2="590" y2="207" class="line" marker-end="url(#arrow)"/>
  <text x="614" y="150" class="focus n mono b">write, token 34</text>
  <text x="614" y="166" class="safe n b">accepted</text>

  <line x1="462" y1="96" x2="492" y2="207" class="line" marker-end="url(#arrow)"/>
  <text x="468" y="150" text-anchor="end" class="ink n mono">write, token 33</text>
  <text x="468" y="166" text-anchor="end" class="lost n b">rejected</text>
  <path d="M478,178 L494,194 M494,178 L478,194" class="lost-s"/>

  <text x="540" y="290" text-anchor="middle" class="ink n">Or fence it outright: cut its power,</text>
  <text x="540" y="306" text-anchor="middle" class="ink n">or its network or disk access (STONITH).</text>
</svg>
