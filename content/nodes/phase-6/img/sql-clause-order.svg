<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="150" y="30" text-anchor="middle" class="ink t b">The order you write</text>
<text x="430" y="30" text-anchor="middle" class="ink t b">The order it is applied</text>
<rect x="70" y="60" width="160" height="28" rx="6" class="box"/>
<text x="150" y="79" text-anchor="middle" class="focus t b mono">SELECT</text>
<rect x="70" y="100" width="160" height="28" rx="6" class="box"/>
<text x="150" y="119" text-anchor="middle" class="ink t b mono">FROM … JOIN</text>
<rect x="70" y="140" width="160" height="28" rx="6" class="box"/>
<text x="150" y="159" text-anchor="middle" class="ink t b mono">WHERE</text>
<rect x="70" y="180" width="160" height="28" rx="6" class="box"/>
<text x="150" y="199" text-anchor="middle" class="ink t b mono">GROUP BY</text>
<rect x="70" y="220" width="160" height="28" rx="6" class="box"/>
<text x="150" y="239" text-anchor="middle" class="ink t b mono">HAVING</text>
<rect x="70" y="260" width="160" height="28" rx="6" class="box"/>
<text x="150" y="279" text-anchor="middle" class="ink t b mono">ORDER BY</text>
<rect x="70" y="300" width="160" height="28" rx="6" class="box"/>
<text x="150" y="319" text-anchor="middle" class="ink t b mono">LIMIT</text>
<rect x="350" y="60" width="160" height="28" rx="6" class="box"/>
<text x="362" y="79" class="ink2 n">1</text>
<text x="438" y="79" text-anchor="middle" class="ink t b mono">FROM … JOIN</text>
<text x="524" y="79" class="ink2 n">build one working table</text>
<rect x="350" y="100" width="160" height="28" rx="6" class="box"/>
<text x="362" y="119" class="ink2 n">2</text>
<text x="438" y="119" text-anchor="middle" class="ink t b mono">WHERE</text>
<text x="524" y="119" class="ink2 n">drop rows not true</text>
<rect x="350" y="140" width="160" height="28" rx="6" class="box"/>
<text x="362" y="159" class="ink2 n">3</text>
<text x="438" y="159" text-anchor="middle" class="ink t b mono">GROUP BY</text>
<text x="524" y="159" class="ink2 n">collapse into groups</text>
<rect x="350" y="180" width="160" height="28" rx="6" class="box"/>
<text x="362" y="199" class="ink2 n">4</text>
<text x="438" y="199" text-anchor="middle" class="ink t b mono">HAVING</text>
<text x="524" y="199" class="ink2 n">drop groups</text>
<rect x="350" y="220" width="160" height="28" rx="6" class="box"/>
<text x="362" y="239" class="ink2 n">5</text>
<text x="438" y="239" text-anchor="middle" class="focus t b mono">SELECT</text>
<text x="524" y="239" class="ink2 n">compute output columns</text>
<rect x="350" y="260" width="160" height="28" rx="6" class="box"/>
<text x="362" y="279" class="ink2 n">6</text>
<text x="438" y="279" text-anchor="middle" class="ink t b mono">DISTINCT</text>
<text x="524" y="279" class="ink2 n">drop duplicate rows</text>
<rect x="350" y="300" width="160" height="28" rx="6" class="box"/>
<text x="362" y="319" class="ink2 n">7</text>
<text x="438" y="319" text-anchor="middle" class="ink t b mono">ORDER BY</text>
<text x="524" y="319" class="ink2 n">sort</text>
<rect x="350" y="340" width="160" height="28" rx="6" class="box"/>
<text x="362" y="359" class="ink2 n">8</text>
<text x="438" y="359" text-anchor="middle" class="ink t b mono">LIMIT</text>
<text x="524" y="359" class="ink2 n">keep a slice</text>
<line x1="232" y1="74.0" x2="346" y2="234.0" class="focus-s" marker-end="url(#arrow)"/>
<line x1="232" y1="114.0" x2="346" y2="74.0" class="line" marker-end="url(#arrow)"/>
<line x1="232" y1="154.0" x2="346" y2="114.0" class="line" marker-end="url(#arrow)"/>
<line x1="232" y1="194.0" x2="346" y2="154.0" class="line" marker-end="url(#arrow)"/>
<line x1="232" y1="234.0" x2="346" y2="194.0" class="line" marker-end="url(#arrow)"/>
<line x1="232" y1="274.0" x2="346" y2="314.0" class="line" marker-end="url(#arrow)"/>
<line x1="232" y1="314.0" x2="346" y2="354.0" class="line" marker-end="url(#arrow)"/>
<text x="70" y="390" class="ink2 n">This is the logical order: it fixes what the result must be.</text>
<text x="70" y="408" class="ink2 n">The planner may do the work in any order that gives the same rows.</text>
</svg>
