<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="30" y="110" width="120" height="70" rx="6" class="box"/>
  <text x="90" y="140" text-anchor="middle" class="ink t b">Phone</text>
  <text x="90" y="160" text-anchor="middle" class="ink2 n">QUIC client</text>
  <rect x="540" y="96" width="160" height="98" rx="6" class="box"/>
  <text x="620" y="122" text-anchor="middle" class="ink t b">Server</text>
  <text x="620" y="144" text-anchor="middle" class="ink2 n">IDs <tspan class="mono">c1</tspan> and <tspan class="mono">c2</tspan></text>
  <text x="620" y="164" text-anchor="middle" class="ink2 n">both find the same</text>
  <text x="620" y="182" text-anchor="middle" class="ink2 n">connection</text>
  <path d="M150,125 C260,40 420,40 540,115" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="345" y="30" text-anchor="middle" class="ink2 n">before: Wi-Fi, from 198.51.100.7 port 51000</text>
  <rect x="300" y="42" width="90" height="26" rx="6" class="box"/>
  <text x="345" y="60" text-anchor="middle" class="ink2 n mono">DCID c1</text>
  <path d="M150,165 C260,250 420,250 540,175" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="300" y="222" width="90" height="26" rx="6" class="box"/>
  <text x="345" y="240" text-anchor="middle" class="focus n mono b">DCID c2</text>
  <text x="345" y="274" text-anchor="middle" class="focus n">after: mobile data, from 203.0.113.9 port 40200</text>
  <text x="345" y="148" text-anchor="middle" class="ink n">new address and port,</text>
  <text x="345" y="164" text-anchor="middle" class="ink n">same connection, fresh ID</text>
  <text x="620" y="222" text-anchor="middle" class="ink2 n">checks the new path,</text>
  <text x="620" y="238" text-anchor="middle" class="ink2 n">then carries on</text>
</svg>
