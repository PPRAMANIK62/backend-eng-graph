<line x1="314" y1="112" x2="336" y2="112" class="line" marker-end="url(#arrow)"/>
<text x="304" y="176" text-anchor="middle" class="ink2 n">1 build</text>
<text x="440" y="58" text-anchor="middle" class="ink2 n">larger</text>
<rect x="418" y="70" width="44" height="24" rx="4" class="box"/>
<text x="440.0" y="86" text-anchor="middle" class="ink n mono">7</text>
<rect x="418" y="100" width="44" height="24" rx="4" class="box"/>
