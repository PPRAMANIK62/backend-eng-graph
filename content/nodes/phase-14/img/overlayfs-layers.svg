<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="62" class="ink t b">Merged view</text>
  <text x="20" y="80" class="ink2 n">the container's /</text>
  <text x="20" y="172" class="ink t b">Upper layer</text>
  <text x="20" y="190" class="ink2 n">writable,</text>
  <text x="20" y="204" class="ink2 n">starts empty</text>
  <text x="20" y="252" class="ink t b">App layer</text>
  <text x="20" y="270" class="ink2 n">read-only</text>
  <text x="20" y="332" class="ink t b">Base layer</text>
  <text x="20" y="350" class="ink2 n">read-only</text>
  <rect x="150" y="316" width="125" height="40" rx="6" class="box"/>
  <text x="212.5" y="341" text-anchor="middle" class="ink n mono">/bin</text>
  <rect x="285" y="316" width="125" height="40" rx="6" class="box"/>
  <text x="347.5" y="341" text-anchor="middle" class="ink n mono">/etc/os-release</text>
  <rect x="420" y="316" width="125" height="40" rx="6" class="box"/>
  <text x="482.5" y="341" text-anchor="middle" class="ink2 n mono">/etc/app.conf</text>
  <rect x="555" y="236" width="125" height="40" rx="6" class="box"/>
  <text x="617.5" y="261" text-anchor="middle" class="ink n mono">/app/server</text>
  <rect x="285" y="156" width="125" height="40" rx="6" class="box"/>
  <rect x="285" y="156" width="125" height="40" rx="6" class="lost-s" stroke-width="1.5"/>
  <text x="347.5" y="181" text-anchor="middle" class="lost b n mono">whiteout</text>
  <rect x="420" y="156" width="125" height="40" rx="6" class="box"/>
  <rect x="420" y="156" width="125" height="40" rx="6" class="focus-s" stroke-width="1.5"/>
  <text x="482.5" y="181" text-anchor="middle" class="focus b n mono">/etc/app.conf</text>
  <rect x="150" y="46" width="125" height="40" rx="6" class="box"/>
  <text x="212.5" y="71" text-anchor="middle" class="ink n mono">/bin</text>
  <rect x="555" y="46" width="125" height="40" rx="6" class="box"/>
  <text x="617.5" y="71" text-anchor="middle" class="ink n mono">/app/server</text>
  <rect x="420" y="46" width="125" height="40" rx="6" class="box"/>
  <rect x="420" y="46" width="125" height="40" rx="6" class="focus-s" stroke-width="1.5"/>
  <text x="482.5" y="71" text-anchor="middle" class="focus b n mono">/etc/app.conf</text>
  <text x="347.5" y="71" text-anchor="middle" class="ink2 n">no os-release</text>
  <line x1="212.5" y1="314" x2="212.5" y2="90" class="line"  marker-end="url(#arrow)"/>
  <line x1="617.5" y1="234" x2="617.5" y2="90" class="line"  marker-end="url(#arrow)"/>
  <line x1="482.5" y1="154" x2="482.5" y2="90" class="line"  marker-end="url(#arrow)"/>
  <line x1="440" y1="314" x2="440" y2="200" class="focus-s" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="450" y="222" class="focus n">copy-up on first write</text>
  <text x="347.5" y="222" text-anchor="middle" class="ink2 n">hides the base file</text>
</svg>
