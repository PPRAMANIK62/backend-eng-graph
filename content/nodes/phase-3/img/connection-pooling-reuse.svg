<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="28" class="ink t b">A new connection for every request</text>
  <rect x="40" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="71.0" y="64" text-anchor="middle" class="ink2 n">TCP</text>
  <rect x="106" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="137.0" y="64" text-anchor="middle" class="ink2 n">TLS</text>
  <rect x="172" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="203.0" y="64" text-anchor="middle" class="focus n b">request</text>
  <rect x="266" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="297.0" y="64" text-anchor="middle" class="ink2 n">TCP</text>
  <rect x="332" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="363.0" y="64" text-anchor="middle" class="ink2 n">TLS</text>
  <rect x="398" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="429.0" y="64" text-anchor="middle" class="focus n b">request</text>
  <rect x="492" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="523.0" y="64" text-anchor="middle" class="ink2 n">TCP</text>
  <rect x="558" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="589.0" y="64" text-anchor="middle" class="ink2 n">TLS</text>
  <rect x="624" y="44" width="62" height="30" rx="6" class="box"/>
  <text x="655.0" y="64" text-anchor="middle" class="focus n b">request</text>
  <text x="40" y="96" class="ink2 n">Every request waits for a TCP handshake and then a TLS handshake before it can go out.</text>
  <line x1="40" y1="120" x2="680" y2="120" class="line" stroke-dasharray="4 4"/>
  <text x="40" y="150" class="ink t b">One pooled connection, reused</text>
  <rect x="40" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="71.0" y="186" text-anchor="middle" class="ink2 n">TCP</text>
  <rect x="106" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="137.0" y="186" text-anchor="middle" class="ink2 n">TLS</text>
  <rect x="172" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="203.0" y="186" text-anchor="middle" class="focus n b">request</text>
  <line x1="238" y1="181" x2="306" y2="181" class="line" stroke-dasharray="3 3"/>
  <text x="272" y="214" text-anchor="middle" class="ink2 n">idle in pool</text>
  <rect x="310" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="341.0" y="186" text-anchor="middle" class="focus n b">request</text>
  <line x1="376" y1="181" x2="444" y2="181" class="line" stroke-dasharray="3 3"/>
  <text x="410" y="214" text-anchor="middle" class="ink2 n">idle in pool</text>
  <rect x="448" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="479.0" y="186" text-anchor="middle" class="focus n b">request</text>
  <line x1="514" y1="181" x2="582" y2="181" class="line" stroke-dasharray="3 3"/>
  <rect x="586" y="166" width="62" height="30" rx="6" class="box"/>
  <text x="617.0" y="186" text-anchor="middle" class="focus n b">request</text>
  <text x="40" y="244" class="ink2 n">Only the first request pays for setup. The rest go out on a connection that is already open.</text>
</svg>
