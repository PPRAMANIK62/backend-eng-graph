<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="360" y="26" text-anchor="middle" class="ink t b">Task "nightly_report", due at 02:00, on two servers</text>
<rect x="30" y="60" width="200" height="56" rx="6" class="box"/>
<text x="130" y="84" text-anchor="middle" class="ink t b">Scheduler on server 1</text>
<text x="130" y="104" text-anchor="middle" class="ink2 n">02:00, it's due: enqueue</text>
<rect x="30" y="200" width="200" height="56" rx="6" class="box"/>
<text x="130" y="224" text-anchor="middle" class="ink t b">Scheduler on server 2</text>
<text x="130" y="244" text-anchor="middle" class="ink2 n">02:00, it's due: enqueue</text>
<rect x="330" y="50" width="360" height="220" rx="6" class="box"/>
<text x="510" y="74" text-anchor="middle" class="ink t b">Database</text>
<text x="350" y="100" class="ink2 n">one transaction per scheduler:</text>
<text x="350" y="120" class="ink n mono">INSERT job</text>
<text x="350" y="140" class="ink n mono">INSERT recurring_execution</text>
<text x="366" y="158" class="ink n mono">(task_key, run_at)</text>
<text x="350" y="186" class="ink2 n">unique index on</text>
<text x="452" y="186" class="ink n mono">(task_key, run_at)</text>
<rect x="350" y="200" width="320" height="52" rx="6" class="safe-box"/>
<text x="364" y="222" class="ink n mono">nightly_report, 02:00</text>
<text x="364" y="240" class="ink2 n">one row, one job</text>
<line x1="232" y1="88" x2="340" y2="120" class="line" marker-end="url(#arrow)"/>
<text x="250" y="88" class="focus n b">commits</text>
<line x1="232" y1="228" x2="340" y2="150" class="line" marker-end="url(#arrow)"/>
<text x="30" y="280" class="lost n b">unique violation: rolls back,</text>
<text x="30" y="298" class="lost n b">its job insert goes too</text>
<text x="360" y="320" text-anchor="middle" class="ink2 n">Whichever commits first wins; the other finds the slot taken and does nothing.</text>
</svg>