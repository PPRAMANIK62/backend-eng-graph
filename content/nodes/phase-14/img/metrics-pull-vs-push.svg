<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">Pull: the server scrapes</text>
  <text x="390" y="24" class="ink t b">Push: the program sends</text>
  <line x1="370" y1="10" x2="370" y2="330" class="line"/>
  <rect x="115" y="44" width="140" height="40" rx="6" class="box"/><text x="185" y="69" text-anchor="middle" class="ink t">Prometheus</text>
  <rect x="30" y="200" width="100" height="56" rx="6" class="box"/>
  <text x="80" y="222" text-anchor="middle" class="ink t">instance 1</text>
  <text x="80" y="243" text-anchor="middle" class="ink2 n mono">/metrics</text>
  <line x1="185" y1="86" x2="80" y2="196" class="focus-s" marker-end="url(#arrow)"/>
  <text x="80" y="276" text-anchor="middle" class="ink2 n mono b">up=1</text>
  <rect x="140" y="200" width="100" height="56" rx="6" class="box"/>
  <text x="190" y="222" text-anchor="middle" class="ink t">instance 2</text>
  <text x="190" y="243" text-anchor="middle" class="ink2 n mono">/metrics</text>
  <line x1="185" y1="86" x2="190" y2="196" class="focus-s" marker-end="url(#arrow)"/>
  <text x="190" y="276" text-anchor="middle" class="ink2 n mono b">up=1</text>
  <rect x="250" y="200" width="100" height="56" rx="6" class="box"/>
  <text x="300" y="222" text-anchor="middle" class="ink t">instance 3</text>
  <text x="300" y="243" text-anchor="middle" class="ink2 n mono">/metrics</text>
  <line x1="185" y1="86" x2="300" y2="196" class="focus-s" marker-end="url(#arrow)"/>
  <text x="300" y="276" text-anchor="middle" class="lost n mono b">up=0</text>
  <line x1="256" y1="206" x2="344" y2="250" class="lost-s"/>
  <line x1="344" y1="206" x2="256" y2="250" class="lost-s"/>
  <rect x="118" y="124" width="134" height="36" rx="4" class="box"/>
  <text x="185" y="139" text-anchor="middle" class="ink n">scrape each target</text><text x="185" y="154" text-anchor="middle" class="ink n">every 15 to 30 s</text>
  <text x="20" y="302" class="ink2 n">Each service counts in memory. A failed scrape is</text>
  <text x="20" y="318" class="ink2 n">recorded as up=0, so a dead instance shows at once.</text>
  <rect x="390" y="56" width="100" height="44" rx="6" class="box"/><text x="440" y="83" text-anchor="middle" class="ink t">batch job</text>
  <line x1="492" y1="78" x2="566" y2="78" class="focus-s" marker-end="url(#arrow)"/>
  <text x="529" y="70" text-anchor="middle" class="ink2 n">push</text>
  <rect x="570" y="56" width="120" height="44" rx="6" class="box"/><text x="630" y="83" text-anchor="middle" class="ink t">Pushgateway</text>
  <rect x="570" y="150" width="120" height="40" rx="6" class="box"/><text x="630" y="175" text-anchor="middle" class="ink t">Prometheus</text>
  <line x1="630" y1="148" x2="630" y2="104" class="line" marker-end="url(#arrow)"/>
  <text x="638" y="130" class="ink2 n">scrape</text>
  <text x="390" y="124" class="ink2 n">Only for batch job results.</text>
  <text x="390" y="140" class="ink2 n">Keeps series until deleted;</text>
  <text x="390" y="156" class="ink2 n">no up signal for the job.</text>
  <rect x="390" y="228" width="100" height="44" rx="6" class="box"/><text x="440" y="255" text-anchor="middle" class="ink t">OTel SDK</text>
  <line x1="492" y1="250" x2="566" y2="250" class="focus-s" marker-end="url(#arrow)"/>
  <text x="529" y="242" text-anchor="middle" class="ink2 n">export</text>
  <rect x="570" y="228" width="120" height="44" rx="6" class="box"/><text x="630" y="255" text-anchor="middle" class="ink t">collector</text>
  <text x="390" y="302" class="ink2 n">The SDK exports at a fixed interval;</text>
  <text x="390" y="318" class="ink2 n">the collector can forward to Prometheus.</text>
</svg>
