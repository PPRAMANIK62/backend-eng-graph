<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="60" y="14" width="120" height="34" rx="6" class="box"/><text x="120" y="36" text-anchor="middle" class="ink t b">Client A</text>
  <rect x="300" y="14" width="120" height="34" rx="6" class="box"/><text x="360" y="36" text-anchor="middle" class="ink t b">Redis</text>
  <rect x="540" y="14" width="120" height="34" rx="6" class="box"/><text x="600" y="36" text-anchor="middle" class="ink t b">Client B</text>
  <line x1="120" y1="48" x2="120" y2="470" class="line" stroke-dasharray="3 4"/>
  <line x1="360" y1="48" x2="360" y2="262" class="line" stroke-dasharray="3 4"/><line x1="360" y1="292" x2="360" y2="372" class="line" stroke-dasharray="3 4"/><line x1="360" y1="402" x2="360" y2="470" class="line" stroke-dasharray="3 4"/>
  <line x1="600" y1="48" x2="600" y2="470" class="line" stroke-dasharray="3 4"/>
  <line x1="126" y1="80" x2="354" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="240.0" y="73" text-anchor="middle" class="ink n mono">WATCH views, GET views</text>
  <line x1="354" y1="116" x2="126" y2="116" class="line" marker-end="url(#arrow)"/>
  <text x="240.0" y="109" text-anchor="middle" class="ink n mono">10</text>
  <line x1="594" y1="160" x2="366" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="480.0" y="153" text-anchor="middle" class="ink n mono">WATCH views, GET views</text>
  <line x1="366" y1="196" x2="594" y2="196" class="line" marker-end="url(#arrow)"/>
  <text x="480.0" y="189" text-anchor="middle" class="ink n mono">10</text>
  <line x1="126" y1="250" x2="354" y2="250" class="line" marker-end="url(#arrow)"/>
  <text x="240.0" y="243" text-anchor="middle" class="ink n mono">MULTI, SET views 11, EXEC</text>
  <rect x="290" y="262" width="140" height="30" rx="6" class="safe-box"/><text x="360" y="282" text-anchor="middle" class="ink n">views = 11</text>
  <line x1="354" y1="320" x2="126" y2="320" class="line" marker-end="url(#arrow)"/>
  <text x="240.0" y="313" text-anchor="middle" class="ink n mono">OK</text>
  <line x1="594" y1="360" x2="366" y2="360" class="line" marker-end="url(#arrow)"/>
  <text x="480.0" y="353" text-anchor="middle" class="ink n mono">MULTI, SET views 11, EXEC</text>
  <rect x="260" y="372" width="200" height="30" rx="6" class="lost-box"/><text x="360" y="392" text-anchor="middle" class="ink n">views changed: abort</text>
  <line x1="366" y1="430" x2="594" y2="430" class="line" marker-end="url(#arrow)"/>
  <text x="480.0" y="423" text-anchor="middle" class="ink n mono">(nil)</text>
  <text x="590" y="458" text-anchor="end" class="ink2 n">B retries: WATCH, reads 11, writes 12</text>
</svg>
