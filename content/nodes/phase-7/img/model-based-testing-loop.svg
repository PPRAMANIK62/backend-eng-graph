<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="20" y="120" width="130" height="64" rx="6" class="box"/>
  <text x="85.0" y="148.0" text-anchor="middle" class="ink t b">Generator</text>
  <text x="85.0" y="166.0" text-anchor="middle" class="ink2 n">random operation</text>
  <rect x="262" y="60" width="160" height="56" rx="6" class="box"/>
  <text x="342.0" y="84.0" text-anchor="middle" class="ink t b">Engine under test</text>
  <text x="342.0" y="102.0" text-anchor="middle" class="ink2 n">log, memtable, SSTables</text>
  <rect x="262" y="188" width="160" height="56" rx="6" class="box"/>
  <text x="342.0" y="212.0" text-anchor="middle" class="ink t b">Model</text>
  <text x="342.0" y="230.0" text-anchor="middle" class="ink2 n mono">a plain map</text>
  <rect x="500" y="116" width="190" height="72" rx="6" class="box"/>
  <text x="595.0" y="148.0" text-anchor="middle" class="ink t b">Compare results</text>
  <text x="595.0" y="166.0" text-anchor="middle" class="ink2 n">then check invariants</text>
  <text x="156" y="143" class="ink2 n mono">Put(k3, v9)</text>
  <path d="M150,152 L240,152 L240,88 L258,88" class="line" marker-end="url(#arrow)"/>
  <path d="M240,152 L240,216 L258,216" class="line" marker-end="url(#arrow)"/>
  <path d="M420,88 L460,88 L460,140 L496,140" class="line" marker-end="url(#arrow)"/>
  <path d="M420,216 L460,216 L460,164 L496,164" class="line" marker-end="url(#arrow)"/>
  <path d="M595,116 L595,30 L85,30 L85,116" class="line" marker-end="url(#arrow)"/>
  <text x="345" y="22" text-anchor="middle" class="ink2 n">same: next operation</text>
  <path d="M595,188 L595,286" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <text x="605" y="244" class="ink n">differ</text>
  <rect x="500" y="290" width="190" height="64" rx="6" class="box"/>
  <text x="595.0" y="318.0" text-anchor="middle" class="ink t b">Shrink</text>
  <text x="595.0" y="336.0" text-anchor="middle" class="ink2 n">smallest sequence that fails</text>
  <path d="M500,322 L426,322" class="line" marker-end="url(#arrow)"/>
  <rect x="262" y="294" width="160" height="56" rx="6" class="box"/>
  <text x="342.0" y="318.0" text-anchor="middle" class="ink t b">Save it</text>
  <text x="342.0" y="336.0" text-anchor="middle" class="ink2 n">as a regression test</text>
</svg>
