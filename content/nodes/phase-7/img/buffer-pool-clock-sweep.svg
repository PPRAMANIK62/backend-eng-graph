<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="182.0" y="28.0" width="96" height="44" rx="6" class="box"/>
  <text x="230.0" y="46.0" text-anchor="middle" class="ink n b">buffer 1</text>
  <text x="230.0" y="63.0" text-anchor="middle" class="ink2 n">count 1</text>
  <rect x="302.2081528017131" y="71.93398282201788" width="96" height="44" rx="6" class="box"/>
  <text x="350.2081528017131" y="89.93398282201788" text-anchor="middle" class="ink n b">buffer 2</text>
  <text x="350.2081528017131" y="106.93398282201788" text-anchor="middle" class="ink2 n">count 0, pinned</text>
  <rect x="352.0" y="178.0" width="96" height="44" rx="6" class="box"/>
  <text x="400.0" y="196.0" text-anchor="middle" class="ink n b">buffer 3</text>
  <text x="400.0" y="213.0" text-anchor="middle" class="ink2 n">count 2 → 1</text>
  <rect x="302.2081528017131" y="284.06601717798213" width="96" height="44" rx="6" class="box"/>
  <text x="350.2081528017131" y="302.06601717798213" text-anchor="middle" class="ink n b">buffer 4</text>
  <text x="350.2081528017131" y="319.06601717798213" text-anchor="middle" class="ink2 n">pinned</text>
  <rect x="182.0" y="328.0" width="96" height="44" rx="6" class="box"/>
  <text x="230.0" y="346.0" text-anchor="middle" class="ink n b">buffer 5</text>
  <text x="230.0" y="363.0" text-anchor="middle" class="ink2 n">count 1 → 0</text>
  <rect x="61.79184719828693" y="284.06601717798213" width="96" height="44" rx="6" class="box"/>
  <rect x="62" y="284" width="96" height="44" rx="6" class="focus-s"/>
  <text x="109.79184719828693" y="302.06601717798213" text-anchor="middle" class="focus n b">buffer 6</text>
  <text x="109.79184719828693" y="319.06601717798213" text-anchor="middle" class="focus n">count 0</text>
  <rect x="12.0" y="178.00000000000003" width="96" height="44" rx="6" class="box"/>
  <text x="60.0" y="196.00000000000003" text-anchor="middle" class="ink n b">buffer 7</text>
  <text x="60.0" y="213.00000000000003" text-anchor="middle" class="ink2 n">count 3</text>
  <rect x="61.79184719828689" y="71.93398282201788" width="96" height="44" rx="6" class="box"/>
  <text x="109.79184719828689" y="89.93398282201788" text-anchor="middle" class="ink n b">buffer 8</text>
  <text x="109.79184719828689" y="106.93398282201788" text-anchor="middle" class="ink2 n">count 1</text>
  <line x1="230" y1="200" x2="346.0" y2="196.0" class="line" marker-end="url(#arrow)"/>
  <circle cx="230" cy="200" r="4" class="ink"/>
  <text x="220" y="188" text-anchor="middle" class="ink2 n">clock hand</text>
  <path d="M333,216 A105,80 0 0 1 168,265" class="focus-s" marker-end="url(#arrow)"/>
  <text x="230" y="300" text-anchor="middle" class="focus n">sweep</text>
  <text x="470" y="40" class="ink n b">The hand moves clockwise from buffer 3:</text>
  <text x="470" y="66" class="ink n">buffer 3: count 2, lower it to 1, move on</text>
  <text x="470" y="86" class="ink n">buffer 4: pinned, skip it</text>
  <text x="470" y="106" class="ink n">buffer 5: count 1, lower it to 0, move on</text>
  <text x="470" y="126" class="focus n">buffer 6: count 0 and unpinned: the victim</text>
  <text x="470" y="166" class="ink2 n">Every pin adds 1 to a buffer's count,</text>
  <text x="470" y="182" class="ink2 n">up to a small limit. Pages in use keep</text>
  <text x="470" y="198" class="ink2 n">getting their count back before the</text>
  <text x="470" y="214" class="ink2 n">hand returns.</text>

</svg>
