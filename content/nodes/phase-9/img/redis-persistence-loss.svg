<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

    <text x="20" y="30" class="ink t b">What a power cut loses</text>
  <text x="640" y="30" text-anchor="middle" class="lost t b">power cut</text>
  <text x="20" y="74" class="ink t b">RDB snapshots</text>
  <text x="20" y="92" class="ink2 n">save points</text>
  <line x1="170" y1="80" x2="640" y2="80" class="line"/>
  <rect x="197" y="68" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="417" y="68" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="423" y="72" width="217" height="16" rx="3" class="lost"/>
  <text x="170" y="112" class="ink2 n">lost: everything since the last snapshot, often minutes</text>
  <text x="20" y="154" class="ink t b">AOF, fsync no</text>
  <text x="20" y="172" class="ink2 n">kernel flushes</text>
  <line x1="170" y1="160" x2="640" y2="160" class="line"/>
  <rect x="257" y="148" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="497" y="148" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="503" y="152" width="137" height="16" rx="3" class="lost"/>
  <text x="170" y="192" class="ink2 n">lost: up to about 30 s (Linux writeback)</text>
  <text x="20" y="234" class="ink t b">AOF, everysec</text>
  <text x="20" y="252" class="ink2 n">fsync each second</text>
  <line x1="170" y1="240" x2="640" y2="240" class="line"/>
  <rect x="187" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="237" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="287" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="337" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="387" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="437" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="487" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="537" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="587" y="228" width="6" height="24" rx="2" class="safe-box"/>
  <rect x="593" y="232" width="47" height="16" rx="3" class="lost"/>
  <text x="170" y="272" class="ink2 n">lost: about 1 s, up to 2 s if fsync is slow</text>
  <text x="20" y="314" class="ink t b">AOF, always</text>
  <text x="20" y="332" class="ink2 n">fsync before reply</text>
  <line x1="170" y1="320" x2="640" y2="320" class="line"/>
  <rect x="170" y="312" width="470" height="16" rx="3" class="safe-box"/>
  <text x="170" y="352" class="ink2 n">nothing that was acknowledged</text>
  <line x1="640" y1="44" x2="640" y2="360" class="lost-s"/>
  <text x="20" y="384" class="ink2 n">Green: data made durable (snapshot written, or fsync done). Orange: writes still only in</text>
  <text x="20" y="402" class="ink2 n">memory or the page cache. Not to scale. If only the Redis process crashes and the machine</text>
  <text x="20" y="420" class="ink2 n">stays up, everysec loses about one write.</text>
</svg>
