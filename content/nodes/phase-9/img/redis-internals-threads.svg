<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- clients -->
  <text x="60" y="28" text-anchor="middle" class="ink t b">Clients</text>
  <rect x="20" y="50" width="80" height="36" rx="6" class="box"/>
  <text x="60" y="73" text-anchor="middle" class="ink t">A</text>
  <rect x="20" y="104" width="80" height="36" rx="6" class="box"/>
  <text x="60" y="127" text-anchor="middle" class="ink t">B</text>
  <rect x="20" y="170" width="80" height="36" rx="6" class="box"/>
  <text x="60" y="193" text-anchor="middle" class="ink t">C</text>
  <rect x="20" y="224" width="80" height="36" rx="6" class="box"/>
  <text x="60" y="247" text-anchor="middle" class="ink t">D</text>

  <!-- I/O threads -->
  <text x="235" y="28" text-anchor="middle" class="ink t b">I/O threads (optional)</text>
  <rect x="150" y="46" width="170" height="98" rx="6" class="box"/>
  <text x="164" y="68" class="ink t b">I/O thread 1</text>
  <text x="164" y="88" class="ink2 n">own event loop</text>
  <text x="164" y="106" class="ink2 n">read, parse RESP</text>
  <text x="164" y="124" class="ink2 n">write replies</text>
  <rect x="150" y="166" width="170" height="98" rx="6" class="box"/>
  <text x="164" y="188" class="ink t b">I/O thread 2</text>
  <text x="164" y="208" class="ink2 n">own event loop</text>
  <text x="164" y="226" class="ink2 n">read, parse RESP</text>
  <text x="164" y="244" class="ink2 n">write replies</text>

  <line x1="102" y1="68" x2="148" y2="80" class="line" marker-end="url(#arrow)"/>
  <line x1="102" y1="122" x2="148" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="102" y1="188" x2="148" y2="200" class="line" marker-end="url(#arrow)"/>
  <line x1="102" y1="242" x2="148" y2="230" class="line" marker-end="url(#arrow)"/>

  <!-- main thread -->
  <text x="480" y="28" text-anchor="middle" class="ink t b">Main thread</text>
  <rect x="380" y="46" width="200" height="218" rx="6" fill="none" class="focus-s"/>
  <text x="394" y="70" class="focus t b">runs every command,</text>
  <text x="394" y="88" class="focus t b">one at a time</text>
  <rect x="396" y="104" width="168" height="28" rx="6" class="box"/>
  <text x="408" y="123" class="ink n mono">INCR page:home  (A)</text>
  <rect x="396" y="140" width="168" height="28" rx="6" class="box"/>
  <text x="408" y="159" class="ink n mono">GET user:7      (C)</text>
  <rect x="396" y="176" width="168" height="28" rx="6" class="box"/>
  <text x="408" y="195" class="ink n mono">SET cart:9 ...  (B)</text>
  <text x="394" y="232" class="ink2 n">also: timers, active expiry,</text>
  <text x="394" y="250" class="ink2 n">replicas and pub/sub clients</text>

  <line x1="322" y1="95" x2="378" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="350" y="92" text-anchor="middle" class="ink2 n">parsed</text>
  <line x1="378" y1="190" x2="322" y2="215" class="line" marker-end="url(#arrow)"/>
  <text x="350" y="228" text-anchor="middle" class="ink2 n">reply</text>

  <!-- keyspace -->
  <rect x="610" y="104" width="96" height="100" rx="6" class="box"/>
  <text x="658" y="136" text-anchor="middle" class="ink t b">Keyspace</text>
  <text x="658" y="156" text-anchor="middle" class="ink2 n">in memory,</text>
  <text x="658" y="172" text-anchor="middle" class="ink2 n">no locks</text>
  <line x1="582" y1="154" x2="608" y2="154" class="line" marker-end="url(#arrow)"/>

  <!-- background work -->
  <rect x="40" y="330" width="200" height="58" rx="6" class="box"/>
  <text x="54" y="354" class="ink t b">Background thread</text>
  <text x="54" y="374" class="ink2 n">fsync of the append-only file</text>
  <rect x="260" y="330" width="200" height="58" rx="6" class="box"/>
  <text x="274" y="354" class="ink t b">Background thread</text>
  <text x="274" y="374" class="ink2 n">free big values (UNLINK)</text>
  <rect x="480" y="330" width="200" height="58" rx="6" class="box"/>
  <text x="494" y="354" class="ink t b">Forked child process</text>
  <text x="494" y="374" class="ink2 n">RDB snapshot, AOF rewrite</text>
  <line x1="440" y1="266" x2="140" y2="328" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="266" x2="360" y2="328" class="line" marker-end="url(#arrow)"/>
  <line x1="500" y1="266" x2="580" y2="328" class="line" marker-end="url(#arrow)"/>

  <text x="360" y="420" text-anchor="middle" class="ink2 n">Bottom row: work the main thread hands off. I/O threads are off by</text>
  <text x="360" y="438" text-anchor="middle" class="ink2 n">default; without them the main thread also does every read and write.</text>
</svg>
