<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  
  <text x="100" y="28" text-anchor="middle" class="ink t b">Lock service</text>
  <line x1="100" y1="40" x2="100" y2="405" class="line"/>
  <text x="270" y="28" text-anchor="middle" class="ink t b">Client 1</text>
  <line x1="270" y1="40" x2="270" y2="405" class="line"/>
  <text x="450" y="28" text-anchor="middle" class="ink t b">Client 2</text>
  <line x1="450" y1="40" x2="450" y2="405" class="line"/>
  <text x="630" y="28" text-anchor="middle" class="ink t b">Storage</text>
  <line x1="630" y1="40" x2="630" y2="405" class="line"/>
  <line x1="270" y1="70" x2="103" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="185.0" y="64" text-anchor="middle" class="ink n mono">get lease</text>
  <line x1="100" y1="100" x2="267" y2="110" class="line" marker-end="url(#arrow)"/>
  <text x="185.0" y="94" text-anchor="middle" class="focus n mono b">ok, token 33</text>
  <rect x="260" y="128" width="20" height="210" rx="4" class="lost-s" style="stroke-dasharray:5 4"/>
  <text x="288" y="160" class="lost n b">long pause</text>
  <text x="288" y="175" class="ink2 n">(say, GC)</text>
  <text x="108" y="172" class="ink2 n">lease 33</text>
  <text x="108" y="186" class="ink2 n">expires</text>
  <line x1="450" y1="205" x2="103" y2="215" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="199" text-anchor="middle" class="ink n mono">get lease</text>
  <line x1="100" y1="235" x2="447" y2="245" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="232" text-anchor="middle" class="focus n mono b">ok, token 34</text>
  <line x1="450" y1="270" x2="627" y2="280" class="line" marker-end="url(#arrow)"/>
  <text x="540.0" y="264" text-anchor="middle" class="focus n mono b">write, token 34</text>
  <rect x="566" y="290" width="128" height="26" rx="6" class="safe-box"/>
  <text x="630" y="307" text-anchor="middle" class="ink n">ok, highest = 34</text>
  <line x1="270" y1="350" x2="627" y2="365" class="line" marker-end="url(#arrow)"/>
  <text x="560" y="344" text-anchor="middle" class="ink n mono">write, token 33 (late)</text>
  <rect x="550" y="374" width="160" height="26" rx="6" class="box"/>
  <rect x="550" y="374" width="160" height="26" rx="6" class="lost-s"/>
  <text x="630" y="391" text-anchor="middle" class="lost n b">rejected: 33 &lt; 34</text>
  </svg>
