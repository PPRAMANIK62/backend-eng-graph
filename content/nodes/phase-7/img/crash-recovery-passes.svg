<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="40" y="30" width="620" height="30" rx="6" class="box"/>
  <text x="436" y="50" class="ink2 n">log records, oldest on the left</text>
  <line x1="100" y1="24" x2="100" y2="250" class="line" stroke-dasharray="4 4"/>
  <line x1="250" y1="24" x2="250" y2="250" class="line" stroke-dasharray="4 4"/>
  <line x1="420" y1="24" x2="420" y2="250" class="focus-s"/>
  <line x1="650" y1="24" x2="650" y2="250" class="lost-s"/>

  <text x="436" y="94" class="ink t b">1 Analysis</text>
  <line x1="422" y1="104" x2="646" y2="104" class="line" marker-end="url(#arrow)"/>
  <text x="436" y="124" class="ink2 n">rebuild the tables</text>

  <text x="266" y="152" class="ink t b">2 Redo</text>
  <line x1="252" y1="162" x2="646" y2="162" class="line" marker-end="url(#arrow)"/>
  <text x="436" y="182" class="ink2 n">repeat history, losers too</text>

  <text x="116" y="210" class="ink t b">3 Undo</text>
  <line x1="646" y1="220" x2="104" y2="220" class="line" marker-end="url(#arrow)"/>
  <text x="436" y="240" class="ink2 n">roll back losers, write CLRs</text>

  <text x="100" y="272" text-anchor="middle" class="ink n">oldest record</text>
  <text x="100" y="288" text-anchor="middle" class="ink n">of a loser</text>
  <text x="250" y="272" text-anchor="middle" class="ink n">smallest recLSN</text>
  <text x="250" y="288" text-anchor="middle" class="ink n">in dirty page table</text>
  <text x="420" y="272" text-anchor="middle" class="ink n b">last checkpoint</text>
  <text x="420" y="288" text-anchor="middle" class="ink n">begins</text>
  <text x="650" y="272" text-anchor="middle" class="ink n b">crash</text>
  <text x="650" y="288" text-anchor="middle" class="ink2 n">end of log</text>
</svg>
