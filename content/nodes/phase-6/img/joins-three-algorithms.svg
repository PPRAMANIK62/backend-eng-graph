<line x1="564" y1="82" x2="634" y2="82" class="focus-s"/>
<line x1="564" y1="112" x2="634" y2="112" class="focus-s"/>
<line x1="564" y1="112" x2="634" y2="142" class="focus-s"/>
<line x1="564" y1="172" x2="634" y2="202" class="focus-s"/>
<path d="M508,70 V218" class="line" marker-end="url(#arrow)"/>
<path d="M692,70 V218" class="line" marker-end="url(#arrow)"/>
<text x="600" y="242" text-anchor="middle" class="ink2 n">two cursors move down together</text>
<text x="600" y="272" text-anchor="middle" class="ink n">sort both sides, then</text>
<text x="600" y="290" text-anchor="middle" class="ink n">zip them in one pass</text>
<text x="600" y="312" text-anchor="middle" class="ink2 n">best when inputs are already</text>
<text x="600" y="328" text-anchor="middle" class="ink2 n">sorted, e.g. by an index</text>
</svg>
