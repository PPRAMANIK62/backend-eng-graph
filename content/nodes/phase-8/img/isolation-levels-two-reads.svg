<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <line x1="70" y1="24" x2="700" y2="24" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="16" text-anchor="end" class="ink2 n">time</text>
  <text x="24" y="78" text-anchor="start" class="ink t b">T1</text>
  <text x="24" y="168" text-anchor="start" class="ink t b">T2</text>
  <line x1="60" y1="73" x2="700" y2="73" class="line" stroke-dasharray="2 4"/>
  <line x1="60" y1="163" x2="700" y2="163" class="line" stroke-dasharray="2 4"/>
  <rect x="70" y="54" width="70" height="38" rx="6" class="box"/>
  <text x="105" y="78" text-anchor="middle" class="ink n mono">BEGIN</text>
  <rect x="156" y="54" width="150" height="38" rx="6" class="box"/>
  <text x="231" y="70" text-anchor="middle" class="ink n mono">SELECT balance</text>
  <text x="231" y="85" text-anchor="middle" class="ink n b">→ 500</text>
  <rect x="330" y="144" width="190" height="38" rx="6" class="box"/>
  <rect x="330" y="144" width="190" height="38" rx="6" class="focus-s"/>
  <text x="425" y="160" text-anchor="middle" class="ink n mono">UPDATE balance = 400</text>
  <text x="425" y="175" text-anchor="middle" class="focus n b">Alice −100</text>
  <rect x="532" y="144" width="80" height="38" rx="6" class="box"/>
  <rect x="532" y="144" width="80" height="38" rx="6" class="focus-s"/>
  <text x="572" y="168" text-anchor="middle" class="focus n mono b">COMMIT</text>
  <rect x="540" y="54" width="150" height="38" rx="6" class="box"/>
  <text x="615" y="70" text-anchor="middle" class="ink n mono">SELECT balance</text>
  <text x="615" y="85" text-anchor="middle" class="ink n b">→ ?</text>
  <line x1="572" y1="142" x2="590" y2="96" class="line" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="24" y="226" text-anchor="start" class="ink t b">What T1 sees on its second read</text>
  <rect x="24" y="240" width="330" height="76" rx="6" class="box"/>
  <rect x="24" y="240" width="330" height="76" rx="6" class="focus-s"/>
  <text x="40" y="264" text-anchor="start" class="ink t b">Read committed</text>
  <text x="338" y="264" text-anchor="end" class="focus t b">400</text>
  <text x="40" y="284" text-anchor="start" class="ink2 n">Each statement takes a fresh snapshot,</text>
  <text x="40" y="300" text-anchor="start" class="ink2 n">so T2&#8217;s commit is visible.</text>
  <rect x="366" y="240" width="330" height="76" rx="6" class="box"/>
  <text x="382" y="264" text-anchor="start" class="ink t b">Repeatable read</text>
  <text x="680" y="264" text-anchor="end" class="ink t b">500</text>
  <text x="382" y="284" text-anchor="start" class="ink2 n">One snapshot for the whole transaction,</text>
  <text x="382" y="300" text-anchor="start" class="ink2 n">taken at its first statement.</text>
</svg>
