<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="180.0" y="24" text-anchor="middle" class="ink t b">Forwarded as is</text>
  <text x="95" y="54" text-anchor="middle" class="ink2 n">Client</text>
  <text x="265" y="54" text-anchor="middle" class="ink2 n">Server</text>
  <rect x="50" y="64" width="90" height="32" rx="6" class="box"/>
  <text x="95" y="85" text-anchor="middle" class="ink t mono">ABCDE</text>
  <rect x="220" y="64" width="90" height="32" rx="6" class="box"/>
  <text x="265" y="85" text-anchor="middle" class="ink t mono">ABCDE</text>
  <line x1="95" y1="98" x2="95" y2="131" class="line" marker-end="url(#arrow)"/>
  <text x="103" y="119" class="ink n mono">del 4</text>
  <line x1="265" y1="98" x2="265" y2="131" class="line" marker-end="url(#arrow)"/>
  <text x="273" y="119" class="ink n mono">del 2</text>
  <rect x="50" y="134" width="90" height="32" rx="6" class="box"/>
  <text x="95" y="155" text-anchor="middle" class="ink t mono">ABCE</text>
  <rect x="220" y="134" width="90" height="32" rx="6" class="box"/>
  <text x="265" y="155" text-anchor="middle" class="ink t mono">ACDE</text>
  <line x1="115" y1="168" x2="245" y2="241" class="line" marker-end="url(#arrow)"/>
  <line x1="245" y1="168" x2="115" y2="241" class="line" marker-end="url(#arrow)"/>
  <text x="259" y="208" text-anchor="end" class="ink n mono">del 4</text>
  <text x="101" y="208" class="ink n mono">del 2</text>
  <rect x="50" y="244" width="90" height="32" rx="6" class="box"/>
  <rect x="50" y="244" width="90" height="32" rx="6" class="lost-s"/>
  <text x="95" y="265" text-anchor="middle" class="ink t mono">ACE</text>
  <rect x="220" y="244" width="90" height="32" rx="6" class="box"/>
  <rect x="220" y="244" width="90" height="32" rx="6" class="lost-s"/>
  <text x="265" y="265" text-anchor="middle" class="ink t mono">ACD</text>
  <text x="180.0" y="306" text-anchor="middle" class="ink n">They diverge: the server deleted E, not D</text>
  <text x="180" y="324" text-anchor="middle" class="ink n">ACE vs ACD</text>
  <text x="540.0" y="24" text-anchor="middle" class="ink t b">Transformed by the server</text>
  <text x="455" y="54" text-anchor="middle" class="ink2 n">Client</text>
  <text x="625" y="54" text-anchor="middle" class="ink2 n">Server</text>
  <rect x="410" y="64" width="90" height="32" rx="6" class="box"/>
  <text x="455" y="85" text-anchor="middle" class="ink t mono">ABCDE</text>
  <rect x="580" y="64" width="90" height="32" rx="6" class="box"/>
  <text x="625" y="85" text-anchor="middle" class="ink t mono">ABCDE</text>
  <line x1="455" y1="98" x2="455" y2="131" class="line" marker-end="url(#arrow)"/>
  <text x="463" y="119" class="ink n mono">del 4</text>
  <line x1="625" y1="98" x2="625" y2="131" class="line" marker-end="url(#arrow)"/>
  <text x="633" y="119" class="ink n mono">del 2</text>
  <rect x="410" y="134" width="90" height="32" rx="6" class="box"/>
  <text x="455" y="155" text-anchor="middle" class="ink t mono">ABCE</text>
  <rect x="580" y="134" width="90" height="32" rx="6" class="box"/>
  <text x="625" y="155" text-anchor="middle" class="ink t mono">ACDE</text>
  <line x1="475" y1="168" x2="605" y2="241" class="line" marker-end="url(#arrow)"/>
  <line x1="605" y1="168" x2="475" y2="241" class="line" marker-end="url(#arrow)"/>
  <text x="619" y="208" text-anchor="end" class="focus n mono b">del 3</text>
  <text x="461" y="208" class="ink n mono">del 2</text>
  <rect x="410" y="244" width="90" height="32" rx="6" class="safe-box"/>
  <text x="455" y="265" text-anchor="middle" class="ink t mono">ACE</text>
  <rect x="580" y="244" width="90" height="32" rx="6" class="safe-box"/>
  <text x="625" y="265" text-anchor="middle" class="ink t mono">ACE</text>
  <text x="540.0" y="306" text-anchor="middle" class="ink n">The server applies the client’s del 4 as del 3</text>
  <text x="540" y="324" text-anchor="middle" class="ink n">Both end at ACE</text>
  <line x1="360" y1="40" x2="360" y2="290" class="line" stroke-dasharray="4 4"/>
</svg>
