<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="30" y="26" class="ink t b">employees (id, manager_id)</text>
  <line x1="130" y1="87" x2="80" y2="133" class="line"/>
  <line x1="130" y1="87" x2="180" y2="133" class="line"/>
  <line x1="80" y1="167" x2="45" y2="213" class="line"/>
  <line x1="80" y1="167" x2="115" y2="213" class="line"/>
  <line x1="180" y1="167" x2="180" y2="213" class="line"/>
  <circle cx="130" cy="70" r="17" class="box"/>
  <text x="130" y="75" text-anchor="middle" class="ink t mono">1</text>
  <circle cx="80" cy="150" r="17" class="box"/>
  <text x="80" y="155" text-anchor="middle" class="ink t mono">2</text>
  <circle cx="180" cy="150" r="17" class="box"/>
  <text x="180" y="155" text-anchor="middle" class="ink t mono">3</text>
  <circle cx="45" cy="230" r="17" class="box"/>
  <text x="45" y="235" text-anchor="middle" class="ink t mono">4</text>
  <circle cx="115" cy="230" r="17" class="box"/>
  <text x="115" y="235" text-anchor="middle" class="ink t mono">5</text>
  <circle cx="180" cy="230" r="17" class="box"/>
  <text x="180" y="235" text-anchor="middle" class="ink t mono">6</text>
  <text x="30" y="282" class="ink2 n">Who reports to 1, directly</text>
  <text x="30" y="298" class="ink2 n">or indirectly?</text>
  <rect x="290" y="44" width="400" height="62" rx="6" class="box"/>
  <text x="304" y="66" class="ink t b">1. Non-recursive term</text>
  <text x="304" y="86" class="ink2 n">rows with manager_id = 1</text>
  <text x="676" y="86" text-anchor="end" class="focus n mono b">2, 3</text>
  <line x1="490" y1="108" x2="490" y2="128" class="line" marker-end="url(#arrow)"/>
  <text x="502" y="123" class="ink2 n">new rows become the working table</text>
  <rect x="290" y="132" width="400" height="62" rx="6" class="box"/>
  <text x="304" y="154" class="ink t b">2. Recursive term, run on 2, 3</text>
  <text x="304" y="174" class="ink2 n">rows whose manager is in the working table</text>
  <text x="676" y="174" text-anchor="end" class="focus n mono b">4, 5, 6</text>
  <line x1="490" y1="196" x2="490" y2="216" class="line" marker-end="url(#arrow)"/>
  <text x="502" y="211" class="ink2 n">new rows become the working table</text>
  <rect x="290" y="220" width="400" height="62" rx="6" class="box"/>
  <text x="304" y="242" class="ink t b">3. Recursive term, run on 4, 5, 6</text>
  <text x="304" y="262" class="ink2 n">no one reports to 4, 5 or 6</text>
  <text x="676" y="262" text-anchor="end" class="ink2 n mono b">nothing: stop</text>
  <rect x="290" y="308" width="400" height="40" rx="6" class="safe-box"/>
  <text x="304" y="333" class="ink t b">Result: every row produced</text>
  <text x="676" y="333" text-anchor="end" class="ink t mono b">2, 3, 4, 5, 6</text>
</svg>
