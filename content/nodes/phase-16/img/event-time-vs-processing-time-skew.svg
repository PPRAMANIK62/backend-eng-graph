<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="100" y1="300" x2="400" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="100" y1="300" x2="100" y2="30" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="325" text-anchor="middle" class="ink t">event time</text>
  <text x="70" y="165" text-anchor="middle" class="ink t" transform="rotate(-90 70 165)">processing time</text>

  <!-- ideal diagonal -->
  <line x1="100" y1="300" x2="360" y2="40" class="line" stroke-dasharray="6 5"/>

  <!-- real pipeline -->
  <path d="M100,300 C104,270 120,240 150,222 S 215,178 228,160 S 255,110 268,60" class="focus-s" style="stroke-width:3"/>

  <!-- skew marker -->
  <line x1="259" y1="90" x2="306" y2="90" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="282" y="80" text-anchor="middle" class="ink n b">skew</text>

  <!-- legend and notes -->
  <line x1="450" y1="70" x2="490" y2="70" class="line" stroke-dasharray="6 5"/>
  <text x="500" y="74" class="ink n">ideal: each event processed</text>
  <text x="500" y="90" class="ink n">the moment it happens</text>
  <line x1="450" y1="125" x2="490" y2="125" class="focus-s" style="stroke-width:3"/>
  <text x="500" y="129" class="ink n">a real pipeline: how far</text>
  <text x="500" y="145" class="ink n">event time has got</text>
  <text x="450" y="190" class="ink2 n">It lags at the start, nearly catches</text>
  <text x="450" y="206" class="ink2 n">up in the middle, then falls behind</text>
  <text x="450" y="222" class="ink2 n">again. The horizontal gap is the</text>
  <text x="450" y="238" class="ink2 n">skew, and it keeps changing.</text>
</svg>
