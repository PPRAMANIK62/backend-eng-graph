<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="370" y="22" text-anchor="middle" class="ink t b">Error budget left, 99.9% SLO over 30 days</text>
  <!-- axes -->
  <line x1="90" y1="260" x2="90" y2="40" class="line"/>
  <line x1="90" y1="260" x2="660" y2="260" class="line"/>
  <text x="80" y="45" text-anchor="end" class="ink2 n">100%</text>
  <text x="80" y="264" text-anchor="end" class="ink2 n">0%</text>
  <text x="90" y="280" text-anchor="middle" class="ink2 n">day 0</text>
  <text x="146.0" y="280" text-anchor="middle" class="ink2 n">3</text>
  <text x="370.0" y="280" text-anchor="middle" class="ink2 n">15</text>
  <text x="650" y="280" text-anchor="middle" class="ink2 n">30</text>
  <text x="370" y="304" text-anchor="middle" class="ink2 n">days into the window</text>

  <!-- burn 1 -->
  <line x1="90" y1="40" x2="650" y2="260" class="focus-s" stroke-width="2.5"/>
  <text x="480" y="110" class="ink t">burn rate 1</text>
  <text x="480" y="126" class="ink2 n">0.1% errors, lasts the window</text>
  <!-- burn 2 -->
  <line x1="90" y1="40" x2="370.0" y2="260" class="line" stroke-width="2.5"/>
  <text x="340" y="200" class="ink t">burn rate 2</text>
  <text x="340" y="216" class="ink2 n">0.2% errors, gone at day 15</text>
  <!-- burn 10 -->
  <line x1="90" y1="40" x2="146.0" y2="260" class="lost-s"/>
  <text x="150" y="225" class="ink t">burn rate 10</text>
  <text x="150" y="241" class="ink2 n">1% errors, gone at day 3</text>
</svg>
