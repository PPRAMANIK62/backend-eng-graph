<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="130" y="28" text-anchor="middle" class="ink t b">T1</text>
  <text x="360" y="28" text-anchor="middle" class="ink t b">T2</text>
  <line x1="130" y1="40" x2="130" y2="312" class="line"/>
  <line x1="130" y1="342" x2="130" y2="370" class="line"/>
  <line x1="360" y1="40" x2="360" y2="370" class="line"/>
  <text x="20" y="28" class="ink2 n">time</text>
  <line x1="24" y1="40" x2="24" y2="370" class="line" marker-end="url(#arrow)"/>

  <!-- 1 -->
  <rect x="45" y="50" width="170" height="30" rx="6" class="box"/>
  <text x="130" y="70" text-anchor="middle" class="ink n mono">UPDATE ... 11111</text>
  <!-- 2 -->
  <rect x="275" y="92" width="170" height="30" rx="6" class="box"/>
  <text x="360" y="112" text-anchor="middle" class="ink n mono">UPDATE ... 22222</text>
  <!-- 3 -->
  <rect x="275" y="134" width="170" height="30" rx="6" class="box"/>
  <text x="360" y="154" text-anchor="middle" class="ink n mono">UPDATE ... 11111</text>
  <line x1="360" y1="166" x2="360" y2="262" class="lost-s" stroke-dasharray="6 5"/>
  <text x="372" y="186" class="ink2 n">waits for T1,</text>
  <text x="372" y="202" class="ink2 n">timer starts</text>
  <!-- 4 -->
  <rect x="45" y="176" width="170" height="30" rx="6" class="box"/>
  <text x="130" y="196" text-anchor="middle" class="ink n mono">UPDATE ... 22222</text>
  <line x1="130" y1="208" x2="130" y2="300" class="lost-s" stroke-dasharray="6 5"/>
  <text x="142" y="228" class="ink2 n">waits for T2</text>

  <!-- detection -->
  <text x="372" y="244" class="ink n">deadlock_timeout later:</text>
  <text x="372" y="260" class="ink n">check finds a cycle</text>
  <rect x="275" y="270" width="170" height="30" rx="6" class="box"/>
  <text x="360" y="290" text-anchor="middle" class="lost n b">ERROR: deadlock</text>
  <text x="372" y="320" class="ink2 n">T2 rolls back,</text>
  <text x="372" y="336" class="ink2 n">its locks are released</text>
  <rect x="45" y="312" width="170" height="30" rx="6" class="safe-box"/>
  <text x="130" y="332" text-anchor="middle" class="ink n">gets 22222, commits</text>

  <!-- waits-for graph -->
  <text x="610" y="28" text-anchor="middle" class="ink t b">Waits-for graph</text>
  <circle cx="545" cy="160" r="30" class="box"/>
  <text x="545" y="165" text-anchor="middle" class="ink t b">T1</text>
  <circle cx="675" cy="160" r="30" class="box"/>
  <text x="675" y="165" text-anchor="middle" class="ink t b">T2</text>
  <path d="M565,138 Q610,100 655,138" class="line" marker-end="url(#arrow)"/>
  <text x="610" y="100" text-anchor="middle" class="ink2 n">waits for 22222</text>
  <path d="M655,182 Q610,220 565,182" class="line" marker-end="url(#arrow)"/>
  <text x="610" y="232" text-anchor="middle" class="ink2 n">waits for 11111</text>
  <text x="610" y="270" text-anchor="middle" class="lost n b">cycle = deadlock</text>
</svg>
