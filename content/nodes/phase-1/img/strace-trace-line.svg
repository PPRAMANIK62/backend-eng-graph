<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="28" class="ink2 n">Line formats from the strace manual, not output from a run</text>
  <text x="40" y="62" class="ink t b">A call that worked</text>
  <rect x="40.0" y="76" width="50.4" height="30" rx="6" class="box"/>
  <text x="65.2" y="96" text-anchor="middle" class="focus b t mono" xml:space="preserve">open</text>
  <rect x="96.4" y="76" width="213.8" height="30" rx="6" class="box"/>
  <text x="203.3" y="96" text-anchor="middle" class="ink t mono" xml:space="preserve">("/dev/null", O_RDONLY)</text>
  <rect x="316.2" y="76" width="41.8" height="30" rx="6" class="box"/>
  <text x="337.1" y="96" text-anchor="middle" class="ink b t mono" xml:space="preserve">= 3</text>
  <line x1="65.2" y1="108" x2="65.2" y2="120" class="line"/>
  <text x="65.2" y="138" text-anchor="middle" class="ink2 n">call name</text>
  <line x1="203.3" y1="108" x2="203.3" y2="120" class="line"/>
  <text x="203.3" y="138" text-anchor="middle" class="ink2 n">arguments</text>
  <line x1="337.1" y1="108" x2="337.1" y2="120" class="line"/>
  <text x="337.1" y="138" text-anchor="middle" class="ink2 n">return value: the new fd</text>
  <text x="40" y="182" class="ink t b">A call that failed</text>
  <rect x="40.0" y="196" width="50.4" height="30" rx="6" class="box"/>
  <text x="65.2" y="216" text-anchor="middle" class="focus b t mono" xml:space="preserve">open</text>
  <rect x="96.4" y="196" width="59.0" height="30" rx="6" class="box"/>
  <text x="125.9" y="216" text-anchor="middle" class="ink t mono" xml:space="preserve">(...)</text>
  <rect x="161.4" y="196" width="110.6" height="30" rx="6" class="box"/>
  <text x="216.7" y="216" text-anchor="middle" class="lost b t mono" xml:space="preserve">= -1 ENOENT</text>
  <rect x="278.0" y="196" width="248.2" height="30" rx="6" class="box"/>
  <text x="402.1" y="216" text-anchor="middle" class="ink2 t mono" xml:space="preserve">(No such file or directory)</text>
  <path d="M162,232 v6 H525 v-6" class="line"/>
  <text x="343.8" y="258" text-anchor="middle" class="ink2 n">-1, the error name and what it means</text>
  <text x="40" y="304" class="ink t b">What the options add to each line</text>
  <text x="56" y="334" class="focus t mono b">-y</text>
  <text x="110" y="334" class="ink t">the file path next to each fd number</text>
  <text x="56" y="360" class="focus t mono b">-T</text>
  <text x="110" y="360" class="ink t">how long the call took</text>
  <text x="56" y="386" class="focus t mono b">-tt</text>
  <text x="110" y="386" class="ink t">a wall-clock timestamp, to the microsecond</text>
</svg>
