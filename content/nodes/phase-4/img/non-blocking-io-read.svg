<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- time axis -->
  <line x1="150" y1="262" x2="700" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="280" text-anchor="end" class="ink2 n">time</text>

  <!-- blocking lane -->
  <text x="20" y="40" class="ink t b">Blocking socket</text>
  <text x="20" y="80" class="ink2 n">thread</text>
  <line x1="150" y1="76" x2="690" y2="76" class="line"/>
  <rect x="150" y="60" width="64" height="32" rx="6" class="box"/>
  <text x="182" y="81" text-anchor="middle" class="ink n mono">read()</text>
  <rect x="220" y="60" width="330" height="32" rx="6" class="old"/>
  <text x="385" y="81" text-anchor="middle" class="ink n">asleep in the kernel, can't serve anyone else</text>
  <line x1="556" y1="46" x2="556" y2="104" class="focus-s"/>
  <text x="556" y="40" text-anchor="middle" class="focus n b">data arrives</text>
  <rect x="566" y="60" width="124" height="32" rx="6" class="box"/>
  <text x="628" y="81" text-anchor="middle" class="ink n mono">returns 512</text>

  <!-- non-blocking lane -->
  <text x="20" y="150" class="ink t b">Non-blocking socket (O_NONBLOCK)</text>
  <text x="20" y="200" class="ink2 n">thread</text>
  <line x1="150" y1="196" x2="690" y2="196" class="line"/>
  <rect x="150" y="180" width="64" height="32" rx="6" class="box"/>
  <text x="182" y="201" text-anchor="middle" class="ink n mono">read()</text>
  <rect x="220" y="180" width="96" height="32" rx="6" class="box"/>
  <text x="268" y="201" text-anchor="middle" class="ink n mono">-1 EAGAIN</text>
  <rect x="324" y="180" width="108" height="32" rx="6" class="box"/>
  <text x="378" y="201" text-anchor="middle" class="ink n">serve client B</text>
  <rect x="440" y="180" width="108" height="32" rx="6" class="box"/>
  <text x="494" y="201" text-anchor="middle" class="ink n">accept client C</text>
  <line x1="556" y1="166" x2="556" y2="224" class="focus-s"/>
  <text x="556" y="160" text-anchor="middle" class="focus n b">data arrives</text>
  <rect x="566" y="180" width="124" height="32" rx="6" class="box"/>
  <text x="628" y="201" text-anchor="middle" class="ink n mono">read(): 512</text>
  <text x="268" y="236" text-anchor="middle" class="ink2 n">returns at once</text>
  <text x="628" y="236" text-anchor="middle" class="ink2 n">tries again later</text>
</svg>
