<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .old-box{stroke:#5c5b57} .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- headers -->
  <text x="120" y="30" text-anchor="middle" class="ink t b">All routes</text>
  <text x="120" y="48" text-anchor="middle" class="ink2 n">in the table</text>
  <text x="360" y="30" text-anchor="middle" class="ink t b">1. Basic match</text>
  <text x="360" y="48" text-anchor="middle" class="ink2 n">prefix covers 10.144.2.5</text>
  <text x="600" y="30" text-anchor="middle" class="ink t b">2. Longest match</text>
  <text x="600" y="48" text-anchor="middle" class="ink2 n">most network bits wins</text>

  <!-- column 1 -->
  <rect x="20" y="70" width="200" height="36" rx="6" class="box"/>
  <text x="120" y="93" text-anchor="middle" class="ink t mono">128.12.0.0/16</text>
  <rect x="20" y="116" width="200" height="36" rx="6" class="box"/>
  <text x="120" y="139" text-anchor="middle" class="ink t mono">10.0.0.0/8</text>
  <rect x="20" y="162" width="200" height="36" rx="6" class="box"/>
  <text x="120" y="185" text-anchor="middle" class="ink t mono">10.144.0.0/16</text>
  <rect x="20" y="208" width="200" height="36" rx="6" class="box"/>
  <text x="120" y="231" text-anchor="middle" class="ink t mono">10.144.2.0/24</text>

  <!-- column 2 -->
  <rect x="260" y="70" width="200" height="36" rx="6" class="old-box"/>
  <text x="360" y="93" text-anchor="middle" class="old t mono">128.12.0.0/16</text>
  <rect x="260" y="116" width="200" height="36" rx="6" class="box"/>
  <text x="360" y="139" text-anchor="middle" class="ink t mono">10.0.0.0/8</text>
  <rect x="260" y="162" width="200" height="36" rx="6" class="box"/>
  <text x="360" y="185" text-anchor="middle" class="ink t mono">10.144.0.0/16</text>
  <rect x="260" y="208" width="200" height="36" rx="6" class="box"/>
  <text x="360" y="231" text-anchor="middle" class="ink t mono">10.144.2.0/24</text>

  <!-- column 3 -->
  <rect x="500" y="70" width="200" height="36" rx="6" class="old-box"/>
  <rect x="500" y="116" width="200" height="36" rx="6" class="old-box"/>
  <text x="600" y="139" text-anchor="middle" class="old t mono">10.0.0.0/8</text>
  <rect x="500" y="162" width="200" height="36" rx="6" class="old-box"/>
  <text x="600" y="185" text-anchor="middle" class="old t mono">10.144.0.0/16</text>
  <rect x="500" y="208" width="200" height="36" rx="6" class="focus-box"/>
  <text x="600" y="231" text-anchor="middle" class="focus t mono b">10.144.2.0/24</text>

  <!-- arrows -->
  <line x1="222" y1="157" x2="256" y2="157" class="line" marker-end="url(#arrow)"/>
  <line x1="462" y1="157" x2="496" y2="157" class="line" marker-end="url(#arrow)"/>

  <!-- result -->
  <text x="360" y="282" text-anchor="middle" class="ink t">The packet for <tspan class="mono">10.144.2.5</tspan> goes to the next hop of <tspan class="mono focus">10.144.2.0/24</tspan></text>
</svg>
