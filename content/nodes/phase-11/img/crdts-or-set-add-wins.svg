<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="20" y="95" class="ink t b">Replica A</text>
  <text x="20" y="235" class="ink t b">Replica B</text>
  <line x1="110" y1="90" x2="520" y2="90" class="line"/>
  <line x1="630" y1="90" x2="700" y2="90" class="line"/>
  <line x1="110" y1="230" x2="520" y2="230" class="line"/>
  <line x1="630" y1="230" x2="700" y2="230" class="line"/>
  <text x="700" y="30" text-anchor="end" class="ink2 n">time →</text>

  <!-- start states -->
  <rect x="115" y="72" width="100" height="36" rx="6" class="box"/>
  <text x="165" y="95" text-anchor="middle" class="ink t mono">{milk·α}</text>
  <rect x="115" y="212" width="100" height="36" rx="6" class="box"/>
  <text x="165" y="235" text-anchor="middle" class="ink t mono">{milk·α}</text>

  <!-- A removes -->
  <text x="300" y="44" text-anchor="middle" class="ink n mono b">remove(milk)</text>
  <text x="300" y="61" text-anchor="middle" class="ink2 n">drops the tags it has seen: α</text>
  <rect x="255" y="72" width="90" height="36" rx="6" class="box"/>
  <text x="300" y="95" text-anchor="middle" class="ink t mono">{ }</text>

  <!-- B adds, concurrently -->
  <text x="320" y="272" text-anchor="middle" class="focus n mono b">add(milk)</text>
  <text x="320" y="288" text-anchor="middle" class="ink2 n">new unique tag: β</text>
  <rect x="245" y="212" width="150" height="36" rx="6" class="box"/>
  <text x="320" y="235" text-anchor="middle" class="t mono" xml:space="preserve"><tspan class="ink">{milk·α, </tspan><tspan class="focus b">milk·β</tspan><tspan class="ink">}</tspan></text>

  <!-- exchange operations -->
  <line x1="345" y1="100" x2="515" y2="214" class="line" marker-end="url(#arrow)"/>
  <line x1="395" y1="220" x2="515" y2="106" class="line" marker-end="url(#arrow)"/>
  <text x="400" y="125" class="ink2 n mono">remove {α}</text>
  <text x="500" y="142" class="ink2 n mono">add milk·β</text>

  <!-- final states -->
  <rect x="520" y="72" width="110" height="36" rx="6" class="safe-box"/>
  <text x="575" y="95" text-anchor="middle" class="ink t mono">{milk·β}</text>
  <rect x="520" y="212" width="110" height="36" rx="6" class="safe-box"/>
  <text x="575" y="235" text-anchor="middle" class="ink t mono">{milk·β}</text>
  <text x="575" y="172" text-anchor="middle" class="ink n b">both agree:</text>
  <text x="575" y="188" text-anchor="middle" class="ink n b">milk stays</text>

  <text x="20" y="318" class="ink2 n">The remove could only delete α, the tag it saw. β was made concurrently, so the add wins.</text>
</svg>
