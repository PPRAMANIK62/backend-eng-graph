<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">Content-Length</text>
  <rect x="20" y="34" width="250" height="40" rx="6" class="box"/>
  <text x="145.0" y="59" text-anchor="middle" xml:space="preserve" class="ink n mono">headers … Content-Length: 5\r\n\r\n</text>
  <rect x="270" y="34" width="90" height="40" rx="6" class="box"/>
  <rect x="270" y="34" width="90" height="40" rx="6" class="focus-s"/>
  <text x="315.0" y="59" text-anchor="middle" xml:space="preserve" class="focus t mono b">hello</text>
  <rect x="372" y="34" width="150" height="40" rx="6" class="line" stroke-dasharray="4 4"/>
  <text x="447.0" y="59" text-anchor="middle" xml:space="preserve" class="ink2 n">next message</text>
  <text x="540" y="59" class="ink2 n">ends after exactly 5 bytes</text>
  <text x="20" y="116" class="ink t b">Transfer-Encoding: chunked</text>
  <rect x="20" y="126" width="170" height="40" rx="6" class="box"/>
  <text x="105.0" y="151" text-anchor="middle" xml:space="preserve" class="ink n mono">headers … \r\n\r\n</text>
  <rect x="190" y="126" width="60" height="40" rx="6" class="box"/>
  <text x="220.0" y="151" text-anchor="middle" xml:space="preserve" class="ink n mono">5\r\n</text>
  <rect x="250" y="126" width="80" height="40" rx="6" class="box"/>
  <rect x="250" y="126" width="80" height="40" rx="6" class="focus-s"/>
  <text x="290.0" y="151" text-anchor="middle" xml:space="preserve" class="focus t mono b">hello</text>
  <rect x="330" y="126" width="50" height="40" rx="6" class="box"/>
  <text x="355.0" y="151" text-anchor="middle" xml:space="preserve" class="ink n mono">\r\n</text>
  <rect x="380" y="126" width="90" height="40" rx="6" class="box"/>
  <text x="425.0" y="151" text-anchor="middle" xml:space="preserve" class="ink n mono">0\r\n\r\n</text>
  <rect x="482" y="126" width="120" height="40" rx="6" class="line" stroke-dasharray="4 4"/>
  <text x="542.0" y="151" text-anchor="middle" xml:space="preserve" class="ink2 n">next message</text>
  <text x="190" y="186" class="ink2 n">chunk size in hex, then the bytes; a zero-size chunk and an empty line end the body</text>
  <text x="20" y="226" class="ink t b">Neither header (responses only)</text>
  <rect x="20" y="236" width="170" height="40" rx="6" class="box"/>
  <text x="105.0" y="261" text-anchor="middle" xml:space="preserve" class="ink n mono">headers … \r\n\r\n</text>
  <rect x="190" y="236" width="220" height="40" rx="6" class="box"/>
  <rect x="190" y="236" width="220" height="40" rx="6" class="focus-s"/>
  <text x="300.0" y="261" text-anchor="middle" xml:space="preserve" class="focus t mono b">hello, wor</text>
  <line x1="416" y1="228" x2="416" y2="284" class="lost-s"/>
  <text x="428" y="252" class="lost n b">connection closes</text>
  <text x="428" y="270" class="ink2 n">body = everything before the close</text>
  <text x="20" y="302" class="lost n">A response cut short by a network failure looks exactly like a complete one.</text>
</svg>
