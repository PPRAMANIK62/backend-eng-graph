<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="70" y="30" text-anchor="middle" class="ink t b">Client</text>
  <text x="250" y="30" text-anchor="middle" class="focus t b">S1 (leader)</text>
  <text x="470" y="30" text-anchor="middle" class="ink t b">S2</text>
  <text x="650" y="30" text-anchor="middle" class="ink t b">S3</text>
  <line x1="70" y1="42" x2="70" y2="420" class="line"/>
  <line x1="250" y1="42" x2="250" y2="420" class="line"/>
  <line x1="470" y1="42" x2="470" y2="420" class="line"/>
  <line x1="650" y1="42" x2="650" y2="420" class="line"/>

  <line x1="70" y1="62" x2="247" y2="82" class="line" marker-end="url(#arrow)"/>
  <text x="150" y="62" text-anchor="middle" class="ink n mono">SET x 5</text>
  <text x="240" y="104" text-anchor="end" class="ink n">append entry 10, term 6</text>

  <line x1="250" y1="116" x2="467" y2="150" class="line" marker-end="url(#arrow)"/>
  <line x1="250" y1="116" x2="647" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="96" class="ink n mono">AppendEntries</text>
  <text x="290" y="110" class="ink2 n mono">prev 9/6, entry 10</text>

  <text x="478" y="178" class="ink2 n">index 9 is term 6: ok,</text>
  <text x="478" y="192" class="ink2 n">write entry 10 to disk</text>
  <line x1="470" y1="200" x2="253" y2="230" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="236" class="ink n mono">success</text>

  <rect x="92" y="236" width="150" height="40" rx="6" class="safe-box"/>
  <text x="167" y="252" text-anchor="middle" class="ink n b">on 2 of 3: commit,</text>
  <text x="167" y="268" text-anchor="middle" class="ink n b">apply entry 10</text>
  <line x1="250" y1="286" x2="73" y2="306" class="line" marker-end="url(#arrow)"/>
  <text x="160" y="318" text-anchor="middle" class="ink n mono">OK</text>

  <text x="642" y="232" text-anchor="end" class="ink2 n">slower disk</text>
  <line x1="650" y1="250" x2="253" y2="310" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="296" class="ink2 n">success, arrives later</text>

  <line x1="250" y1="346" x2="467" y2="370" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="250" y1="346" x2="647" y2="370" class="focus-s" marker-end="url(#arrow)"/>
  <text x="258" y="340" class="focus n">next heartbeat: commit index 10</text>
  <text x="478" y="394" class="ink2 n">apply entry 10</text>
  <text x="642" y="394" text-anchor="end" class="ink2 n">apply entry 10</text>
</svg>
