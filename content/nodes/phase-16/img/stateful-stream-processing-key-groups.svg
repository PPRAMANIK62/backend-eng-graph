<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the key groups -->
  <text x="100" y="24" class="ink t b">Every key hashes into one of 128 key groups (the max parallelism)</text>
  <text x="16" y="79" class="ink t">key groups</text>
  <rect x="100" y="60" width="576" height="28" rx="6" class="box"/>
  <rect x="325" y="60" width="5" height="28" class="focus"/>
  <text x="100" y="106" class="ink2 n mono">0</text>
  <text x="676" y="106" text-anchor="end" class="ink2 n mono">127</text>
  <text x="338" y="52" class="focus n b">user alice's key group</text>

  <!-- 2 instances -->
  <text x="16" y="159" class="ink t">2 instances</text>
  <rect x="100" y="136" width="286" height="40" rx="6" class="box"/>
  <text x="243" y="161" text-anchor="middle" class="ink n">instance 0: groups 0–63</text>
  <rect x="390" y="136" width="286" height="40" rx="6" class="box"/>
  <text x="533" y="161" text-anchor="middle" class="ink n">instance 1: groups 64–127</text>

  <!-- rescale arrow -->
  <line x1="60" y1="184" x2="60" y2="210" class="line" marker-end="url(#arrow)"/>
  <text x="72" y="202" class="ink2 n">rescale: new ranges, same groups</text>

  <!-- 3 instances -->
  <text x="16" y="243" class="ink t">3 instances</text>
  <rect x="100" y="220" width="191" height="40" rx="6" class="box"/>
  <text x="195" y="245" text-anchor="middle" class="ink n">instance 0: 0–42</text>
  <rect x="296" y="220" width="189" height="40" rx="6" class="box"/>
  <text x="390" y="245" text-anchor="middle" class="ink n">instance 1: 43–85</text>
  <rect x="490" y="220" width="186" height="40" rx="6" class="box"/>
  <text x="583" y="245" text-anchor="middle" class="ink n">instance 2: 86–127</text>

  <!-- alice's group, followed down -->
  <line x1="327.5" y1="90" x2="327.5" y2="136" class="focus-s" stroke-dasharray="4 3"/>
  <line x1="327.5" y1="176" x2="327.5" y2="220" class="focus-s" stroke-dasharray="4 3"/>
  <circle cx="327.5" cy="146" r="4" class="focus"/>
  <circle cx="327.5" cy="230" r="4" class="focus"/>

  <text x="100" y="292" class="ink2 n">Alice's key group never changes. With 2 instances instance 0 owns it; with 3, instance 1 does,</text>
  <text x="100" y="310" class="ink2 n">and it reads that whole group from the snapshot as one sequential chunk.</text>
</svg>
