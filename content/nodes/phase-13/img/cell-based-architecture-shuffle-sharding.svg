<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="34" class="ink t b">No sharding</text>
  <text x="20" y="52" class="ink2 n">all 8 serve everyone</text>
  <text x="20" y="68" class="lost n b">100% impact</text>
  <rect x="190" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="190" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="216.0" y="43" text-anchor="middle" class="ink n">1</text>
  <rect x="250" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="250" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="276.0" y="43" text-anchor="middle" class="ink n">2</text>
  <rect x="310" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="310" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="336.0" y="43" text-anchor="middle" class="ink n">3</text>
  <rect x="370" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="370" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="396.0" y="43" text-anchor="middle" class="ink n">4</text>
  <rect x="430" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="430" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="456.0" y="43" text-anchor="middle" class="ink n">5</text>
  <rect x="490" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="490" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="516.0" y="43" text-anchor="middle" class="ink n">6</text>
  <rect x="550" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="550" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="576.0" y="43" text-anchor="middle" class="ink n">7</text>
  <rect x="610" y="20" width="52" height="36" rx="6" class="box"/>
  <rect x="610" y="20" width="52" height="36" rx="6" class="lost-s"/>
  <text x="636.0" y="43" text-anchor="middle" class="ink n">8</text>
  <text x="190" y="76" class="ink2 n">a bad customer knocks them over one by one</text>
  <text x="20" y="134" class="ink t b">Plain sharding</text>
  <text x="20" y="152" class="ink2 n">4 shards of 2</text>
  <text x="20" y="168" class="lost n b">25% impact</text>
  <rect x="190" y="120" width="52" height="36" rx="6" class="box"/>
  <rect x="190" y="120" width="52" height="36" rx="6" class="lost-s"/>
  <text x="216.0" y="143" text-anchor="middle" class="ink n">1</text>
  <rect x="250" y="120" width="52" height="36" rx="6" class="box"/>
  <rect x="250" y="120" width="52" height="36" rx="6" class="lost-s"/>
  <text x="276.0" y="143" text-anchor="middle" class="ink n">2</text>
  <rect x="310" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="336.0" y="143" text-anchor="middle" class="ink n">3</text>
  <rect x="370" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="396.0" y="143" text-anchor="middle" class="ink n">4</text>
  <rect x="430" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="456.0" y="143" text-anchor="middle" class="ink n">5</text>
  <rect x="490" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="516.0" y="143" text-anchor="middle" class="ink n">6</text>
  <rect x="550" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="576.0" y="143" text-anchor="middle" class="ink n">7</text>
  <rect x="610" y="120" width="52" height="36" rx="6" class="box"/>
  <text x="636.0" y="143" text-anchor="middle" class="ink n">8</text>
  <path d="M 190 164 L 190 170 L 302 170 L 302 164" class="line"/>
  <text x="246.0" y="186" text-anchor="middle" class="ink2 n">shard 1</text>
  <path d="M 310 164 L 310 170 L 422 170 L 422 164" class="line"/>
  <text x="366.0" y="186" text-anchor="middle" class="ink2 n">shard 2</text>
  <path d="M 430 164 L 430 170 L 542 170 L 542 164" class="line"/>
  <text x="486.0" y="186" text-anchor="middle" class="ink2 n">shard 3</text>
  <path d="M 550 164 L 550 170 L 662 170 L 662 164" class="line"/>
  <text x="606.0" y="186" text-anchor="middle" class="ink2 n">shard 4</text>
  <text x="20" y="234" class="ink t b">Shuffle sharding</text>
  <text x="20" y="252" class="ink2 n">each customer gets a pair</text>
  <text x="20" y="268" class="lost n b">about 1 in 28</text>
  <rect x="190" y="220" width="52" height="36" rx="6" class="box"/>
  <rect x="190" y="220" width="52" height="36" rx="6" class="lost-s"/>
  <text x="216.0" y="243" text-anchor="middle" class="ink n">1</text>
  <rect x="250" y="220" width="52" height="36" rx="6" class="box"/>
  <text x="276.0" y="243" text-anchor="middle" class="ink n">2</text>
  <rect x="310" y="220" width="52" height="36" rx="6" class="box"/>
  <text x="336.0" y="243" text-anchor="middle" class="ink n">3</text>
  <rect x="370" y="220" width="52" height="36" rx="6" class="box"/>
  <rect x="370" y="220" width="52" height="36" rx="6" class="lost-s"/>
  <text x="396.0" y="243" text-anchor="middle" class="ink n">4</text>
  <rect x="430" y="220" width="52" height="36" rx="6" class="box"/>
  <text x="456.0" y="243" text-anchor="middle" class="ink n">5</text>
  <rect x="490" y="220" width="52" height="36" rx="6" class="box"/>
  <text x="516.0" y="243" text-anchor="middle" class="ink n">6</text>
  <rect x="550" y="220" width="52" height="36" rx="6" class="box"/>
  <text x="576.0" y="243" text-anchor="middle" class="ink n">7</text>
  <rect x="610" y="220" width="52" height="36" rx="6" class="safe-box"/>
  <text x="636.0" y="243" text-anchor="middle" class="ink n">8</text>
  <path d="M 216.0 260 L 216.0 274 L 396.0 274 L 396.0 260" class="lost-s" stroke-width="2"/>
  <text x="306.0" y="292" text-anchor="middle" class="ink n">bad customer: workers 1 and 4, down</text>
  <path d="M 216.0 216 L 216.0 208 L 636.0 208 L 636.0 216" class="line"/>
  <text x="662.0" y="292" text-anchor="end" class="ink n">other customer: 1 and 8,</text>
  <text x="662.0" y="308" text-anchor="end" class="ink n">still served by 8</text>
