<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <rect x="20" y="96" width="120" height="68" rx="6" class="box"/>
  <text x="80" y="124" text-anchor="middle" class="ink t b">Producer</text>
  <text x="80" y="144" text-anchor="middle" class="ink2 n">key = order ID</text>
  <text x="20" y="196" class="ink2 n">hash(key) picks</text>
  <text x="20" y="212" class="ink2 n">the partition</text>
  <line x1="142" y1="130" x2="217" y2="62" class="line" marker-end="url(#arrow)"/>
  <text x="220" y="34" class="ink2 n">Partition 0</text>
  <rect x="220" y="40" width="104" height="44" rx="6" class="box"/>
  <text x="272.0" y="67" text-anchor="middle" class="focus n mono b">17 created</text>
  <rect x="328" y="40" width="104" height="44" rx="6" class="box"/>
  <text x="380.0" y="67" text-anchor="middle" class="focus n mono b">17 paid</text>
  <rect x="436" y="40" width="104" height="44" rx="6" class="box"/>
  <text x="488.0" y="67" text-anchor="middle" class="focus n mono b">17 shipped</text>
  <line x1="544" y1="62" x2="584" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="142" y1="130" x2="217" y2="134" class="line" marker-end="url(#arrow)"/>
  <text x="220" y="106" class="ink2 n">Partition 1</text>
  <rect x="220" y="112" width="104" height="44" rx="6" class="box"/>
  <text x="272.0" y="139" text-anchor="middle" class="ink n mono">88 created</text>
  <rect x="328" y="112" width="104" height="44" rx="6" class="line" stroke-dasharray="4 3"/>
  <rect x="436" y="112" width="104" height="44" rx="6" class="line" stroke-dasharray="4 3"/>
  <line x1="544" y1="134" x2="584" y2="130" class="line" marker-end="url(#arrow)"/>
  <line x1="142" y1="130" x2="217" y2="206" class="line" marker-end="url(#arrow)"/>
  <text x="220" y="178" class="ink2 n">Partition 2</text>
  <rect x="220" y="184" width="104" height="44" rx="6" class="box"/>
  <text x="272.0" y="211" text-anchor="middle" class="ink n mono">42 created</text>
  <rect x="328" y="184" width="104" height="44" rx="6" class="box"/>
  <text x="380.0" y="211" text-anchor="middle" class="ink n mono">42 paid</text>
  <rect x="436" y="184" width="104" height="44" rx="6" class="line" stroke-dasharray="4 3"/>
  <line x1="544" y1="206" x2="584" y2="150" class="line" marker-end="url(#arrow)"/>
  <rect x="588" y="96" width="112" height="68" rx="6" class="box"/>
  <text x="644.0" y="135" text-anchor="middle" class="ink t b">Consumer</text>
  <text x="220" y="260" class="ink2 n">Each partition is read in order. Partitions interleave any way,</text>
  <text x="220" y="276" class="ink2 n">so events for orders 17, 42 and 88 can mix freely.</text>
</svg>
