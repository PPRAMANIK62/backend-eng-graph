<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="165" y="22" text-anchor="middle" class="ink t b">Read your own writes, broken</text>
  <text x="40" y="58" text-anchor="middle" class="ink t b">User</text>
  <line x1="40" y1="66" x2="40" y2="300" class="line"/>
  <text x="165" y="58" text-anchor="middle" class="ink t b">Leader</text>
  <line x1="165" y1="66" x2="165" y2="300" class="line"/>
  <text x="290" y="58" text-anchor="middle" class="ink t b">Follower</text>
  <line x1="290" y1="66" x2="290" y2="300" class="line"/>
  <line x1="40" y1="92" x2="162" y2="112" class="focus-s" marker-end="url(#arrow)"/>
  <text x="102" y="86" text-anchor="middle" class="focus n b">save name "Ana"</text>
  <line x1="165" y1="122" x2="43" y2="142" class="line" marker-end="url(#arrow)"/>
  <text x="102" y="120" text-anchor="middle" class="ink n">OK</text>
  <line x1="40" y1="170" x2="287" y2="194" class="line" marker-end="url(#arrow)"/>
  <text x="102" y="168" text-anchor="middle" class="ink n">reload</text>
  <line x1="290" y1="212" x2="43" y2="236" class="line" marker-end="url(#arrow)"/>
  <text x="102" y="222" text-anchor="middle" class="lost n b">"Anna" (old)</text>
  <line x1="165" y1="252" x2="287" y2="276" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="228" y="318" text-anchor="middle" class="ink2 n">the change arrives late</text>
  <line x1="360" y1="10" x2="360" y2="330" class="line" stroke-dasharray="4 4"/>
  <text x="520" y="22" text-anchor="middle" class="ink t b">Monotonic reads, broken</text>
  <text x="400" y="58" text-anchor="middle" class="ink t b">User</text>
  <line x1="400" y1="66" x2="400" y2="300" class="line"/>
  <text x="520" y="58" text-anchor="middle" class="ink t b">Follower A</text>
  <line x1="520" y1="66" x2="520" y2="300" class="line"/>
  <text x="645" y="58" text-anchor="middle" class="ink t b">Follower B</text>
  <line x1="645" y1="66" x2="645" y2="300" class="line"/>
  <line x1="400" y1="92" x2="517" y2="112" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="90" text-anchor="middle" class="ink n">load page</text>
  <line x1="520" y1="122" x2="403" y2="142" class="focus-s" marker-end="url(#arrow)"/>
  <text x="460" y="154" text-anchor="middle" class="focus n b">new comment</text>
  <line x1="400" y1="176" x2="642" y2="200" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="174" text-anchor="middle" class="ink n">refresh</text>
  <line x1="645" y1="214" x2="403" y2="238" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="256" text-anchor="middle" class="lost n b">comment gone</text>
  <text x="520" y="318" text-anchor="middle" class="ink2 n">caught up</text>
  <text x="645" y="318" text-anchor="middle" class="ink2 n">further behind</text>
</svg>
