<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- panel 1 -->
  <text x="20" y="26" class="ink t b">Locks released early (not two-phase)</text>
  <text x="20" y="72" class="ink t b">T1</text>
  <text x="20" y="132" class="ink t b">T2</text>
  <line x1="60" y1="170" x2="700" y2="170" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="188" text-anchor="end" class="ink2 n">time</text>

  <rect x="60" y="48" width="210" height="36" rx="6" class="box"/>
  <text x="165" y="71" text-anchor="middle" class="ink n mono">lock A · A = 400 · unlock A</text>
  <rect x="490" y="48" width="210" height="36" rx="6" class="box"/>
  <text x="595" y="71" text-anchor="middle" class="ink n mono">lock B · B = 600 · unlock B</text>

  <rect x="280" y="108" width="200" height="36" rx="6" class="box"/>
  <text x="380" y="131" text-anchor="middle" class="ink n mono">read A = 400, B = 500</text>
  <text x="380" y="160" text-anchor="middle" class="lost n b">sum 900: 100 went missing</text>

  <!-- panel 2 -->
  <text x="20" y="226" class="ink t b">Two-phase locking</text>
  <text x="20" y="272" class="ink t b">T1</text>
  <text x="20" y="332" class="ink t b">T2</text>
  <line x1="60" y1="370" x2="700" y2="370" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="388" text-anchor="end" class="ink2 n">time</text>

  <rect x="60" y="248" width="130" height="36" rx="6" class="box"/>
  <text x="125" y="271" text-anchor="middle" class="ink n mono">lock A · A = 400</text>
  <rect x="200" y="248" width="130" height="36" rx="6" class="box"/>
  <text x="265" y="271" text-anchor="middle" class="ink n mono">lock B · B = 600</text>
  <rect x="340" y="248" width="150" height="36" rx="6" class="box"/>
  <text x="415" y="271" text-anchor="middle" class="ink n mono">commit · unlock A, B</text>

  <line x1="100" y1="326" x2="490" y2="326" class="line" stroke-dasharray="5 4"/>
  <text x="295" y="318" text-anchor="middle" class="ink2 n">T2 asks for A and waits</text>
  <rect x="500" y="308" width="200" height="36" rx="6" class="safe-box"/>
  <text x="600" y="331" text-anchor="middle" class="ink n mono">read A = 400, B = 600</text>
  <text x="600" y="360" text-anchor="middle" class="ink n b">sum 1,000</text>
</svg>
