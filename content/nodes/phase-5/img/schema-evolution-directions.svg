<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- column heads -->
  <text x="200" y="24" text-anchor="middle" class="ink t b">Old version (v1)</text>
  <text x="520" y="24" text-anchor="middle" class="ink t b">New version (v2)</text>

  <!-- writers -->
  <rect x="110" y="40" width="180" height="44" rx="6" class="box"/>
  <text x="200" y="67" text-anchor="middle" class="ink t">v1 writer</text>
  <rect x="430" y="40" width="180" height="44" rx="6" class="box"/>
  <text x="520" y="67" text-anchor="middle" class="ink t">v2 writer</text>

  <!-- data -->
  <rect x="90" y="130" width="220" height="44" rx="6" class="box"/>
  <text x="200" y="157" text-anchor="middle" class="ink n mono">{id, amount}</text>
  <rect x="410" y="130" width="220" height="44" rx="6" class="box"/>
  <text x="520" y="157" text-anchor="middle" class="ink n mono">{id, amount, coupon}</text>

  <!-- readers -->
  <rect x="110" y="262" width="180" height="44" rx="6" class="box"/>
  <text x="200" y="289" text-anchor="middle" class="ink t">v1 reader</text>
  <rect x="430" y="262" width="180" height="44" rx="6" class="box"/>
  <text x="520" y="289" text-anchor="middle" class="ink t">v2 reader</text>

  <!-- same-version paths -->
  <line x1="200" y1="84" x2="200" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="520" y1="84" x2="520" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="170" y1="174" x2="170" y2="259" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="174" x2="550" y2="259" class="line" marker-end="url(#arrow)"/>

  <!-- cross-version paths -->
  <line x1="250" y1="174" x2="470" y2="259" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="470" y1="174" x2="250" y2="259" class="focus-s" marker-end="url(#arrow)"/>
  <text x="360" y="186" text-anchor="middle" class="ink2 n">stored or sent,</text>
  <text x="360" y="200" text-anchor="middle" class="ink2 n">read later</text>

  <!-- what each reader does -->
  <text x="200" y="330" text-anchor="middle" class="focus t b">Forward: old reads new</text>
  <text x="200" y="350" text-anchor="middle" class="ink2 n">skips the coupon it doesn't know</text>
  <text x="520" y="330" text-anchor="middle" class="focus t b">Backward: new reads old</text>
  <text x="520" y="350" text-anchor="middle" class="ink2 n">fills the missing coupon with a default</text>
</svg>
