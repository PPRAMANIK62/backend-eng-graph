<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
<text x="20" y="65" class="ink t b">Replica A</text>
<line x1="110" y1="60" x2="700" y2="60" class="line" stroke-dasharray="2 4"/>
<text x="20" y="155" class="ink t b">Client</text>
<line x1="110" y1="150" x2="700" y2="150" class="line" stroke-dasharray="2 4"/>
<text x="20" y="245" class="ink t b">Replica B</text>
<line x1="110" y1="240" x2="373" y2="240" class="line" stroke-dasharray="2 4"/><line x1="447" y1="240" x2="700" y2="240" class="line" stroke-dasharray="2 4"/>
<line x1="130" y1="150" x2="170" y2="64" class="line" marker-end="url(#arrow)"/>
<text x="160" y="110" class="ink2 n">request</text>
<rect x="175" y="46" width="372" height="28" rx="6" class="box"/>
<text x="361" y="65" text-anchor="middle" class="ink2 n">stuck behind other work (a GC pause, a busy disk)</text>
<path d="M130,170 V178 H330 V170" class="line"/>
<text x="230" y="196" text-anchor="middle" class="ink2 n">wait about the p95 latency</text>
<line x1="330" y1="150" x2="370" y2="236" class="focus-s" marker-end="url(#arrow)"/>
<text x="360" y="190" class="focus n b">same request again</text>
<rect x="375" y="226" width="70" height="28" rx="6" class="safe-box"/>
<text x="410" y="245" text-anchor="middle" class="ink n">quick</text>
<line x1="450" y1="236" x2="490" y2="154" class="focus-s" marker-end="url(#arrow)"/>
<text x="480" y="206" class="focus n b">first answer wins</text>
<line x1="500" y1="146" x2="538" y2="80" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
<text x="548" y="116" class="lost n b">cancel</text>
<text x="700" y="290" text-anchor="end" class="ink2 n">time →</text>
</svg>
