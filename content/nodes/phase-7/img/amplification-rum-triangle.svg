<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <polygon points="360,50 60,400 660,400" class="line"/>
  <text x="360" y="34" text-anchor="middle" class="ink t b">Read-optimized</text>
  <text x="60" y="428" text-anchor="middle" class="ink t b">Write-optimized</text>
  <text x="705" y="428" text-anchor="end" class="ink t b">Space-optimized</text>
  <circle cx="330" cy="135" r="6" class="box"/>
  <text x="340" y="140" text-anchor="start" class="ink t">Hash index</text>
  <circle cx="320" cy="165" r="6" class="box"/>
  <text x="330" y="170" text-anchor="start" class="ink t">B+tree</text>
  <circle cx="340" cy="195" r="6" class="box"/>
  <text x="350" y="200" text-anchor="start" class="ink t">Skip list</text>
  <circle cx="130" cy="365" r="6" class="box"/>
  <text x="140" y="370" text-anchor="start" class="ink t">Append-only log</text>
  <circle cx="600" cy="365" r="6" class="box"/>
  <text x="590" y="370" text-anchor="end" class="ink t">Bloom filter</text>
  <circle cx="570" cy="335" r="6" class="box"/>
  <text x="560" y="340" text-anchor="end" class="ink t">Compression</text>
  <circle cx="545" cy="305" r="6" class="box"/>
  <text x="535" y="310" text-anchor="end" class="ink t">Sparse index</text>
  <circle cx="200" cy="315" r="6" class="focus"/>
  <text x="210" y="320" text-anchor="start" class="ink t">LSM, tiered</text>
  <circle cx="290" cy="262" r="6" class="focus"/>
  <text x="300" y="267" text-anchor="start" class="ink t">LSM, leveled</text>
  <line x1="208" y1="309" x2="280" y2="268" class="focus-s" marker-end="url(#arrow)"/>
  <text x="40" y="468" class="ink2 n">Each structure is good at two corners at most. Moving an LSM tree from tiered to leveled compaction</text>
  <text x="40" y="486" class="ink2 n">spends more writes to get cheaper reads and less space. Positions are rough, not measured.</text>
</svg>
