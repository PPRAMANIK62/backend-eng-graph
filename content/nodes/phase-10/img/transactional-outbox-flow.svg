<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- order service -->
  <rect x="20" y="70" width="130" height="56" rx="6" class="box"/>
  <text x="85" y="95" text-anchor="middle" class="ink t b">Order service</text>
  <text x="85" y="113" text-anchor="middle" class="ink2 n">handles request</text>
  <line x1="152" y1="98" x2="196" y2="98" class="line" marker-end="url(#arrow)"/>
  <text x="174" y="88" text-anchor="middle" class="ink2 n mono">BEGIN</text>

  <!-- postgres -->
  <rect x="200" y="20" width="250" height="176" rx="6" class="box"/>
  <text x="325" y="42" text-anchor="middle" class="ink t b">Postgres</text>
  <rect x="216" y="54" width="218" height="126" rx="6" class="safe-box"/>
  <text x="325" y="72" text-anchor="middle" class="ink n">one transaction, one COMMIT</text>
  <rect x="230" y="82" width="190" height="36" rx="6" class="box"/>
  <text x="325" y="105" text-anchor="middle" class="ink n mono">orders: row 1042</text>
  <rect x="230" y="128" width="190" height="36" rx="6" class="box"/>
  <text x="325" y="151" text-anchor="middle" class="focus n mono b">outbox: OrderPlaced 1042</text>

  <!-- relay -->
  <line x1="452" y1="146" x2="516" y2="146" class="line" marker-end="url(#arrow)"/>
  <text x="484" y="136" text-anchor="middle" class="ink2 n">committed</text>
  <text x="484" y="166" text-anchor="middle" class="ink2 n">rows only</text>
  <rect x="520" y="110" width="180" height="72" rx="6" class="box"/>
  <text x="610" y="135" text-anchor="middle" class="ink t b">Relay</text>
  <text x="610" y="153" text-anchor="middle" class="ink2 n">polls the table, or</text>
  <text x="610" y="169" text-anchor="middle" class="ink2 n">tails the WAL</text>
  <text x="610" y="96" text-anchor="middle" class="lost n">can resend after a crash</text>

  <!-- kafka -->
  <line x1="610" y1="184" x2="610" y2="236" class="line" marker-end="url(#arrow)"/>
  <rect x="470" y="240" width="230" height="56" rx="6" class="box"/>
  <text x="585" y="264" text-anchor="middle" class="ink t b">Kafka topic: order</text>
  <text x="585" y="282" text-anchor="middle" class="ink2 n mono">key = 1042</text>

  <!-- shipping -->
  <line x1="468" y1="268" x2="394" y2="268" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="228" width="370" height="90" rx="6" class="box"/>
  <text x="36" y="252" class="ink t b">Shipping service</text>
  <text x="36" y="272" class="ink2 n">one local transaction: skip if event id is</text>
  <text x="36" y="288" class="ink2 n">already in processed_events, else create the</text>
  <text x="36" y="304" class="ink2 n">shipment and record the id</text>
</svg>
