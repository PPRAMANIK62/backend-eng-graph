<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="56" y="40" width="358" height="112" rx="10" class="focus-s" style="stroke-width:2"/>
  <text x="64" y="30" class="focus n b">write set, W = 3</text>
  <rect x="314" y="60" width="342" height="112" rx="10" class="line" style="stroke-width:2;stroke-dasharray:6 4"/>
  <text x="656" y="192" text-anchor="end" class="ink n b">read set, R = 3</text>
  <rect x="70" y="80" width="80" height="52" rx="6" class="box"/>
  <text x="110" y="104" text-anchor="middle" class="ink t b">1</text>
  <text x="110" y="122" text-anchor="middle" class="ink2 n">has write</text>
  <rect x="195" y="80" width="80" height="52" rx="6" class="box"/>
  <text x="235" y="104" text-anchor="middle" class="ink t b">2</text>
  <text x="235" y="122" text-anchor="middle" class="ink2 n">has write</text>
  <rect x="320" y="80" width="80" height="52" rx="6" class="safe-box"/>
  <text x="360" y="104" text-anchor="middle" class="ink t b">3</text>
  <text x="360" y="122" text-anchor="middle" class="ink2 n">has write</text>
  <rect x="445" y="80" width="80" height="52" rx="6" class="box"/>
  <text x="485" y="104" text-anchor="middle" class="ink t b">4</text>
  <text x="485" y="122" text-anchor="middle" class="ink2 n">old value</text>
  <rect x="570" y="80" width="80" height="52" rx="6" class="box"/>
  <text x="610" y="104" text-anchor="middle" class="ink t b">5</text>
  <text x="610" y="122" text-anchor="middle" class="ink2 n">old value</text>
  <text x="360" y="222" text-anchor="middle" class="ink n">3 + 3 &gt; 5, so replica 3 is in both sets and the read sees the write</text>

</svg>
