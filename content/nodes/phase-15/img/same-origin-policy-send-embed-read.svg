<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="250" y="28" text-anchor="middle" class="ink t b">Page from evil.example</text>
  <text x="250" y="46" text-anchor="middle" class="ink2 n">in the user's browser</text>
  <text x="600" y="28" text-anchor="middle" class="ink t b">bank.example</text>
  <line x1="250" y1="58" x2="250" y2="360" class="line"/>
  <line x1="600" y1="58" x2="600" y2="360" class="line"/>

  <!-- send -->
  <text x="20" y="94" class="ink t b">Send</text>
  <text x="20" y="112" class="ink2 n">allowed</text>
  <line x1="250" y1="100" x2="597" y2="100" class="line" marker-end="url(#arrow)"/>
  <text x="424" y="92" text-anchor="middle" class="ink n mono">form POST /transfer</text>
  <text x="612" y="104" class="ink n">request runs</text>

  <!-- embed -->
  <text x="20" y="184" class="ink t b">Embed</text>
  <text x="20" y="202" class="ink2 n">allowed</text>
  <line x1="250" y1="180" x2="597" y2="180" class="line" marker-end="url(#arrow)"/>
  <text x="424" y="172" text-anchor="middle" class="ink n mono">&lt;img src="https://bank.example/logo.png"&gt;</text>
  <line x1="600" y1="210" x2="253" y2="210" class="line" marker-end="url(#arrow)"/>
  <text x="424" y="230" text-anchor="middle" class="ink2 n">image is shown; its bytes stay hidden from script</text>

  <!-- read -->
  <text x="20" y="284" class="ink t b">Read</text>
  <text x="20" y="302" class="ink2 n">blocked</text>
  <line x1="250" y1="280" x2="597" y2="280" class="focus-s" marker-end="url(#arrow)"/>
  <text x="424" y="272" text-anchor="middle" class="focus n mono b">fetch("https://bank.example/balance")</text>
  <text x="612" y="284" class="ink n">request still runs</text>
  <line x1="600" y1="312" x2="300" y2="312" class="line"/>
  <line x1="290" y1="296" x2="290" y2="328" class="lost-s"/>
  <text x="424" y="304" text-anchor="middle" class="ink2 n">response</text>
  <text x="300" y="346" class="ink n">browser withholds the response from the page</text>
  <text x="300" y="362" class="ink2 n">unless bank.example allows it with CORS</text>
</svg>
