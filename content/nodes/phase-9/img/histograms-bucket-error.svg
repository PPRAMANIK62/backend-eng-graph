<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- scale: 180 ms at x=80, 320 ms at x=640 => 4 px per ms -->
  <!-- axis -->
  <line x1="80" y1="280" x2="640" y2="280" class="line"/>
  <line x1="80" y1="280" x2="80" y2="286" class="line"/>
  <text x="80" y="302" text-anchor="middle" class="ink2 n">180 ms</text>
  <line x1="160" y1="280" x2="160" y2="286" class="line"/>
  <text x="160" y="302" text-anchor="middle" class="ink2 n">200 ms</text>
  <line x1="320" y1="280" x2="320" y2="286" class="line"/>
  <text x="320" y="302" text-anchor="middle" class="ink2 n">240 ms</text>
  <line x1="480" y1="280" x2="480" y2="286" class="line"/>
  <text x="480" y="302" text-anchor="middle" class="ink2 n">280 ms</text>
  <line x1="560" y1="280" x2="560" y2="286" class="line"/>
  <text x="560" y="302" text-anchor="middle" class="ink2 n">300 ms</text>
  <text x="360" y="322" text-anchor="middle" class="ink2 n">request duration</text>

  <!-- the true spike at 220 ms: x = 80 + 40*4 = 240 -->
  <line x1="240" y1="40" x2="240" y2="280" class="focus-s" stroke-dasharray="5 4"/>
  <text x="240" y="30" text-anchor="middle" class="focus t b">almost every request ≈ 220 ms</text>

  <!-- classic bucket 200-300 ms: x 160..560 -->
  <text x="40" y="78" class="ink t b">Classic bucket</text>
  <rect x="160" y="90" width="400" height="44" rx="6" class="box"/>
  <text x="360" y="117" text-anchor="middle" class="ink2 n">one bucket, 200 to 300 ms: all requests land here</text>
  <!-- estimate 295 ms: x = 80 + 115*4 = 540 -->
  <line x1="540" y1="84" x2="540" y2="140" class="lost-s"/>
  <text x="548" y="156" class="lost t b">p95 estimate 295 ms</text>

  <!-- native bucket ~210-229 ms: x 200..316 -->
  <text x="40" y="186" class="ink t b">Native bucket</text>
  <rect x="200" y="198" width="76" height="44" rx="6" class="box"/>
  <text x="292" y="215" class="ink2 n">bucket about 210 to 229 ms</text>
  <!-- estimate 228 ms: x = 80 + 48*4 = 272 -->
  <line x1="272" y1="192" x2="272" y2="248" class="lost-s"/>
  <text x="292" y="236" class="lost t b">p95 estimate 228 ms</text>
</svg>
