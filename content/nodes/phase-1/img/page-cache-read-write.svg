<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- READ -->
  <text x="40" y="26" class="ink t b">Read</text>
  <rect x="40" y="40" width="310" height="40" rx="6" class="box"/>
  <text x="195" y="65" text-anchor="middle" class="ink t"><tspan class="mono">read()</tspan> 4 KiB of users.db</text>
  <line x1="195" y1="82" x2="195" y2="105" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="108" width="310" height="40" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="40" y="108" width="310" height="40" rx="6" class="focus-s"/>
  <text x="195" y="133" text-anchor="middle" class="ink t">Is that page in the page cache?</text>

  <!-- hit -->
  <line x1="100" y1="150" x2="100" y2="197" class="line" marker-end="url(#arrow)"/>
  <text x="108" y="178" class="ink2 n">yes</text>
  <rect x="40" y="200" width="130" height="72" rx="6" class="box"/>
  <text x="105" y="224" text-anchor="middle" class="ink t">Hit: copy to</text>
  <text x="105" y="242" text-anchor="middle" class="ink t">your buffer</text>
  <text x="105" y="262" text-anchor="middle" class="ink2 n">no disk I/O</text>

  <!-- miss -->
  <line x1="265" y1="150" x2="265" y2="197" class="line" marker-end="url(#arrow)"/>
  <text x="273" y="178" class="ink2 n">no</text>
  <rect x="190" y="200" width="160" height="48" rx="6" class="box"/>
  <text x="270" y="220" text-anchor="middle" class="ink t">Find a free page</text>
  <text x="270" y="238" text-anchor="middle" class="ink2 n">reclaim memory if none</text>
  <line x1="270" y1="250" x2="270" y2="273" class="line" marker-end="url(#arrow)"/>
  <rect x="190" y="276" width="160" height="40" rx="6" class="box"/>
  <text x="270" y="301" text-anchor="middle" class="ink t">Read from disk, wait</text>
  <line x1="270" y1="318" x2="270" y2="341" class="line" marker-end="url(#arrow)"/>
  <rect x="190" y="344" width="160" height="48" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="190" y="344" width="160" height="48" rx="6" class="focus-s"/>
  <text x="270" y="364" text-anchor="middle" class="ink t">Store in the cache,</text>
  <text x="270" y="382" text-anchor="middle" class="ink t">copy to your buffer</text>
  <text x="40" y="420" class="ink2 n">Later reads of that page, from any process, hit.</text>

  <!-- WRITE -->
  <text x="400" y="26" class="ink t b">Write</text>
  <rect x="400" y="40" width="300" height="40" rx="6" class="box"/>
  <text x="550" y="65" text-anchor="middle" class="ink t"><tspan class="mono">write()</tspan> 100 bytes to users.db</text>
  <line x1="550" y1="82" x2="550" y2="105" class="line" marker-end="url(#arrow)"/>
  <rect x="400" y="108" width="300" height="56" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="400" y="108" width="300" height="56" rx="6" class="focus-s"/>
  <text x="550" y="131" text-anchor="middle" class="ink t">Update the page in the cache</text>
  <text x="550" y="151" text-anchor="middle" class="ink t">and mark it dirty</text>
  <line x1="550" y1="166" x2="550" y2="197" class="line" marker-end="url(#arrow)"/>
  <rect x="400" y="200" width="300" height="48" rx="6" class="box"/>
  <text x="550" y="220" text-anchor="middle" class="ink t"><tspan class="mono">write()</tspan> returns</text>
  <text x="550" y="238" text-anchor="middle" class="ink2 n">the new bytes exist only in RAM</text>
  <line x1="550" y1="250" x2="550" y2="341" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="562" y="284" class="ink2 n">later: kernel flusher threads</text>
  <text x="562" y="300" class="ink2 n">or now: <tspan class="mono">fsync()</tspan></text>
  <rect x="400" y="344" width="300" height="48" rx="6" class="safe-box"/>
  <text x="550" y="373" text-anchor="middle" class="ink t">Written to disk</text>
</svg>
