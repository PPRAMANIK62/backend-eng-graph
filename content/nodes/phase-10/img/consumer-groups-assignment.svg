  <text x="225" y="77" text-anchor="middle" class="ink t mono">P2</text>
  <rect x="270" y="54" width="70" height="36" rx="6" class="box"/>
  <text x="305" y="77" text-anchor="middle" class="ink t mono">P3</text>
  <rect x="380" y="54" width="70" height="36" rx="6" class="box"/>
  <text x="415" y="77" text-anchor="middle" class="ink t mono">P0</text>
