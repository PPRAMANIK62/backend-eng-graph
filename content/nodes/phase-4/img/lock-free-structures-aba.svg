<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="24" y="28" class="ink t b">1. Thread 1 starts a pop</text>
  <text x="24" y="63" class="ink2 n mono">top</text>
  <line x1="54" y1="58" x2="88" y2="58" class="line" marker-end="url(#arrow)"/>
  <rect x="92" y="40" width="56" height="36" rx="6" class="box"/>
  <text x="120" y="63" text-anchor="middle" class="ink t b">A</text>
  <line x1="150" y1="58" x2="178" y2="58" class="line" marker-end="url(#arrow)"/>
  <rect x="182" y="40" width="56" height="36" rx="6" class="box"/>
  <text x="210" y="63" text-anchor="middle" class="ink t b">B</text>
  <line x1="240" y1="58" x2="268" y2="58" class="line" marker-end="url(#arrow)"/>
  <rect x="272" y="40" width="56" height="36" rx="6" class="box"/>
  <text x="300" y="63" text-anchor="middle" class="ink t b">C</text>
  <text x="360" y="54" class="ink n">reads top = A and A.next = B,</text>
  <text x="360" y="72" class="ink n">plans <tspan class="mono">CAS(top, A, B)</tspan>, then is paused</text>
  <text x="24" y="118" class="ink t b">2. Thread 2 pops A, pops B, pushes A back</text>
  <text x="24" y="153" class="ink2 n mono">top</text>
  <line x1="54" y1="148" x2="88" y2="148" class="line" marker-end="url(#arrow)"/>
  <rect x="92" y="130" width="56" height="36" rx="6" class="focus-s"/>
  <text x="120" y="153" text-anchor="middle" class="focus t b">A</text>
  <line x1="150" y1="148" x2="178" y2="148" class="line" marker-end="url(#arrow)"/>
  <rect x="182" y="130" width="56" height="36" rx="6" class="box"/>
  <text x="210" y="153" text-anchor="middle" class="ink t b">C</text>
  <rect x="272" y="130" width="56" height="36" rx="6" class="box"/>
  <text x="300" y="153" text-anchor="middle" class="ink2 t b">B</text>
  <text x="360" y="144" class="ink n">B is off the stack, maybe freed and reused.</text>
  <text x="360" y="162" class="ink n">The top is A again, but a different state.</text>
  <text x="24" y="208" class="ink t b">3. Thread 1 resumes: top is still A, so the CAS succeeds</text>
  <text x="24" y="243" class="ink2 n mono">top</text>
  <line x1="54" y1="238" x2="88" y2="238" class="line" marker-end="url(#arrow)"/>
  <rect x="92" y="220" width="56" height="36" rx="6" class="box"/>
  <text x="120" y="243" text-anchor="middle" class="lost t b">B</text>
  <text x="160" y="243" class="lost n b">top now points at B, which was removed</text>
  <rect x="470" y="220" width="56" height="36" rx="6" class="box"/>
  <text x="498" y="243" text-anchor="middle" class="ink2 t b">C</text>
  <text x="534" y="243" class="ink2 n">C is lost from the stack</text>
</svg>
