<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="60" y="26" text-anchor="middle" class="ink t b">Client</text>
  <text x="200" y="26" text-anchor="middle" class="ink t b">Coordinator</text>
  <text x="390" y="26" text-anchor="middle" class="ink t b">Replica A</text>
  <text x="520" y="26" text-anchor="middle" class="ink t b">Replica B</text>
  <text x="650" y="26" text-anchor="middle" class="ink t b">Replica C</text>
  <line x1="60" y1="38" x2="60" y2="510" class="line"/>
  <line x1="200" y1="38" x2="200" y2="510" class="line"/>
  <line x1="390" y1="38" x2="390" y2="510" class="line"/>
  <line x1="520" y1="38" x2="520" y2="510" class="line"/>
  <line x1="650" y1="38" x2="650" y2="96" class="line"/>
  <line x1="650" y1="96" x2="650" y2="250" class="line" stroke-dasharray="4 5"/>
  <line x1="650" y1="250" x2="650" y2="510" class="line"/>
  <text x="658" y="120" class="lost n b">down</text>
  <line x1="60" y1="60" x2="197" y2="72" class="focus-s" marker-end="url(#arrow)"/>
  <text x="130" y="58" text-anchor="middle" class="focus n mono">put v2</text>
  <line x1="200" y1="90" x2="387" y2="102" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="200" y1="90" x2="517" y2="118" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="200" y1="90" x2="628" y2="138" class="focus-s"/>
  <path d="M628,130 L644,146 M644,130 L628,146" class="lost-s"/>
  <text x="398" y="96" class="ink2 n">stores v2</text>
  <text x="528" y="112" class="ink2 n">stores v2</text>
  <line x1="390" y1="140" x2="203" y2="158" class="line" marker-end="url(#arrow)"/>
  <line x1="520" y1="146" x2="203" y2="164" class="line" marker-end="url(#arrow)"/>
  <text x="295" y="140" text-anchor="middle" class="ink2 n">ack</text>
  <line x1="200" y1="182" x2="63" y2="196" class="focus-s" marker-end="url(#arrow)"/>
  <text x="130" y="184" text-anchor="middle" class="focus n b">OK</text>
  <text x="210" y="192" class="ink n">2 acks: W = 2 met</text>
  <line x1="20" y1="226" x2="700" y2="226" class="line" stroke-dasharray="2 4"/>
  <text x="642" y="266" text-anchor="end" class="ink2 n">back up,</text>
  <text x="642" y="282" text-anchor="end" class="ink2 n">still has v1</text>
  <text x="30" y="246" class="ink2 n">later</text>
  <line x1="60" y1="306" x2="197" y2="318" class="line" marker-end="url(#arrow)"/>
  <text x="130" y="304" text-anchor="middle" class="ink n mono">get</text>
  <line x1="200" y1="330" x2="387" y2="346" class="line" marker-end="url(#arrow)"/>
  <line x1="200" y1="330" x2="647" y2="352" class="line" marker-end="url(#arrow)"/>
  <line x1="390" y1="370" x2="203" y2="386" class="focus-s" marker-end="url(#arrow)"/>
  <text x="380" y="364" text-anchor="end" class="focus n b">v2</text>
  <line x1="650" y1="376" x2="203" y2="400" class="line" marker-end="url(#arrow)"/>
  <text x="636" y="396" text-anchor="end" class="ink2 n b">v1 (stale)</text>
  <text x="210" y="420" class="ink n">R = 2 answers: newer is v2</text>
  <line x1="200" y1="432" x2="63" y2="446" class="focus-s" marker-end="url(#arrow)"/>
  <text x="130" y="434" text-anchor="middle" class="focus n b">v2</text>
  <line x1="200" y1="460" x2="647" y2="486" class="focus-s" marker-end="url(#arrow)"/>
  <text x="210" y="494" class="focus n b">read repair: v2 to C</text>

</svg>
