<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="28" class="ink t b">Any two majorities of five nodes share at least one node</text>
  <rect x="112" y="80" width="296" height="100" rx="12" class="focus-s"/>
  <text x="120" y="72" class="focus n b">majority 1: accepted value x</text>
  <rect x="318" y="92" width="290" height="92" rx="12" class="line" stroke-dasharray="6 5"/>
  <text x="600" y="202" text-anchor="end" class="ink2 n">majority 2: any later vote or proposal</text>
  <circle cx="160" cy="130" r="24" class="box"/>
  <text x="160" y="135" text-anchor="middle" class="ink t b">A</text>
  <circle cx="260" cy="130" r="24" class="box"/>
  <text x="260" y="135" text-anchor="middle" class="ink t b">B</text>
  <circle cx="360" cy="130" r="24" class="box"/>
  <text x="360" y="135" text-anchor="middle" class="ink t b">C</text>
  <circle cx="460" cy="130" r="24" class="box"/>
  <text x="460" y="135" text-anchor="middle" class="ink t b">D</text>
  <circle cx="560" cy="130" r="24" class="box"/>
  <text x="560" y="135" text-anchor="middle" class="ink t b">E</text>
  <text x="290" y="202" text-anchor="middle" class="focus n b">C is in both, so majority 2</text>
  <text x="290" y="218" text-anchor="middle" class="focus n b">always meets someone who saw x</text>
  <text x="20" y="266" class="ink t b">Five nodes survive two crashes</text>
  <circle cx="160" cy="330" r="24" class="safe-box"/>
  <text x="160" y="335" text-anchor="middle" class="ink t b">A</text>
  <circle cx="260" cy="330" r="24" class="safe-box"/>
  <text x="260" y="335" text-anchor="middle" class="ink t b">B</text>
  <circle cx="360" cy="330" r="24" class="safe-box"/>
  <text x="360" y="335" text-anchor="middle" class="ink t b">C</text>
  <circle cx="460" cy="330" r="24" class="box"/>
  <text x="460" y="335" text-anchor="middle" class="ink2 t b">D</text>
  <path d="M476,304 L490,318 M490,304 L476,318" class="lost-s"/>
  <circle cx="560" cy="330" r="24" class="box"/>
  <text x="560" y="335" text-anchor="middle" class="ink2 t b">E</text>
  <path d="M576,304 L590,318 M590,304 L576,318" class="lost-s"/>
  <text x="260" y="380" text-anchor="middle" class="ink n">3 of 5 still up: still a majority, still makes progress</text>
  <text x="510" y="380" text-anchor="middle" class="ink2 n">crashed</text>
  <text x="360" y="410" text-anchor="middle" class="ink2 n">A third crash would leave 2 of 5: no majority, so the cluster stops deciding (but never decides wrong).</text>
</svg>
