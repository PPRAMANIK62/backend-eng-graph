<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="30" class="ink t b">Plain DNS</text>
  <rect x="20" y="46" width="140" height="52" rx="6" class="box"/>
  <text x="90" y="68" text-anchor="middle" class="ink t b">Stub resolver</text>
  <text x="90" y="86" text-anchor="middle" class="ink2 n">on your machine</text>
  <rect x="340" y="46" width="160" height="52" rx="6" class="box"/>
  <text x="420" y="68" text-anchor="middle" class="ink t b">Recursive resolver</text>
  <text x="420" y="86" text-anchor="middle" class="ink2 n">ISP or public resolver</text>
  <rect x="580" y="46" width="120" height="52" rx="6" class="box"/>
  <text x="640" y="68" text-anchor="middle" class="ink t b">Authoritative</text>
  <text x="640" y="86" text-anchor="middle" class="ink2 n">servers</text>
  <line x1="502" y1="72" x2="577" y2="72" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="64" text-anchor="middle" class="ink2 n">plain DNS</text>
  <line x1="162" y1="72" x2="337" y2="72" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="64" text-anchor="middle" class="lost n mono b">api.example.com?</text>
  <text x="250" y="90" text-anchor="middle" class="ink2 n">readable on the path</text>
  <text x="20" y="150" class="ink t b">Encrypted DNS (DoT, DoH, DoQ)</text>
  <rect x="20" y="166" width="140" height="52" rx="6" class="box"/>
  <text x="90" y="188" text-anchor="middle" class="ink t b">Stub resolver</text>
  <text x="90" y="206" text-anchor="middle" class="ink2 n">on your machine</text>
  <rect x="340" y="166" width="160" height="52" rx="6" class="box"/>
  <text x="420" y="188" text-anchor="middle" class="ink t b">Recursive resolver</text>
  <text x="420" y="206" text-anchor="middle" class="ink2 n">ISP or public resolver</text>
  <rect x="580" y="166" width="120" height="52" rx="6" class="box"/>
  <text x="640" y="188" text-anchor="middle" class="ink t b">Authoritative</text>
  <text x="640" y="206" text-anchor="middle" class="ink2 n">servers</text>
  <line x1="502" y1="192" x2="577" y2="192" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="184" text-anchor="middle" class="ink2 n">separate hop</text>
  <line x1="162" y1="192" x2="337" y2="192" class="focus-s" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="184" text-anchor="middle" class="focus n b">encrypted</text>
  <text x="250" y="210" text-anchor="middle" class="ink2 n">names hidden on the path</text>
  <text x="420" y="236" text-anchor="middle" class="ink2 n">still sees every name and your IP</text>
  <text x="20" y="276" class="ink2 n">DoT and DoH are specified for the hop from your stub resolver to the recursive resolver.</text>
  <text x="20" y="294" class="ink2 n">DoQ can also carry the resolver's own queries to authoritative servers.</text>
</svg>
