<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="94" y="26" text-anchor="middle" class="ink t b">Cache-aside</text>
  <rect x="49" y="40" width="90" height="34" rx="6" class="box"/>
  <text x="94.0" y="61" text-anchor="middle" class="ink t">App</text>
  <rect x="12" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="44.0" y="161" text-anchor="middle" class="ink t">Cache</text>
  <rect x="114" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="146.0" y="161" text-anchor="middle" class="ink t">DB</text>
  <line x1="64" y1="76" x2="44" y2="137" class="line" marker-end="url(#arrow)"/>
  <line x1="124" y1="76" x2="144" y2="137" class="line" marker-end="url(#arrow)"/>
  <text x="30" y="106" text-anchor="start" class="ink2 n">1, 3</text>
  <text x="158" y="106" text-anchor="end" class="ink2 n">2</text>
  <text x="12" y="222" text-anchor="start" class="ink2 n">App reads the cache;</text>
  <text x="12" y="239" text-anchor="start" class="ink2 n">on a miss, app reads</text>
  <text x="12" y="256" text-anchor="start" class="ink2 n">the DB and fills</text>
  <text x="12" y="273" text-anchor="start" class="ink2 n">the cache.</text>
  <text x="12" y="290" text-anchor="start" class="ink2 n">Write: app updates</text>
  <text x="12" y="307" text-anchor="start" class="ink2 n">DB, then deletes key.</text>
  <text x="272" y="26" text-anchor="middle" class="ink t b">Read-through</text>
  <rect x="227" y="40" width="90" height="34" rx="6" class="box"/>
  <text x="272.0" y="61" text-anchor="middle" class="ink t">App</text>
  <rect x="190" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="222.0" y="161" text-anchor="middle" class="ink t">Cache</text>
  <rect x="292" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="324.0" y="161" text-anchor="middle" class="ink t">DB</text>
  <line x1="252" y1="76" x2="222" y2="137" class="line" marker-end="url(#arrow)"/>
  <line x1="256" y1="157" x2="289" y2="157" class="line" marker-end="url(#arrow)"/>
  <text x="202" y="106" text-anchor="start" class="ink2 n">1 get</text>
  <text x="272" y="194" text-anchor="middle" class="ink2 n">2 load</text>
  <text x="190" y="222" text-anchor="start" class="ink2 n">App reads the cache;</text>
  <text x="190" y="239" text-anchor="start" class="ink2 n">on a miss, the cache</text>
  <text x="190" y="256" text-anchor="start" class="ink2 n">itself loads from</text>
  <text x="190" y="273" text-anchor="start" class="ink2 n">the DB.</text>
  <text x="190" y="290" text-anchor="start" class="ink2 n">Write: separate</text>
  <text x="190" y="307" text-anchor="start" class="ink2 n">(often write-through).</text>
  <text x="450" y="26" text-anchor="middle" class="ink t b">Write-through</text>
  <rect x="405" y="40" width="90" height="34" rx="6" class="box"/>
  <text x="450.0" y="61" text-anchor="middle" class="ink t">App</text>
  <rect x="368" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="400.0" y="161" text-anchor="middle" class="ink t">Cache</text>
  <rect x="470" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="502.0" y="161" text-anchor="middle" class="ink t">DB</text>
  <line x1="430" y1="76" x2="400" y2="137" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="434" y1="157" x2="467" y2="157" class="focus-s" marker-end="url(#arrow)"/>
  <text x="380" y="106" text-anchor="start" class="focus n">1 put</text>
  <text x="450" y="194" text-anchor="middle" class="focus n">2 store, wait</text>
  <text x="368" y="222" text-anchor="start" class="ink2 n">App writes the cache;</text>
  <text x="368" y="239" text-anchor="start" class="ink2 n">the cache writes</text>
  <text x="368" y="256" text-anchor="start" class="ink2 n">the DB and only then</text>
  <text x="368" y="273" text-anchor="start" class="ink2 n">returns.</text>
  <text x="368" y="290" text-anchor="start" class="ink2 n">Write is as slow as</text>
  <text x="368" y="307" text-anchor="start" class="ink2 n">the DB write.</text>
  <text x="628" y="26" text-anchor="middle" class="ink t b">Write-behind</text>
  <rect x="583" y="40" width="90" height="34" rx="6" class="box"/>
  <text x="628.0" y="61" text-anchor="middle" class="ink t">App</text>
  <rect x="546" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="578.0" y="161" text-anchor="middle" class="ink t">Cache</text>
  <rect x="648" y="140" width="64" height="34" rx="6" class="box"/>
  <text x="680.0" y="161" text-anchor="middle" class="ink t">DB</text>
  <line x1="608" y1="76" x2="578" y2="137" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="612" y1="157" x2="645" y2="157" class="focus-s" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="558" y="106" text-anchor="start" class="focus n">1 put</text>
  <text x="628" y="194" text-anchor="middle" class="focus n">2 later, batched</text>
  <text x="546" y="222" text-anchor="start" class="ink2 n">App writes the cache,</text>
  <text x="546" y="239" text-anchor="start" class="ink2 n">which returns at once</text>
  <text x="546" y="256" text-anchor="start" class="ink2 n">and writes the DB</text>
  <text x="546" y="273" text-anchor="start" class="ink2 n">later, in batches.</text>
  <text x="546" y="290" text-anchor="start" class="ink2 n">Unwritten changes</text>
  <text x="546" y="307" text-anchor="start" class="ink2 n">live only in the cache.</text>
  <text x="360" y="340" text-anchor="middle" class="ink2 n">Grey arrows: the read path. Blue arrows: the write path.</text>
</svg>
