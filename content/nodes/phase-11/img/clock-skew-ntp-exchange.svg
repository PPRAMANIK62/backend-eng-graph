<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="180" y="30" text-anchor="middle" class="ink t b">Client</text>
  <text x="540" y="30" text-anchor="middle" class="ink t b">NTP server</text>
  <line x1="180" y1="42" x2="180" y2="250" class="line"/>
  <line x1="540" y1="42" x2="540" y2="250" class="line"/>

  <!-- request -->
  <line x1="180" y1="70" x2="537" y2="120" class="focus-s" marker-end="url(#arrow)"/>
  <text x="360" y="84" text-anchor="middle" class="ink n">request</text>
  <text x="168" y="74" text-anchor="end" class="focus t b mono">T1</text>
  <text x="168" y="90" text-anchor="end" class="ink2 n">sent</text>
  <text x="552" y="124" class="focus t b mono">T2</text>
  <text x="582" y="124" class="ink2 n">received</text>

  <!-- server holds it -->
  <path d="M556,136 H566 V174 H556" class="line"/>
  <text x="574" y="160" class="ink2 n">server holds it</text>

  <!-- reply -->
  <line x1="540" y1="186" x2="183" y2="236" class="focus-s" marker-end="url(#arrow)"/>
  <text x="360" y="200" text-anchor="middle" class="ink n">reply carries T1, T2, T3</text>
  <text x="552" y="190" class="focus t b mono">T3</text>
  <text x="582" y="190" class="ink2 n">sent</text>
  <text x="168" y="240" text-anchor="end" class="focus t b mono">T4</text>
  <text x="168" y="256" text-anchor="end" class="ink2 n">received</text>

  <text x="40" y="296" class="ink2 n">T1 and T4 are read from the client's clock, T2 and T3 from the server's.</text>
  <text x="40" y="324" class="ink t mono">delay  = (T4 − T1) − (T3 − T2)</text>
  <text x="40" y="350" class="ink t mono">offset = ((T2 − T1) + (T3 − T4)) / 2</text>
  <text x="40" y="376" class="ink2 n">The offset is exact only if the request and the reply take equally long.</text>

</svg>
