<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="28" class="ink t b">What one slow handler does to everyone else</text>
  <line x1="150" y1="212" x2="700" y2="212" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="230" text-anchor="end" class="ink2 n">time on the loop thread</text>

  <text x="20" y="72" class="ink n">quick handlers</text>
  <rect x="150" y="54" width="40" height="30" rx="6" class="box"/><text x="170" y="74" text-anchor="middle" class="ink n">A</text>
  <rect x="194" y="54" width="40" height="30" rx="6" class="box"/><text x="214" y="74" text-anchor="middle" class="ink n">B</text>
  <rect x="238" y="54" width="40" height="30" rx="6" class="box"/><text x="258" y="74" text-anchor="middle" class="ink n">C</text>
  <rect x="282" y="54" width="40" height="30" rx="6" class="box"/><text x="302" y="74" text-anchor="middle" class="ink n">D</text>
  <text x="334" y="74" class="ink2 n">each client waits only for a few short turns</text>

  <text x="20" y="170" class="ink n">one slow handler</text>
  <rect x="150" y="150" width="40" height="30" rx="6" class="box"/><text x="170" y="170" text-anchor="middle" class="ink n">A</text>
  <rect x="194" y="150" width="300" height="30" rx="6" class="box"/>
  <rect x="194" y="150" width="300" height="30" rx="6" class="lost-s"/>
  <text x="344" y="170" text-anchor="middle" class="ink n">B: parse a huge JSON body</text>
  <rect x="498" y="150" width="40" height="30" rx="6" class="box"/><text x="518" y="170" text-anchor="middle" class="ink n">C</text>
  <rect x="542" y="150" width="40" height="30" rx="6" class="box"/><text x="562" y="170" text-anchor="middle" class="ink n">D</text>
  <line x1="238" y1="136" x2="494" y2="136" class="line" marker-end="url(#arrow)"/>
  <text x="366" y="126" text-anchor="middle" class="lost n b">C and D, and new connections, wait all this time</text>
</svg>
