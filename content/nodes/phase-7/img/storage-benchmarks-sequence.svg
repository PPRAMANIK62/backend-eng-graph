<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" class="ink t b">One benchmark, in order</text>
  <rect x="20" y="40" width="124" height="84" rx="6" class="box"/>
  <text x="30" y="62" class="ink t b">1  Load</text>
  <text x="30" y="80" class="ink t">in key order</text>
  <text x="30" y="146" class="ink2 n">little compaction yet</text>
  <line x1="145" y1="82" x2="160" y2="82" class="line" marker-end="url(#arrow)"/>
  <rect x="162" y="40" width="124" height="84" rx="6" class="box"/>
  <text x="172" y="62" class="ink t b">2  Age</text>
  <text x="172" y="80" class="ink t">overwrite every</text>
  <text x="172" y="98" class="ink t">key at random</text>
  <text x="172" y="146" class="ink2 n">compaction running:</text>
  <text x="172" y="162" class="ink2 n">steady state</text>
  <line x1="287" y1="82" x2="302" y2="82" class="line" marker-end="url(#arrow)"/>
  <rect x="304" y="40" width="124" height="84" rx="6" class="box"/>
  <rect x="304" y="40" width="124" height="84" rx="6" class="focus-s"/>
  <text x="314" y="62" class="ink t b">3  Measure</text>
  <text x="314" y="80" class="ink t">A, B, C, F, D</text>
  <text x="314" y="146" class="ink2 n">each at several</text>
  <text x="314" y="162" class="ink2 n">target throughputs</text>
  <line x1="429" y1="82" x2="444" y2="82" class="line" marker-end="url(#arrow)"/>
  <rect x="446" y="40" width="124" height="84" rx="6" class="box"/>
  <text x="456" y="62" class="ink t b">4  Reset</text>
  <text x="456" y="80" class="ink t">delete, reload,</text>
  <text x="456" y="98" class="ink t">age again</text>
  <text x="456" y="146" class="ink2 n">D added rows, so</text>
  <text x="456" y="162" class="ink2 n">start from fresh data</text>
  <line x1="571" y1="82" x2="586" y2="82" class="line" marker-end="url(#arrow)"/>
  <rect x="588" y="40" width="124" height="84" rx="6" class="box"/>
  <rect x="588" y="40" width="124" height="84" rx="6" class="focus-s"/>
  <text x="598" y="62" class="ink t b">5  Measure</text>
  <text x="598" y="80" class="ink t">E</text>
  <text x="598" y="146" class="ink2 n">short scans</text>
  <text x="20" y="200" class="ink t b">Record during steps 3 and 5, per interval, for every engine</text>
  <text x="20" y="222" class="ink2 n">throughput · p95 and p99 latency · bytes read and written by the disk · database size on disk</text>
  <text x="20" y="240" class="ink2 n">Same for all engines: data several times bigger than RAM, same durability rule, same disks.</text>
</svg>
