<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="180" y="26" text-anchor="middle" class="ink t b">Plain Raft</text>
  <line x1="180" y1="70" x2="100" y2="140" class="line"/>
  <line x1="180" y1="70" x2="260" y2="140" class="line"/>
  <line x1="100" y1="140" x2="260" y2="140" class="line"/>
  <line x1="100" y1="140" x2="50" y2="230" class="line"/>
  <line x1="260" y1="140" x2="310" y2="230" class="line"/>
  <rect x="154" y="54" width="52" height="32" rx="6" class="box"/>
  <text x="180" y="75" text-anchor="middle" class="ink t b">S1</text>
  <rect x="74" y="124" width="52" height="32" rx="6" class="box"/>
  <text x="100" y="145" text-anchor="middle" class="ink t b">S2</text>
  <rect x="234" y="124" width="52" height="32" rx="6" class="box"/>
  <text x="260" y="145" text-anchor="middle" class="focus t b">S3</text>
  <rect x="24" y="214" width="52" height="32" rx="6" class="box"/>
  <text x="50" y="235" text-anchor="middle" class="ink t b">S4</text>
  <rect x="284" y="214" width="52" height="32" rx="6" class="box"/>
  <text x="310" y="235" text-anchor="middle" class="ink t b">S5</text>
  <text x="292" y="120" class="focus n b">leader</text>
  <path d="M40,212 C32,180 54,164 74,156" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <text x="68" y="146" text-anchor="end" class="lost n">term 6</text>
  <text x="180" y="344" text-anchor="middle" class="lost n b">Repeats: no leader lasts.</text>
  <text x="180" y="274" text-anchor="middle" class="ink n">S4 can&#39;t hear the leader. It times out,</text>
  <text x="180" y="290" text-anchor="middle" class="ink n">raises its term, and S2 passes the</text>
  <text x="180" y="306" text-anchor="middle" class="ink n">higher term on, so S3 steps down.</text>
  <line x1="360" y1="14" x2="360" y2="352" class="line" stroke-dasharray="2 4"/>
  <text x="540" y="26" text-anchor="middle" class="ink t b">With Pre-Vote</text>
  <line x1="540" y1="70" x2="460" y2="140" class="line"/>
  <line x1="540" y1="70" x2="620" y2="140" class="line"/>
  <line x1="460" y1="140" x2="620" y2="140" class="line"/>
  <line x1="460" y1="140" x2="410" y2="230" class="line"/>
  <line x1="620" y1="140" x2="670" y2="230" class="line"/>
  <rect x="514" y="54" width="52" height="32" rx="6" class="box"/>
  <text x="540" y="75" text-anchor="middle" class="ink t b">S1</text>
  <rect x="434" y="124" width="52" height="32" rx="6" class="box"/>
  <text x="460" y="145" text-anchor="middle" class="ink t b">S2</text>
  <rect x="594" y="124" width="52" height="32" rx="6" class="box"/>
  <text x="620" y="145" text-anchor="middle" class="focus t b">S3</text>
  <rect x="384" y="214" width="52" height="32" rx="6" class="box"/>
  <text x="410" y="235" text-anchor="middle" class="ink t b">S4</text>
  <rect x="644" y="214" width="52" height="32" rx="6" class="box"/>
  <text x="670" y="235" text-anchor="middle" class="ink t b">S5</text>
  <text x="652" y="120" class="focus n b">leader</text>
  <path d="M400,212 C392,180 414,164 434,156" class="line" marker-end="url(#arrow)"/>
  <text x="428" y="146" text-anchor="end" class="ink n">pre-vote?</text>
  <text x="454" y="196" class="ink n b">no</text>
  <text x="540" y="344" text-anchor="middle" class="ink n b">S3 stays leader.</text>
  <text x="540" y="274" text-anchor="middle" class="ink n">S2 still hears the leader, so it says</text>
  <text x="540" y="290" text-anchor="middle" class="ink n">no. S4 never raises its term, and</text>
  <text x="540" y="306" text-anchor="middle" class="ink n">nobody is disturbed.</text>
  <text x="360" y="378" text-anchor="middle" class="ink2 n">Only the links drawn work. S5 causes the same trouble as S4, through S3.</text>
</svg>
