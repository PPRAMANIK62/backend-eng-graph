<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="90" y="28" text-anchor="middle" class="ink t b">Reader</text>
  <line x1="90" y1="40" x2="90" y2="300" class="line"/>
  <text x="270" y="28" text-anchor="middle" class="ink t b">Cache</text>
  <line x1="270" y1="40" x2="270" y2="300" class="line"/>
  <text x="450" y="28" text-anchor="middle" class="ink t b">Database</text>
  <line x1="450" y1="40" x2="450" y2="300" class="line"/>
  <text x="630" y="28" text-anchor="middle" class="ink t b">Writer</text>
  <line x1="630" y1="40" x2="630" y2="300" class="line"/>
  <line x1="90" y1="66" x2="267" y2="66" class="line" marker-end="url(#arrow)"/>
  <text x="180.0" y="60" text-anchor="middle" class="ink n mono">get x</text>
  <line x1="270" y1="94" x2="93" y2="94" class="line" marker-end="url(#arrow)"/>
  <text x="180.0" y="88" text-anchor="middle" class="ink n mono">miss</text>
  <line x1="90" y1="126" x2="447" y2="126" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="120" text-anchor="middle" class="ink n mono">select x</text>
  <line x1="450" y1="154" x2="93" y2="154" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="148" text-anchor="middle" class="ink n mono">x = 42</text>
  <line x1="630" y1="182" x2="453" y2="182" class="focus-s" marker-end="url(#arrow)"/>
  <text x="540.0" y="176" text-anchor="middle" class="focus n mono">update x = 43</text>
  <line x1="630" y1="216" x2="273" y2="216" class="focus-s" marker-end="url(#arrow)"/>
  <text x="540.0" y="210" text-anchor="middle" class="focus n mono">delete x</text>
  <text x="360.0" y="210" text-anchor="middle" class="ink2 n">nothing cached</text>
  <line x1="90" y1="252" x2="267" y2="252" class="lost-s" marker-end="url(#arrow)" style="stroke-width:2"/>
  <text x="180.0" y="246" text-anchor="middle" class="lost n mono b">set x = 42</text>
  <rect x="200" y="306" width="140" height="30" rx="6" class="box"/>
  <text x="270" y="326" text-anchor="middle" class="lost n mono b">x = 42 (old)</text>
  <rect x="380" y="306" width="140" height="30" rx="6" class="safe-box"/>
  <text x="450" y="326" text-anchor="middle" class="ink n mono b">x = 43</text>
  <text x="36" y="326" text-anchor="start" class="ink2 n">Result:</text>
</svg>
