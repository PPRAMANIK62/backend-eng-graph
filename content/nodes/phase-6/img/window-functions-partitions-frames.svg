  <text x="44" y="92" class="ink n b">depname</text><text x="200" y="92" text-anchor="end" class="ink n b">salary</text><text x="300" y="92" text-anchor="end" class="ink n b">row_number</text>
  <rect x="34" y="100" width="276" height="120" rx="6" class="box"/>
  <rect x="34" y="228" width="276" height="48" rx="6" class="box"/>
  <rect x="34" y="284" width="276" height="72" rx="6" class="box"/>
