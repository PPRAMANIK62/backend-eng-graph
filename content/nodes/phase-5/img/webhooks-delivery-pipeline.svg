<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- event log and fan-out -->
  <rect x="20" y="76" width="110" height="40" rx="6" class="box"/>
  <text x="75" y="101" text-anchor="middle" class="ink t b">Event log</text>
  <line x1="130" y1="96" x2="157" y2="96" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="76" width="110" height="40" rx="6" class="box"/>
  <text x="215" y="94" text-anchor="middle" class="ink n b">Fan-out:</text>
  <text x="215" y="109" text-anchor="middle" class="ink n">one per endpoint</text>

  <!-- per-endpoint queues -->
  <line x1="270" y1="90" x2="297" y2="42" class="line" marker-end="url(#arrow)"/>
  <line x1="270" y1="96" x2="297" y2="96" class="line" marker-end="url(#arrow)"/>
  <line x1="270" y1="102" x2="297" y2="150" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="20" width="150" height="40" rx="6" class="box"/>
  <rect x="300" y="20" width="150" height="40" rx="6" class="focus-s"/>
  <text x="375" y="45" text-anchor="middle" class="focus n b">Queue for endpoint A</text>
  <rect x="300" y="76" width="150" height="40" rx="6" class="box"/>
  <text x="375" y="101" text-anchor="middle" class="ink n">Queue for endpoint B</text>
  <rect x="300" y="132" width="150" height="40" rx="6" class="box"/>
  <text x="375" y="157" text-anchor="middle" class="ink n">Queue for endpoint C</text>

  <!-- worker and endpoint -->
  <line x1="450" y1="40" x2="477" y2="40" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="480" y="20" width="110" height="40" rx="6" class="box"/>
  <text x="535" y="38" text-anchor="middle" class="ink n b">Worker:</text>
  <text x="535" y="53" text-anchor="middle" class="ink n">sign, POST</text>
  <line x1="590" y1="40" x2="617" y2="40" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="620" y="20" width="90" height="40" rx="6" class="box"/>
  <text x="665" y="45" text-anchor="middle" class="ink n b">Endpoint A</text>

  <!-- success -->
  <line x1="665" y1="60" x2="665" y2="97" class="line" marker-end="url(#arrow)"/>
  <text x="673" y="83" class="ink2 n">2xx</text>
  <rect x="610" y="100" width="100" height="40" rx="6" class="safe-box"/>
  <text x="660" y="125" text-anchor="middle" class="ink n b">Delivered</text>

  <!-- failure and retry -->
  <line x1="560" y1="60" x2="560" y2="197" class="line" marker-end="url(#arrow)"/>
  <text x="568" y="164" class="lost n b">error, redirect</text>
  <text x="568" y="180" class="lost n b">or timeout</text>
  <rect x="480" y="200" width="230" height="40" rx="6" class="box"/>
  <text x="595" y="218" text-anchor="middle" class="ink n b">Retry schedule</text>
  <text x="595" y="233" text-anchor="middle" class="ink n">exponential backoff + jitter</text>
  <line x1="505" y1="200" x2="505" y2="63" class="line" marker-end="url(#arrow)"/>
  <text x="497" y="190" text-anchor="end" class="ink2 n">next attempt</text>

  <!-- dead letter -->
  <line x1="595" y1="240" x2="595" y2="277" class="line" marker-end="url(#arrow)"/>
  <text x="603" y="263" class="ink2 n">after the last attempt</text>
  <rect x="480" y="280" width="230" height="40" rx="6" class="box"/>
  <text x="595" y="298" text-anchor="middle" class="ink n b">Dead-letter queue</text>
  <text x="595" y="313" text-anchor="middle" class="ink n">notify the owner, replay later</text>
</svg>
