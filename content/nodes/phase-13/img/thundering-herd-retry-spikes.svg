  <text x="20" y="37" text-anchor="start" class="ink t b">Retry at the same delay</text>
  <text x="20" y="143" text-anchor="start" class="ink2 n">every client fails together, so every client retries together</text>
  <line x1="20" y1="262" x2="700" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="20" y="174" text-anchor="start" class="ink t b">With jitter</text>
  <text x="20" y="280" text-anchor="start" class="ink2 n">each client waits a random time, so the same retries arrive spread out</text>
