<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the five layers -->

  <text x="40" y="26" class="ink t b mono">Cache-Control: max-age=600, stale-while-revalidate=30, stale-if-error=1200</text>

  <!-- row 1: fresh -->
  <text x="40" y="66" class="ink t b">Fresh</text>
  <text x="40" y="84" class="ink2 n">served straight from cache</text>
  <rect x="240" y="60" width="200" height="26" rx="6" class="focus"/>

  <!-- row 2: stale-while-revalidate -->
  <text x="40" y="126" class="ink t b">stale-while-revalidate</text>
  <text x="40" y="144" class="ink2 n">stale copy now, refresh behind it</text>
  <rect x="440" y="120" width="60" height="26" rx="6" class="old"/>
  <text x="512" y="138" class="ink2 n">then requests wait again</text>

  <!-- row 3: stale-if-error -->
  <text x="40" y="186" class="ink t b">stale-if-error</text>
  <text x="40" y="204" class="ink2 n">stale copy instead of 500, 502, 503, 504</text>
  <rect x="440" y="180" width="170" height="26" rx="6" class="old"/>
  <rect x="614" y="180" width="76" height="26" rx="6" class="lost"/>
  <text x="652" y="222" text-anchor="middle" class="ink2 n">error sent</text>

  <!-- axis -->
  <line x1="240" y1="244" x2="696" y2="244" class="line" marker-end="url(#arrow)"/>
  <line x1="240" y1="238" x2="240" y2="250" class="line"/>
  <line x1="440" y1="238" x2="440" y2="250" class="line"/>
  <line x1="500" y1="238" x2="500" y2="250" class="line"/>
  <line x1="612" y1="238" x2="612" y2="250" class="line"/>
  <text x="240" y="266" text-anchor="middle" class="ink n mono">0</text>
  <text x="440" y="266" text-anchor="middle" class="ink n mono">600</text>
  <text x="500" y="266" text-anchor="middle" class="ink n mono">630</text>
  <text x="612" y="266" text-anchor="middle" class="ink n mono">1800</text>
  <text x="240" y="284" class="ink2 n">age of the stored response, in seconds (not to scale)</text>
</svg>
