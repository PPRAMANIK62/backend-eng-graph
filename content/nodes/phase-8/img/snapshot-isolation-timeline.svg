<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="140" y="26" text-anchor="middle" class="ink t b">T1 (repeatable read)</text>
  <text x="360" y="26" text-anchor="middle" class="ink t b">Row id 7</text>
  <text x="580" y="26" text-anchor="middle" class="ink t b">T2</text>
  <text x="20" y="26" class="ink2 n">time</text>
  <line x1="24" y1="38" x2="24" y2="400" class="line" marker-end="url(#arrow)"/>
  <line x1="140" y1="38" x2="140" y2="400" class="line"/>
  <line x1="580" y1="38" x2="580" y2="400" class="line"/>

  <!-- T1 first read: snapshot -->
  <rect x="44" y="52" width="192" height="40" rx="6" class="box"/>
  <text x="140" y="70" text-anchor="middle" class="ink n mono">SELECT balance</text>
  <text x="140" y="86" text-anchor="middle" class="ink2 n">snapshot taken: sees 100</text>
  <line x1="44" y1="100" x2="676" y2="100" class="focus-s" stroke-dasharray="5 4"/>
  <text x="676" y="116" text-anchor="end" class="focus n b">T1's snapshot</text>

  <rect x="310" y="52" width="100" height="36" rx="6" class="box"/>
  <text x="360" y="75" text-anchor="middle" class="ink t mono">100</text>

  <!-- T2 update and commit -->
  <rect x="484" y="132" width="192" height="40" rx="6" class="box"/>
  <text x="580" y="150" text-anchor="middle" class="ink n mono">UPDATE balance = 70</text>
  <text x="580" y="166" text-anchor="middle" class="ink2 n">new version, not yet visible</text>
  <rect x="484" y="186" width="192" height="30" rx="6" class="box"/>
  <text x="580" y="206" text-anchor="middle" class="ink n mono">COMMIT</text>

  <rect x="310" y="132" width="100" height="36" rx="6" class="old"/>
  <text x="360" y="155" text-anchor="middle" class="ink t mono">100</text>
  <rect x="310" y="176" width="100" height="36" rx="6" class="box"/>
  <rect x="310" y="176" width="100" height="36" rx="6" class="focus-s"/>
  <text x="360" y="199" text-anchor="middle" class="ink t mono">70</text>
  <line x1="481" y1="152" x2="413" y2="190" class="line" marker-end="url(#arrow)"/>

  <!-- T1 second read -->
  <rect x="44" y="236" width="192" height="40" rx="6" class="box"/>
  <text x="140" y="254" text-anchor="middle" class="ink n mono">SELECT balance</text>
  <text x="140" y="270" text-anchor="middle" class="ink2 n">still 100: same snapshot</text>
  <line x1="239" y1="256" x2="307" y2="156" class="line" marker-end="url(#arrow)"/>

  <!-- T1 write conflict -->
  <rect x="44" y="300" width="192" height="40" rx="6" class="box"/>
  <text x="140" y="318" text-anchor="middle" class="ink n mono">UPDATE balance - 10</text>
  <text x="140" y="334" text-anchor="middle" class="ink2 n">row changed since snapshot</text>
  <line x1="239" y1="320" x2="307" y2="204" class="line" marker-end="url(#arrow)"/>
  <rect x="44" y="352" width="300" height="40" rx="6" class="box"/>
  <rect x="44" y="352" width="300" height="40" rx="6" class="lost-s"/>
  <text x="56" y="370" class="ink n b">ERROR: could not serialize access</text>
  <text x="56" y="386" class="ink2 n">T1 rolls back; the app retries it from the start</text>

</svg>
