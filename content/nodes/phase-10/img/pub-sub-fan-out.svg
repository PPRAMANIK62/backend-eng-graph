<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- publisher -->
  <rect x="20" y="118" width="110" height="44" rx="6" class="box"/>
  <text x="75" y="145" text-anchor="middle" class="ink t b">Publisher</text>
  <line x1="132" y1="140" x2="187" y2="140" class="line" marker-end="url(#arrow)"/>
  <text x="160" y="130" text-anchor="middle" class="ink n mono">A, B</text>

  <!-- topic -->
  <rect x="190" y="118" width="110" height="44" rx="6" class="box"/>
  <text x="245" y="145" text-anchor="middle" class="ink t b">Topic</text>

  <!-- to subscriptions -->
  <line x1="302" y1="132" x2="357" y2="78" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="302" y1="148" x2="357" y2="202" class="focus-s" marker-end="url(#arrow)"/>
  <text x="318" y="92" class="focus n mono b">A, B</text>
  <text x="318" y="198" class="focus n mono b">A, B</text>

  <!-- subscriptions -->
  <rect x="360" y="50" width="150" height="52" rx="6" class="box"/>
  <text x="435" y="72" text-anchor="middle" class="ink t b">Subscription 1</text>
  <text x="435" y="90" text-anchor="middle" class="ink2 n">email service</text>
  <rect x="360" y="178" width="150" height="52" rx="6" class="box"/>
  <text x="435" y="200" text-anchor="middle" class="ink t b">Subscription 2</text>
  <text x="435" y="218" text-anchor="middle" class="ink2 n">analytics</text>

  <!-- consumers -->
  <line x1="512" y1="66" x2="567" y2="40" class="line" marker-end="url(#arrow)"/>
  <line x1="512" y1="86" x2="567" y2="112" class="line" marker-end="url(#arrow)"/>
  <rect x="570" y="20" width="130" height="36" rx="6" class="box"/>
  <text x="635" y="43" text-anchor="middle" class="ink n">Consumer 1: <tspan class="mono">A</tspan></text>
  <rect x="570" y="96" width="130" height="36" rx="6" class="box"/>
  <text x="635" y="119" text-anchor="middle" class="ink n">Consumer 2: <tspan class="mono">B</tspan></text>

  <line x1="512" y1="204" x2="567" y2="204" class="line" marker-end="url(#arrow)"/>
  <rect x="570" y="186" width="130" height="36" rx="6" class="box"/>
  <text x="635" y="209" text-anchor="middle" class="ink n">Consumer 3: <tspan class="mono">A, B</tspan></text>

  <!-- notes -->
  <text x="635" y="152" text-anchor="middle" class="ink2 n">compete: each gets some</text>
  <text x="635" y="242" text-anchor="middle" class="ink2 n">gets everything</text>
  <text x="245" y="186" text-anchor="middle" class="ink2 n">a copy per</text>
  <text x="245" y="202" text-anchor="middle" class="ink2 n">subscription</text>
</svg>
