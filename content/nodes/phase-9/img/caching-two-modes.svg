<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="20" y="14" width="330" height="262" rx="6" class="safe-box"/>
  <text x="185" y="40" text-anchor="middle" class="ink t b">Cache warm</text>
  <text x="185" y="58" text-anchor="middle" class="ink2 n">Stable: stays here until something empties it</text>
  <rect x="35" y="80" width="140" height="52" rx="6" class="box"/>
  <text x="105.0" y="110" text-anchor="middle" class="ink n">Most reads hit</text>
  <rect x="195" y="80" width="140" height="52" rx="6" class="box"/>
  <text x="265.0" y="102" text-anchor="middle" class="ink n">Database gets</text>
  <text x="265.0" y="118" text-anchor="middle" class="ink n">only the misses</text>
  <rect x="195" y="200" width="140" height="52" rx="6" class="box"/>
  <text x="265.0" y="230" text-anchor="middle" class="ink n">Database stays fast</text>
  <rect x="35" y="200" width="140" height="52" rx="6" class="box"/>
  <text x="105.0" y="222" text-anchor="middle" class="ink n">Fills are quick,</text>
  <text x="105.0" y="238" text-anchor="middle" class="ink n">cache stays full</text>
  <line x1="175" y1="106" x2="192" y2="106" class="line" marker-end="url(#arrow)"/>
  <line x1="265" y1="132" x2="265" y2="197" class="line" marker-end="url(#arrow)"/>
  <line x1="195" y1="226" x2="178" y2="226" class="line" marker-end="url(#arrow)"/>
  <line x1="105" y1="200" x2="105" y2="135" class="line" marker-end="url(#arrow)"/>
  <rect x="370" y="14" width="330" height="262" rx="6" class="lost-s"/>
  <text x="535" y="40" text-anchor="middle" class="ink t b">Cache empty</text>
  <text x="535" y="58" text-anchor="middle" class="ink2 n">Also stable: stays here until load drops</text>
  <rect x="385" y="80" width="140" height="52" rx="6" class="box"/>
  <text x="455.0" y="110" text-anchor="middle" class="ink n">Most reads miss</text>
  <rect x="545" y="80" width="140" height="52" rx="6" class="box"/>
  <text x="615.0" y="102" text-anchor="middle" class="ink n">Database gets</text>
  <text x="615.0" y="118" text-anchor="middle" class="ink n">nearly every read</text>
  <rect x="545" y="200" width="140" height="52" rx="6" class="box"/>
  <text x="615.0" y="222" text-anchor="middle" class="ink n">Database slows,</text>
  <text x="615.0" y="238" text-anchor="middle" class="ink n">requests pile up</text>
  <rect x="385" y="200" width="140" height="52" rx="6" class="box"/>
  <text x="455.0" y="222" text-anchor="middle" class="ink n">Fills are slow,</text>
  <text x="455.0" y="238" text-anchor="middle" class="ink n">cache stays empty</text>
  <line x1="525" y1="106" x2="542" y2="106" class="line" marker-end="url(#arrow)"/>
  <line x1="615" y1="132" x2="615" y2="197" class="line" marker-end="url(#arrow)"/>
  <line x1="545" y1="226" x2="528" y2="226" class="line" marker-end="url(#arrow)"/>
  <line x1="455" y1="200" x2="455" y2="135" class="line" marker-end="url(#arrow)"/>
  <line x1="352" y1="160" x2="367" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="296" text-anchor="middle" class="ink2 n">A restart, a failed cache node or a key format change moves the system from left to right.</text>
</svg>
