<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">1  Lost on the way in</text>
  <text x="50" y="52" text-anchor="middle" class="ink n b">Client</text>
  <text x="200" y="52" text-anchor="middle" class="ink n b">Server</text>
  <line x1="50" y1="60" x2="50" y2="250" class="line"/>
  <line x1="200" y1="60" x2="200" y2="250" class="line"/>
  <line x1="50" y1="80" x2="120" y2="100" class="focus-s"/>
  <path d="M119,95 L133,109 M133,95 L119,109" class="lost-s"/>
  <text x="58" y="78" class="focus n mono">POST /charges</text>
  <text x="58" y="236" class="ink n">timeout</text>
  <circle cx="50" cy="232" r="4" class="ink"/>
  <text x="125" y="276" text-anchor="middle" class="ink2 n">nothing happened</text>
  <text x="255" y="24" class="ink t b">2  Server fails midway</text>
  <text x="285" y="52" text-anchor="middle" class="ink n b">Client</text>
  <text x="435" y="52" text-anchor="middle" class="ink n b">Server</text>
  <line x1="285" y1="60" x2="285" y2="250" class="line"/>
  <line x1="435" y1="60" x2="435" y2="250" class="line"/>
  <line x1="285" y1="80" x2="432" y2="120" class="focus-s" marker-end="url(#arrow)"/>
  <text x="293" y="78" class="focus n mono">POST /charges</text>
  <rect x="427" y="126" width="16" height="40" rx="3" class="box"/>
  <path d="M428,169 L442,183 M442,169 L428,183" class="lost-s"/>
  <text x="421" y="200" text-anchor="end" class="ink2 n">crash</text>
  <text x="293" y="236" class="ink n">timeout</text>
  <circle cx="285" cy="232" r="4" class="ink"/>
  <text x="360" y="276" text-anchor="middle" class="ink2 n">some work may be done</text>
  <text x="490" y="24" class="ink t b">3  Response lost</text>
  <text x="520" y="52" text-anchor="middle" class="ink n b">Client</text>
  <text x="670" y="52" text-anchor="middle" class="ink n b">Server</text>
  <line x1="520" y1="60" x2="520" y2="250" class="line"/>
  <line x1="670" y1="60" x2="670" y2="250" class="line"/>
  <line x1="520" y1="80" x2="667" y2="120" class="focus-s" marker-end="url(#arrow)"/>
  <text x="528" y="78" class="focus n mono">POST /charges</text>
  <rect x="662" y="126" width="16" height="40" rx="3" class="safe-box"/>
  <line x1="670" y1="176" x2="600" y2="196" class="line"/>
  <path d="M587,191 L601,205 M601,191 L587,205" class="lost-s"/>
  <text x="656" y="170" text-anchor="end" class="ink2 n">200 OK</text>
  <text x="528" y="236" class="ink n">timeout</text>
  <circle cx="520" cy="232" r="4" class="ink"/>
  <text x="595" y="276" text-anchor="middle" class="ink2 n">the charge went through</text>
  <text x="360" y="310" text-anchor="middle" class="ink t">The client sees the same thing each time: no answer, then its timeout.</text>
</svg>
