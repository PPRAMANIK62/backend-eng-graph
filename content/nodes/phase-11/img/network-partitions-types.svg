<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="120" y="26" text-anchor="middle" class="ink t b">Complete</text>
<text x="120" y="44" text-anchor="middle" class="ink2 n">two groups, no link between them</text>
<text x="360" y="26" text-anchor="middle" class="ink t b">Partial</text>
<text x="360" y="44" text-anchor="middle" class="ink2 n">A and B cut off; C still reaches both</text>
<text x="600" y="26" text-anchor="middle" class="ink t b">Simplex</text>
<text x="600" y="44" text-anchor="middle" class="ink2 n">traffic flows one way only</text>
<line x1="50" y1="110" x2="50" y2="200" class="line"/>
<line x1="160" y1="100" x2="215" y2="160" class="line"/>
<line x1="215" y1="160" x2="160" y2="220" class="line"/>
<line x1="160" y1="100" x2="160" y2="220" class="line"/>
<line x1="115" y1="70" x2="115" y2="250" class="lost-s" stroke-dasharray="6 5" style="stroke-width:2"/>
<circle cx="50" cy="110" r="17" class="box"/>
<text x="50" y="115" text-anchor="middle" class="ink n b">1</text>
<circle cx="50" cy="200" r="17" class="box"/>
<text x="50" y="205" text-anchor="middle" class="ink n b">2</text>
<circle cx="160" cy="100" r="17" class="box"/>
<text x="160" y="105" text-anchor="middle" class="ink n b">3</text>
<circle cx="215" cy="160" r="17" class="box"/>
<text x="215" y="165" text-anchor="middle" class="ink n b">4</text>
<circle cx="160" cy="220" r="17" class="box"/>
<text x="160" y="225" text-anchor="middle" class="ink n b">5</text>
<line x1="280" y1="110" x2="360" y2="220" class="line"/>
<line x1="440" y1="110" x2="360" y2="220" class="line"/>
<line x1="297" y1="110" x2="423" y2="110" class="lost-s" stroke-dasharray="6 5" style="stroke-width:2"/>
<text x="360.0" y="116.0" text-anchor="middle" class="lost t b">✕</text>
<circle cx="280" cy="110" r="17" class="box"/>
<text x="280" y="115" text-anchor="middle" class="ink n b">A</text>
<circle cx="440" cy="110" r="17" class="box"/>
<text x="440" y="115" text-anchor="middle" class="ink n b">B</text>
<circle cx="360" cy="220" r="17" class="box"/>
<text x="360" y="225" text-anchor="middle" class="ink n b">C</text>
<line x1="538" y1="136" x2="660" y2="136" class="line" marker-end="url(#arrow)"/>
<text x="600" y="128" text-anchor="middle" class="ink2 n">heartbeats get through</text>
<line x1="662" y1="164" x2="538" y2="164" class="lost-s" stroke-dasharray="6 5" style="stroke-width:2"/>
<text x="600" y="170" text-anchor="middle" class="lost t b">✕</text>
<text x="600" y="194" text-anchor="middle" class="ink2 n">everything into A dropped</text>
<circle cx="520" cy="150" r="17" class="box"/>
<text x="520" y="155" text-anchor="middle" class="ink n b">A</text>
<circle cx="680" cy="150" r="17" class="box"/>
<text x="680" y="155" text-anchor="middle" class="ink n b">B</text>
<text x="360" y="288" text-anchor="middle" class="ink2 n">Dashed red: links that drop everything. Grey: links that still work.</text>
</svg>