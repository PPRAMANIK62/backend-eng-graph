<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="31" class="ink t b">One checkout request</text>
  <rect x="200" y="10" width="90" height="32" rx="6" class="box"/>
  <text x="245.0" y="31" text-anchor="middle" class="ink t">proxy</text>
  <line x1="290" y1="26" x2="307" y2="26" class="line" marker-end="url(#arrow)"/>
  <rect x="310" y="10" width="90" height="32" rx="6" class="box"/>
  <text x="355.0" y="31" text-anchor="middle" class="ink t">API</text>
  <line x1="400" y1="26" x2="417" y2="26" class="line" marker-end="url(#arrow)"/>
  <rect x="420" y="10" width="90" height="32" rx="6" class="box"/>
  <text x="465.0" y="31" text-anchor="middle" class="ink t">payment</text>
  <line x1="510" y1="26" x2="537" y2="26" class="line" marker-end="url(#arrow)"/>
  <rect x="540" y="10" width="90" height="32" rx="6" class="box"/>
  <text x="585.0" y="31" text-anchor="middle" class="ink t">database</text>
  <line x1="20" y1="62" x2="700" y2="62" class="line"/>
  <text x="20" y="84" class="ink2 n">Signal</text><text x="170" y="84" class="ink2 n">What this request leaves behind</text><text x="540" y="84" class="ink2 n">Answers</text>
  <text x="20" y="118" class="ink t b">Metric</text><text x="20" y="136" class="ink2 n">cheapest to keep</text>
  <text x="170" y="114" class="ink n mono">http_requests_total</text><text x="306" y="114" class="focus n mono b">+1</text>
  <rect x="170" y="174" width="20" height="10" rx="2" class="box"/>
  <rect x="196" y="158" width="20" height="26" rx="2" class="box"/>
  <rect x="222" y="144" width="20" height="40" rx="2" class="box"/>
  <rect x="248" y="154" width="20" height="30" rx="2" class="box"/>
  <rect x="274" y="166" width="20" height="18" rx="2" class="box"/>
  <rect x="274" y="158" width="20" height="8" rx="2" class="focus"/>
  <text x="284" y="154" text-anchor="middle" class="focus n mono b">+1</text>
  <rect x="300" y="176" width="20" height="8" rx="2" class="box"/>
  <text x="170" y="200" class="ink2 n">latency histogram buckets</text>
  <text x="345" y="148" class="ink2 n">Merged with every other</text><text x="345" y="164" class="ink2 n">request. Nothing about this</text><text x="345" y="180" class="ink2 n">one request survives.</text>
  <text x="540" y="118" class="ink t">Is something wrong?</text><text x="540" y="136" class="ink2 n">rate, errors, latency</text>
  <line x1="20" y1="218" x2="700" y2="218" class="line"/>
  <text x="20" y="252" class="ink t b">Log event</text><text x="20" y="270" class="ink2 n">heaviest to keep</text>
  <rect x="170" y="234" width="340" height="52" rx="6" class="box"/>
  <text x="182" y="255" class="ink n mono">route=/checkout status=200</text>
  <text x="182" y="274" class="ink n mono">user=usr_123 trace_id=<tspan class="focus">4bf92f35…</tspan></text>
  <text x="540" y="252" class="ink t">What happened to</text><text x="540" y="270" class="ink t">this request?</text>
  <line x1="20" y1="306" x2="700" y2="306" class="line"/>
  <text x="20" y="340" class="ink t b">Trace</text><text x="20" y="358" class="ink2 n">in between</text>
  <rect x="170" y="322" width="340" height="18" rx="4" class="box"/>
  <text x="178" y="335" class="ink n mono">proxy</text>
  <rect x="186" y="346" width="314" height="18" rx="4" class="box"/>
  <text x="194" y="359" class="ink n mono">API</text>
  <rect x="202" y="370" width="288" height="18" rx="4" class="box"/>
  <text x="210" y="383" class="ink n mono">payment</text>
  <rect x="236" y="394" width="234" height="18" rx="4" class="focus-s"/>
  <text x="244" y="407" class="focus n mono b">database</text>
  <text x="170" y="430" class="ink2 n">four spans, one trace id; the database span holds most of the time</text>
  <text x="540" y="340" class="ink t">Where did the</text><text x="540" y="358" class="ink t">time go?</text>
</svg>
