<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- left: series -->
  <text x="180" y="28" text-anchor="middle" class="ink t b">In series: every one must work</text>
  <text x="8" y="90" class="ink2 n">request</text>
  <line x1="8" y1="100" x2="58" y2="100" class="line" marker-end="url(#arrow)"/>
  <rect x="60" y="76" width="70" height="48" rx="6" class="box"/>
  <text x="95" y="105" text-anchor="middle" class="ink t">Service</text>
  <line x1="130" y1="100" x2="163" y2="100" class="line" marker-end="url(#arrow)"/>
  <rect x="165" y="76" width="70" height="48" rx="6" class="box"/>
  <text x="200" y="105" text-anchor="middle" class="ink t">Auth</text>
  <line x1="235" y1="100" x2="268" y2="100" class="line" marker-end="url(#arrow)"/>
  <rect x="270" y="76" width="70" height="48" rx="6" class="box"/>
  <text x="305" y="105" text-anchor="middle" class="ink t">DB</text>
  <text x="95" y="146" text-anchor="middle" class="ink2 n mono">a₁</text>
  <text x="200" y="146" text-anchor="middle" class="ink2 n mono">a₂</text>
  <text x="305" y="146" text-anchor="middle" class="ink2 n mono">a₃</text>

  <text x="180" y="190" text-anchor="middle" class="focus t b mono">A = a₁ × a₂ × a₃</text>
  <text x="180" y="218" text-anchor="middle" class="ink2 n">Every number is below 1, so each</text>
  <text x="180" y="234" text-anchor="middle" class="ink2 n">added dependency pulls A down.</text>
  <text x="180" y="270" text-anchor="middle" class="ink n">A 99.99% service with five critical</text>
  <text x="180" y="286" text-anchor="middle" class="ink n">dependencies at 99.999% gives them</text>
  <text x="180" y="302" text-anchor="middle" class="ink n">26 of its 53 minutes a year.</text>

  <line x1="360" y1="20" x2="360" y2="310" class="line" stroke-dasharray="4 4"/>

  <!-- right: parallel -->
  <text x="540" y="28" text-anchor="middle" class="ink t b">In parallel: any one is enough</text>
  <text x="380" y="92" class="ink2 n">request</text>
  <line x1="380" y1="100" x2="440" y2="100" class="line"/>
  <line x1="440" y1="100" x2="478" y2="68" class="line" marker-end="url(#arrow)"/>
  <line x1="440" y1="100" x2="478" y2="132" class="line" marker-end="url(#arrow)"/>
  <rect x="480" y="46" width="110" height="40" rx="6" class="box"/>
  <text x="535" y="71" text-anchor="middle" class="ink t">Copy 1</text>
  <rect x="480" y="114" width="110" height="40" rx="6" class="box"/>
  <text x="535" y="139" text-anchor="middle" class="ink t">Copy 2</text>
  <text x="608" y="71" class="ink2 n mono">a</text>
  <text x="608" y="139" class="ink2 n mono">a</text>

  <text x="540" y="190" text-anchor="middle" class="focus t b mono">A = 1 − (1 − a)²</text>
  <text x="540" y="218" text-anchor="middle" class="ink2 n">Down only when both are down,</text>
  <text x="540" y="234" text-anchor="middle" class="ink2 n">so the failure chances multiply.</text>
  <text x="540" y="270" text-anchor="middle" class="ink n">Two copies at 99% give 99.99%.</text>
  <text x="540" y="298" text-anchor="middle" class="lost t b">Only if they fail independently</text>
</svg>
