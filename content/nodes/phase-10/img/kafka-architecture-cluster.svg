<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <rect x="30" y="140" width="180" height="176" rx="6" class="box"/>
  <text x="42" y="164" class="ink t b">Broker 1</text>
  <rect x="40" y="178" width="160" height="32" rx="6" class="focus-s"/>
  <text x="52" y="199" class="focus n b">P0 leader</text>
  <rect x="40" y="222" width="160" height="32" rx="6" class="box"/>
  <text x="52" y="243" class="ink2 n">P1 follower</text>
  <rect x="40" y="266" width="160" height="32" rx="6" class="box"/>
  <text x="52" y="287" class="ink2 n">P2 follower</text>
  <rect x="270" y="140" width="180" height="176" rx="6" class="box"/>
  <text x="282" y="164" class="ink t b">Broker 2</text>
  <rect x="280" y="178" width="160" height="32" rx="6" class="box"/>
  <text x="292" y="199" class="ink2 n">P0 follower</text>
  <rect x="280" y="222" width="160" height="32" rx="6" class="focus-s"/>
  <text x="292" y="243" class="focus n b">P1 leader</text>
  <rect x="280" y="266" width="160" height="32" rx="6" class="box"/>
  <text x="292" y="287" class="ink2 n">P2 follower</text>
  <rect x="510" y="140" width="180" height="176" rx="6" class="box"/>
  <text x="522" y="164" class="ink t b">Broker 3</text>
  <rect x="520" y="178" width="160" height="32" rx="6" class="box"/>
  <text x="532" y="199" class="ink2 n">P0 follower</text>
  <rect x="520" y="222" width="160" height="32" rx="6" class="box"/>
  <text x="532" y="243" class="ink2 n">P1 follower</text>
  <rect x="520" y="266" width="160" height="32" rx="6" class="focus-s"/>
  <text x="532" y="287" class="focus n b">P2 leader</text>
  <line x1="280" y1="238" x2="203" y2="238" class="line" marker-end="url(#arrow)"/>
  <line x1="440" y1="238" x2="517" y2="238" class="line" marker-end="url(#arrow)"/>
  <rect x="290" y="40" width="140" height="44" rx="6" class="box"/>
  <text x="360" y="67" text-anchor="middle" class="ink t b">Producer</text>
  <line x1="360" y1="86" x2="360" y2="137" class="focus-s" marker-end="url(#arrow)"/>
  <text x="370" y="110" class="focus n">record for P1,</text>
  <text x="370" y="126" class="focus n">sent to its leader</text>
  <rect x="30" y="34" width="200" height="56" rx="6" class="box"/>
  <text x="130" y="57" text-anchor="middle" class="ink t b">Controllers</text>
  <text x="130" y="76" text-anchor="middle" class="ink2 n">Raft quorum (KRaft)</text>
  <line x1="130" y1="137" x2="130" y2="93" class="line" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="140" y="118" class="ink2 n">brokers fetch metadata</text>
  <line x1="360" y1="318" x2="360" y2="357" class="line" marker-end="url(#arrow)"/>
  <text x="370" y="342" class="ink2 n">fetch from an offset</text>
  <rect x="290" y="360" width="140" height="44" rx="6" class="box"/>
  <text x="360" y="387" text-anchor="middle" class="ink t b">Consumer</text>
  <text x="30" y="382" class="ink2 n">Followers copy the leader's log</text>
  <text x="30" y="398" class="ink2 n">by fetching from it (arrows for P1).</text>
  <text x="690" y="382" text-anchor="end" class="ink2 n">Each broker leads one partition</text>
  <text x="690" y="398" text-anchor="end" class="ink2 n">and follows the other two.</text>
</svg>
