<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">One shared pool</text>
  <rect x="20" y="36" width="320" height="76" rx="6" class="box"/>
  <text x="34" y="56" class="ink n">8 threads for all outgoing calls</text>
  <rect x="36" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="73" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="110" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="147" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="184" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="221" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="258" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="295" y="72" width="26" height="26" rx="4" class="lost"/>
  <rect x="20" y="160" width="96" height="46" rx="6" class="box"/>
  <rect x="20" y="160" width="96" height="46" rx="6" class="lost-s"/>
  <text x="68.0" y="180" text-anchor="middle" class="ink t b">Payments</text>
  <text x="68.0" y="197" text-anchor="middle" class="ink2 n">hangs</text>
  <line x1="180" y1="114" x2="68.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <rect x="132" y="160" width="96" height="46" rx="6" class="box"/>
  <text x="180.0" y="180" text-anchor="middle" class="ink t b">Search</text>
  <text x="180.0" y="197" text-anchor="middle" class="ink2 n">healthy</text>
  <line x1="180" y1="114" x2="180.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <rect x="244" y="160" width="96" height="46" rx="6" class="box"/>
  <text x="292.0" y="180" text-anchor="middle" class="ink t b">Profile</text>
  <text x="292.0" y="197" text-anchor="middle" class="ink2 n">healthy</text>
  <line x1="180" y1="114" x2="292.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <text x="20" y="232" class="ink n">Every thread is stuck on payments,</text>
  <text x="20" y="250" class="ink n">so search and profile calls get none.</text>
  <text x="380" y="24" class="ink t b">A pool per dependency</text>
  <rect x="380" y="36" width="100" height="76" rx="6" class="box"/>
  <text x="430" y="56" text-anchor="middle" class="ink n">Payments pool</text>
  <rect x="388" y="72" width="24" height="26" rx="4" class="lost"/>
  <rect x="418" y="72" width="24" height="26" rx="4" class="lost"/>
  <rect x="448" y="72" width="24" height="26" rx="4" class="lost"/>
  <rect x="490" y="36" width="100" height="76" rx="6" class="box"/>
  <text x="540" y="56" text-anchor="middle" class="ink n">Search pool</text>
  <rect x="498" y="72" width="24" height="26" rx="4" class="focus"/>
  <rect x="528" y="72" width="24" height="26" rx="4" class="box"/>
  <rect x="558" y="72" width="24" height="26" rx="4" class="box"/>
  <rect x="600" y="36" width="100" height="76" rx="6" class="box"/>
  <text x="650" y="56" text-anchor="middle" class="ink n">Profile pool</text>
  <rect x="608" y="72" width="24" height="26" rx="4" class="focus"/>
  <rect x="638" y="72" width="24" height="26" rx="4" class="box"/>
  <rect x="668" y="72" width="24" height="26" rx="4" class="box"/>
  <rect x="380" y="160" width="100" height="46" rx="6" class="box"/>
  <rect x="380" y="160" width="100" height="46" rx="6" class="lost-s"/>
  <text x="430.0" y="180" text-anchor="middle" class="ink t b">Payments</text>
  <text x="430.0" y="197" text-anchor="middle" class="ink2 n">hangs</text>
  <line x1="430" y1="114" x2="430.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <rect x="490" y="160" width="100" height="46" rx="6" class="box"/>
  <text x="540.0" y="180" text-anchor="middle" class="ink t b">Search</text>
  <text x="540.0" y="197" text-anchor="middle" class="ink2 n">healthy</text>
  <line x1="540" y1="114" x2="540.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <rect x="600" y="160" width="100" height="46" rx="6" class="box"/>
  <text x="650.0" y="180" text-anchor="middle" class="ink t b">Profile</text>
  <text x="650.0" y="197" text-anchor="middle" class="ink2 n">healthy</text>
  <line x1="650" y1="114" x2="650.0" y2="157" class="line" marker-end="url(#arrow)"/>
  <text x="380" y="232" class="ink n">The payments pool fills and its calls fail</text>
  <text x="380" y="250" class="ink n">fast; search and profile keep their threads.</text>
  <rect x="20" y="276" width="16" height="16" rx="3" class="lost"/>
  <text x="42" y="289" class="ink2 n">waiting on a hung call</text>
  <rect x="200" y="276" width="16" height="16" rx="3" class="focus"/>
  <text x="222" y="289" class="ink2 n">serving a request</text>
  <rect x="360" y="276" width="16" height="16" rx="3" class="box"/>
  <text x="382" y="289" class="ink2 n">free</text>
</svg>
