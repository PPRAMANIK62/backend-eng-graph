<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="60" y="14" width="120" height="32" rx="6" class="box"/>
  <text x="120" y="35" text-anchor="middle" class="ink t b">Service</text>
  <rect x="300" y="14" width="120" height="32" rx="6" class="box"/>
  <text x="360" y="35" text-anchor="middle" class="ink t b">Vault</text>
  <rect x="540" y="14" width="120" height="32" rx="6" class="box"/>
  <text x="600" y="35" text-anchor="middle" class="ink t b">Postgres</text>
  <line x1="120" y1="46" x2="120" y2="425" class="line"/>
  <line x1="360" y1="46" x2="360" y2="425" class="line"/>
  <line x1="600" y1="46" x2="600" y2="425" class="line"/>

  <!-- 1 login -->
  <line x1="120" y1="84" x2="357" y2="84" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="76" text-anchor="middle" class="ink n">1  log in with its own identity</text>

  <!-- 2 create user -->
  <line x1="360" y1="122" x2="597" y2="122" class="line" marker-end="url(#arrow)"/>
  <text x="480" y="114" text-anchor="middle" class="ink n">2  create a new database user</text>

  <!-- 3 return credential -->
  <line x1="360" y1="166" x2="123" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <text x="240" y="150" text-anchor="middle" class="focus n b">3  username, password</text>
  <text x="240" y="186" text-anchor="middle" class="ink2 n mono">lease_id, TTL</text>

  <!-- 4 use it -->
  <line x1="120" y1="214" x2="597" y2="214" class="focus-s" marker-end="url(#arrow)"/>
  <text x="480" y="206" text-anchor="middle" class="focus n b">4  connect as that user</text>

  <!-- 5 renew -->
  <line x1="120" y1="258" x2="357" y2="258" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="250" text-anchor="middle" class="ink n">5  renew the lease before the TTL runs out</text>
  <line x1="360" y1="290" x2="123" y2="290" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="310" text-anchor="middle" class="ink2 n">new TTL, maybe shorter than asked</text>

  <!-- expiry -->
  <line x1="40" y1="332" x2="680" y2="332" class="line" stroke-dasharray="4 4"/>
  <rect x="250" y="322" width="220" height="22" rx="6" class="box"/>
  <text x="360" y="338" text-anchor="middle" class="ink2 n">lease expires, or is revoked</text>

  <!-- 6 revoke -->
  <line x1="360" y1="376" x2="597" y2="376" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <text x="480" y="368" text-anchor="middle" class="lost n b">6  revoke that user</text>

  <!-- 7 rejected -->
  <line x1="120" y1="412" x2="570" y2="412" class="lost-s" style="stroke-width:1.5"/>
  <text x="584" y="417" text-anchor="middle" class="lost t b">✕</text>
  <text x="240" y="404" text-anchor="middle" class="lost n b">7  old password rejected</text>
</svg>
