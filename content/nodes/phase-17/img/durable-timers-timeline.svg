<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="66" text-anchor="start" class="ink t b">Workflow</text>
  <text x="20" y="142" text-anchor="start" class="ink t b">Engine</text>
  <text x="20" y="160" text-anchor="start" class="ink t b">storage</text>
  <text x="20" y="222" text-anchor="start" class="ink t b">Workers</text>
  <rect x="130" y="40" width="110" height="40" rx="6" class="box"/>
  <text x="185.0" y="65.0" text-anchor="middle" class="ink t">send invoice</text>
  <rect x="250" y="40" width="110" height="40" rx="6" class="box"/>
  <text x="305.0" y="65.0" text-anchor="middle" class="ink t mono">sleep(24h)</text>
  <line x1="360" y1="60" x2="560" y2="60" class="line" stroke-dasharray="5 4"/>
  <text x="460" y="52" text-anchor="middle" class="ink2 n">unloaded, not in memory</text>
  <rect x="570" y="34" width="130" height="52" rx="6" class="box"/>
  <text x="635.0" y="56.5" text-anchor="middle" class="ink n">replays, then</text>
  <text x="635.0" y="73.5" text-anchor="middle" class="ink n">sends reminder</text>
  <rect x="570" y="34" width="130" height="52" rx="6" class="focus-s"/>
  <rect x="305" y="120" width="255" height="34" rx="6" class="safe-box"/>
  <text x="432.5" y="142.0" text-anchor="middle" class="ink n">timer stored with its due time</text>
  <line x1="305" y1="82" x2="305" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="560" y1="120" x2="600" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="608" y="110" text-anchor="start" class="ink2 n">fires</text>
  <line x1="420" y1="196" x2="420" y2="236" class="lost-s"/>
  <text x="432" y="214" text-anchor="start" class="ink n">worker crashes</text>
  <text x="432" y="230" text-anchor="start" class="ink n">and restarts</text>
  <text x="412" y="214" text-anchor="end" class="ink2 n">timer unaffected</text>
  <line x1="130" y1="266" x2="700" y2="266" class="line" marker-end="url(#arrow)"/>
  <line x1="305" y1="260" x2="305" y2="272" class="line"/>
  <text x="305" y="290" text-anchor="middle" class="ink2 n">timer starts</text>
  <line x1="560" y1="260" x2="560" y2="272" class="line"/>
  <text x="560" y="290" text-anchor="middle" class="ink2 n">due time</text>
  <text x="700" y="290" text-anchor="end" class="ink2 n">time</text>

</svg>
