  <text x="44" y="140" class="ink n mono">develop</text><text x="200" y="140" text-anchor="end" class="ink n mono">5200</text><text x="300" y="140" text-anchor="end" class="focus n mono b">2</text>
  <text x="44" y="164" class="ink n mono">develop</text><text x="200" y="164" text-anchor="end" class="ink n mono">5200</text><text x="300" y="164" text-anchor="end" class="focus n mono b">3</text>
