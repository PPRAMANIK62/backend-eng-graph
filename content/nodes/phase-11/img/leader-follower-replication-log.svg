  <rect x="314" y="140" width="50" height="34" rx="6" class="box"/>
  <text x="339.0" y="162.0" text-anchor="middle" class="ink t">4</text>
  <rect x="368" y="140" width="50" height="34" rx="6" class="box"/>
  <text x="393.0" y="162.0" text-anchor="middle" class="ink t">5</text>
  <rect x="422" y="140" width="50" height="34" rx="6" class="box"/>
  <text x="447.0" y="162.0" text-anchor="middle" class="ink t">6</text>
  <rect x="476" y="140" width="50" height="34" rx="6" class="focus-s"/>
  <text x="501.0" y="162.0" text-anchor="middle" class="focus t b">7</text>
  <rect x="530" y="140" width="50" height="34" rx="6" class="line" stroke-dasharray="4 3"/>
  <text x="612" y="154" text-anchor="start" class="ink2 n">received: 1 to 7</text>
  <text x="612" y="170" text-anchor="start" class="ink n b">replayed: 1 to 6</text>
  <rect x="20" y="240" width="110" height="34" rx="6" class="box"/>
  <text x="75.0" y="262.0" text-anchor="middle" class="ink t b">Follower B</text>
  <rect x="152" y="240" width="50" height="34" rx="6" class="box"/>
  <text x="177.0" y="262.0" text-anchor="middle" class="ink t">1</text>
  <rect x="206" y="240" width="50" height="34" rx="6" class="box"/>
  <text x="231.0" y="262.0" text-anchor="middle" class="ink t">2</text>
  <rect x="260" y="240" width="50" height="34" rx="6" class="box"/>
  <text x="285.0" y="262.0" text-anchor="middle" class="ink t">3</text>
  <rect x="314" y="240" width="50" height="34" rx="6" class="focus-s"/>
