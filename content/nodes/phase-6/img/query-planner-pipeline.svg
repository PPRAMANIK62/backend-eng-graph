<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


<rect x="20" y="40" width="130" height="70" rx="6" class="box"/>
<text x="85" y="70" class="ink t b" text-anchor="middle">SQL query</text>
<text x="85" y="92" class="ink2 n" text-anchor="middle">what, not how</text>
<line x1="150" y1="75" x2="188" y2="75" class="line" marker-end="url(#arrow)"/>
<rect x="190" y="20" width="230" height="150" rx="6" class="box"/>
<text x="305" y="46" class="ink t b" text-anchor="middle">Plan enumeration</text>
<text x="206" y="74" class="ink n">• scan for each table</text>
<text x="218" y="92" class="ink2 n">(seq, index, bitmap)</text>
<text x="206" y="116" class="ink n">• join order</text>
<text x="218" y="134" class="ink2 n">(best plans for growing subsets)</text>
<text x="206" y="158" class="ink n">• join method</text>
<line x1="420" y1="95" x2="458" y2="95" class="line" marker-end="url(#arrow)"/>
<text x="439" y="86" class="ink2 n" text-anchor="middle">each</text>
<rect x="460" y="40" width="150" height="110" rx="6" class="box"/>
<text x="535" y="70" class="ink t b" text-anchor="middle">Cost model</text>
<text x="535" y="94" class="ink2 n" text-anchor="middle">rows × per-row cost</text>
<text x="535" y="112" class="ink2 n" text-anchor="middle">+ pages × page cost</text>
<text x="535" y="134" class="ink2 n" text-anchor="middle">= cost units</text>
<line x1="610" y1="95" x2="640" y2="95" class="focus-s" marker-end="url(#arrow)"/>
<rect x="642" y="62" width="68" height="66" rx="6" class="box"/>
<rect x="642" y="62" width="68" height="66" rx="6" class="focus-s"/>
<text x="676" y="90" class="ink n b" text-anchor="middle">cheapest</text>
<text x="676" y="108" class="ink n b" text-anchor="middle">plan</text>
<rect x="300" y="240" width="200" height="80" rx="6" class="box"/>
<text x="400" y="268" class="ink t b" text-anchor="middle">Cardinality estimation</text>
<text x="400" y="290" class="ink2 n" text-anchor="middle">how many rows each</text>
<text x="400" y="306" class="ink2 n" text-anchor="middle">step will produce</text>
<line x1="460" y1="240" x2="510" y2="152" class="focus-s" marker-end="url(#arrow)"/>
<rect x="530" y="240" width="180" height="80" rx="6" class="box"/>
<text x="620" y="268" class="ink t b" text-anchor="middle">Cost constants</text>
<text x="620" y="290" class="ink2 n mono" text-anchor="middle">seq_page_cost 1.0</text>
<text x="620" y="306" class="ink2 n mono" text-anchor="middle">random_page_cost 4.0</text>
<line x1="600" y1="240" x2="570" y2="152" class="line" marker-end="url(#arrow)"/>
<rect x="20" y="240" width="200" height="80" rx="6" class="box"/>
<text x="120" y="268" class="ink t b" text-anchor="middle">Table statistics</text>
<text x="120" y="290" class="ink2 n" text-anchor="middle">row counts, common values,</text>
<text x="120" y="306" class="ink2 n" text-anchor="middle">histograms (from ANALYZE)</text>
<line x1="220" y1="280" x2="298" y2="280" class="line" marker-end="url(#arrow)"/>
<line x1="676" y1="128" x2="676" y2="200" class="line" marker-end="url(#arrow)"/>
<text x="676" y="218" class="ink n" text-anchor="middle">executor</text>
<text x="20" y="360" class="ink2 n">Errors in the row estimates, more than the cost formula, are usually why a plan is bad (Leis et al., 2015).</text>
</svg>