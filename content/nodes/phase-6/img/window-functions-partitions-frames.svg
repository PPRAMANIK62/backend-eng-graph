  <line x1="588" y1="208" x2="606" y2="208" class="line"/>
  <text x="612" y="204" class="ink2 n">frame of this row:</text>
  <text x="612" y="220" class="ink2 n">start up to its</text>
  <text x="612" y="236" class="ink2 n">last peer (4800)</text>
  <text x="30" y="380" class="ink2 n">Every input row stays in the output; the function adds a column.</text>
