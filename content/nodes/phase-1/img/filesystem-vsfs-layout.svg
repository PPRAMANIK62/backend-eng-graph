<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="26" class="ink2 n">A small disk of 4 KB blocks, numbered from 0. Region sizes not to scale.</text>

  <!-- the regions -->
  <rect x="40" y="40" width="36" height="76" rx="6" class="box"/>
  <text x="58" y="83" text-anchor="middle" class="ink t b">S</text>
  <rect x="80" y="40" width="36" height="76" rx="6" class="box"/>
  <text x="98" y="83" text-anchor="middle" class="ink t b">i</text>
  <rect x="120" y="40" width="36" height="76" rx="6" class="box"/>
  <text x="138" y="83" text-anchor="middle" class="ink t b">d</text>
  <rect x="160" y="40" width="210" height="76" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="160" y="40" width="210" height="76" rx="6" class="focus-s"/>
  <text x="176" y="66" class="ink t b">Inode table</text>
  <text x="176" y="88" class="ink2 n">one inode per file: size,</text>
  <text x="176" y="104" class="ink2 n">permissions, where the data is</text>
  <rect x="374" y="40" width="306" height="76" rx="6" class="box"/>
  <text x="390" y="66" class="ink t b">Data region</text>
  <text x="390" y="88" class="ink2 n">file contents, and directories'</text>
  <text x="390" y="104" class="ink2 n">lists of names and inode numbers</text>

  <!-- leader lines for the narrow regions -->
  <line x1="138" y1="118" x2="138" y2="146" class="line"/>
  <text x="148" y="146" class="ink t">Data bitmap <tspan class="ink2 n">one bit per data block: used or free</tspan></text>
  <line x1="98" y1="118" x2="98" y2="182" class="line"/>
  <text x="108" y="182" class="ink t">Inode bitmap <tspan class="ink2 n">one bit per inode: used or free</tspan></text>
  <line x1="58" y1="118" x2="58" y2="218" class="line"/>
  <text x="68" y="218" class="ink t">Superblock, block 0 <tspan class="ink2 n">how many inodes and data blocks, where the</tspan></text>
  <text x="68" y="236" class="ink2 n">inode table starts, and a magic number for the filesystem type</text>
</svg>
