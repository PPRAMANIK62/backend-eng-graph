<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle" class="ink t b">Range partitions</text>
  <text x="180" y="46" text-anchor="middle" class="ink2 n">cut the sorted keys</text>
  <rect x="30" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="30" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="77.5" y="85" text-anchor="middle" class="focus n mono b">order 301</text>
  <rect x="135" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="135" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="182.5" y="85" text-anchor="middle" class="focus n mono b">order 302</text>
  <rect x="240" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="240" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="287.5" y="85" text-anchor="middle" class="focus n mono b">order 303</text>
  <rect x="30" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="77.5" y="196" text-anchor="middle" class="ink t b">P1</text>
  <text x="77.5" y="220" text-anchor="middle" class="ink2 n mono">1–100</text>
  <rect x="135" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="182.5" y="196" text-anchor="middle" class="ink t b">P2</text>
  <text x="182.5" y="220" text-anchor="middle" class="ink2 n mono">101–200</text>
  <rect x="240" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="287.5" y="196" text-anchor="middle" class="ink t b">P3</text>
  <text x="287.5" y="220" text-anchor="middle" class="ink2 n mono">201–max</text>
  <line x1="77.5" y1="96" x2="273.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="182.5" y1="96" x2="287.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="287.5" y1="96" x2="301.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <text x="180" y="266" text-anchor="middle" class="ink n">All new orders land in P3.</text>
  <text x="180" y="284" text-anchor="middle" class="ink2 n">A scan of orders 150–250 reads P2 and P3.</text>
  <text x="540" y="28" text-anchor="middle" class="ink t b">Hash partitions</text>
  <text x="540" y="46" text-anchor="middle" class="ink2 n">cut the hash values</text>
  <rect x="390" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="390" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="437.5" y="85" text-anchor="middle" class="focus n mono b">order 301</text>
  <rect x="495" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="495" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="542.5" y="85" text-anchor="middle" class="focus n mono b">order 302</text>
  <rect x="600" y="66" width="95" height="28" rx="6" class="box"/>
  <rect x="600" y="66" width="95" height="28" rx="6" class="focus-s"/>
  <text x="647.5" y="85" text-anchor="middle" class="focus n mono b">order 303</text>
  <rect x="390" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="437.5" y="196" text-anchor="middle" class="ink t b">P1</text>
  <text x="437.5" y="220" text-anchor="middle" class="ink2 n mono">hash range 1</text>
  <rect x="495" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="542.5" y="196" text-anchor="middle" class="ink t b">P2</text>
  <text x="542.5" y="220" text-anchor="middle" class="ink2 n mono">hash range 2</text>
  <rect x="600" y="170" width="95" height="70" rx="6" class="box"/>
  <text x="647.5" y="196" text-anchor="middle" class="ink t b">P3</text>
  <text x="647.5" y="220" text-anchor="middle" class="ink2 n mono">hash range 3</text>
  <line x1="437.5" y1="96" x2="542.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="542.5" y1="96" x2="647.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="647.5" y1="96" x2="437.5" y2="166" class="focus-s" marker-end="url(#arrow)"/>
  <text x="540" y="266" text-anchor="middle" class="ink n">New orders spread over all three.</text>
  <text x="540" y="284" text-anchor="middle" class="ink2 n">A scan of orders 150–250 reads every partition.</text>
  <line x1="360" y1="20" x2="360" y2="290" class="line"/>
</svg>
