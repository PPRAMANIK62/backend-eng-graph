<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="75" class="ink t b">S1</text>
  <line x1="60" y1="70" x2="146" y2="70" class="line" stroke-dasharray="2 4"/>
  <text x="20" y="135" class="ink t b">S2</text>
  <line x1="60" y1="130" x2="700" y2="130" class="line" stroke-dasharray="2 4"/>
  <text x="20" y="195" class="ink t b">S3</text>
  <line x1="60" y1="190" x2="700" y2="190" class="line" stroke-dasharray="2 4"/>
  <text x="20" y="255" class="ink t b">S4</text>
  <line x1="60" y1="250" x2="700" y2="250" class="line" stroke-dasharray="2 4"/>
  <text x="20" y="315" class="ink t b">S5</text>
  <line x1="60" y1="310" x2="700" y2="310" class="line" stroke-dasharray="2 4"/>
  <text x="64" y="54" class="focus n b">leader, term 4</text>
  <line x1="90" y1="70" x2="120" y2="128" class="line" marker-end="url(#arrow)"/>
  <text x="150" y="76" class="lost t b">✕</text><text x="168" y="75" class="lost n">crashes</text>
  <rect x="125" y="124" width="315" height="12" rx="3" class="box"/>
  <rect x="440" y="124" width="120" height="12" rx="3" class="line" stroke-dasharray="4 3"/>
  <rect x="125" y="184" width="175" height="12" rx="3" class="focus"/>
  <rect x="125" y="244" width="315" height="12" rx="3" class="box"/>
  <rect x="440" y="244" width="200" height="12" rx="3" class="line" stroke-dasharray="4 3"/>
  <rect x="125" y="304" width="315" height="12" rx="3" class="box"/>
  <rect x="440" y="304" width="80" height="12" rx="3" class="line" stroke-dasharray="4 3"/>
  <text x="130" y="116" class="ink2 n">last heartbeat: election timers start</text>
  <text x="212" y="212" class="focus n b" text-anchor="middle">runs out first</text>
  <text x="296" y="174" text-anchor="end" class="ink n">term 5, votes for itself</text>
  <line x1="310" y1="190" x2="352" y2="130" class="line" marker-end="url(#arrow)"/>
  <line x1="362" y1="130" x2="398" y2="190" class="line" marker-end="url(#arrow)"/>
  <line x1="310" y1="190" x2="352" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="362" y1="250" x2="398" y2="190" class="line" marker-end="url(#arrow)"/>
  <line x1="310" y1="190" x2="352" y2="310" class="line" marker-end="url(#arrow)"/>
  <line x1="362" y1="310" x2="398" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="318" y="336" class="ink2 n">RequestVote, then votes back</text>
  <text x="446" y="216" class="focus n b">leader, term 5</text>
  <line x1="404" y1="190" x2="437" y2="130" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="404" y1="190" x2="437" y2="250" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="404" y1="190" x2="437" y2="310" class="focus-s" marker-end="url(#arrow)"/>
  <text x="446" y="116" class="ink2 n">dashed: where each would have run out</text>
  <text x="446" y="100" class="ink2 n">heartbeats from S3 reset the timers;</text>
  <line x1="60" y1="350" x2="700" y2="350" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="368" text-anchor="end" class="ink2 n">time</text>
</svg>
