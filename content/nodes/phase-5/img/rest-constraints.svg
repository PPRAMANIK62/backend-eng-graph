<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="20" y="26" class="ink t b">Constraint added</text>
<text x="250" y="26" class="ink t b">What it buys</text>
<text x="490" y="26" class="ink t b">What it costs</text>
<rect x="20" y="40" width="680" height="50" rx="6" class="box"/>
<text x="34" y="70" class="ink t b">1</text>
<text x="56" y="70" class="ink t">Client-server</text>
<text x="250" y="62" class="ink n">UI and storage separate,</text>
<text x="250" y="78" class="ink n">each side evolves on its own</text>
<text x="490" y="70" class="ink2 n">(none given)</text>
<rect x="20" y="98" width="680" height="50" rx="6" class="box"/>
<text x="34" y="128" class="ink t b">2</text>
<text x="56" y="128" class="ink t">Stateless</text>
<text x="250" y="120" class="ink n">visibility, reliability,</text>
<text x="250" y="136" class="ink n">scalability</text>
<text x="490" y="120" class="ink2 n">same data resent in</text>
<text x="490" y="136" class="ink2 n">every request</text>
<rect x="20" y="156" width="680" height="50" rx="6" class="box"/>
<text x="34" y="186" class="ink t b">3</text>
<text x="56" y="186" class="ink t">Cache</text>
<text x="250" y="178" class="ink n">some requests never</text>
<text x="250" y="194" class="ink n">reach the server</text>
<text x="490" y="186" class="ink2 n">stale data</text>
<rect x="20" y="214" width="680" height="50" rx="6" class="box"/>
<rect x="20" y="214" width="680" height="50" rx="6" class="focus-s"/>
<text x="34" y="244" class="focus t b">4</text>
<text x="56" y="244" class="focus t b">Uniform interface</text>
<text x="250" y="236" class="ink n">one generic interface,</text>
<text x="250" y="252" class="ink n">implementations decoupled</text>
<text x="490" y="236" class="ink2 n">less efficient than a</text>
<text x="490" y="252" class="ink2 n">format built for one app</text>
<rect x="20" y="272" width="680" height="50" rx="6" class="box"/>
<text x="34" y="302" class="ink t b">5</text>
<text x="56" y="302" class="ink t">Layered system</text>
<text x="250" y="294" class="ink n">proxies, load balancers,</text>
<text x="250" y="310" class="ink n">shared caches, firewalls</text>
<text x="490" y="302" class="ink2 n">added latency per layer</text>
<rect x="20" y="330" width="680" height="50" rx="6" class="box"/>
<text x="34" y="360" class="ink t b">6</text>
<text x="56" y="360" class="ink t">Code on demand (optional)</text>
<text x="250" y="352" class="ink n">clients extended with</text>
<text x="250" y="368" class="ink n">downloaded scripts</text>
<text x="490" y="360" class="ink2 n">less visibility</text>
<text x="20" y="396" class="ink2 n">Each row adds to all the rows above it. Row 4 is the one that sets REST apart from other styles.</text>
</svg>
