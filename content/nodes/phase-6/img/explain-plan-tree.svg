<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- top node -->
  <rect x="230" y="24" width="260" height="62" rx="6" class="box"/>
  <text x="360" y="50" text-anchor="middle" class="ink t b">Nested Loop</text>
  <text x="360" y="72" text-anchor="middle" class="ink2 n mono">actual rows=10 loops=1</text>

  <!-- outer child -->
  <rect x="30" y="170" width="290" height="62" rx="6" class="box"/>
  <text x="175" y="196" text-anchor="middle" class="ink t b">Bitmap Heap Scan on tenk1</text>
  <text x="175" y="218" text-anchor="middle" class="ink2 n mono">actual rows=10 loops=1</text>

  <rect x="30" y="316" width="290" height="62" rx="6" class="box"/>
  <text x="175" y="342" text-anchor="middle" class="ink t b">Bitmap Index Scan</text>
  <text x="175" y="364" text-anchor="middle" class="ink2 n mono">on tenk1_unique1, rows=10</text>

  <!-- inner child, the focus -->
  <rect x="400" y="170" width="290" height="62" rx="6" class="box"/>
  <rect x="400" y="170" width="290" height="62" rx="6" class="focus-s"/>
  <text x="545" y="196" text-anchor="middle" class="ink t b">Index Scan on tenk2</text>
  <text x="545" y="218" text-anchor="middle" class="focus n mono b">actual rows=1 loops=10</text>

  <!-- arrows: rows flow up -->
  <line x1="175" y1="314" x2="175" y2="236" class="line" marker-end="url(#arrow)"/>
  <text x="187" y="280" class="ink2 n">row locations</text>
  <line x1="175" y1="168" x2="300" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="230" y="126" text-anchor="end" class="ink2 n">outer rows, one at a time</text>
  <line x1="545" y1="168" x2="420" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="498" y="130" class="ink2 n">one match per lookup</text>

  <!-- annotation for loops -->
  <text x="545" y="262" text-anchor="middle" class="ink n">runs once per outer row</text>
  <text x="545" y="282" text-anchor="middle" class="ink2 n">0.003 ms per loop × 10 loops</text>
  <text x="545" y="302" text-anchor="middle" class="ink2 n">≈ 0.030 ms in total</text>

  <text x="545" y="352" text-anchor="middle" class="ink2 n">Read from the bottom: rows flow up,</text>
  <text x="545" y="370" text-anchor="middle" class="ink2 n">each parent pulls from its children.</text>
</svg>
