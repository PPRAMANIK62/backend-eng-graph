<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the observed history -->
  <text x="30" y="30" class="ink t b">What the clients recorded</text>
  <rect x="30" y="46" width="290" height="58" rx="6" class="box"/>
  <text x="44" y="68" class="ink t b">A</text>
  <text x="70" y="68" class="ink n mono">append 1 to x</text>
  <text x="70" y="90" class="ink n mono">read y → [1]</text>
  <rect x="30" y="116" width="290" height="58" rx="6" class="box"/>
  <text x="44" y="138" class="ink t b">B</text>
  <text x="70" y="138" class="ink n mono">append 2 to x</text>
  <text x="70" y="160" class="ink n mono">append 1 to y</text>
  <rect x="30" y="186" width="290" height="36" rx="6" class="box"/>
  <text x="44" y="209" class="ink t b">C</text>
  <text x="70" y="209" class="ink n mono">read x → [1 2]</text>
  <text x="30" y="250" class="ink2 n">All three committed. Every appended value is unique.</text>

  <!-- the inferred graph -->
  <text x="545" y="30" text-anchor="middle" class="ink t b">What the checker infers</text>
  <rect x="400" y="124" width="90" height="44" rx="6" class="box"/>
  <text x="445" y="151" text-anchor="middle" class="ink t b">A</text>
  <rect x="600" y="124" width="90" height="44" rx="6" class="box"/>
  <text x="645" y="151" text-anchor="middle" class="ink t b">B</text>

  <path d="M645,122 C645,74 445,74 445,120" class="focus-s" marker-end="url(#arrow)"/>
  <text x="545" y="50" text-anchor="middle" class="focus n b">wr on y</text>
  <text x="545" y="66" text-anchor="middle" class="ink2 n">A read the 1 that only B wrote</text>

  <path d="M445,170 C445,218 645,218 645,174" class="focus-s" marker-end="url(#arrow)"/>
  <text x="545" y="232" text-anchor="middle" class="focus n b">ww on x</text>
  <text x="545" y="250" text-anchor="middle" class="ink2 n">C saw [1 2], so A's append came before B's</text>

  <text x="545" y="280" text-anchor="middle" class="lost n b">B before A and A before B: a cycle (G1c)</text>
</svg>
