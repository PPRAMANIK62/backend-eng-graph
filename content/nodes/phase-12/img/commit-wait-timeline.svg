<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <line x1="40" y1="200" x2="690" y2="200" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="222" text-anchor="end" class="ink2 n">true time</text>
  <rect x="120" y="120" width="160" height="30" rx="6" class="focus-box"/>
  <text x="200" y="140" text-anchor="middle" class="ink t">TT.now() at commit</text>
  <text x="120" y="112" text-anchor="middle" class="ink2 n">earliest</text>
  <text x="280" y="112" text-anchor="middle" class="ink2 n">latest</text>
  <line x1="280" y1="150" x2="280" y2="200" class="focus-s"/>
  <text x="280" y="240" text-anchor="middle" class="ink t b">s = latest</text>
  <text x="280" y="258" text-anchor="middle" class="ink2 n">commit timestamp</text>
  <rect x="300" y="60" width="160" height="30" rx="6" class="focus-box"/>
  <text x="380" y="80" text-anchor="middle" class="ink t">TT.now() later</text>
  <text x="300" y="52" text-anchor="middle" class="ink2 n">earliest > s</text>
  <path d="M280 170 L380 170" class="line" stroke-dasharray="4 3"/>
  <text x="330" y="188" text-anchor="middle" class="ink t b">commit wait</text>
  <line x1="380" y1="200" x2="380" y2="96" class="safe-s"/>
  <text x="392" y="232" text-anchor="start" class="ink t">write becomes visible,</text>
  <text x="392" y="250" text-anchor="start" class="ink t">locks released</text>
  <text x="40" y="300" text-anchor="start" class="ink2 n">The coordinator stamps the commit with the latest possible current time, s, then waits until</text>
  <text x="40" y="318" text-anchor="start" class="ink2 n">TrueTime says even the earliest possible time is past s. Any transaction that starts after the</text>
  <text x="40" y="336" text-anchor="start" class="ink2 n">write is visible gets a larger timestamp, wherever it runs. The wider the uncertainty, the longer the wait.</text>

</svg>
