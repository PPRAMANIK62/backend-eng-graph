<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- column headings -->
  <text x="40" y="28" class="ink t b">Per-process fd tables</text>
  <text x="330" y="28" class="ink t b">Open file descriptions</text>
  <text x="330" y="46" class="ink2 n">system-wide</text>
  <text x="590" y="28" class="ink t b">The file</text>

  <!-- process A -->
  <text x="40" y="72" class="ink t">Process A</text>
  <rect x="40" y="82" width="200" height="36" rx="6" class="box"/>
  <text x="54" y="105" class="ink t mono">fd 3</text><text x="104" y="105" class="ink2 n">open()</text>
  <rect x="40" y="124" width="200" height="36" rx="6" class="box"/>
  <text x="54" y="147" class="ink t mono">fd 4</text><text x="104" y="147" class="ink2 n mono">dup(3)</text>
  <rect x="40" y="166" width="200" height="36" rx="6" class="box"/>
  <text x="54" y="189" class="ink t mono">fd 5</text><text x="104" y="189" class="ink2 n">second open()</text>

  <!-- process B -->
  <text x="40" y="252" class="ink t">Process B, forked from A</text>
  <rect x="40" y="262" width="200" height="36" rx="6" class="box"/>
  <text x="54" y="285" class="ink t mono">fd 3</text><text x="104" y="285" class="ink2 n">inherited</text>

  <!-- descriptions -->
  <rect x="330" y="92" width="190" height="64" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="330" y="92" width="190" height="64" rx="6" class="focus-s"/>
  <text x="346" y="118" class="ink t b">Description 1</text>
  <text x="346" y="140" class="ink2 n">one offset, one set of flags</text>
  <rect x="330" y="206" width="190" height="64" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="330" y="206" width="190" height="64" rx="6" class="focus-s"/>
  <text x="346" y="232" class="ink t b">Description 2</text>
  <text x="346" y="254" class="ink2 n">its own offset and flags</text>

  <!-- fd -> description arrows -->
  <line x1="242" y1="100" x2="327" y2="112" class="line" marker-end="url(#arrow)"/>
  <line x1="242" y1="142" x2="327" y2="124" class="line" marker-end="url(#arrow)"/>
  <line x1="242" y1="280" x2="327" y2="138" class="line" marker-end="url(#arrow)"/>
  <line x1="242" y1="184" x2="327" y2="228" class="line" marker-end="url(#arrow)"/>

  <!-- the file -->
  <rect x="590" y="150" width="100" height="64" rx="6" class="box"/>
  <text x="640" y="176" text-anchor="middle" class="ink t b">inode</text>
  <text x="640" y="198" text-anchor="middle" class="ink2 n">app.log</text>
  <line x1="522" y1="124" x2="587" y2="172" class="line" marker-end="url(#arrow)"/>
  <line x1="522" y1="238" x2="587" y2="194" class="line" marker-end="url(#arrow)"/>

  <!-- notes -->
  <text x="40" y="336" class="ink2 n">A's fd 3 and fd 4 and B's fd 3 share Description 1: a read through any of them moves the offset for all three.</text>
  <text x="40" y="354" class="ink2 n">A's fd 5 has Description 2, so its position in the same file is independent.</text>
</svg>
