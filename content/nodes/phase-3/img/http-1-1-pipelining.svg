<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="180.0" y="22" text-anchor="middle" class="ink t b">Keep-alive, one at a time</text>
  <text x="60" y="46" text-anchor="middle" class="ink n b">Client</text>
  <text x="300" y="46" text-anchor="middle" class="ink n b">Server</text>
  <line x1="60" y1="54" x2="60" y2="320" class="line"/>
  <line x1="300" y1="54" x2="300" y2="320" class="line"/>
  <line x1="60" y1="76" x2="297" y2="102" class="line" marker-end="url(#arrow)"/>
  <text x="68" y="72" text-anchor="start" class="ink n mono">req A</text>
  <line x1="300" y1="112" x2="63" y2="138" class="focus-s" marker-end="url(#arrow)"/>
  <text x="200" y="140" text-anchor="middle" class="focus n mono">resp A</text>
  <line x1="60" y1="156" x2="297" y2="182" class="line" marker-end="url(#arrow)"/>
  <text x="68" y="152" text-anchor="start" class="ink n mono">req B</text>
  <line x1="300" y1="192" x2="63" y2="218" class="focus-s" marker-end="url(#arrow)"/>
  <text x="200" y="220" text-anchor="middle" class="focus n mono">resp B</text>
  <line x1="60" y1="236" x2="297" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="68" y="232" text-anchor="start" class="ink n mono">req C</text>
  <line x1="300" y1="272" x2="63" y2="298" class="focus-s" marker-end="url(#arrow)"/>
  <text x="200" y="300" text-anchor="middle" class="focus n mono">resp C</text>
  <text x="180.0" y="330" text-anchor="middle" class="ink2 n">one round trip per request</text>
  <text x="540.0" y="22" text-anchor="middle" class="ink t b">Pipelined</text>
  <text x="420" y="46" text-anchor="middle" class="ink n b">Client</text>
  <text x="660" y="46" text-anchor="middle" class="ink n b">Server</text>
  <line x1="420" y1="54" x2="420" y2="320" class="line"/>
  <line x1="660" y1="54" x2="660" y2="320" class="line"/>
  <line x1="420" y1="76" x2="657" y2="102" class="line" marker-end="url(#arrow)"/>
  <text x="412" y="80" text-anchor="end" class="ink n mono">A</text>
  <line x1="420" y1="90" x2="657" y2="116" class="line" marker-end="url(#arrow)"/>
  <text x="412" y="94" text-anchor="end" class="ink n mono">B</text>
  <line x1="420" y1="104" x2="657" y2="130" class="line" marker-end="url(#arrow)"/>
  <text x="412" y="108" text-anchor="end" class="ink n mono">C</text>
  <text x="480" y="68" class="ink n mono">req A, B, C</text>
  <rect x="664" y="102" width="10" height="120" class="old"/>
  <text x="680" y="166" class="ink2 n">A</text>
  <text x="680" y="182" class="ink2 n">slow</text>
  <path d="M648,122 H642 V222 H648" class="lost-s"/>
  <text x="634" y="160" text-anchor="end" class="lost n b">B and C are ready,</text>
  <text x="634" y="176" text-anchor="end" class="lost n b">held behind A</text>
  <line x1="660" y1="228" x2="423" y2="254" class="focus-s" marker-end="url(#arrow)"/>
  <text x="412" y="258" text-anchor="end" class="focus n mono">A</text>
  <line x1="660" y1="244" x2="423" y2="270" class="focus-s" marker-end="url(#arrow)"/>
  <text x="412" y="274" text-anchor="end" class="focus n mono">B</text>
  <line x1="660" y1="260" x2="423" y2="286" class="focus-s" marker-end="url(#arrow)"/>
  <text x="412" y="290" text-anchor="end" class="focus n mono">C</text>
  <text x="540.0" y="330" text-anchor="middle" class="ink2 n">responses must come back in order</text>
</svg>
