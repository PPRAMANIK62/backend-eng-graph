<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} 
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="36" class="ink t b">TCP: requests A, B and C share one ordered byte stream</text>
  <rect x="40" y="52" width="80" height="40" rx="6" class="box"/>
  <text x="80" y="77" text-anchor="middle" class="ink t">1: A</text>
  <rect x="130" y="52" width="80" height="40" rx="6" class="box" stroke-dasharray="4 4"/>
  <text x="170" y="77" text-anchor="middle" class="ink2 t">2: B</text>
  <text x="170" y="107" text-anchor="middle" class="lost n b">lost</text>
  <rect x="220" y="52" width="80" height="40" rx="6" class="box"/>
  <text x="260" y="77" text-anchor="middle" class="ink t">3: C</text>
  <rect x="310" y="52" width="80" height="40" rx="6" class="box"/>
  <text x="350" y="77" text-anchor="middle" class="ink t">4: A</text>
  <line x1="400" y1="72" x2="436" y2="72" class="line" marker-end="url(#arrow)"/>
  <text x="450" y="68" class="focus t">app gets: segment 1</text>
  <text x="450" y="88" class="lost t b">stuck: 3 and 4, until 2 is resent</text>
  <text x="40" y="132" class="ink2 n">Segments 3 and 4 arrived fine, but TCP hands bytes over only in order.</text>

  <line x1="40" y1="150" x2="680" y2="150" class="line" stroke-dasharray="4 4"/>

  <text x="40" y="186" class="ink t b">QUIC: each request on its own stream</text>
  <rect x="40" y="202" width="80" height="40" rx="6" class="box"/>
  <text x="80" y="227" text-anchor="middle" class="ink t">A</text>
  <rect x="130" y="202" width="80" height="40" rx="6" class="box" stroke-dasharray="4 4"/>
  <text x="170" y="227" text-anchor="middle" class="ink2 t">B</text>
  <text x="170" y="257" text-anchor="middle" class="lost n b">lost</text>
  <rect x="220" y="202" width="80" height="40" rx="6" class="box"/>
  <text x="260" y="227" text-anchor="middle" class="ink t">C</text>
  <rect x="310" y="202" width="80" height="40" rx="6" class="box"/>
  <text x="350" y="227" text-anchor="middle" class="ink t">A</text>
  <line x1="400" y1="222" x2="436" y2="222" class="line" marker-end="url(#arrow)"/>
  <text x="450" y="218" class="focus t">app gets: A, C, A</text>
  <text x="450" y="238" class="lost t b">stuck: stream B only</text>
  <text x="40" y="282" class="ink2 n">Only the stream whose data was in the lost packet waits for the retransmission.</text>
  <text x="40" y="300" class="ink2 n">A packet carrying several streams would block all of them.</text>
</svg>
