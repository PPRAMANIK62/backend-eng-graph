<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- panel 1: with propagation (SRE book example, 18 px per second, t=0 at x=120) -->
  <text x="20" y="20" class="ink t b">With propagation: one deadline for the whole tree</text>

  <text x="108" y="63" text-anchor="end" class="ink t">Server A</text>
  <rect x="120" y="46" width="540" height="24" rx="6" class="box"/>
  <text x="130" y="63" class="ink n">sets a 30 s deadline, works 7 s</text>

  <text x="108" y="99" text-anchor="end" class="ink t">Server B</text>
  <rect x="246" y="82" width="414" height="24" rx="6" class="box"/>
  <text x="256" y="99" class="focus n b">gets 23 s left, works 4 s</text>

  <text x="108" y="135" text-anchor="end" class="ink t">Server C</text>
  <rect x="318" y="118" width="342" height="24" rx="6" class="box"/>
  <text x="328" y="135" class="focus n b">gets 19 s left</text>

  <line x1="246" y1="70" x2="246" y2="80" class="line" marker-end="url(#arrow)"/>
  <line x1="318" y1="106" x2="318" y2="116" class="line" marker-end="url(#arrow)"/>

  <line x1="660" y1="38" x2="660" y2="150" class="focus-s" stroke-dasharray="5 4"/>
  <text x="660" y="32" text-anchor="middle" class="focus n b">deadline</text>

  <line x1="120" y1="156" x2="660" y2="156" class="line"/>
  <text x="120" y="172" text-anchor="middle" class="ink2 n">0 s</text>
  <text x="246" y="172" text-anchor="middle" class="ink2 n">7 s</text>
  <text x="318" y="172" text-anchor="middle" class="ink2 n">11 s</text>
  <text x="660" y="172" text-anchor="middle" class="ink2 n">30 s</text>

  <!-- panel 2: without propagation -->
  <text x="20" y="222" class="ink t b">Without it: B makes up a fresh 20 s for C</text>

  <text x="108" y="261" text-anchor="end" class="ink t">A calls B</text>
  <rect x="120" y="244" width="180" height="24" rx="6" class="box"/>
  <text x="130" y="261" class="ink n">10 s deadline</text>

  <text x="108" y="297" text-anchor="end" class="ink t">Server B</text>
  <rect x="120" y="280" width="144" height="24" rx="6" class="box"/>
  <text x="130" y="297" class="ink n">busy 8 s</text>

  <text x="108" y="333" text-anchor="end" class="ink t">Server C</text>
  <rect x="264" y="316" width="90" height="24" rx="6" class="old"/>
  <text x="309" y="333" text-anchor="middle" class="ink n">queued 5 s</text>
  <rect x="354" y="316" width="270" height="24" rx="6" class="lost"/>
  <text x="364" y="333" class="ink n b">wasted work, thinks it has 15 s</text>

  <line x1="264" y1="304" x2="264" y2="314" class="line" marker-end="url(#arrow)"/>

  <line x1="300" y1="236" x2="300" y2="310" class="lost-s" stroke-dasharray="5 4"/>
  <text x="308" y="261" class="ink2 n">caller gave up here</text>

  <line x1="120" y1="354" x2="660" y2="354" class="line"/>
  <text x="120" y="370" text-anchor="middle" class="ink2 n">0 s</text>
  <text x="264" y="370" text-anchor="middle" class="ink2 n">8 s</text>
  <text x="300" y="382" text-anchor="middle" class="ink2 n">10 s</text>
  <text x="354" y="370" text-anchor="middle" class="ink2 n">13 s</text>
  <text x="624" y="370" text-anchor="middle" class="ink2 n">28 s</text>
</svg>
