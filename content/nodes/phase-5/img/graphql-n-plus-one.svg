<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="20" y="26" class="ink t b">The query</text>
<rect x="20" y="38" width="230" height="100" rx="6" class="box"/>
<text x="34" y="64" class="ink t mono" xml:space="preserve">{ posts(first: 3) {</text>
<text x="34" y="84" class="ink t mono" xml:space="preserve">    title</text>
<text x="34" y="104" class="ink t mono" xml:space="preserve">    author { name }</text>
<text x="34" y="124" class="ink t mono" xml:space="preserve">} }</text>
<text x="300" y="26" class="ink t b">Resolvers the server runs</text>
<rect x="300" y="72" width="90" height="32" rx="6" class="box"/><text x="345" y="93" text-anchor="middle" class="ink t mono">posts</text>
<path d="M390,88 L438,56" class="line" marker-end="url(#arrow)"/>
<rect x="440" y="40" width="90" height="32" rx="6" class="box"/><text x="485" y="61" text-anchor="middle" class="ink n mono">post 1</text>
<line x1="530" y1="56" x2="578" y2="56" class="line" marker-end="url(#arrow)"/>
<rect x="580" y="40" width="120" height="32" rx="6" class="box"/><text x="640" y="61" text-anchor="middle" class="ink n mono">author(7)</text>
<path d="M390,88 L438,98" class="line" marker-end="url(#arrow)"/>
<rect x="440" y="82" width="90" height="32" rx="6" class="box"/><text x="485" y="103" text-anchor="middle" class="ink n mono">post 2</text>
<line x1="530" y1="98" x2="578" y2="98" class="line" marker-end="url(#arrow)"/>
<rect x="580" y="82" width="120" height="32" rx="6" class="box"/><text x="640" y="103" text-anchor="middle" class="ink n mono">author(9)</text>
<path d="M390,88 L438,140" class="line" marker-end="url(#arrow)"/>
<rect x="440" y="124" width="90" height="32" rx="6" class="box"/><text x="485" y="145" text-anchor="middle" class="ink n mono">post 3</text>
<line x1="530" y1="140" x2="578" y2="140" class="line" marker-end="url(#arrow)"/>
<rect x="580" y="124" width="120" height="32" rx="6" class="box"/><text x="640" y="145" text-anchor="middle" class="ink n mono">author(7)</text>
<text x="20" y="190" class="ink t b">Without batching: 1 + N queries</text>
<text x="380" y="190" class="ink t b">With a DataLoader: 2 queries</text>
<rect x="20" y="208" width="320" height="32" rx="6" class="box"/>
<text x="34" y="229" class="ink n mono">SELECT … posts, limit 3</text>
<rect x="20" y="248" width="320" height="32" rx="6" class="box"/>
<rect x="20" y="248" width="320" height="32" rx="6" class="lost-s" style="stroke-width:1.5"/>
<text x="34" y="269" class="lost n mono">SELECT … user 7</text>
<rect x="20" y="288" width="320" height="32" rx="6" class="box"/>
<rect x="20" y="288" width="320" height="32" rx="6" class="lost-s" style="stroke-width:1.5"/>
<text x="34" y="309" class="lost n mono">SELECT … user 9</text>
<rect x="20" y="328" width="320" height="32" rx="6" class="box"/>
<rect x="20" y="328" width="320" height="32" rx="6" class="lost-s" style="stroke-width:1.5"/>
<text x="34" y="349" class="lost n mono">SELECT … user 7 (again)</text>
<text x="20" y="378" class="ink2 n">one query per author field, in the order resolvers run</text>
<rect x="380" y="208" width="320" height="32" rx="6" class="box"/>
<text x="394" y="229" class="ink n mono">SELECT … posts, limit 3</text>
<rect x="380" y="248" width="320" height="32" rx="6" class="box"/>
<rect x="380" y="248" width="320" height="32" rx="6" class="focus-s"/>
<text x="394" y="269" class="focus n mono">SELECT … users where id in (7, 9)</text>
<text x="380" y="298" class="ink2 n">loads made in the same tick are collected into</text>
<text x="380" y="314" class="ink2 n">one batch; author 7 is loaded once per request</text>
</svg>
