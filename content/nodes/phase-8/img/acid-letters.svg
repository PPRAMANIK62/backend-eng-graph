<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="96" y="26" text-anchor="start" class="ink2 n b">What it promises</text>
  <text x="430" y="26" text-anchor="start" class="ink2 n b">What delivers it</text>
  <rect x="24" y="40" width="56" height="64" rx="6" class="box"/>
  <text x="52" y="82" text-anchor="middle" class="ink t b">A</text>
  <text x="96" y="60" text-anchor="start" class="ink t b">Atomicity</text>
  <text x="96" y="80" text-anchor="start" class="ink n">All of the transfer or none of it,</text>
  <text x="96" y="96" text-anchor="start" class="ink n">even if it aborts or the server crashes.</text>
  <line x1="380" y1="72" x2="420" y2="72" class="line" marker-end="url(#arrow)"/>
  <rect x="430" y="40" width="266" height="64" rx="6" class="box"/>
  <text x="444" y="68" text-anchor="start" class="ink n">Undo records in the log</text>
  <text x="444" y="86" text-anchor="start" class="ink2 n">(write-ahead log, crash recovery)</text>
  <rect x="24" y="120" width="56" height="64" rx="6" class="box"/>
  <rect x="24" y="120" width="56" height="64" rx="6" class="focus-s"/>
  <text x="52" y="162" text-anchor="middle" class="focus t b">C</text>
  <text x="96" y="140" text-anchor="start" class="ink t b">Consistency</text>
  <text x="96" y="160" text-anchor="start" class="ink n">The rules still hold after it commits.</text>
  <line x1="380" y1="152" x2="420" y2="152" class="line" marker-end="url(#arrow)"/>
  <rect x="430" y="120" width="266" height="64" rx="6" class="box"/>
  <rect x="430" y="120" width="266" height="64" rx="6" class="focus-s"/>
  <text x="444" y="148" text-anchor="start" class="ink n">Constraints the database checks,</text>
  <text x="444" y="166" text-anchor="start" class="focus n b">and your code for every other rule</text>
  <rect x="24" y="200" width="56" height="64" rx="6" class="box"/>
  <text x="52" y="242" text-anchor="middle" class="ink t b">I</text>
  <text x="96" y="220" text-anchor="start" class="ink t b">Isolation</text>
  <text x="96" y="240" text-anchor="start" class="ink n">It acts as if it ran alone,</text>
  <text x="96" y="256" text-anchor="start" class="ink n">even with others running at once.</text>
  <line x1="380" y1="232" x2="420" y2="232" class="line" marker-end="url(#arrow)"/>
  <rect x="430" y="200" width="266" height="64" rx="6" class="box"/>
  <text x="444" y="228" text-anchor="start" class="ink n">Concurrency control, at the</text>
  <text x="444" y="246" text-anchor="start" class="ink2 n">isolation level you picked</text>
  <rect x="24" y="280" width="56" height="64" rx="6" class="box"/>
  <text x="52" y="322" text-anchor="middle" class="ink t b">D</text>
  <text x="96" y="300" text-anchor="start" class="ink t b">Durability</text>
  <text x="96" y="320" text-anchor="start" class="ink n">Once committed, it survives</text>
  <text x="96" y="336" text-anchor="start" class="ink n">a crash or restart.</text>
  <line x1="380" y1="312" x2="420" y2="312" class="line" marker-end="url(#arrow)"/>
  <rect x="430" y="280" width="266" height="64" rx="6" class="box"/>
  <text x="444" y="308" text-anchor="start" class="ink n">The log on non-volatile storage</text>
  <text x="444" y="326" text-anchor="start" class="ink2 n">(write-ahead log, fsync)</text>
</svg>
