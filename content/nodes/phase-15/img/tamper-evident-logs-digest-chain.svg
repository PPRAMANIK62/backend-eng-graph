<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- log files -->
  <text x="20" y="26" class="ink t b">Log files</text>
  <rect x="40" y="40" width="90" height="34" rx="6" class="box"/><text x="85" y="62" text-anchor="middle" class="ink n mono">log 1</text>
  <rect x="140" y="40" width="90" height="34" rx="6" class="box"/><text x="185" y="62" text-anchor="middle" class="ink n mono">log 2</text>
  <rect x="280" y="40" width="90" height="34" rx="6" class="box"/><text x="325" y="62" text-anchor="middle" class="ink n mono">log 3</text>
  <rect x="380" y="40" width="90" height="34" rx="6" class="box"/><text x="425" y="62" text-anchor="middle" class="ink n mono">log 4</text>
  <rect x="520" y="40" width="90" height="34" rx="6" class="box"/><text x="565" y="62" text-anchor="middle" class="ink n mono">log 5</text>

  <line x1="85" y1="76" x2="120" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="185" y1="76" x2="150" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="325" y1="76" x2="360" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="425" y1="76" x2="390" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="565" y1="76" x2="600" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="650" y="102" class="ink2 n">SHA-256</text>
  <text x="650" y="118" class="ink2 n">of each file</text>

  <!-- digests -->
  <text x="20" y="112" class="ink t b">Digests</text>
  <rect x="40" y="122" width="190" height="96" rx="6" class="box"/>
  <text x="54" y="144" class="ink n b">digest, hour 1</text>
  <text x="54" y="164" class="ink2 n mono">hash(log 1)</text>
  <text x="54" y="182" class="ink2 n mono">hash(log 2)</text>
  <text x="54" y="204" class="focus n">signed with private key</text>

  <rect x="280" y="122" width="190" height="96" rx="6" class="box"/>
  <text x="294" y="144" class="ink n b">digest, hour 2</text>
  <text x="294" y="164" class="ink2 n mono">hash(log 3), hash(log 4)</text>
  <text x="294" y="182" class="ink2 n mono">sig(digest 1)</text>
  <text x="294" y="204" class="focus n">signed with private key</text>

  <rect x="520" y="122" width="180" height="96" rx="6" class="box"/>
  <text x="534" y="144" class="ink n b">digest, hour 3</text>
  <text x="534" y="164" class="ink2 n mono">hash(log 5)</text>
  <text x="534" y="182" class="ink2 n mono">sig(digest 2)</text>
  <text x="534" y="204" class="focus n">signed with private key</text>

  <line x1="232" y1="176" x2="277" y2="176" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="472" y1="176" x2="517" y2="176" class="focus-s" marker-end="url(#arrow)"/>

  <!-- what breaks -->
  <text x="40" y="250" class="ink n">Change a log file: its hash no longer matches the digest.</text>
  <text x="40" y="270" class="ink n">Edit a digest: its signature fails with the public key.</text>
  <text x="40" y="290" class="ink n">Delete a digest: the next digest points to a signature that isn't there.</text>
</svg>
