<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- stable -->
  <rect x="20" y="120" width="190" height="120" rx="6" class="safe-box"/>
  <text x="115" y="146" text-anchor="middle" class="ink t b">Stable</text>
  <text x="115" y="170" text-anchor="middle" class="ink2 n">Load below hidden capacity.</text>
  <text x="115" y="188" text-anchor="middle" class="ink2 n">A trigger causes errors,</text>
  <text x="115" y="206" text-anchor="middle" class="ink2 n">and they clear when the</text>
  <text x="115" y="224" text-anchor="middle" class="ink2 n">trigger ends.</text>

  <!-- vulnerable -->
  <rect x="265" y="120" width="190" height="120" rx="6" class="box"/>
  <text x="360" y="146" text-anchor="middle" class="ink t b">Vulnerable</text>
  <text x="360" y="170" text-anchor="middle" class="ink2 n">Healthy, and looks it.</text>
  <text x="360" y="188" text-anchor="middle" class="ink2 n">Many systems run here</text>
  <text x="360" y="206" text-anchor="middle" class="ink2 n">on purpose: it's efficient.</text>

  <!-- metastable -->
  <rect x="510" y="120" width="190" height="120" rx="6" class="box"/>
  <rect x="510" y="120" width="190" height="120" rx="6" class="lost-s"/>
  <text x="605" y="146" text-anchor="middle" class="ink t b">Metastable</text>
  <text x="605" y="170" text-anchor="middle" class="ink2 n">Busy, but goodput</text>
  <text x="605" y="188" text-anchor="middle" class="ink2 n">near zero. Stays here</text>
  <text x="605" y="206" text-anchor="middle" class="ink2 n">after the trigger is gone.</text>

  <!-- stable <-> vulnerable -->
  <line x1="212" y1="160" x2="262" y2="160" class="line" marker-end="url(#arrow)"/>
  <line x1="263" y1="202" x2="213" y2="202" class="line" marker-end="url(#arrow)"/>
  <text x="238" y="96" text-anchor="middle" class="ink n">load rises</text>
  <line x1="238" y1="102" x2="238" y2="154" class="line" stroke-dasharray="3 3"/>
  <text x="238" y="266" text-anchor="middle" class="ink n">load falls</text>
  <line x1="238" y1="208" x2="238" y2="254" class="line" stroke-dasharray="3 3"/>

  <!-- vulnerable -> metastable: trigger -->
  <line x1="457" y1="180" x2="507" y2="180" class="focus-s" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="470" y="92" text-anchor="middle" class="focus t b">trigger</text>
  <text x="470" y="108" text-anchor="middle" class="ink2 n">blip, spike, deploy</text>
  <line x1="482" y1="114" x2="482" y2="174" class="line" stroke-dasharray="3 3"/>

  <!-- metastable self loop -->
  <path d="M 645 118 C 652 58, 700 58, 690 118" class="lost-s" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="28" text-anchor="end" class="ink n b">sustaining effect</text>
  <text x="636" y="44" text-anchor="end" class="ink2 n">retries, a cache that can't</text>
  <text x="636" y="60" text-anchor="end" class="ink2 n">refill, slow error paths</text>

  <!-- metastable -> stable: strong push -->
  <path d="M 605 242 C 605 400, 115 400, 115 244" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="300" text-anchor="middle" class="ink t b">only a strong push gets it out</text>
  <text x="360" y="320" text-anchor="middle" class="ink2 n">cut load hard, turn off retries, restart</text>
</svg>
