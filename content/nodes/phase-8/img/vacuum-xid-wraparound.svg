<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="20" y="26" class="ink t b">XIDs are a circle</text>
  <path d="M 220.0 80.0 A 110 110 0 0 0 220.0 300.0" class="line"/>
  <path d="M 220.0 80.0 A 110 110 0 0 1 220.0 300.0" class="focus-s" stroke-dasharray="6 4"/>
  <circle cx="220.0" cy="80.0" r="6" class="focus"/>
  <text x="220.0" y="66.0" text-anchor="middle" class="ink n b">current XID</text>
  <text x="102" y="186" text-anchor="end" class="ink n">older:</text>
  <text x="102" y="202" text-anchor="end" class="ink2 n">in the past</text>
  <text x="338" y="186" class="ink n">newer:</text>
  <text x="338" y="202" class="ink2 n">in the future</text>
  <text x="220" y="184" text-anchor="middle" class="ink2 n">2 billion behind,</text>
  <text x="220" y="202" text-anchor="middle" class="ink2 n">2 billion ahead</text>
  <circle cx="149.3" cy="274.3" r="6" class="old"/>
  <text x="139.3" y="296.3" text-anchor="middle" class="ink n">unfrozen row</text>
  <text x="220" y="330" text-anchor="middle" class="ink2 n">As the current XID moves on, an old row's xmin</text>
  <text x="220" y="348" text-anchor="middle" class="ink2 n">drifts round until it looks like the future.</text>
  <text x="220" y="366" text-anchor="middle" class="ink2 n">Frozen rows count as older than every XID.</text>

  <line x1="490" y1="380" x2="490" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="480" y="384" text-anchor="end" class="ink2 n">0</text>
  <text x="470" y="26" class="ink t b">Age of the oldest unfrozen XID</text>
  <text x="470" y="44" class="ink2 n">(PostgreSQL 18 defaults)</text>
  <line x1="482" y1="353.5" x2="498" y2="353.5" class="focus-s"/>
  <text x="508" y="361.5" class="ink n b">200 million</text>
  <text x="508" y="377.5" class="ink2 n">anti-wraparound vacuum starts</text>
  <line x1="482" y1="168.4" x2="498" y2="168.4" class="focus-s"/>
  <text x="508" y="176.4" class="ink n b">1.6 billion</text>
  <text x="508" y="192.4" class="ink2 n">failsafe: vacuum drops throttling</text>
  <line x1="482" y1="101.3" x2="498" y2="101.3" class="lost-s"/>
  <text x="508" y="140.0" class="ink n b">40 million left</text>
  <text x="508" y="156.0" class="ink2 n">warnings in the log</text>
  <line x1="482" y1="96.4" x2="498" y2="96.4" class="lost-s"/>
  <text x="508" y="104.0" class="ink n b">3 million left</text>
  <text x="508" y="120.0" class="ink2 n">no new XIDs: writes stop</text>

</svg>
