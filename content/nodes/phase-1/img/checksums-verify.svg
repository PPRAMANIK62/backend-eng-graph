<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- written -->
  <text x="40" y="24" class="ink t b">Written</text>
  <rect x="40" y="36" width="130" height="44" rx="6" class="box"/>
  <text x="105" y="63" text-anchor="middle" class="ink n mono">0x1c2a9f03</text>
  <rect x="174" y="36" width="260" height="44" rx="6" class="focus-s"/>
  <text x="304" y="63" text-anchor="middle" class="ink t">payload, 200 bytes</text>
  <text x="105" y="98" text-anchor="middle" class="ink2 n">checksum, 4 bytes</text>
  <text x="454" y="56" class="ink2 n">checksum computed</text>
  <text x="454" y="72" class="ink2 n">over the payload first</text>

  <line x1="40" y1="120" x2="680" y2="120" class="line" stroke-dasharray="4 4"/>

  <!-- read back intact -->
  <text x="40" y="152" class="ink t b">Read back, intact</text>
  <rect x="40" y="164" width="130" height="44" rx="6" class="box"/>
  <text x="105" y="191" text-anchor="middle" class="ink n mono">0x1c2a9f03</text>
  <rect x="174" y="164" width="260" height="44" rx="6" class="focus-s"/>
  <text x="304" y="191" text-anchor="middle" class="ink t">payload, 200 bytes</text>
  <line x1="438" y1="186" x2="477" y2="186" class="line" marker-end="url(#arrow)"/>
  <rect x="480" y="164" width="200" height="44" rx="6" class="safe-box"/>
  <text x="580" y="184" text-anchor="middle" class="ink n">recomputed: <tspan class="mono">0x1c2a9f03</tspan></text>
  <text x="580" y="200" text-anchor="middle" class="ink n b">match, use it</text>

  <!-- read back torn -->
  <text x="40" y="252" class="ink t b">Read back, second half missing</text>
  <rect x="40" y="264" width="130" height="44" rx="6" class="box"/>
  <text x="105" y="291" text-anchor="middle" class="ink n mono">0x1c2a9f03</text>
  <rect x="174" y="264" width="128" height="44" rx="6" class="focus-s"/>
  <text x="238" y="291" text-anchor="middle" class="ink n">first half</text>
  <rect x="306" y="264" width="128" height="44" rx="6" class="line" stroke-dasharray="4 4"/>
  <text x="370" y="291" text-anchor="middle" class="ink2 n">didn’t reach disk</text>
  <line x1="438" y1="286" x2="477" y2="286" class="line" marker-end="url(#arrow)"/>
  <rect x="480" y="264" width="200" height="44" rx="6" class="lost-s"/>
  <text x="580" y="284" text-anchor="middle" class="ink n">recomputed: a different value</text>
  <text x="580" y="300" text-anchor="middle" class="lost n b">mismatch, reject it</text>
</svg>
