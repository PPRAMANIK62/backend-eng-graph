<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="40" y="26" class="ink t b">UUIDv7: time first, then random</text>
  <rect x="40" y="36" width="240" height="34" class="focus" fill-opacity=".18"/>
  <rect x="40" y="36" width="240" height="34" class="focus-s"/>
  <text x="160.0" y="57.0" text-anchor="middle" class="ink n mono">unix_ts_ms (48 bits)</text>
  <rect x="280" y="36" width="20" height="34" class="box"/>
  <text x="290.0" y="85" text-anchor="middle" class="ink2 n mono">ver</text>
  <rect x="300" y="36" width="60" height="34" class="box"/>
  <text x="330.0" y="57.0" text-anchor="middle" class="ink n mono">rand_a</text>
  <rect x="360" y="36" width="10" height="34" class="box"/>
  <text x="365" y="85" text-anchor="middle" class="ink2 n mono">var</text>
  <rect x="370" y="36" width="310" height="34" class="box"/>
  <text x="525.0" y="57.0" text-anchor="middle" class="ink n mono">rand_b (62 bits)</text>
  <text x="40" y="118" class="ink t b">UUIDv4: random except the version and variant</text>
  <rect x="40" y="128" width="240" height="34" class="box"/>
  <text x="160.0" y="149.0" text-anchor="middle" class="ink n mono">random</text>
  <rect x="280" y="128" width="20" height="34" class="box"/>
  <text x="290.0" y="177" text-anchor="middle" class="ink2 n mono">ver</text>
  <rect x="300" y="128" width="60" height="34" class="box"/>
  <text x="330.0" y="149.0" text-anchor="middle" class="ink n mono">random</text>
  <rect x="360" y="128" width="10" height="34" class="box"/>
  <text x="365" y="177" text-anchor="middle" class="ink2 n mono">var</text>
  <rect x="370" y="128" width="310" height="34" class="box"/>
  <text x="525.0" y="149.0" text-anchor="middle" class="ink n mono">random</text>
  <text x="40" y="222" class="ink t b">Ordered keys (sequence, UUIDv7)</text>
  <rect x="40" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="90" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="140" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="190" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="240" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="290" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="290" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <text x="40" y="244" class="ink2 n">5 new rows, one after another</text>
  <line x1="60" y1="256" x2="311" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="116" y1="256" x2="311" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="172" y1="256" x2="311" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="228" y1="256" x2="311" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="284" y1="256" x2="311" y2="296" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="350" class="ink2 n">All inserts land on the rightmost leaf page</text>
  <text x="400" y="222" class="ink t b">Random keys (UUIDv4)</text>
  <rect x="400" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="400" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <rect x="450" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="450" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <rect x="500" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="500" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <rect x="550" y="300" width="42" height="30" rx="6" class="box"/>
  <rect x="600" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="600" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <rect x="650" y="300" width="42" height="30" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="650" y="300" width="42" height="30" rx="6" class="focus-s"/>
  <text x="400" y="244" class="ink2 n">5 new rows, one after another</text>
  <line x1="420" y1="256" x2="471" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="476" y1="256" x2="621" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="532" y1="256" x2="421" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="588" y1="256" x2="671" y2="296" class="line" marker-end="url(#arrow)"/>
  <line x1="644" y1="256" x2="521" y2="296" class="line" marker-end="url(#arrow)"/>
  <text x="400" y="350" class="ink2 n">Each insert lands on a different leaf page</text>
  <text x="360" y="372" text-anchor="middle" class="ink2 n">Bottom row: leaf pages of the primary key's B-tree index</text>
</svg>
