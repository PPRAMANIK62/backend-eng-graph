  <rect x="60" y="282" width="170" height="32" rx="6" class="box"/>
  <text x="74" y="303" class="ink t b">page 6</text>
  <text x="216" y="303" text-anchor="end" class="ink2 n">heap</text>
  <path d="M 230 298.0 C 290 298.0, 330 298.0, 330 374" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="60" y="318" width="170" height="32" rx="6" class="box"/>
  <text x="74" y="339" class="ink t b">page 7</text>
  <text x="216" y="339" text-anchor="end" class="ink2 n">stack</text>
  <path d="M 230 334.0 C 350 334.0, 370 307.0, 487 307.0" class="line" marker-end="url(#arrow)"/>
  <rect x="270" y="376" width="140" height="44" rx="6" class="box"/>
  <text x="340" y="396" text-anchor="middle" class="ink t b">Disk (swap)</text>
  <text x="340" y="412" text-anchor="middle" class="ink2 n">page 6: not present</text>
  <text x="60" y="404" class="ink2 n">Invalid pages use no RAM.</text>
</svg>
