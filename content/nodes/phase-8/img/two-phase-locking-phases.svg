<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- left: basic 2PL -->
  <text x="195" y="24" text-anchor="middle" class="ink t b">Basic 2PL</text>
  <line x1="60" y1="220" x2="60" y2="50" class="line" marker-end="url(#arrow)"/>
  <line x1="60" y1="220" x2="340" y2="220" class="line" marker-end="url(#arrow)"/>
  <text x="48" y="60" text-anchor="end" class="ink2 n">locks</text>
  <text x="48" y="76" text-anchor="end" class="ink2 n">held</text>
  <text x="340" y="240" text-anchor="end" class="ink2 n">time</text>
  <path d="M60,220 H85 V190 H115 V160 H145 V130 H175 V100 H205 V130 H235 V160 H265 V190 H295 V220 H315" class="focus-s" style="stroke-width:2.5"/>
  <line x1="190" y1="92" x2="190" y2="220" class="line" stroke-dasharray="4 4"/>
  <text x="190" y="84" text-anchor="middle" class="ink n b">lock point</text>
  <text x="125" y="260" text-anchor="middle" class="ink n">growing: only take</text>
  <text x="255" y="260" text-anchor="middle" class="ink n">shrinking: only release</text>

  <!-- right: strict 2PL -->
  <text x="555" y="24" text-anchor="middle" class="ink t b">Strict 2PL</text>
  <line x1="420" y1="220" x2="420" y2="50" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="220" x2="700" y2="220" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="240" text-anchor="end" class="ink2 n">time</text>
  <path d="M420,220 H445 V190 H475 V160 H505 V130 H535 V100 H645 V220 H675" class="focus-s" style="stroke-width:2.5"/>
  <text x="485" y="260" text-anchor="middle" class="ink n">growing: only take</text>
  <text x="590" y="92" text-anchor="middle" class="ink n">held until the end</text>
  <text x="655" y="150" class="ink n b">commit:</text>
  <text x="655" y="166" class="ink n">release all</text>
</svg>
