<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="28" class="ink t b">cpu.max = 200000 100000 (200 ms of CPU per 100 ms), eight threads busy</text>
  <!-- period boundaries -->
  <line x1="90" y1="50" x2="90" y2="200" class="line"/>
  <line x1="290" y1="50" x2="290" y2="200" class="line"/>
  <line x1="490" y1="50" x2="490" y2="200" class="line"/>
  <line x1="690" y1="50" x2="690" y2="200" class="line"/>
  <text x="190" y="62" text-anchor="middle" class="ink2 n">period 1</text>
  <text x="390" y="62" text-anchor="middle" class="ink2 n">period 2</text>
  <text x="590" y="62" text-anchor="middle" class="ink2 n">period 3</text>

  <text x="80" y="104" text-anchor="end" class="ink n">group</text>
  <!-- running bursts -->
  <rect x="90" y="84" width="50" height="30" rx="4" class="focus"/>
  <rect x="290" y="84" width="50" height="30" rx="4" class="focus"/>
  <rect x="490" y="84" width="50" height="30" rx="4" class="focus"/>
  <!-- throttled -->
  <rect x="140" y="84" width="150" height="30" rx="4" class="lost" fill-opacity=".35"/>
  <rect x="340" y="84" width="150" height="30" rx="4" class="lost" fill-opacity=".35"/>
  <rect x="540" y="84" width="150" height="30" rx="4" class="lost" fill-opacity=".35"/>
  <text x="215" y="104" text-anchor="middle" class="ink n">throttled 75 ms</text>
  <text x="415" y="104" text-anchor="middle" class="ink n">throttled 75 ms</text>
  <text x="615" y="104" text-anchor="middle" class="ink n">throttled 75 ms</text>
  <text x="115" y="136" text-anchor="middle" class="focus n b">25 ms</text>

  <!-- a request -->
  <text x="80" y="170" text-anchor="end" class="ink n">request</text>
  <line x1="170" y1="165" x2="290" y2="165" class="lost-s" stroke-dasharray="6 5"/>
  <circle cx="170" cy="165" r="5" class="ink"/>
  <line x1="290" y1="165" x2="312" y2="165" class="focus-s" stroke-width="3"/>
  <text x="282" y="192" text-anchor="end" class="ink2 n">arrives, waits for the next period</text>

  <!-- time axis -->
  <line x1="90" y1="215" x2="690" y2="215" class="line" marker-end="url(#arrow)"/>
  <text x="90" y="235" text-anchor="middle" class="ink2 n">0</text>
  <text x="290" y="235" text-anchor="middle" class="ink2 n">100 ms</text>
  <text x="490" y="235" text-anchor="middle" class="ink2 n">200 ms</text>
  <text x="690" y="235" text-anchor="end" class="ink2 n">300 ms</text>
  <rect x="90" y="252" width="14" height="14" rx="3" class="focus"/>
  <text x="112" y="264" class="ink n">running on 8 cores (8 × 25 ms = 200 ms used)</text>
  <rect x="440" y="252" width="14" height="14" rx="3" class="lost" fill-opacity=".35"/>
  <text x="462" y="264" class="ink n">stopped until the period ends</text>
</svg>
