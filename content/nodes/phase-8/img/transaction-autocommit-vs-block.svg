<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="24" y="28" text-anchor="start" class="ink t b">Autocommit: four statements, four transactions</text>
  <rect x="24" y="44" width="156" height="40" rx="6" class="box"/>
  <text x="102" y="62" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="102" y="77" text-anchor="middle" class="ink n b">Alice −100</text>
  <text x="102" y="102" text-anchor="middle" class="ink2 n">commits</text>
  <rect x="196" y="44" width="156" height="40" rx="6" class="box"/>
  <text x="274" y="62" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="274" y="77" text-anchor="middle" class="ink n b">north −100</text>
  <text x="274" y="102" text-anchor="middle" class="ink2 n">commits</text>
  <rect x="368" y="44" width="156" height="40" rx="6" class="box" stroke-dasharray="5 4"/>
  <text x="446" y="62" text-anchor="middle" class="ink2 n mono">UPDATE</text>
  <text x="446" y="77" text-anchor="middle" class="ink2 n">Bob +100</text>
  <text x="446" y="102" text-anchor="middle" class="ink2 n">never runs</text>
  <rect x="540" y="44" width="156" height="40" rx="6" class="box" stroke-dasharray="5 4"/>
  <text x="618" y="62" text-anchor="middle" class="ink2 n mono">UPDATE</text>
  <text x="618" y="77" text-anchor="middle" class="ink2 n">south +100</text>
  <text x="618" y="102" text-anchor="middle" class="ink2 n">never runs</text>
  <line x1="358" y1="38" x2="358" y2="112" class="lost-s"/>
  <text x="358" y="128" text-anchor="middle" class="lost n b">crash</text>
  <text x="24" y="160" text-anchor="start" class="lost t b">After restart: Alice has lost 100 and Bob never got it.</text>
  <line x1="24" y1="186" x2="696" y2="186" class="line" stroke-dasharray="2 4"/>
  <text x="24" y="218" text-anchor="start" class="ink t b">One transaction: BEGIN … COMMIT</text>
  <rect x="24" y="236" width="70" height="40" rx="6" class="box"/>
  <text x="59" y="261" text-anchor="middle" class="ink n mono b">BEGIN</text>
  <rect x="104" y="236" width="108" height="40" rx="6" class="box"/>
  <rect x="104" y="236" width="108" height="40" rx="6" class="focus-s"/>
  <text x="158" y="252" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="158" y="268" text-anchor="middle" class="ink n b">Alice −100</text>
  <rect x="222" y="236" width="108" height="40" rx="6" class="box"/>
  <rect x="222" y="236" width="108" height="40" rx="6" class="focus-s"/>
  <text x="276" y="252" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="276" y="268" text-anchor="middle" class="ink n b">north −100</text>
  <rect x="340" y="236" width="108" height="40" rx="6" class="box"/>
  <rect x="340" y="236" width="108" height="40" rx="6" class="focus-s"/>
  <text x="394" y="252" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="394" y="268" text-anchor="middle" class="ink n b">Bob +100</text>
  <rect x="458" y="236" width="108" height="40" rx="6" class="box"/>
  <rect x="458" y="236" width="108" height="40" rx="6" class="focus-s"/>
  <text x="512" y="252" text-anchor="middle" class="ink n mono">UPDATE</text>
  <text x="512" y="268" text-anchor="middle" class="ink n b">south +100</text>
  <rect x="576" y="236" width="80" height="40" rx="6" class="box"/>
  <text x="616" y="261" text-anchor="middle" class="ink n mono b">COMMIT</text>
  <line x1="94" y1="296" x2="576" y2="296" class="focus-s" marker-end="url(#arrow)"/>
  <text x="335" y="314" text-anchor="middle" class="focus n">crash anywhere in here: all four are undone</text>
  <text x="24" y="350" text-anchor="start" class="ink2 n">Other sessions see:</text>
  <rect x="150" y="336" width="210" height="22" rx="6" class="box"/>
  <text x="255" y="351" text-anchor="middle" class="ink n">the old values, until COMMIT</text>
  <rect x="370" y="336" width="326" height="22" rx="6" class="safe-box"/>
  <text x="533" y="351" text-anchor="middle" class="ink n b">all four at once, after COMMIT</text>
  <text x="24" y="384" text-anchor="start" class="ink2 n">Never the middle: no reader sees Alice debited but Bob not yet credited.</text>
</svg>
