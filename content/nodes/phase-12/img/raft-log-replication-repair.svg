  <text x="336" y="136" text-anchor="middle" class="ink2 n b">5</text>
  <line x1="326" y1="132" x2="300" y2="132" class="line" marker-end="url(#arrow)"/>
  <text x="288" y="136" text-anchor="middle" class="focus n b">4</text>
  <text x="408" y="156" text-anchor="middle" class="ink2 n">7 rejections, one round trip each</text>
  <text x="360" y="262" text-anchor="middle" class="ink n">At nextIndex 4 the check (index 3, term 1) passes. The follower deletes</text>
  <text x="360" y="278" text-anchor="middle" class="ink n">its entries 4 to 11 and takes the leader&#39;s 4 to 10.</text>
  <rect x="120" y="296" width="16" height="16" rx="3" class="old"/><text x="142" y="309" class="ink n">uncommitted, from old terms: overwritten</text>
  <rect x="430" y="296" width="16" height="16" rx="3" class="focus"/><text x="452" y="309" class="ink n">leader&#39;s entries, sent to fix it</text>
