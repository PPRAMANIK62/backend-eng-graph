<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="20" y="160" width="130" height="56" rx="6" class="box"/>
  <text x="85" y="193" text-anchor="middle" class="ink t b">Load balancer</text>
  <rect x="210" y="40" width="250" height="100" rx="6" class="box"/>
  <text x="226" y="64" class="ink t b">Production</text>
  <text x="226" y="82" class="ink2 n">v1, running for days</text>
  <rect x="226" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="245" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="264" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="283" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="302" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="321" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="340" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="359" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="378" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="397" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="416" y="94" width="16" height="16" rx="3" class="old"/>
  <rect x="435" y="94" width="16" height="16" rx="3" class="old"/>
  <path d="M 152 188 L 180 188 L 180 90.0 L 207 90.0" class="line" marker-end="url(#arrow)"/>
  <text x="448" y="130" text-anchor="end" class="ink2 n">most traffic; not compared</text>
  <rect x="210" y="170" width="250" height="80" rx="6" class="box"/>
  <text x="226" y="194" class="ink t b">Baseline</text>
  <text x="226" y="212" class="ink2 n">v1, started just now</text>
  <rect x="226" y="224" width="16" height="16" rx="3" class="old"/>
  <rect x="245" y="224" width="16" height="16" rx="3" class="old"/>
  <rect x="264" y="224" width="16" height="16" rx="3" class="old"/>
  <path d="M 152 188 L 180 188 L 180 210.0 L 207 210.0" class="line" marker-end="url(#arrow)"/>
  <text x="448" y="240" text-anchor="end" class="ink2 n">small share</text>
  <rect x="210" y="280" width="250" height="80" rx="6" class="box"/>
  <text x="226" y="304" class="ink t b">Canary</text>
  <text x="226" y="322" class="ink2 n">v2, started just now</text>
  <rect x="226" y="334" width="16" height="16" rx="3" class="focus"/>
  <rect x="245" y="334" width="16" height="16" rx="3" class="focus"/>
  <rect x="264" y="334" width="16" height="16" rx="3" class="focus"/>
  <path d="M 152 188 L 180 188 L 180 320.0 L 207 320.0" class="line" marker-end="url(#arrow)"/>
  <text x="448" y="350" text-anchor="end" class="ink2 n">same small share</text>
  <rect x="520" y="180" width="180" height="120" rx="6" class="box"/>
  <rect x="520" y="180" width="180" height="120" rx="6" class="focus-s"/>
  <text x="610" y="204" text-anchor="middle" class="ink t b">Judge</text>
  <text x="610" y="224" text-anchor="middle" class="ink2 n">metric by metric:</text>
  <text x="610" y="240" text-anchor="middle" class="ink2 n">errors, latency, …</text>
  <text x="610" y="258" text-anchor="middle" class="ink2 n">Mann-Whitney U,</text>
  <text x="610" y="274" text-anchor="middle" class="ink2 n">98% confidence</text>
  <path d="M 462 210 L 490 210 L 490 230 L 517 230" class="line" marker-end="url(#arrow)"/>
  <path d="M 462 320 L 490 320 L 490 250 L 517 250" class="line" marker-end="url(#arrow)"/>
  <text x="490" y="196" text-anchor="middle" class="ink2 n">metrics</text>
  <path d="M 610 302 L 610 330" class="line" marker-end="url(#arrow)"/>
  <rect x="540" y="334" width="140" height="30" rx="6" class="safe-box"/>
  <text x="610" y="354" text-anchor="middle" class="ink n b">pass: continue</text>
  <rect x="540" y="372" width="140" height="30" rx="6" class="lost" fill-opacity=".18"/>
  <rect x="540" y="372" width="140" height="30" rx="6" class="lost-s" style="stroke-width:1.5"/>
  <text x="610" y="392" text-anchor="middle" class="ink n b">fail: roll back</text>
  <text x="610" y="420" text-anchor="middle" class="ink2 n">in between: marginal</text>

</svg>
