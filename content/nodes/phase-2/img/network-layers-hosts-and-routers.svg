<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .arrowhead-f{fill:#2a78d6}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .arrowhead-f{fill:#3987e5}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-f"/>
    </marker>
  </defs>

  <!-- Host A -->
  <rect x="20" y="40" width="120" height="40" rx="6" class="box"/>
  <text x="80" y="65" text-anchor="middle" class="ink t">Application</text>
  <rect x="20" y="84" width="120" height="40" rx="6" class="box"/>
  <text x="80" y="109" text-anchor="middle" class="ink t">Transport</text>
  <rect x="20" y="128" width="120" height="40" rx="6" class="box"/>
  <text x="80" y="153" text-anchor="middle" class="ink t">Internet</text>
  <rect x="20" y="172" width="120" height="40" rx="6" class="box"/>
  <text x="80" y="197" text-anchor="middle" class="ink t">Link</text>
  <text x="80" y="238" text-anchor="middle" class="ink t b">Host A</text>

  <!-- Router 1 -->
  <rect x="210" y="128" width="120" height="40" rx="6" class="box"/>
  <text x="270" y="153" text-anchor="middle" class="ink t">Internet</text>
  <rect x="210" y="172" width="120" height="40" rx="6" class="box"/>
  <text x="270" y="197" text-anchor="middle" class="ink t">Link</text>
  <text x="270" y="238" text-anchor="middle" class="ink t b">Router</text>

  <!-- Router 2 -->
  <rect x="400" y="128" width="120" height="40" rx="6" class="box"/>
  <text x="460" y="153" text-anchor="middle" class="ink t">Internet</text>
  <rect x="400" y="172" width="120" height="40" rx="6" class="box"/>
  <text x="460" y="197" text-anchor="middle" class="ink t">Link</text>
  <text x="460" y="238" text-anchor="middle" class="ink t b">Router</text>

  <!-- Host B -->
  <rect x="580" y="40" width="120" height="40" rx="6" class="box"/>
  <text x="640" y="65" text-anchor="middle" class="ink t">Application</text>
  <rect x="580" y="84" width="120" height="40" rx="6" class="box"/>
  <text x="640" y="109" text-anchor="middle" class="ink t">Transport</text>
  <rect x="580" y="128" width="120" height="40" rx="6" class="box"/>
  <text x="640" y="153" text-anchor="middle" class="ink t">Internet</text>
  <rect x="580" y="172" width="120" height="40" rx="6" class="box"/>
  <text x="640" y="197" text-anchor="middle" class="ink t">Link</text>
  <text x="640" y="238" text-anchor="middle" class="ink t b">Host B</text>

  <!-- end to end: application and transport -->
  <line x1="142" y1="60" x2="576" y2="60" class="focus-s" stroke-dasharray="6 4" marker-end="url(#arrow-f)"/>
  <text x="360" y="52" text-anchor="middle" class="focus n b">HTTP: end to end</text>
  <line x1="142" y1="104" x2="576" y2="104" class="focus-s" stroke-dasharray="6 4" marker-end="url(#arrow-f)"/>
  <text x="360" y="96" text-anchor="middle" class="focus n b">TCP: end to end</text>

  <!-- hop by hop: internet and link -->
  <line x1="142" y1="148" x2="206" y2="148" class="line" marker-end="url(#arrow)"/>
  <line x1="332" y1="148" x2="396" y2="148" class="line" marker-end="url(#arrow)"/>
  <line x1="522" y1="148" x2="576" y2="148" class="line" marker-end="url(#arrow)"/>
  <line x1="142" y1="192" x2="206" y2="192" class="line" marker-end="url(#arrow)"/>
  <line x1="332" y1="192" x2="396" y2="192" class="line" marker-end="url(#arrow)"/>
  <line x1="522" y1="192" x2="576" y2="192" class="line" marker-end="url(#arrow)"/>
  <text x="365" y="262" text-anchor="middle" class="ink2 n">IP and the link: hop by hop</text>
</svg>
