<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="26" text-anchor="start" class="ink t b">Sign-up</text>
  <rect x="20" y="40" width="150" height="40" rx="6" class="box"/>
  <text x="95.0" y="65.0" text-anchor="middle" class="ink t">new password</text>
  <rect x="20" y="92" width="150" height="40" rx="6" class="box"/>
  <text x="95.0" y="117.0" text-anchor="middle" class="ink t">random salt</text>
  <rect x="250" y="58" width="160" height="56" rx="6" class="box"/>
  <text x="330.0" y="82.0" text-anchor="middle" class="focus t b">Argon2id</text>
  <text x="330.0" y="100.0" text-anchor="middle" class="ink2 n mono">m, t, p</text>
  <rect x="250" y="58" width="160" height="56" rx="6" class="focus-s"/>
  <path d="M170,60 H210 V80 H247" class="line" marker-end="url(#arrow)"/>
  <path d="M170,112 H210 V92 H247" class="line" marker-end="url(#arrow)"/>
  <rect x="490" y="44" width="210" height="84" rx="6" class="safe-box"/>
  <text x="595.0" y="73.0" text-anchor="middle" class="ink t b">Stored in the users row</text>
  <text x="595.0" y="91.0" text-anchor="middle" class="ink2 n">algorithm, parameters,</text>
  <text x="595.0" y="109.0" text-anchor="middle" class="ink2 n">salt, hash</text>
  <path d="M410,86 H487" class="line" marker-end="url(#arrow)"/>
  <text x="20" y="214" text-anchor="start" class="ink t b">Log-in</text>
  <rect x="20" y="228" width="150" height="40" rx="6" class="box"/>
  <text x="95.0" y="253.0" text-anchor="middle" class="ink t">salt, parameters</text>
  <rect x="20" y="280" width="150" height="40" rx="6" class="box"/>
  <text x="95.0" y="305.0" text-anchor="middle" class="ink t">typed password</text>
  <path d="M530,128 V176 H95 V225" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="170" text-anchor="middle" class="ink2 n">read from the stored row</text>
  <rect x="250" y="246" width="160" height="56" rx="6" class="box"/>
  <text x="330.0" y="270.0" text-anchor="middle" class="focus t b">Argon2id</text>
  <text x="330.0" y="288.0" text-anchor="middle" class="ink2 n mono">same m, t, p</text>
  <rect x="250" y="246" width="160" height="56" rx="6" class="focus-s"/>
  <path d="M170,248 H210 V268 H247" class="line" marker-end="url(#arrow)"/>
  <path d="M170,300 H210 V280 H247" class="line" marker-end="url(#arrow)"/>
  <rect x="490" y="246" width="210" height="56" rx="6" class="box"/>
  <text x="595.0" y="270.0" text-anchor="middle" class="ink t">Compare with</text>
  <text x="595.0" y="288.0" text-anchor="middle" class="ink t">the stored hash</text>
  <path d="M410,274 H487" class="line" marker-end="url(#arrow)"/>
  <path d="M660,128 V243" class="line" marker-end="url(#arrow)"/>
  <text x="652" y="190" text-anchor="end" class="ink2 n">stored hash</text>
  <text x="595" y="330" text-anchor="middle" class="ink n b">equal: password is correct</text>
  <path d="M595,302 V314" class="line" marker-end="url(#arrow)"/>
</svg>
