<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="28" text-anchor="start" class="ink t b">Partition 0 of topic orders</text>
  <rect x="42" y="70" width="44" height="40" rx="6" class="safe-box"/>
  <text x="64.0" y="95" text-anchor="middle" class="ink t mono">0</text>
  <rect x="90" y="70" width="44" height="40" rx="6" class="safe-box"/>
  <text x="112.0" y="95" text-anchor="middle" class="ink t mono">1</text>
  <rect x="138" y="70" width="44" height="40" rx="6" class="safe-box"/>
  <text x="160.0" y="95" text-anchor="middle" class="ink t mono">2</text>
  <rect x="186" y="70" width="44" height="40" rx="6" class="safe-box"/>
  <text x="208.0" y="95" text-anchor="middle" class="ink t mono">3</text>
  <rect x="234" y="70" width="44" height="40" rx="6" class="box"/>
  <rect x="234" y="70" width="44" height="40" rx="6" class="focus-s"/>
  <text x="256.0" y="95" text-anchor="middle" class="ink t mono">4</text>
  <rect x="282" y="70" width="44" height="40" rx="6" class="box"/>
  <rect x="282" y="70" width="44" height="40" rx="6" class="focus-s"/>
  <text x="304.0" y="95" text-anchor="middle" class="ink t mono">5</text>
  <rect x="330" y="70" width="44" height="40" rx="6" class="box"/>
  <rect x="330" y="70" width="44" height="40" rx="6" class="focus-s"/>
  <text x="352.0" y="95" text-anchor="middle" class="ink t mono">6</text>
  <rect x="378" y="70" width="44" height="40" rx="6" class="box"/>
  <rect x="378" y="70" width="44" height="40" rx="6" class="focus-s"/>
  <text x="400.0" y="95" text-anchor="middle" class="ink t mono">7</text>
  <rect x="426" y="70" width="44" height="40" rx="6" class="box"/>
  <text x="448.0" y="95" text-anchor="middle" class="ink t mono">8</text>
  <rect x="474" y="70" width="44" height="40" rx="6" class="box"/>
  <text x="496.0" y="95" text-anchor="middle" class="ink t mono">9</text>
  <rect x="522" y="70" width="44" height="40" rx="6" class="box"/>
  <text x="544.0" y="95" text-anchor="middle" class="ink t mono">10</text>
  <rect x="570" y="70" width="44" height="40" rx="6" class="box"/>
  <text x="592.0" y="95" text-anchor="middle" class="ink t mono">11</text>
  <text x="624" y="95" text-anchor="start" class="ink2 t">...</text>
  <line x1="232" y1="140" x2="232" y2="114" class="line" marker-end="url(#arrow)"/>
  <text x="232" y="158" text-anchor="middle" class="ink n b">committed offset</text>
  <text x="232" y="174" text-anchor="middle" class="ink2 n mono">4</text>
  <line x1="424" y1="140" x2="424" y2="114" class="line" marker-end="url(#arrow)"/>
  <text x="424" y="158" text-anchor="middle" class="ink n b">position</text>
  <text x="424" y="174" text-anchor="middle" class="ink2 n mono">8</text>
  <line x1="616" y1="140" x2="616" y2="114" class="line" marker-end="url(#arrow)"/>
  <text x="616" y="158" text-anchor="middle" class="ink n b">log end</text>
  <text x="616" y="174" text-anchor="middle" class="ink2 n mono">12</text>
  <path d="M42,62 V54 H230 V62" class="line"/>
  <text x="136.0" y="46" text-anchor="middle" class="ink n">processed and committed</text>
  <path d="M234,62 V54 H422 V62" class="line"/>
  <text x="328.0" y="46" text-anchor="middle" class="focus n b">fetched, not committed yet</text>
  <path d="M426,62 V54 H614 V62" class="line"/>
  <text x="520.0" y="46" text-anchor="middle" class="ink2 n">not fetched yet</text>
  <text x="40" y="212" text-anchor="start" class="ink2 n">A restart resumes at the committed offset, 4. Records 4 to 7 are read again,</text>
  <text x="40" y="230" text-anchor="start" class="ink2 n">whether or not they were already processed.</text>

</svg>
