<svg xmlns="http://www.w3.org/2000/svg" width="720" height="222" viewBox="0 0 720 222" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="40" y="34" class="ink t b">Peak load 19,000 QPS. Each cluster breaks at 5,000 QPS.</text>
  <rect x="40" y="56" width="96" height="70" rx="6" class="box"/>
  <text x="88" y="86" text-anchor="middle" class="ink t b">cluster 1</text>
  <text x="88" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <rect x="150" y="56" width="96" height="70" rx="6" class="box"/>
  <text x="198" y="86" text-anchor="middle" class="ink t b">cluster 2</text>
  <text x="198" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <rect x="260" y="56" width="96" height="70" rx="6" class="box"/>
  <text x="308" y="86" text-anchor="middle" class="ink t b">cluster 3</text>
  <text x="308" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <rect x="370" y="56" width="96" height="70" rx="6" class="box"/>
  <text x="418" y="86" text-anchor="middle" class="ink t b">cluster 4</text>
  <text x="418" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <rect x="480" y="56" width="96" height="70" rx="6" class="safe-box"/>
  <text x="528" y="86" text-anchor="middle" class="ink t b">cluster 5</text>
  <text x="528" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <rect x="590" y="56" width="96" height="70" rx="6" class="safe-box"/>
  <text x="638" y="86" text-anchor="middle" class="ink t b">cluster 6</text>
  <text x="638" y="106" text-anchor="middle" class="ink2 n">5,000 QPS</text>
  <path d="M40,140 V148 H470 V140" class="line"/>
  <text x="255" y="168" text-anchor="middle" class="ink n">N = 4: 20,000 QPS, just enough for the peak</text>
  <path d="M480,140 V148 H690 V140" class="line"/>
  <text x="585" y="168" text-anchor="middle" class="ink n">+2 spare</text>
  <text x="40" y="206" class="ink2 n">Lose any two clusters and the four left still carry the peak.</text>

</svg>
