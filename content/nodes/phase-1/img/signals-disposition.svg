<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="24" y="112" width="110" height="48" rx="6" class="box"/>
  <text x="79" y="141" text-anchor="middle" class="ink t b">Kernel</text>
  <line x1="134" y1="136" x2="203" y2="136" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="126" text-anchor="middle" class="ink2 n">signal</text>

  <!-- the process -->
  <rect x="192" y="12" width="512" height="248" rx="6" class="focus-s"/>
  <text x="208" y="36" class="focus t b">Process</text>

  <rect x="208" y="104" width="150" height="64" rx="6" class="box"/>
  <text x="283" y="132" text-anchor="middle" class="ink t b">Its disposition</text>
  <text x="283" y="152" text-anchor="middle" class="ink2 n">for this signal</text>

  <rect x="420" y="40" width="268" height="52" rx="6" class="box"/>
  <text x="436" y="62" class="ink t b">Default</text>
  <text x="436" y="81" class="ink2 n">usually terminate; some dump core, stop</text>
  <rect x="420" y="110" width="268" height="52" rx="6" class="box"/>
  <text x="436" y="132" class="ink t b">Ignore</text>
  <text x="436" y="151" class="ink2 n">the signal is thrown away</text>
  <rect x="420" y="180" width="268" height="52" rx="6" class="box"/>
  <text x="436" y="202" class="ink t b">Handle <tspan class="ink2 n mono">sigaction</tspan></text>
  <text x="436" y="221" class="ink2 n">pauses what it was doing, runs your function</text>

  <path d="M358,124 L390,66 H417" class="line" marker-end="url(#arrow)"/>
  <line x1="358" y1="136" x2="417" y2="136" class="line" marker-end="url(#arrow)"/>
  <path d="M358,148 L390,206 H417" class="line" marker-end="url(#arrow)"/>

  <text x="24" y="292" class="ink2 n">Blocked signals wait as pending until unblocked.</text>
  <text x="24" y="312" class="ink t"><tspan class="b">SIGKILL</tspan> and <tspan class="b">SIGSTOP</tspan> skip the choice: they can't be caught, blocked or ignored.</text>
</svg>
