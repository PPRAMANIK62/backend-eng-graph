<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="10" y="115" width="110" height="70" rx="6" class="box"/>
  <text x="20" y="137" class="ink2 t b">D1</text>
  <text x="110" y="137" text-anchor="end" class="ink2 n">via Sx</text>
  <text x="20" y="167" class="ink n mono">[(Sx,1)]</text>
  <rect x="150" y="115" width="110" height="70" rx="6" class="box"/>
  <text x="160" y="137" class="ink t b">D2</text>
  <text x="250" y="137" text-anchor="end" class="ink2 n">via Sx</text>
  <text x="160" y="167" class="ink n mono">[(Sx,2)]</text>
  <rect x="300" y="30" width="170" height="70" rx="6" class="box"/>
  <text x="310" y="52" class="focus t b">D3</text>
  <text x="460" y="52" text-anchor="end" class="ink2 n">via Sy</text>
  <text x="310" y="82" class="ink n mono">[(Sx,2),(Sy,1)]</text>
  <rect x="300" y="200" width="170" height="70" rx="6" class="box"/>
  <text x="310" y="222" class="focus t b">D4</text>
  <text x="460" y="222" text-anchor="end" class="ink2 n">via Sz</text>
  <text x="310" y="252" class="ink n mono">[(Sx,2),(Sz,1)]</text>
  <rect x="510" y="115" width="200" height="70" rx="6" class="safe-box"/>
  <text x="520" y="137" class="ink t b">D5</text>
  <text x="700" y="137" text-anchor="end" class="ink2 n">via Sx</text>
  <text x="520" y="167" class="ink n mono">[(Sx,3),(Sy,1),(Sz,1)]</text>
  <line x1="120" y1="150" x2="147" y2="150" class="line" marker-end="url(#arrow)"/>
  <line x1="260" y1="140" x2="297" y2="72" class="line" marker-end="url(#arrow)"/>
  <line x1="260" y1="160" x2="297" y2="228" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="72" x2="507" y2="140" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="228" x2="507" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="385" y="160" text-anchor="middle" class="focus n b">concurrent:</text>
  <text x="385" y="176" text-anchor="middle" class="focus n">neither is below the other</text>
  <text x="135" y="210" text-anchor="middle" class="ink2 n">D1 is an ancestor of D2:</text>
  <text x="135" y="226" text-anchor="middle" class="ink2 n">its counters are all ≤ D2’s</text>
  <text x="610" y="210" text-anchor="middle" class="ink n">client reads D3 and D4,</text>
  <text x="610" y="226" text-anchor="middle" class="ink n">merges, writes D5</text>

</svg>
