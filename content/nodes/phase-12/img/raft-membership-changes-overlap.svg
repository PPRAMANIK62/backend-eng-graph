<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="175" y="26" text-anchor="middle" class="lost t b">Unsafe: three to five at once</text>
  <rect x="18" y="92" width="122" height="52" rx="10" class="old" fill-opacity="0.5"/>
  <rect x="140" y="84" width="180" height="68" rx="10" class="focus-s" stroke-dasharray="6 4"/>
  <rect x="26" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="50" y="123" text-anchor="middle" class="ink t b">S1</text>
  <rect x="86" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="110" y="123" text-anchor="middle" class="ink t b">S2</text>
  <rect x="146" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="170" y="123" text-anchor="middle" class="ink t b">S3</text>
  <rect x="206" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="230" y="123" text-anchor="middle" class="ink t b">S4</text>
  <rect x="266" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="290" y="123" text-anchor="middle" class="ink t b">S5</text>
  <text x="80" y="176" text-anchor="middle" class="ink n">S1, S2: old config</text>
  <text x="80" y="192" text-anchor="middle" class="ink n">2 of 3 is a majority</text>
  <text x="250" y="176" text-anchor="middle" class="focus n">S3, S4, S5: new config</text>
  <text x="250" y="192" text-anchor="middle" class="focus n">3 of 5 is a majority</text>
  <text x="175" y="226" text-anchor="middle" class="lost n b">No server in both: two leaders possible</text>
  <line x1="360" y1="14" x2="360" y2="240" class="line" stroke-dasharray="2 4"/>
  <text x="545" y="26" text-anchor="middle" class="ink t b">Safe: three to four</text>
  <rect x="410" y="92" width="130" height="52" rx="10" class="old" fill-opacity="0.5"/>
  <rect x="484" y="84" width="196" height="68" rx="10" class="focus-s" stroke-dasharray="6 4"/>
  <rect x="416" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="440" y="123" text-anchor="middle" class="ink t b">S1</text>
  <rect x="486" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="510" y="123" text-anchor="middle" class="ink t b">S2</text>
  <rect x="556" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="580" y="123" text-anchor="middle" class="ink t b">S3</text>
  <rect x="626" y="103" width="48" height="30" rx="6" class="box"/>
  <text x="650" y="123" text-anchor="middle" class="ink t b">S4</text>
  <text x="490" y="176" text-anchor="middle" class="ink n">any 2 of the old S1 to S3</text>
  <text x="600" y="194" text-anchor="middle" class="focus n">any 3 of the new S1 to S4</text>
  <text x="545" y="226" text-anchor="middle" class="ink n b">Always share a server (here S2)</text>
  <text x="360" y="264" text-anchor="middle" class="ink2 n">Grey: a majority of the old configuration. Dashed blue: a majority of the new one.</text>
</svg>
