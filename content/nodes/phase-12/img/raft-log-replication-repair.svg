  <text x="576" y="48" text-anchor="middle" class="ink2 n">10</text>
  <text x="624" y="48" text-anchor="middle" class="ink2 n">11</text>
  <text x="20" y="82" class="ink t b">Leader</text>
  <text x="20" y="98" class="ink2 n">term 8</text>
  <rect x="122" y="64" width="44" height="36" rx="4" class="box"/>
  <text x="144" y="87" text-anchor="middle" class="ink t">1</text>
