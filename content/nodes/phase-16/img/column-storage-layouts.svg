  <text x="41.25" y="97" text-anchor="middle" class="ink2 n mono">1</text>
  <text x="83.75" y="97" text-anchor="middle" class="ink2 n mono">mug</text>
  <line x1="62.5" y1="74" x2="62.5" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="108.0" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="126.25" y="97" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="105.0" y1="74" x2="105.0" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="150.5" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="168.75" y="97" text-anchor="middle" class="ink2 n mono">12.5</text>
