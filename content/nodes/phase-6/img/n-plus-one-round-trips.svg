<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="170" y="30" text-anchor="middle" class="ink t b">Lazy loading</text>
  <text x="60" y="58" text-anchor="middle" class="ink t">App</text>
  <text x="280" y="58" text-anchor="middle" class="ink t">Database</text>
  <line x1="60" y1="68" x2="60" y2="300" class="line"/>
  <line x1="280" y1="68" x2="280" y2="300" class="line"/>
  <line x1="62" y1="92" x2="276" y2="92" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="86" text-anchor="middle" class="ink n mono">SELECT books LIMIT 10</text>
  <line x1="62" y1="124" x2="276" y2="124" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="118" text-anchor="middle" class="focus n mono">author WHERE id = 1</text>
  <line x1="62" y1="156" x2="276" y2="156" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="150" text-anchor="middle" class="focus n mono">author WHERE id = 2</text>
  <line x1="62" y1="188" x2="276" y2="188" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="182" text-anchor="middle" class="focus n mono">author WHERE id = 3</text>
  <text x="170" y="224" text-anchor="middle" class="ink2 t">⋮</text>
  <line x1="62" y1="246" x2="276" y2="246" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="240" text-anchor="middle" class="focus n mono">author WHERE id = 9</text>
  <line x1="62" y1="278" x2="276" y2="278" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="272" text-anchor="middle" class="focus n mono">author WHERE id = 10</text>
  <text x="170" y="330" text-anchor="middle" class="ink t b">1 + 10 = 11 round trips</text>
  <text x="550" y="30" text-anchor="middle" class="ink t b">Eager loading (preload)</text>
  <text x="440" y="58" text-anchor="middle" class="ink t">App</text>
  <text x="660" y="58" text-anchor="middle" class="ink t">Database</text>
  <line x1="440" y1="68" x2="440" y2="300" class="line"/>
  <line x1="660" y1="68" x2="660" y2="300" class="line"/>
  <line x1="442" y1="92" x2="656" y2="92" class="line" marker-end="url(#arrow)"/>
  <text x="550" y="86" text-anchor="middle" class="ink n mono">SELECT books LIMIT 10</text>
  <line x1="442" y1="124" x2="656" y2="124" class="line" marker-end="url(#arrow)"/>
  <text x="550" y="118" text-anchor="middle" class="focus n mono">authors WHERE id IN (1..10)</text>
  <text x="550" y="330" text-anchor="middle" class="ink t b">2 round trips</text>
  <text x="550" y="170" text-anchor="middle" class="ink2 n">the same two queries</text>
  <text x="550" y="188" text-anchor="middle" class="ink2 n">however many books</text>
</svg>
