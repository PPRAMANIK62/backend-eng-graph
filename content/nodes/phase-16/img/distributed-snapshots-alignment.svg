<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="16" y="24" class="ink t b">One moment during alignment of checkpoint n</text>

  <!-- lane labels -->
  <text x="16" y="84" class="ink t">input 1</text>
  <text x="16" y="194" class="ink t">input 2</text>
  <line x1="84" y1="79" x2="506" y2="79" class="line"/>
  <line x1="84" y1="189" x2="506" y2="189" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="66" width="34" height="26" rx="4" class="old"/><text x="317" y="83" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="342" y="66" width="34" height="26" rx="4" class="old"/><text x="359" y="83" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="384" y="66" width="34" height="26" rx="4" class="old"/><text x="401" y="83" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="426" y="66" width="34" height="26" rx="4" class="old"/><text x="443" y="83" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="470" y="58" width="6" height="42" class="ink"/>
  <text x="473" y="52" text-anchor="middle" class="ink n b">barrier n</text>
  <text x="490" y="120" text-anchor="end" class="ink2 n">blocked: these belong to checkpoint n+1 and wait</text>
  <rect x="110" y="176" width="34" height="26" rx="4" class="old"/><text x="127" y="193" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="152" y="176" width="34" height="26" rx="4" class="old"/><text x="169" y="193" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="194" y="176" width="34" height="26" rx="4" class="old"/><text x="211" y="193" text-anchor="middle" class="ink n mono">n+1</text>
  <rect x="236" y="168" width="6" height="42" class="ink"/>
  <text x="239" y="162" text-anchor="middle" class="ink n b">barrier n</text>
  <rect x="300" y="176" width="34" height="26" rx="4" class="focus"/><text x="317" y="193" text-anchor="middle" class="ink n mono">n</text>
  <rect x="342" y="176" width="34" height="26" rx="4" class="focus"/><text x="359" y="193" text-anchor="middle" class="ink n mono">n</text>
  <rect x="384" y="176" width="34" height="26" rx="4" class="focus"/><text x="401" y="193" text-anchor="middle" class="ink n mono">n</text>
  <text x="490" y="230" text-anchor="end" class="ink2 n">still read: these belong to checkpoint n</text>

  <!-- operator -->
  <rect x="510" y="50" width="120" height="170" rx="6" class="box"/>
  <text x="570" y="128" text-anchor="middle" class="ink t b">join or</text>
  <text x="570" y="146" text-anchor="middle" class="ink t b">keyed operator</text>
  <line x1="632" y1="135" x2="700" y2="135" class="line" marker-end="url(#arrow)"/>
  <text x="666" y="124" text-anchor="middle" class="ink2 n">output</text>

  <!-- what happens next -->
  <text x="16" y="276" class="ink t b">When barrier n arrives on input 2 as well</text>
  <text x="16" y="300" class="ink n">1. Send barrier n downstream on the output.</text>
  <text x="16" y="322" class="ink n">2. Snapshot the state: every checkpoint-n record is in it, no n+1 record is.</text>
  <text x="16" y="344" class="ink n">3. Unblock input 1 and carry on, starting with the held-back records.</text>
  <rect x="520" y="290" width="184" height="54" rx="6" class="safe-box"/>
  <text x="612" y="313" text-anchor="middle" class="ink n b">state for checkpoint n</text>
  <text x="612" y="331" text-anchor="middle" class="ink2 n">written in the background</text>
  <line x1="570" y1="222" x2="570" y2="287" class="line" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
</svg>
