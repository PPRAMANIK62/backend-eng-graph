<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="180" y="28" text-anchor="middle" class="ink t b">Container</text>
  <text x="540" y="28" text-anchor="middle" class="ink t b">Virtual machine (KVM)</text>

  <!-- container stack -->
  <rect x="60" y="50" width="240" height="46" rx="6" class="box"/>
  <text x="180" y="78" text-anchor="middle" class="ink t">Untrusted code</text>
  <rect x="60" y="112" width="240" height="40" rx="6" class="box"/>
  <text x="180" y="137" text-anchor="middle" class="ink2 n">seccomp filter (which calls are allowed)</text>
  <rect x="60" y="168" width="240" height="60" rx="6" class="box"/>
  <rect x="60" y="168" width="240" height="60" rx="6" class="focus-s"/>
  <text x="180" y="194" text-anchor="middle" class="ink t b">Host kernel</text>
  <text x="180" y="213" text-anchor="middle" class="ink2 n">shared by every container</text>
  <line x1="180" y1="98" x2="180" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="180" y1="154" x2="180" y2="166" class="line" marker-end="url(#arrow)"/>
  <text x="306" y="108" class="ink2 n">system</text>
  <text x="306" y="123" class="ink2 n">calls</text>
  <text x="180" y="256" text-anchor="middle" class="ink n">The wall: the host kernel's</text>
  <text x="180" y="274" text-anchor="middle" class="ink n">system-call interface</text>

  <!-- vm stack -->
  <rect x="420" y="50" width="240" height="46" rx="6" class="box"/>
  <text x="540" y="78" text-anchor="middle" class="ink t">Untrusted code</text>
  <rect x="420" y="112" width="240" height="46" rx="6" class="box"/>
  <text x="540" y="140" text-anchor="middle" class="ink t">Guest kernel (its own)</text>
  <rect x="420" y="174" width="240" height="56" rx="6" class="box"/>
  <rect x="420" y="174" width="240" height="56" rx="6" class="focus-s"/>
  <text x="540" y="198" text-anchor="middle" class="ink t b">VMM process</text>
  <text x="540" y="217" text-anchor="middle" class="ink2 n">in its own sandbox (the jailer)</text>
  <rect x="420" y="246" width="240" height="40" rx="6" class="box"/>
  <rect x="420" y="246" width="240" height="40" rx="6" class="focus-s"/>
  <text x="540" y="271" text-anchor="middle" class="ink t b">KVM</text>
  <rect x="420" y="302" width="240" height="46" rx="6" class="box"/>
  <text x="540" y="330" text-anchor="middle" class="ink t">Host kernel</text>
  <line x1="540" y1="98" x2="540" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="540" y2="172" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="232" x2="540" y2="244" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="288" x2="540" y2="300" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="372" text-anchor="middle" class="ink n">The wall: hardware virtualization</text>
  <text x="540" y="390" text-anchor="middle" class="ink n">plus a small VMM</text>
</svg>
