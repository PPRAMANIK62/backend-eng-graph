<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- clients -->
  <text x="160" y="24" text-anchor="middle" class="ink t b">Client A</text>
  <text x="560" y="24" text-anchor="middle" class="ink t b">Client B</text>
  <line x1="140" y1="34" x2="140" y2="86" class="line" marker-end="url(#arrow)"/>
  <text x="130" y="60" text-anchor="end" class="ink n mono">1. write x = 1</text>
  <line x1="180" y1="86" x2="180" y2="34" class="line" marker-end="url(#arrow)"/>
  <text x="190" y="60" class="ink n mono">ok</text>
  <line x1="560" y1="34" x2="560" y2="86" class="focus-s" marker-end="url(#arrow)"/>
  <text x="570" y="52" class="ink n mono">2. read x</text>
  <text x="570" y="68" class="ink2 n">starts after A got ok</text>

  <!-- the two sides -->
  <rect x="60" y="90" width="200" height="70" rx="6" class="box"/>
  <text x="160" y="118" text-anchor="middle" class="ink t b">Node in G1</text>
  <text x="160" y="142" text-anchor="middle" class="ink n mono">x = 1</text>
  <rect x="460" y="90" width="200" height="70" rx="6" class="box"/>
  <text x="560" y="118" text-anchor="middle" class="ink t b">Node in G2</text>
  <text x="560" y="142" text-anchor="middle" class="ink n mono">x = 0</text>

  <!-- the partition -->
  <line x1="262" y1="125" x2="458" y2="125" class="line" stroke-dasharray="4 3"/>
  <line x1="348" y1="113" x2="372" y2="137" class="lost-s"/>
  <line x1="372" y1="113" x2="348" y2="137" class="lost-s"/>
  <text x="360" y="164" text-anchor="middle" class="ink n">partition:</text>
  <text x="360" y="180" text-anchor="middle" class="ink n">every message lost</text>

  <!-- the choice -->
  <text x="360" y="228" text-anchor="middle" class="ink t b">What can the node in G2 do with B's read? Only one of two things:</text>
  <rect x="60" y="248" width="290" height="110" rx="6" class="box"/>
  <text x="80" y="274" class="ink t b">Answer now: x = 0</text>
  <text x="80" y="298" class="ink n">B gets a reply, so it stays available.</text>
  <text x="80" y="318" class="ink n">But A's write finished first and B</text>
  <text x="80" y="338" class="ink n">doesn't see it: <tspan class="b">not linearizable</tspan>.</text>
  <rect x="370" y="248" width="290" height="110" rx="6" class="box"/>
  <text x="390" y="274" class="ink t b">Wait for G1, or return an error</text>
  <text x="390" y="298" class="ink n">No wrong answer: stays linearizable.</text>
  <text x="390" y="318" class="ink n">But a working node gave no answer</text>
  <text x="390" y="338" class="ink n">(or only an error): <tspan class="b">not available</tspan>.</text>
</svg>
