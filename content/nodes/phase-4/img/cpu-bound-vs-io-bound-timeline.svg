<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- legend -->
  <rect x="24" y="16" width="18" height="14" rx="3" class="focus"/>
  <text x="50" y="28" class="ink n">on the CPU</text>
  <rect x="150" y="16" width="18" height="14" rx="3" class="box"/>
  <text x="176" y="28" class="ink n">waiting (thread asleep, CPU free)</text>

  <!-- time axis -->
  <line x1="200" y1="214" x2="690" y2="214" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="236" text-anchor="end" class="ink2 n">time for one request</text>

  <!-- CPU-bound -->
  <text x="24" y="82" class="ink t b">CPU-bound</text>
  <text x="24" y="100" class="ink2 n">hash a password</text>
  <rect x="200" y="68" width="440" height="30" rx="6" class="focus"/>
  <text x="420" y="88" text-anchor="middle" class="ink n b">computing the whole time</text>

  <!-- I/O-bound -->
  <text x="24" y="152" class="ink t b">I/O-bound</text>
  <text x="24" y="170" class="ink2 n">look up a user in a database</text>
  <rect x="200" y="138" width="40" height="30" rx="6" class="focus"/>
  <rect x="240" y="138" width="360" height="30" rx="6" class="box"/>
  <text x="420" y="158" text-anchor="middle" class="ink n">waiting for the reply</text>
  <rect x="600" y="138" width="40" height="30" rx="6" class="focus"/>
  <text x="220" y="190" text-anchor="middle" class="ink2 n">send</text>
  <text x="620" y="190" text-anchor="middle" class="ink2 n">parse</text>
</svg>
