<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="150" y="28" text-anchor="middle" class="ink t b">Member Mi</text>
  <text x="380" y="28" text-anchor="middle" class="ink t b">k random members</text>
  <text x="610" y="28" text-anchor="middle" class="ink t b">Member Mj</text>
  <text x="150" y="46" text-anchor="middle" class="ink2 n">the prober</text>
  <text x="380" y="46" text-anchor="middle" class="ink2 n">asked to help</text>
  <text x="610" y="46" text-anchor="middle" class="ink2 n">picked at random</text>
  <line x1="150" y1="58" x2="150" y2="320" class="line"/>
  <line x1="380" y1="58" x2="380" y2="320" class="line"/>
  <line x1="610" y1="58" x2="610" y2="320" class="line"/>
  <path d="M36,76 H28 V312 H36" class="line"/>
  <text x="20" y="194" text-anchor="middle" class="ink2 n" transform="rotate(-90 20 194)">one protocol period</text>
  <line x1="150" y1="80" x2="470" y2="100" class="line"/>
  <path d="M470,92 L484,106 M484,92 L470,106" class="lost-s"/>
  <text x="260" y="80" text-anchor="middle" class="ink n mono">ping</text>
  <text x="494" y="104" class="ink2 n">no ack in time</text>
  <path d="M140,80 H132 V150 H140" class="line"/>
  <text x="126" y="119" text-anchor="end" class="ink2 n">timeout</text>
  <line x1="150" y1="158" x2="377" y2="182" class="line" marker-end="url(#arrow)"/>
  <text x="265" y="160" text-anchor="middle" class="ink n mono">ping-req(Mj)</text>
  <line x1="380" y1="192" x2="607" y2="216" class="line" marker-end="url(#arrow)"/>
  <text x="495" y="194" text-anchor="middle" class="ink n mono">ping</text>
  <line x1="610" y1="228" x2="383" y2="252" class="focus-s" marker-end="url(#arrow)"/>
  <text x="495" y="230" text-anchor="middle" class="focus n mono b">ack</text>
  <line x1="380" y1="262" x2="153" y2="286" class="focus-s" marker-end="url(#arrow)"/>
  <text x="265" y="264" text-anchor="middle" class="focus n mono b">ack (relayed)</text>
  <text x="160" y="306" class="ink n">Mj stays alive in Mi's list</text>
  <text x="360" y="346" text-anchor="middle" class="ink2 n">Membership updates (joins, suspicions, deaths) ride along on every ping, ping-req and ack.</text>
</svg>
