<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="26" class="ink t b">One append, in order (time goes down)</text>
  <text x="450" y="26" class="ink t b">If the power goes out here</text>

  <!-- steps -->
  <rect x="40" y="44" width="360" height="40" rx="6" class="box"/>
  <text x="56" y="69" class="ink t">1  Data block to its final place</text>
  <line x1="40" y1="104" x2="400" y2="104" class="line" stroke-dasharray="5 4"/>
  <text x="408" y="108" class="ink2 n">wait</text>

  <rect x="40" y="124" width="360" height="40" rx="6" class="box"/>
  <text x="56" y="149" class="ink t">2  Journal: TxB, new inode, new bitmap</text>
  <line x1="40" y1="184" x2="400" y2="184" class="line" stroke-dasharray="5 4"/>
  <text x="408" y="188" class="ink2 n">wait</text>

  <rect x="40" y="204" width="360" height="40" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="40" y="204" width="360" height="40" rx="6" class="focus-s"/>
  <text x="56" y="229" class="ink t">3  Journal: commit block (TxE)</text>
  <line x1="40" y1="264" x2="400" y2="264" class="line" stroke-dasharray="5 4"/>
  <text x="408" y="268" class="ink2 n">wait</text>

  <rect x="40" y="284" width="360" height="40" rx="6" class="box"/>
  <text x="56" y="309" class="ink t">4  Checkpoint: inode, bitmap to final places</text>

  <rect x="40" y="344" width="360" height="40" rx="6" class="box"/>
  <text x="56" y="369" class="ink t">5  Free the transaction's journal space</text>

  <!-- crash before commit -->
  <line x1="450" y1="50" x2="450" y2="240" class="lost-s"/>
  <text x="466" y="120" class="ink t">Before the commit is on disk:</text>
  <text x="466" y="140" class="ink2 n">recovery skips the transaction.</text>
  <text x="466" y="156" class="ink2 n">The append is lost, but the</text>
  <text x="466" y="172" class="ink2 n">filesystem is consistent: no inode</text>
  <text x="466" y="188" class="ink2 n">points at an unwritten block.</text>

  <!-- crash after commit -->
  <rect x="449.5" y="252" width="1" height="132" class="safe-box"/>
  <text x="466" y="300" class="ink t">After the commit is on disk:</text>
  <text x="466" y="320" class="ink2 n">recovery replays the inode and</text>
  <text x="466" y="336" class="ink2 n">bitmap to their final places.</text>
  <text x="466" y="352" class="ink2 n">The append survives. Replaying a</text>
  <text x="466" y="368" class="ink2 n">block already written is harmless.</text>
</svg>
