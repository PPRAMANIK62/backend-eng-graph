<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="28" text-anchor="start" class="ink2 n">Internet</text>
  <text x="228" y="28" text-anchor="start" class="ink2 n">Our system</text>
  <line x1="212" y1="14" x2="212" y2="410" class="focus-s" stroke-dasharray="6 5"/>
  <text x="218" y="404" text-anchor="start" class="focus n">trust boundary</text>
  <rect x="20" y="60" width="120" height="50" rx="6" class="box"/>
  <text x="80.0" y="90.0" text-anchor="middle" class="ink t b">Browser</text>
  <rect x="20" y="290" width="120" height="50" rx="6" class="box"/>
  <text x="80.0" y="320.0" text-anchor="middle" class="ink t b">Websites</text>
  <rect x="280" y="60" width="150" height="50" rx="6" class="box"/>
  <text x="355.0" y="90.0" text-anchor="middle" class="ink t b">API server</text>
  <rect x="520" y="45" width="180" height="86" rx="6" class="box"/>
  <text x="610.0" y="67" text-anchor="middle" class="ink t b">Postgres</text>
  <text x="610.0" y="87" text-anchor="middle" class="ink2 n">users, password hashes,</text>
  <text x="610.0" y="103" text-anchor="middle" class="ink2 n">notes</text>
  <rect x="280" y="190" width="150" height="44" rx="6" class="box"/>
  <text x="355.0" y="217.0" text-anchor="middle" class="ink t b">Job queue</text>
  <rect x="280" y="290" width="150" height="50" rx="6" class="box"/>
  <text x="355.0" y="320.0" text-anchor="middle" class="ink t b">Preview worker</text>
  <line x1="140" y1="85" x2="277" y2="85" class="line" marker-end="url(#arrow)"/>
  <text x="146" y="78" text-anchor="start" class="ink2 n">requests</text>
  <line x1="430" y1="85" x2="517" y2="85" class="line" marker-end="url(#arrow)"/>
  <text x="474" y="78" text-anchor="middle" class="ink2 n">SQL</text>
  <line x1="355" y1="110" x2="355" y2="187" class="line" marker-end="url(#arrow)"/>
  <text x="362" y="153" text-anchor="start" class="ink2 n">preview job</text>
  <line x1="355" y1="234" x2="355" y2="287" class="line" marker-end="url(#arrow)"/>
  <line x1="280" y1="315" x2="143" y2="315" class="line" marker-end="url(#arrow)"/>
  <text x="150" y="308" text-anchor="start" class="ink2 n">fetch URL</text>
  <rect x="20" y="124" width="176" height="26" rx="6" class="box"/>
  <text x="30" y="142" class="lost n b">S</text>
  <text x="48" y="142" class="ink n">stolen session cookie</text>
  <rect x="20" y="156" width="176" height="26" rx="6" class="box"/>
  <text x="30" y="174" class="lost n b">I</text>
  <text x="48" y="174" class="ink n">another user's note ID</text>
  <rect x="20" y="188" width="176" height="26" rx="6" class="box"/>
  <text x="30" y="206" class="lost n b">E</text>
  <text x="48" y="206" class="ink n">role claim not checked</text>
  <rect x="470" y="146" width="200" height="26" rx="6" class="box"/>
  <text x="480" y="164" class="lost n b">T</text>
  <text x="498" y="164" class="ink n">SQL injection from a note</text>
  <rect x="470" y="178" width="200" height="26" rx="6" class="box"/>
  <text x="480" y="196" class="lost n b">D</text>
  <text x="498" y="196" class="ink n">login flood</text>
  <rect x="20" y="354" width="176" height="26" rx="6" class="box"/>
  <text x="30" y="372" class="lost n b">I</text>
  <text x="48" y="372" class="ink n">URL to internal address</text>
</svg>
