<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- lanes -->
  <text x="140" y="30" text-anchor="middle" class="ink t b">Client</text>
  <text x="520" y="30" text-anchor="middle" class="ink t b">API</text>
  <line x1="140" y1="42" x2="140" y2="380" class="line"/>
  <line x1="520" y1="42" x2="520" y2="380" class="line"/>

  <!-- start -->
  <line x1="140" y1="66" x2="517" y2="82" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="64" text-anchor="middle" class="ink n mono">POST /reports:export</text>
  <text x="532" y="84" class="ink2 n">validate, record</text>
  <text x="532" y="100" class="ink2 n">operation 81</text>
  <line x1="520" y1="110" x2="143" y2="126" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="140" text-anchor="middle" class="ink n mono b">202 Accepted</text>
  <text x="330" y="156" text-anchor="middle" class="focus n mono">Operation-Location: /operations/81</text>

  <!-- background work -->
  <rect x="514" y="112" width="12" height="190" rx="3" class="focus"/>
  <text x="538" y="200" class="focus t b">export runs</text>
  <text x="538" y="218" class="focus t b">in the background</text>

  <!-- first poll -->
  <line x1="140" y1="186" x2="511" y2="200" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="184" text-anchor="middle" class="ink n mono">GET /operations/81</text>
  <line x1="511" y1="222" x2="143" y2="236" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="252" text-anchor="middle" class="ink n mono">200  {"status": "Running"}</text>
  <text x="330" y="268" text-anchor="middle" class="ink n mono">Retry-After: 5</text>
  <text x="128" y="290" text-anchor="end" class="ink2 n">waits 5 s</text>

  <!-- second poll -->
  <line x1="140" y1="306" x2="517" y2="320" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="304" text-anchor="middle" class="ink n mono">GET /operations/81</text>
  <line x1="520" y1="338" x2="143" y2="352" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="370" text-anchor="middle" class="ink n mono">200  {"status": "Succeeded", "result": ...}</text>
</svg>
