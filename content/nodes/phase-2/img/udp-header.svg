<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- bit ruler -->
  <text x="140" y="36" text-anchor="middle" class="ink2 n mono">bit 0</text>
  <text x="380" y="36" text-anchor="middle" class="ink2 n mono">16</text>
  <text x="620" y="36" text-anchor="middle" class="ink2 n mono">31</text>

  <!-- row labels -->
  <text x="124" y="80" text-anchor="end" class="ink2 n">bytes 0–3</text>
  <text x="124" y="128" text-anchor="end" class="ink2 n">bytes 4–7</text>
  <text x="124" y="176" text-anchor="end" class="ink2 n">bytes 8+</text>

  <!-- row 1 -->
  <rect x="140" y="52" width="240" height="44" class="box"/>
  <rect x="380" y="52" width="240" height="44" class="box"/>
  <text x="260" y="79" text-anchor="middle" class="ink t">Source port</text>
  <text x="500" y="79" text-anchor="middle" class="focus t b">Destination port</text>

  <!-- row 2 -->
  <rect x="140" y="96" width="240" height="44" class="box"/>
  <rect x="380" y="96" width="240" height="44" class="box"/>
  <text x="260" y="123" text-anchor="middle" class="ink t">Length</text>
  <text x="500" y="123" text-anchor="middle" class="ink t">Checksum</text>

  <!-- data -->
  <rect x="140" y="148" width="480" height="44" rx="4" class="line" stroke-dasharray="5 4"/>
  <text x="380" y="175" text-anchor="middle" class="ink2 t">Data (up to the path MTU, ideally)</text>

  <text x="140" y="222" class="ink2 n">Each field is 16 bits. The checksum also covers the IP addresses (the pseudo-header).</text>
</svg>
