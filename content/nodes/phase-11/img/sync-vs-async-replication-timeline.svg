<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="160" y="20" text-anchor="middle" class="ink t b">Asynchronous</text>
  <text x="40" y="54" text-anchor="middle" class="ink t b">Client</text>
  <line x1="40" y1="62" x2="40" y2="262" class="line"/>
  <text x="160" y="54" text-anchor="middle" class="ink t b">Leader</text>
  <line x1="160" y1="62" x2="160" y2="262" class="line"/>
  <text x="280" y="54" text-anchor="middle" class="ink t b">Follower</text>
  <line x1="280" y1="62" x2="280" y2="262" class="line"/>
  <line x1="40" y1="80" x2="157" y2="100" class="line" marker-end="url(#arrow)"/>
  <text x="90" y="82" text-anchor="middle" class="ink n mono">COMMIT</text>
  <text x="168" y="116" text-anchor="start" class="ink2 n">flush log</text>
  <line x1="160" y1="130" x2="43" y2="150" class="focus-s" marker-end="url(#arrow)"/>
  <text x="102" y="133" text-anchor="middle" class="focus n b">OK</text>
  <path d="M153,170 l14,14 M167,170 l-14,14" class="lost-s"/>
  <text x="146" y="176" text-anchor="end" class="lost n b">crash here:</text>
  <text x="146" y="192" text-anchor="end" class="lost n b">order lost</text>
  <line x1="160" y1="212" x2="277" y2="240" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="222" y="210" text-anchor="middle" class="ink2 n">sent later</text>
  <text x="160" y="288" text-anchor="middle" class="ink2 n">OK before any other copy exists</text>
  <line x1="360" y1="10" x2="360" y2="300" class="line" stroke-dasharray="4 4"/>
  <text x="510" y="20" text-anchor="middle" class="ink t b">Synchronous</text>
  <text x="400" y="54" text-anchor="middle" class="ink t b">Client</text>
  <line x1="400" y1="62" x2="400" y2="262" class="line"/>
  <text x="510" y="54" text-anchor="middle" class="ink t b">Leader</text>
  <line x1="510" y1="62" x2="510" y2="262" class="line"/>
  <text x="620" y="54" text-anchor="middle" class="ink t b">Follower</text>
  <line x1="620" y1="62" x2="620" y2="262" class="line"/>
  <line x1="400" y1="80" x2="507" y2="100" class="line" marker-end="url(#arrow)"/>
  <text x="448" y="82" text-anchor="middle" class="ink n mono">COMMIT</text>
  <text x="518" y="116" text-anchor="start" class="ink2 n">flush log</text>
  <line x1="510" y1="130" x2="617" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="568" y="133" text-anchor="middle" class="ink n">change</text>
  <line x1="620" y1="170" x2="513" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="570" y="170" text-anchor="middle" class="ink n">ack</text>
  <line x1="510" y1="215" x2="403" y2="235" class="focus-s" marker-end="url(#arrow)"/>
  <text x="460" y="218" text-anchor="middle" class="focus n b">OK</text>
  <path d="M650,130 H658 V190 H650" class="line"/>
  <text x="664" y="156" text-anchor="start" class="ink2 n">+1 round</text>
  <text x="664" y="172" text-anchor="start" class="ink2 n">trip</text>
  <text x="510" y="288" text-anchor="middle" class="ink2 n">the order is on two machines before OK</text>
</svg>
