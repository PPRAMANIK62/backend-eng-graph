<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="170" y="28" text-anchor="middle" class="ink t b">Before: insert ea</text>
  <text x="540" y="28" text-anchor="middle" class="ink t b">After the split</text>
  <rect x="110" y="50" width="120" height="36" rx="6" class="box"/>
  <text x="170" y="73" text-anchor="middle" class="ink t mono">d   g</text>
  <text x="236" y="73" class="ink2 n">parent</text>
  <rect x="90" y="150" width="160" height="40" rx="6" class="box"/>
  <text x="170" y="175" text-anchor="middle" class="ink t mono">d   e   f</text>
  <text x="258" y="168" class="ink2 n">leaf</text>
  <text x="258" y="184" class="ink2 n">is full</text>
  <line x1="150" y1="86" x2="160" y2="148" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="238" width="60" height="32" rx="6" class="box"/>
  <rect x="40" y="238" width="60" height="32" rx="6" class="focus-s"/>
  <text x="70" y="259" text-anchor="middle" class="focus t mono b">ea</text>
  <path d="M100,244 C130,230 140,215 150,194" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="336" y1="110" x2="398" y2="110" class="line" marker-end="url(#arrow)"/>
  <text x="367" y="100" text-anchor="middle" class="ink2 n">split</text>
  <rect x="460" y="50" width="160" height="36" rx="6" class="box"/>
  <text x="505" y="73" text-anchor="middle" class="ink t mono">d</text>
  <text x="540" y="73" text-anchor="middle" class="focus t mono b">ea</text>
  <text x="575" y="73" text-anchor="middle" class="ink t mono">g</text>
  <text x="626" y="73" class="ink2 n">parent</text>
  <rect x="410" y="150" width="120" height="40" rx="6" class="box"/>
  <text x="470" y="175" text-anchor="middle" class="ink t mono">d   e</text>
  <rect x="560" y="150" width="120" height="40" rx="6" class="box"/>
  <rect x="560" y="150" width="120" height="40" rx="6" class="focus-s"/>
  <text x="620" y="175" text-anchor="middle" class="ink t mono">ea   f</text>
  <line x1="530" y1="170" x2="558" y2="170" class="line" marker-end="url(#arrow)"/>
  <line x1="505" y1="86" x2="475" y2="148" class="line" marker-end="url(#arrow)"/>
  <line x1="545" y1="86" x2="605" y2="148" class="focus-s" marker-end="url(#arrow)"/>
  <text x="470" y="210" text-anchor="middle" class="ink2 n">old leaf</text>
  <text x="620" y="210" text-anchor="middle" class="focus n">new leaf</text>
  <text x="410" y="250" class="ink2 n">The first key of the new leaf is copied</text>
  <text x="410" y="266" class="ink2 n">up into the parent. Three pages changed.</text>

</svg>
