<line x1="416" y1="82" x2="388" y2="142" class="focus-s" marker-end="url(#arrow)"/>
<line x1="416" y1="142" x2="388" y2="82" class="focus-s" marker-end="url(#arrow)"/>
<line x1="416" y1="172" x2="388" y2="112" class="focus-s" marker-end="url(#arrow)"/>
<line x1="416" y1="202" x2="388" y2="142" class="focus-s" marker-end="url(#arrow)"/>
<text x="402" y="238" text-anchor="middle" class="ink2 n">2 probe</text>
<text x="360" y="272" text-anchor="middle" class="ink n">hash one side once,</text>
<text x="360" y="290" text-anchor="middle" class="ink n">stream the other past it</text>
<text x="360" y="312" text-anchor="middle" class="ink2 n">equality only; needs memory</text>
<text x="360" y="328" text-anchor="middle" class="ink2 n">for the smaller side</text>
<text x="540" y="58" text-anchor="middle" class="ink2 n">sorted A</text>
<text x="660" y="58" text-anchor="middle" class="ink2 n">sorted B</text>
