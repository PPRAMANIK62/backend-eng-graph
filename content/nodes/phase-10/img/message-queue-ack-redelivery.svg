<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- lanes -->
  <text x="70" y="28" text-anchor="middle" class="ink t b">Producer</text>
  <text x="300" y="28" text-anchor="middle" class="ink t b">Queue</text>
  <text x="480" y="28" text-anchor="middle" class="ink t b">Worker A</text>
  <text x="650" y="28" text-anchor="middle" class="ink t b">Worker B</text>
  <line x1="70" y1="40" x2="70" y2="400" class="line"/>
  <line x1="300" y1="40" x2="300" y2="400" class="line"/>
  <line x1="480" y1="40" x2="480" y2="190" class="line"/>
  <line x1="650" y1="40" x2="650" y2="400" class="line"/>

  <!-- publish -->
  <line x1="70" y1="62" x2="297" y2="82" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="62" text-anchor="middle" class="ink n mono">send m1</text>
  <text x="290" y="104" text-anchor="end" class="ink2 n">m1 ready</text>

  <!-- deliver to A -->
  <line x1="300" y1="120" x2="477" y2="140" class="line" marker-end="url(#arrow)"/>
  <text x="390" y="118" text-anchor="middle" class="ink n mono">deliver m1</text>
  <text x="290" y="150" text-anchor="end" class="ink2 n">m1 unacked,</text>
  <text x="290" y="166" text-anchor="end" class="ink2 n">hidden from others</text>

  <!-- crash -->
  <line x1="470" y1="182" x2="490" y2="202" class="lost-s"/>
  <line x1="490" y1="182" x2="470" y2="202" class="lost-s"/>
  <text x="502" y="190" class="ink n">crashes</text>
  <text x="502" y="206" class="ink2 n">no ack sent</text>

  <!-- back to ready -->
  <text x="290" y="226" text-anchor="end" class="ink2 n">connection closed</text>
  <text x="290" y="242" text-anchor="end" class="ink2 n">or timeout expires</text>
  <text x="290" y="264" text-anchor="end" class="focus n b">m1 ready again</text>

  <!-- redeliver to B -->
  <line x1="300" y1="280" x2="647" y2="304" class="focus-s" marker-end="url(#arrow)"/>
  <text x="470" y="280" text-anchor="middle" class="focus n mono b">deliver m1 (redelivered)</text>
  <text x="640" y="330" text-anchor="end" class="ink2 n">processes m1</text>

  <!-- ack -->
  <line x1="650" y1="344" x2="303" y2="368" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="344" text-anchor="middle" class="ink n mono">ack m1</text>
  <rect x="160" y="370" width="132" height="28" rx="6" class="safe-box"/>
  <text x="226" y="389" text-anchor="middle" class="ink n b">m1 deleted</text>
</svg>
