  <rect x="60" y="174" width="170" height="32" rx="6" class="line" stroke-dasharray="4 3"/>
  <text x="74" y="195" class="ink2 t">page 3</text>
  <text x="216" y="195" text-anchor="end" class="ink2 n">invalid</text>
  <rect x="60" y="210" width="170" height="32" rx="6" class="line" stroke-dasharray="4 3"/>
  <text x="74" y="231" class="ink2 t">page 4</text>
