<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" class="ink2 n">USER SPACE</text>
  <line x1="20" y1="140" x2="700" y2="140" class="line" style="stroke-dasharray:5 4"/>
  <text x="20" y="160" class="ink2 n">KERNEL</text>
  <rect x="20" y="40" width="160" height="56" rx="6" class="box"/>
  <text x="100.0" y="65.0" text-anchor="middle" class="ink t b">Your program</text>
  <text x="100.0" y="82.0" text-anchor="middle" class="ink2 n">bpftrace, bcc, C</text>
  <rect x="220" y="40" width="160" height="56" rx="6" class="box"/>
  <text x="300.0" y="65.0" text-anchor="middle" class="ink t b">Bytecode</text>
  <text x="300.0" y="82.0" text-anchor="middle" class="ink2 n">compiled by LLVM</text>
  <rect x="500" y="40" width="200" height="56" rx="6" class="box"/>
  <text x="600.0" y="65.0" text-anchor="middle" class="ink t b">The tool</text>
  <text x="600.0" y="82.0" text-anchor="middle" class="ink2 n">reads the map, prints</text>
  <line x1="182" y1="68" x2="218" y2="68" class="line" marker-end="url(#arrow)"/>
  <path d="M300,98 L300,120 L100,120 L100,176" class="line" marker-end="url(#arrow)"/>
  <text x="200" y="114" text-anchor="middle" class="ink n mono">bpf() load</text>
  <rect x="20" y="178" width="160" height="56" rx="6" class="focus-s"/>
  <text x="100.0" y="203.0" text-anchor="middle" class="ink t b">Verifier</text>
  <text x="100.0" y="220.0" text-anchor="middle" class="ink2 n">checks every path</text>
  <rect x="250" y="178" width="140" height="56" rx="6" class="box"/>
  <text x="320.0" y="203.0" text-anchor="middle" class="ink t b">JIT</text>
  <text x="320.0" y="220.0" text-anchor="middle" class="ink2 n">to machine code</text>
  <line x1="182" y1="206" x2="248" y2="206" class="line" marker-end="url(#arrow)"/>
  <text x="215" y="198" text-anchor="middle" class="ink2 n">safe</text>
  <line x1="100" y1="236" x2="100" y2="270" class="lost-s"/>
  <text x="112" y="262" class="ink n">unsafe: load fails,</text>
  <text x="112" y="278" class="ink n">nothing runs</text>
  <rect x="460" y="178" width="110" height="56" rx="6" class="box"/>
  <text x="515.0" y="203.0" text-anchor="middle" class="ink t b">Hook</text>
  <text x="515.0" y="220.0" text-anchor="middle" class="ink2 n">attached</text>
  <line x1="392" y1="206" x2="458" y2="206" class="line" marker-end="url(#arrow)"/>
  <rect x="610" y="178" width="90" height="56" rx="6" class="box"/>
  <text x="655.0" y="203.0" text-anchor="middle" class="ink t b">Map</text>
  <text x="655.0" y="220.0" text-anchor="middle" class="ink2 n">summaries</text>
  <line x1="572" y1="206" x2="608" y2="206" class="line" marker-end="url(#arrow)"/>
  <text x="590" y="170" text-anchor="middle" class="ink2 n">updates</text>
  <line x1="655" y1="176" x2="655" y2="98" class="line" marker-end="url(#arrow)"/>
  <text x="662" y="130" class="ink2 n">reads</text>
  <line x1="515" y1="290" x2="515" y2="238" class="line" marker-end="url(#arrow)"/>
  <text x="515" y="306" text-anchor="middle" class="ink2 n">event fires: syscall, kernel or user function,</text>
  <text x="515" y="322" text-anchor="middle" class="ink2 n">tracepoint, timer tick; the program runs each time</text>
</svg>
