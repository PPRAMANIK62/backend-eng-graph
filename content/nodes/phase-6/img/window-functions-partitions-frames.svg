  <text x="44" y="212" class="ink n mono">develop</text><text x="200" y="212" text-anchor="end" class="ink n mono">4200</text><text x="300" y="212" text-anchor="end" class="focus n mono b">5</text>
  <text x="44" y="244" class="ink n mono">personnel</text><text x="200" y="244" text-anchor="end" class="ink n mono">3900</text><text x="300" y="244" text-anchor="end" class="focus n mono b">1</text>
  <text x="44" y="268" class="ink n mono">personnel</text><text x="200" y="268" text-anchor="end" class="ink n mono">3500</text><text x="300" y="268" text-anchor="end" class="focus n mono b">2</text>
  <text x="44" y="300" class="ink n mono">sales</text><text x="200" y="300" text-anchor="end" class="ink n mono">5000</text><text x="300" y="300" text-anchor="end" class="focus n mono b">1</text>
  <text x="44" y="324" class="ink n mono">sales</text><text x="200" y="324" text-anchor="end" class="ink n mono">4800</text><text x="300" y="324" text-anchor="end" class="focus n mono b">2</text>
  <text x="44" y="348" class="ink n mono">sales</text><text x="200" y="348" text-anchor="end" class="ink n mono">4800</text><text x="300" y="348" text-anchor="end" class="focus n mono b">3</text>
  <text x="380" y="24" class="ink t b">Frames: a running total</text>
  <text x="380" y="44" class="ink2 n mono">sum(salary) OVER (ORDER BY salary)</text>
  <text x="470" y="92" text-anchor="end" class="ink n b">salary</text><text x="570" y="92" text-anchor="end" class="ink n b">sum</text>
