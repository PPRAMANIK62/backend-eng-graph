<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="680" height="190" rx="6" class="line" stroke-dasharray="6 4"/>
  <text x="36" y="44" class="ink2 n">one transaction: both writes commit together, or both roll back</text>

  <text x="40" y="92" class="ink t b">App</text>
  <text x="40" y="110" class="ink2 n">one statement</text>

  <rect x="150" y="66" width="230" height="56" rx="6" class="focus-s"/>
  <text x="166" y="90" class="ink n mono">UPDATE orders</text>
  <text x="166" y="110" class="ink2 n mono">SET amount = 50 WHERE id = 7</text>

  <line x1="380" y1="94" x2="446" y2="94" class="line" marker-end="url(#arrow)"/>
  <text x="413" y="84" text-anchor="middle" class="ink2 n">fires</text>

  <rect x="450" y="66" width="230" height="56" rx="6" class="box"/>
  <text x="466" y="90" class="ink n mono">orders_audit_trg</text>
  <text x="466" y="110" class="ink2 n">AFTER, FOR EACH ROW</text>

  <line x1="565" y1="124" x2="565" y2="146" class="line" marker-end="url(#arrow)"/>
  <rect x="450" y="150" width="230" height="44" rx="6" class="focus-s"/>
  <text x="466" y="177" class="ink n mono">INSERT INTO orders_audit</text>

  <line x1="265" y1="124" x2="265" y2="146" class="line" marker-end="url(#arrow)"/>
  <rect x="150" y="150" width="230" height="44" rx="6" class="box"/>
  <text x="166" y="177" class="ink n">row 7 in orders changed</text>
</svg>
