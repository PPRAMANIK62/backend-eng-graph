  <line x1="572.5" y1="74" x2="572.5" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="618.0" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="636.25" y="97" text-anchor="middle" class="ink2 n mono">APAC</text>
  <line x1="615.0" y1="74" x2="615.0" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="660.5" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="678.75" y="97" text-anchor="middle" class="ink2 n mono">2.2</text>
  <line x1="657.5" y1="74" x2="657.5" y2="110" class="line" stroke-opacity=".35"/>
  <text x="105.0" y="126" text-anchor="middle" class="ink2 n">row 1</text>
  <text x="275.0" y="126" text-anchor="middle" class="ink2 n">row 2</text>
  <text x="445.0" y="126" text-anchor="middle" class="ink2 n">row 3</text>
  <text x="615.0" y="126" text-anchor="middle" class="ink2 n">row 4</text>
  <text x="20" y="150" class="ink n">The page comes off disk whole: 16 values read to use the 8 the query needs.</text>
  <text x="20" y="194" class="ink t b">Column store: each column is stored on its own</text>
  <text x="20" y="231" class="ink n b">id</text>
  <rect x="110" y="208" width="264" height="36" rx="6" class="box"/>
  <text x="143.0" y="231" text-anchor="middle" class="ink2 n mono">1</text>
  <line x1="176" y1="208" x2="176" y2="244" class="line" stroke-opacity=".35"/>
  <text x="209.0" y="231" text-anchor="middle" class="ink2 n mono">2</text>
  <line x1="242" y1="208" x2="242" y2="244" class="line" stroke-opacity=".35"/>
  <text x="275.0" y="231" text-anchor="middle" class="ink2 n mono">3</text>
  <line x1="308" y1="208" x2="308" y2="244" class="line" stroke-opacity=".35"/>
  <text x="341.0" y="231" text-anchor="middle" class="ink2 n mono">4</text>
  <text x="394" y="231" class="ink2 n">not read</text>
  <text x="20" y="275" class="ink n b">product</text>
  <rect x="110" y="252" width="264" height="36" rx="6" class="box"/>
  <text x="143.0" y="275" text-anchor="middle" class="ink2 n mono">mug</text>
  <line x1="176" y1="252" x2="176" y2="288" class="line" stroke-opacity=".35"/>
  <text x="209.0" y="275" text-anchor="middle" class="ink2 n mono">lamp</text>
  <line x1="242" y1="252" x2="242" y2="288" class="line" stroke-opacity=".35"/>
  <text x="275.0" y="275" text-anchor="middle" class="ink2 n mono">desk</text>
  <line x1="308" y1="252" x2="308" y2="288" class="line" stroke-opacity=".35"/>
  <text x="341.0" y="275" text-anchor="middle" class="ink2 n mono">pen</text>
  <text x="394" y="275" class="ink2 n">not read</text>
  <text x="20" y="319" class="ink n b">region</text>
  <rect x="110" y="296" width="264" height="36" rx="6" class="box"/>
  <rect x="113" y="299" width="258" height="30" rx="4" class="focus-box"/>
  <text x="143.0" y="319" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="176" y1="296" x2="176" y2="332" class="line" stroke-opacity=".35"/>
  <text x="209.0" y="319" text-anchor="middle" class="ink2 n mono">US</text>
  <line x1="242" y1="296" x2="242" y2="332" class="line" stroke-opacity=".35"/>
  <text x="275.0" y="319" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="308" y1="296" x2="308" y2="332" class="line" stroke-opacity=".35"/>
  <text x="341.0" y="319" text-anchor="middle" class="ink2 n mono">APAC</text>
  <text x="394" y="319" class="ink n b">read</text>
  <text x="20" y="363" class="ink n b">price</text>
  <rect x="110" y="340" width="264" height="36" rx="6" class="box"/>
  <rect x="113" y="343" width="258" height="30" rx="4" class="focus-box"/>
  <text x="143.0" y="363" text-anchor="middle" class="ink2 n mono">12.5</text>
  <line x1="176" y1="340" x2="176" y2="376" class="line" stroke-opacity=".35"/>
  <text x="209.0" y="363" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="242" y1="340" x2="242" y2="376" class="line" stroke-opacity=".35"/>
  <text x="275.0" y="363" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="308" y1="340" x2="308" y2="376" class="line" stroke-opacity=".35"/>
  <text x="341.0" y="363" text-anchor="middle" class="ink2 n mono">2.2</text>
  <text x="394" y="363" class="ink n b">read</text>
  <text x="20" y="406" class="ink n">Value 1 of every column is row 1, value 2 is row 2, and so on. The position is the row id,</text>
  <text x="20" y="424" class="ink n">so none is stored. Only the region and price columns are read.</text>
</svg>
