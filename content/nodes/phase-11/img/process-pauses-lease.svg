<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="14" y="75" class="ink t b">Client 1</text>
<line x1="150" y1="70" x2="700" y2="70" class="line"/>
<text x="14" y="155" class="ink t b">Lock service</text>
<line x1="150" y1="150" x2="170" y2="150" class="line"/>
<line x1="400" y1="150" x2="420" y2="150" class="line"/>
<line x1="690" y1="150" x2="700" y2="150" class="line"/>
<text x="14" y="235" class="ink t b">Client 2</text>
<line x1="150" y1="230" x2="700" y2="230" class="line"/>
<line x1="150" y1="275" x2="700" y2="275" class="line" marker-end="url(#arrow)"/>
<text x="696" y="266" text-anchor="end" class="ink2 n">time</text>
<rect x="170" y="138" width="230" height="24" rx="6" class="safe-box"/>
<text x="285" y="155" text-anchor="middle" class="ink n">client 1 holds the lease</text>
<line x1="400" y1="126" x2="400" y2="174" class="lost-s" style="stroke-width:2"/>
<text x="404" y="122" class="lost n b">lease expires</text>
<line x1="170" y1="138" x2="170" y2="74" class="line" marker-end="url(#arrow)"/>
<text x="176" y="100" class="ink2 n">granted</text>
<rect x="240" y="60" width="250" height="20" rx="4" class="box"/>
<text x="365" y="75" text-anchor="middle" class="ink n b">paused (GC), doesn't notice</text>
<rect x="420" y="138" width="270" height="24" rx="6" class="safe-box"/>
<text x="555" y="155" text-anchor="middle" class="ink n">client 2 holds the lease</text>
<line x1="420" y1="162" x2="420" y2="226" class="line" marker-end="url(#arrow)"/>
<text x="426" y="200" class="ink2 n">granted</text>
<line x1="470" y1="230" x2="470" y2="255" class="focus-s" marker-end="url(#arrow)"/>
<text x="478" y="252" class="focus n b">writes to storage</text>
<line x1="530" y1="70" x2="530" y2="40" class="lost-s" style="stroke-width:2" marker-end="url(#arrow)"/>
<text x="538" y="46" class="lost n b">wakes up and writes too</text>
<text x="538" y="30" class="ink2 n">thinks it still holds the lease</text>
</svg>