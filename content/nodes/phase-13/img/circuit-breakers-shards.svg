<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="30" y="24" width="170" height="60" rx="6" class="box"/>
  <text x="115" y="50" text-anchor="middle" class="ink t b">Client</text>
  <text x="115" y="70" text-anchor="middle" class="ink2 n">one breaker for the store</text>

  <line x1="202" y1="54" x2="247" y2="54" class="line" marker-end="url(#arrow)"/>

  <rect x="250" y="30" width="440" height="48" rx="6" class="box"/>
  <text x="470" y="59" text-anchor="middle" class="ink t b">Router</text>

  <line x1="318" y1="80" x2="318" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="80" x2="470" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="622" y1="80" x2="622" y2="127" class="line" marker-end="url(#arrow)"/>

  <rect x="250" y="130" width="136" height="60" rx="6" class="box"/>
  <rect x="250" y="130" width="136" height="60" rx="6" class="lost-s"/>
  <text x="318" y="156" text-anchor="middle" class="ink t b">Keys A–H</text>
  <text x="318" y="176" text-anchor="middle" class="ink n">overloaded</text>

  <rect x="402" y="130" width="136" height="60" rx="6" class="safe-box"/>
  <text x="470" y="156" text-anchor="middle" class="ink t b">Keys I–R</text>
  <text x="470" y="176" text-anchor="middle" class="ink n">fine</text>

  <rect x="554" y="130" width="136" height="60" rx="6" class="safe-box"/>
  <text x="622" y="156" text-anchor="middle" class="ink t b">Keys S–Z</text>
  <text x="622" y="176" text-anchor="middle" class="ink n">fine</text>

  <text x="30" y="226" class="ink n"><tspan class="b">Trip the breaker:</tspan> calls for keys I–Z fail too, though their shards are fine.</text>
  <text x="30" y="248" class="ink n"><tspan class="b">Don't trip it:</tspan> the overloaded A–H shard gets no protection at all.</text>
</svg>
