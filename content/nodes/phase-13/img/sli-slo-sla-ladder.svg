<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- axis -->
  <line x1="70" y1="330" x2="70" y2="30" class="line" marker-end="url(#arrow)"/>
  <text x="60" y="44" text-anchor="end" class="ink2 n">higher</text>
  <text x="60" y="330" text-anchor="end" class="ink2 n">lower</text>
  <text x="30" y="190" text-anchor="middle" class="ink2 n" transform="rotate(-90 30 190)">availability</text>

  <!-- SLI -->
  <line x1="80" y1="80" x2="330" y2="80" class="focus-s" stroke-width="3"/>
  <text x="345" y="76" class="ink t b">What you deliver</text>
  <text x="345" y="94" class="ink2 n">measured by the SLI, e.g. share of good requests</text>

  <!-- internal SLO -->
  <line x1="80" y1="150" x2="330" y2="150" class="line" stroke-width="3"/>
  <text x="345" y="146" class="ink t b">Internal SLO</text>
  <text x="345" y="164" class="ink2 n">tighter target your team acts on</text>

  <!-- published SLO -->
  <line x1="80" y1="220" x2="330" y2="220" class="line" stroke-width="3"/>
  <text x="345" y="216" class="ink t b">Published SLO</text>
  <text x="345" y="234" class="ink2 n">what users are told to expect</text>

  <!-- SLA -->
  <line x1="80" y1="290" x2="330" y2="290" class="lost-s"/>
  <text x="345" y="286" class="ink t b">SLA</text>
  <text x="345" y="304" class="ink2 n">contract floor; below it, customers get credits</text>

  <!-- margins -->
  <line x1="200" y1="156" x2="200" y2="214" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="210" y="190" class="ink2 n">margin to fix problems</text>
  <text x="210" y="205" class="ink2 n">before users notice</text>
  <line x1="200" y1="226" x2="200" y2="284" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="210" y="260" class="ink2 n">margin before it costs money</text>

  <!-- overachieving warning -->
  <text x="345" y="30" class="ink2 n">Far above the published SLO for long, and users</text>
  <text x="345" y="45" class="ink2 n">start depending on that instead of the target.</text>
</svg>
