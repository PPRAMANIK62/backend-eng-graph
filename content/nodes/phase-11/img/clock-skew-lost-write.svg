<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- real time: when each write really happened -->
  <text x="40" y="34" class="ink t b">Real time</text>
  <line x1="200" y1="30" x2="690" y2="30" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="84" class="ink t">Server A</text>
  <text x="40" y="100" class="ink2 n">clock right</text>
  <text x="40" y="144" class="ink t">Server B</text>
  <text x="40" y="160" class="ink2 n">clock behind</text>
  <line x1="200" y1="88" x2="690" y2="88" class="line"/>
  <line x1="200" y1="148" x2="690" y2="148" class="line"/>

  <circle cx="330" cy="88" r="6" class="ink"/>
  <text x="330" y="70" text-anchor="middle" class="ink n">writes draft 1</text>
  <circle cx="500" cy="148" r="6" class="focus"/>
  <text x="500" y="130" text-anchor="middle" class="focus n b">writes draft 2 (later)</text>

  <!-- each write gets its server's timestamp -->
  <line x1="330" y1="94" x2="330" y2="224" class="line" style="stroke-dasharray:4 4"/>
  <line x1="500" y1="154" x2="263" y2="224" class="focus-s" style="stroke-dasharray:4 4"/>

  <text x="40" y="234" class="ink t b">Timestamp</text>
  <text x="40" y="250" class="ink2 n">from each server's clock</text>
  <line x1="200" y1="230" x2="690" y2="230" class="line" marker-end="url(#arrow)"/>
  <circle cx="330" cy="230" r="6" class="ink"/>
  <text x="330" y="256" text-anchor="middle" class="ink n">A's stamp</text>
  <circle cx="260" cy="230" r="6" class="focus"/>
  <text x="252" y="256" text-anchor="middle" class="focus n b">B's stamp</text>
  <text x="252" y="272" text-anchor="middle" class="ink2 n">earlier</text>

  <!-- the store's decision -->
  <rect x="200" y="296" width="490" height="56" rx="6" class="box"/>
  <text x="216" y="319" class="ink t">Last write wins keeps the later stamp:</text>
  <text x="216" y="340" class="ink t">draft 1 is kept, and <tspan class="lost b">draft 2 is lost</tspan></text>

</svg>
