<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="190" y="26" text-anchor="middle" class="ink2 n">easier to build on</text>
<text x="650" y="26" text-anchor="middle" class="ink2 n">closer to the worst case</text>
<line x1="250" y1="22" x2="580" y2="22" class="line" marker-end="url(#arrow)"/>
<text x="14" y="86" class="ink t b">Network</text>
<rect x="110" y="44" width="190" height="74" rx="6" class="box"/>
<text x="122" y="68" class="ink t b">Reliable links</text>
<text x="122" y="88" class="ink2 n">every message arrives</text>
<rect x="312" y="44" width="190" height="74" rx="6" class="box"/>
<text x="324" y="68" class="ink t b">Fair-loss links</text>
<text x="324" y="88" class="ink2 n">lost, duplicated, reordered;</text>
<text x="324" y="104" class="ink2 n">retries get through</text>
<rect x="514" y="44" width="190" height="74" rx="6" class="box"/>
<text x="526" y="68" class="ink t b">Arbitrary links</text>
<text x="526" y="88" class="ink2 n">an attacker can read,</text>
<text x="526" y="104" class="ink2 n">change, drop, replay</text>
<text x="14" y="178" class="ink t b">Nodes</text>
<rect x="110" y="136" width="190" height="74" rx="6" class="box"/>
<text x="122" y="160" class="ink t b">Crash-stop</text>
<text x="122" y="180" class="ink2 n">stops, never returns</text>
<rect x="312" y="136" width="190" height="74" rx="6" class="box"/>
<text x="324" y="160" class="ink t b">Crash-recovery</text>
<text x="324" y="180" class="ink2 n">restarts; memory lost,</text>
<text x="324" y="196" class="ink2 n">disk kept</text>
<rect x="514" y="136" width="190" height="74" rx="6" class="box"/>
<text x="526" y="160" class="ink t b">Byzantine</text>
<text x="526" y="180" class="ink2 n">anything, even lying</text>
<text x="14" y="270" class="ink t b">Timing</text>
<rect x="110" y="228" width="190" height="74" rx="6" class="box"/>
<text x="122" y="252" class="ink t b">Synchronous</text>
<text x="122" y="272" class="ink2 n">known bound on delay</text>
<text x="122" y="288" class="ink2 n">and speed</text>
<rect x="312" y="228" width="190" height="74" rx="6" class="box"/>
<text x="324" y="252" class="ink t b">Partially synchronous</text>
<text x="324" y="272" class="ink2 n">bound holds, except for</text>
<text x="324" y="288" class="ink2 n">unknown stretches</text>
<rect x="514" y="228" width="190" height="74" rx="6" class="box"/>
<text x="526" y="252" class="ink t b">Asynchronous</text>
<text x="526" y="272" class="ink2 n">no bound at all</text>
<text x="410" y="334" text-anchor="middle" class="ink n">Pick one per row. The algorithm is correct only if the real system is no worse than what you picked.</text>
</svg>