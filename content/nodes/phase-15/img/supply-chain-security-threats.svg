<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the chain -->
  <rect x="20" y="30" width="150" height="50" rx="6" class="box"/>
  <text x="95" y="60" text-anchor="middle" class="ink t b">Source repo</text>
  <rect x="200" y="30" width="150" height="50" rx="6" class="box"/>
  <text x="275" y="60" text-anchor="middle" class="ink t b">Build</text>
  <rect x="380" y="30" width="150" height="50" rx="6" class="box"/>
  <text x="455" y="60" text-anchor="middle" class="ink t b">Package registry</text>
  <rect x="560" y="30" width="140" height="50" rx="6" class="box"/>
  <text x="630" y="60" text-anchor="middle" class="ink t b">Your service</text>
  <line x1="170" y1="55" x2="197" y2="55" class="line" marker-end="url(#arrow)"/>
  <line x1="350" y1="55" x2="377" y2="55" class="line" marker-end="url(#arrow)"/>
  <line x1="530" y1="55" x2="557" y2="55" class="line" marker-end="url(#arrow)"/>

  <!-- attacks -->
  <text x="20" y="112" class="ink2 n b">Attacks</text>
  <text x="20" y="134" class="lost n">B  malicious commit</text>
  <text x="20" y="152" class="lost n">C  source server hacked</text>
  <text x="200" y="134" class="lost n">D  built from other source</text>
  <text x="200" y="152" class="lost n">E  build platform hacked</text>
  <text x="380" y="134" class="lost n">F  tampered artifact uploaded</text>
  <text x="380" y="152" class="lost n">G  mirror serves a bad copy</text>
  <text x="560" y="134" class="lost n">H  typosquatted name</text>

  <!-- defences -->
  <line x1="20" y1="174" x2="700" y2="174" class="line" stroke-dasharray="4 4"/>
  <text x="20" y="198" class="ink2 n b">Defences</text>
  <rect x="20" y="208" width="150" height="46" rx="6" class="safe-box"/>
  <text x="95" y="228" text-anchor="middle" class="ink n">two-person review,</text>
  <text x="95" y="244" text-anchor="middle" class="ink n">protected repo</text>
  <rect x="200" y="208" width="150" height="46" rx="6" class="safe-box"/>
  <text x="275" y="228" text-anchor="middle" class="ink n">signed provenance</text>
  <text x="275" y="244" text-anchor="middle" class="ink n">(SLSA build levels)</text>
  <rect x="380" y="208" width="150" height="46" rx="6" class="safe-box"/>
  <text x="455" y="228" text-anchor="middle" class="ink n">pinned hashes,</text>
  <text x="455" y="244" text-anchor="middle" class="ink n">checksum log</text>
  <rect x="560" y="208" width="140" height="46" rx="6" class="safe-box"/>
  <text x="630" y="228" text-anchor="middle" class="ink n">SBOM, and a human</text>
  <text x="630" y="244" text-anchor="middle" class="ink n">checking names</text>

  <!-- dependencies -->
  <rect x="200" y="300" width="150" height="50" rx="6" class="box"/>
  <text x="275" y="330" text-anchor="middle" class="ink t b">Dependencies</text>
  <path d="M200,325 H186 V70 H197" class="line" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="370" y="320" class="ink2 n">Each dependency has its own chain,</text>
  <text x="370" y="338" class="ink2 n">with every attack above, recursively.</text>
  <text x="370" y="356" class="ink2 n">It feeds into your build.</text>
</svg>
