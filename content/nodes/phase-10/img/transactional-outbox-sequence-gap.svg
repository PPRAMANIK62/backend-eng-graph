<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="64" class="ink t b">T1</text>
  <text x="20" y="114" class="ink t b">T2</text>
  <text x="20" y="164" class="ink t b">T3</text>
  <text x="20" y="254" class="ink t b">Relay</text>
  <line x1="80" y1="250" x2="700" y2="250" class="line"/>
  <text x="700" y="268" text-anchor="end" class="ink2 n">time →</text>

  <!-- transactions: bar from insert (takes position) to commit -->
  <rect x="90" y="44" width="400" height="28" rx="6" class="box"/>
  <text x="100" y="63" class="ink n mono">INSERT → position 11</text>
  <text x="484" y="63" text-anchor="end" class="ink n b">COMMIT</text>
  <rect x="130" y="94" width="400" height="28" rx="6" class="box"/>
  <text x="140" y="113" class="ink n mono">INSERT → position 12</text>
  <text x="524" y="113" text-anchor="end" class="ink n b">COMMIT</text>
  <rect x="170" y="144" width="150" height="28" rx="6" class="box"/>
  <text x="180" y="163" class="ink n mono">position 13</text>
  <text x="314" y="163" text-anchor="end" class="ink n b">COMMIT</text>

  <!-- poll 1 -->
  <line x1="360" y1="250" x2="360" y2="30" class="focus-s"/>
  <text x="366" y="200" class="focus n b">poll 1: sees only 13</text>
  <text x="366" y="216" class="focus n">sends 13, saves last = 13</text>

  <!-- poll 2 -->
  <line x1="580" y1="250" x2="580" y2="30" class="focus-s"/>
  <text x="586" y="200" class="focus n b">poll 2:</text>
  <text x="586" y="216" class="focus n mono">position &gt; 13</text>
  <text x="586" y="232" class="focus n">finds nothing</text>

  <!-- lost -->
  <text x="80" y="292" class="lost n b">11 and 12 committed after poll 1 and are never sent</text>
</svg>
