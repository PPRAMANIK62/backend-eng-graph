<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="180" y="28" text-anchor="middle" class="ink t b">Client</text>
  <text x="500" y="28" text-anchor="middle" class="ink t b">Server</text>
  <line x1="180" y1="40" x2="180" y2="455" class="line"/>
  <line x1="500" y1="40" x2="500" y2="455" class="line"/>

  <!-- first poll -->
  <line x1="180" y1="60" x2="497" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="62" class="ink n mono">GET /updates?index=41</text>
  <rect x="494" y="90" width="12" height="100" rx="3" class="focus"/>
  <text x="518" y="130" class="ink n">request held open,</text>
  <text x="518" y="146" class="ink n">nothing to send yet</text>
  <text x="518" y="190" class="ink n b">event 42 happens</text>

  <!-- response with event -->
  <line x1="500" y1="196" x2="183" y2="226" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="196" text-anchor="middle" class="ink n mono">200 OK, event 42</text>

  <!-- event during the gap -->
  <text x="518" y="232" class="ink n b">event 43 happens</text>
  <text x="518" y="248" class="ink2 n">no request is waiting:</text>
  <text x="518" y="264" class="ink2 n">43 waits for the next poll</text>

  <!-- immediate re-poll -->
  <text x="168" y="236" text-anchor="end" class="ink2 n">polls again at once</text>
  <line x1="180" y1="240" x2="497" y2="270" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="244" class="ink n mono">GET ?index=42</text>
  <line x1="500" y1="276" x2="183" y2="306" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="276" text-anchor="middle" class="ink n mono">200 OK, event 43</text>

  <!-- quiet period, timeout -->
  <line x1="180" y1="320" x2="497" y2="350" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="324" class="ink n mono">GET ?index=43</text>
  <rect x="494" y="350" width="12" height="60" rx="3" class="focus"/>
  <text x="518" y="376" class="ink n">nothing happens;</text>
  <text x="518" y="392" class="ink n">the wait time runs out</text>
  <line x1="500" y1="412" x2="183" y2="442" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="412" text-anchor="middle" class="ink n mono">200 OK, no change</text>
  <text x="168" y="446" text-anchor="end" class="ink2 n">and polls again</text>
</svg>
