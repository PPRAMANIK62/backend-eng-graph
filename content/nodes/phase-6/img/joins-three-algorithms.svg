<rect x="158" y="160" width="44" height="24" rx="4" class="box"/>
<text x="180.0" y="176" text-anchor="middle" class="ink n mono">5</text>
<rect x="158" y="190" width="44" height="24" rx="4" class="box"/>
<text x="180.0" y="206" text-anchor="middle" class="ink n mono">7</text>
<rect x="158" y="220" width="44" height="24" rx="4" class="box"/>
<text x="180.0" y="236" text-anchor="middle" class="ink n mono">9</text>
<line x1="64" y1="82" x2="154" y2="142" class="focus-s" marker-end="url(#arrow)"/>
