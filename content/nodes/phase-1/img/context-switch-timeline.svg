<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="24" y="56" class="ink t b">Thread A</text>
  <text x="24" y="72" class="ink2 n">user mode</text>
  <text x="24" y="150" class="ink t b">Kernel</text>
  <text x="24" y="166" class="ink2 n">kernel mode</text>
  <text x="24" y="244" class="ink t b">Thread B</text>
  <text x="24" y="260" class="ink2 n">user mode</text>
  <line x1="120" y1="102" x2="700" y2="102" class="line" stroke-dasharray="4 4"/>
  <line x1="120" y1="196" x2="700" y2="196" class="line" stroke-dasharray="4 4"/>

  <!-- A runs -->
  <rect x="120" y="40" width="100" height="44" rx="6" class="box"/>
  <text x="170" y="67" text-anchor="middle" class="ink t">A runs</text>
  <line x1="120" y1="252" x2="600" y2="252" class="line" stroke-dasharray="2 5"/>
  <text x="360" y="244" text-anchor="middle" class="ink2 n">B waits, ready to run</text>

  <!-- kernel steps -->
  <rect x="240" y="124" width="110" height="52" rx="6" class="box"/>
  <text x="295" y="146" text-anchor="middle" class="ink t">Save A's</text>
  <text x="295" y="164" text-anchor="middle" class="ink t">registers</text>
  <rect x="362" y="124" width="110" height="52" rx="6" class="box"/>
  <text x="417" y="146" text-anchor="middle" class="focus t b">Scheduler</text>
  <text x="417" y="164" text-anchor="middle" class="focus t b">picks B</text>
  <rect x="484" y="124" width="110" height="52" rx="6" class="box"/>
  <text x="539" y="146" text-anchor="middle" class="ink t">Restore B's</text>
  <text x="539" y="164" text-anchor="middle" class="ink t">registers</text>
  <line x1="350" y1="150" x2="359" y2="150" class="line" marker-end="url(#arrow)"/>
  <line x1="472" y1="150" x2="481" y2="150" class="line" marker-end="url(#arrow)"/>

  <!-- crossings -->
  <path d="M220,62 H240 V121" class="line" marker-end="url(#arrow)"/>
  <text x="252" y="96" class="ink2 n">timer interrupt</text>
  <path d="M594,150 H620 V233" class="line" marker-end="url(#arrow)"/>
  <text x="612" y="216" text-anchor="end" class="ink2 n">return to user mode</text>

  <!-- B runs -->
  <rect x="604" y="236" width="96" height="44" rx="6" class="box"/>
  <text x="652" y="263" text-anchor="middle" class="ink t">B runs</text>

  <!-- time axis -->
  <line x1="120" y1="310" x2="696" y2="310" class="line" marker-end="url(#arrow)"/>
  <text x="696" y="330" text-anchor="end" class="ink2 n">time</text>
</svg>
