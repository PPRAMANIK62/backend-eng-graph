<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="180" y="30" text-anchor="middle" class="ink t b">Sender</text>
  <text x="540" y="30" text-anchor="middle" class="ink t b">Receiver</text>
  <line x1="180" y1="42" x2="180" y2="335" class="line"/>
  <line x1="540" y1="42" x2="540" y2="335" class="line"/>

  <!-- segments -->
  <line x1="180" y1="60" x2="537" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="64" text-anchor="end" class="ink n mono">seg 1</text>

  <line x1="180" y1="90" x2="356" y2="105" class="lost-s"/>
  <path d="M352,97 L368,113 M368,97 L352,113" class="lost-s"/>
  <text x="168" y="94" text-anchor="end" class="lost n mono b">seg 2 (lost)</text>

  <line x1="180" y1="120" x2="537" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="124" text-anchor="end" class="ink n mono">seg 3</text>

  <line x1="180" y1="150" x2="537" y2="180" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="154" text-anchor="end" class="ink n mono">seg 4</text>

  <line x1="180" y1="180" x2="537" y2="210" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="184" text-anchor="end" class="ink n mono">seg 5</text>

  <!-- ACKs -->
  <line x1="540" y1="95" x2="183" y2="125" class="line" marker-end="url(#arrow)"/>
  <text x="552" y="99" class="ink n mono">ACK 2</text>

  <line x1="540" y1="155" x2="183" y2="185" class="line" marker-end="url(#arrow)"/>
  <text x="552" y="159" class="ink n mono">ACK 2 (duplicate 1)</text>

  <line x1="540" y1="185" x2="183" y2="215" class="line" marker-end="url(#arrow)"/>
  <text x="552" y="189" class="ink n mono">ACK 2 (duplicate 2)</text>

  <line x1="540" y1="215" x2="183" y2="245" class="line" marker-end="url(#arrow)"/>
  <text x="552" y="219" class="ink n mono">ACK 2 (duplicate 3)</text>

  <!-- resend -->
  <text x="168" y="238" text-anchor="end" class="ink2 n">3rd duplicate:</text>
  <line x1="180" y1="250" x2="537" y2="280" class="focus-s" marker-end="url(#arrow)"/>
  <text x="168" y="254" text-anchor="end" class="focus n mono b">seg 2 again</text>

  <line x1="540" y1="285" x2="183" y2="315" class="line" marker-end="url(#arrow)"/>
  <text x="552" y="289" class="ink n mono">ACK 6</text>
  <text x="552" y="305" class="ink2 n">has 1 to 5</text>
</svg>
