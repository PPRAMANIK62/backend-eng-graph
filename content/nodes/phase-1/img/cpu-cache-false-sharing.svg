<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="40" y="30" width="240" height="140" rx="6" class="box"/>
  <text x="56" y="56" class="ink t b">Core 1</text>
  <text x="56" y="76" class="ink2 n">thread A writes <tspan class="mono">a</tspan> over and over</text>
  <text x="56" y="106" class="ink2 n">L1 cache: one 64-byte line</text>
  <rect x="56" y="116" width="13" height="28" class="focus" fill-opacity="0.25"/>
  <text x="62.5" y="135" text-anchor="middle" class="ink n mono b">a</text>
  <line x1="69" y1="116" x2="69" y2="144" class="line" stroke-opacity="0.5"/>
  <rect x="69" y="116" width="13" height="28" class="focus" fill-opacity="0.25"/>
  <text x="75.5" y="135" text-anchor="middle" class="ink n mono b">b</text>
  <line x1="82" y1="116" x2="82" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="95" y1="116" x2="95" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="108" y1="116" x2="108" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="121" y1="116" x2="121" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="134" y1="116" x2="134" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="147" y1="116" x2="147" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="160" y1="116" x2="160" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="173" y1="116" x2="173" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="186" y1="116" x2="186" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="199" y1="116" x2="199" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="212" y1="116" x2="212" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="225" y1="116" x2="225" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="238" y1="116" x2="238" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="251" y1="116" x2="251" y2="144" class="line" stroke-opacity="0.5"/>
  <rect x="56" y="116" width="208" height="28" rx="3" class="line"/>
  <rect x="440" y="30" width="240" height="140" rx="6" class="box"/>
  <text x="456" y="56" class="ink t b">Core 2</text>
  <text x="456" y="76" class="ink2 n">thread B writes <tspan class="mono">b</tspan> over and over</text>
  <text x="456" y="106" class="ink2 n">L1 cache: one 64-byte line</text>
  <rect x="456" y="116" width="13" height="28" class="focus" fill-opacity="0.25"/>
  <text x="462.5" y="135" text-anchor="middle" class="ink n mono b">a</text>
  <line x1="469" y1="116" x2="469" y2="144" class="line" stroke-opacity="0.5"/>
  <rect x="469" y="116" width="13" height="28" class="focus" fill-opacity="0.25"/>
  <text x="475.5" y="135" text-anchor="middle" class="ink n mono b">b</text>
  <line x1="482" y1="116" x2="482" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="495" y1="116" x2="495" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="508" y1="116" x2="508" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="521" y1="116" x2="521" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="534" y1="116" x2="534" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="547" y1="116" x2="547" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="560" y1="116" x2="560" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="573" y1="116" x2="573" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="586" y1="116" x2="586" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="599" y1="116" x2="599" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="612" y1="116" x2="612" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="625" y1="116" x2="625" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="638" y1="116" x2="638" y2="144" class="line" stroke-opacity="0.5"/>
  <line x1="651" y1="116" x2="651" y2="144" class="line" stroke-opacity="0.5"/>
  <rect x="456" y="116" width="208" height="28" rx="3" class="lost-s"/>
  <text x="456" y="162" class="lost n b">invalid copy</text>
  <text x="56" y="162" class="ink2 n">owns the line</text>
  <path d="M 280 110 C 330 90, 390 90, 440 110" class="line" marker-end="url(#arrow)"/>
  <circle cx="360" cy="83" r="11" class="box"/><text x="360" y="88" text-anchor="middle" class="ink n b">1</text>
  <path d="M 440 146 C 390 166, 330 166, 280 146" class="line" marker-end="url(#arrow)"/>
  <circle cx="360" cy="171" r="11" class="box"/><text x="360" y="176" text-anchor="middle" class="ink n b">2</text>
  <circle cx="52" cy="213" r="11" class="box"/><text x="52" y="218" text-anchor="middle" class="ink n b">1</text>
  <text x="74" y="218" class="ink t">A writes a. Core 1 takes ownership of the line (RFO), and core 2's copy is invalidated.</text>
  <circle cx="52" cy="239" r="11" class="box"/><text x="52" y="244" text-anchor="middle" class="ink n b">2</text>
  <text x="74" y="244" class="ink t">B writes b. Core 2 fetches the line back and takes ownership; core 1's copy is invalidated.</text>
  <text x="74" y="270" class="ink2 t">Repeat on every write. The line bounces between the cores, though a and b are never shared.</text>
</svg>
