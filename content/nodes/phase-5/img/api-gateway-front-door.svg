<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="90" y="24" text-anchor="middle" class="ink2 n">Clients</text>
  <text x="360" y="24" text-anchor="middle" class="ink2 n">One public entry point</text>
  <text x="630" y="24" text-anchor="middle" class="ink2 n">Services</text>

  <rect x="20" y="44" width="140" height="40" rx="6" class="box"/>
  <text x="90" y="69" text-anchor="middle" class="ink n b">Web app</text>
  <rect x="20" y="110" width="140" height="40" rx="6" class="box"/>
  <text x="90" y="135" text-anchor="middle" class="ink n b">Mobile app</text>
  <rect x="20" y="176" width="140" height="40" rx="6" class="box"/>
  <text x="90" y="201" text-anchor="middle" class="ink n b">Third-party developer</text>

  <line x1="160" y1="64" x2="247" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="160" y1="130" x2="247" y2="130" class="line" marker-end="url(#arrow)"/>
  <line x1="160" y1="196" x2="247" y2="150" class="line" marker-end="url(#arrow)"/>

  <rect x="250" y="44" width="220" height="172" rx="6" class="box"/>
  <rect x="250" y="44" width="220" height="172" rx="6" class="focus-s"/>
  <text x="360" y="70" text-anchor="middle" class="focus t b">API gateway</text>
  <text x="268" y="100" class="ink n">1  Authenticate the caller</text>
  <text x="268" y="124" class="ink n">2  Apply its rate limit (429)</text>
  <text x="268" y="148" class="ink n">3  Route to one service, or</text>
  <text x="286" y="166" class="ink n">fan out and combine</text>
  <text x="268" y="196" class="ink2 n">+ logging, metrics, versions</text>

  <line x1="470" y1="110" x2="557" y2="64" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="130" x2="557" y2="130" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="150" x2="557" y2="196" class="line" marker-end="url(#arrow)"/>

  <rect x="560" y="44" width="140" height="40" rx="6" class="box"/>
  <text x="630" y="69" text-anchor="middle" class="ink n b">Product info</text>
  <rect x="560" y="110" width="140" height="40" rx="6" class="box"/>
  <text x="630" y="135" text-anchor="middle" class="ink n b">Inventory</text>
  <rect x="560" y="176" width="140" height="40" rx="6" class="box"/>
  <text x="630" y="201" text-anchor="middle" class="ink n b">Order history</text>
</svg>
