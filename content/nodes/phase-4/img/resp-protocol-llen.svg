<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="24" y="28" class="ink t b">Client sends LLEN mylist</text>
  <text x="400" y="28" class="ink2 n">One write: the lines below, back to back</text>

  <rect x="24" y="44" width="150" height="34" rx="6" class="box"/>
  <text x="40" y="66" class="ink t mono"><tspan class="focus b">*</tspan>2\r\n</text>
  <text x="194" y="66" class="ink2 n">array of 2 elements follows</text>

  <rect x="48" y="90" width="126" height="34" rx="6" class="box"/>
  <text x="64" y="112" class="ink t mono"><tspan class="focus b">$</tspan>4\r\n</text>
  <text x="194" y="112" class="ink2 n">bulk string, 4 bytes long</text>

  <rect x="48" y="136" width="126" height="34" rx="6" class="box"/>
  <text x="64" y="158" class="ink t mono">LLEN\r\n</text>
  <text x="194" y="158" class="ink2 n">the 4 bytes, then CRLF (the command name)</text>

  <rect x="48" y="182" width="126" height="34" rx="6" class="box"/>
  <text x="64" y="204" class="ink t mono"><tspan class="focus b">$</tspan>6\r\n</text>
  <text x="194" y="204" class="ink2 n">bulk string, 6 bytes long</text>

  <rect x="48" y="228" width="126" height="34" rx="6" class="box"/>
  <text x="64" y="250" class="ink t mono">mylist\r\n</text>
  <text x="194" y="250" class="ink2 n">the 6 bytes, then CRLF (the argument)</text>

  <text x="24" y="296" class="ink t b">Server replies</text>
  <rect x="140" y="278" width="150" height="34" rx="6" class="box"/>
  <text x="156" y="300" class="ink t mono"><tspan class="focus b">:</tspan>48293\r\n</text>
  <text x="310" y="300" class="ink2 n">integer: the list has 48,293 elements</text>
</svg>
