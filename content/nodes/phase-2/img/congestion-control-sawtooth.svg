<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="300" x2="690" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="80" y1="300" x2="80" y2="40" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="326" text-anchor="end" class="ink2 n">time, in round trips</text>
  <text x="70" y="44" text-anchor="end" class="ink2 n">cwnd</text>

  <!-- ssthresh after the timeout -->
  <line x1="500" y1="230" x2="690" y2="230" class="line" stroke-dasharray="4 4"/>
  <text x="690" y="248" text-anchor="end" class="ink2 n">new ssthresh</text>

  <!-- the congestion window -->
  <path d="M80,290 C150,288 220,270 265,120" class="focus-s" style="stroke-width:2.5"/>
  <path d="M265,120 V210 L400,130 V215 L500,160 V292" class="focus-s" style="stroke-width:2.5"/>
  <path d="M500,292 C530,290 560,270 572,230 L690,196" class="focus-s" style="stroke-width:2.5"/>

  <!-- events -->
  <circle cx="265" cy="120" r="5" class="lost"/>
  <circle cx="400" cy="130" r="5" class="lost"/>
  <circle cx="500" cy="160" r="5" class="lost"/>

  <text x="96" y="150" class="ink t">slow start:</text>
  <text x="96" y="168" class="ink2 n">doubles every</text>
  <text x="96" y="184" class="ink2 n">round trip</text>
  <text x="265" y="88" text-anchor="middle" class="ink n">3 duplicate ACKs:</text>
  <text x="265" y="104" text-anchor="middle" class="ink n b">cut in half</text>
  <text x="400" y="114" text-anchor="middle" class="ink n">loss again: halve</text>
  <text x="330" y="244" text-anchor="middle" class="ink2 n">per round trip</text>
  <text x="330" y="230" text-anchor="middle" class="ink2 n">+1 segment</text>
  <text x="520" y="128" class="ink n b">timeout:</text>
  <text x="520" y="144" class="ink n">back to 1 segment</text>

</svg>
