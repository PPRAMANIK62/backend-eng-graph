<svg xmlns="http://www.w3.org/2000/svg" width="720" height="182" viewBox="0 0 720 182" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- five steps -->
  <rect x="16" y="30" width="126" height="92" rx="6" class="box"/>
  <text x="79" y="56" text-anchor="middle" class="ink t b">1  Generate</text>
  <text x="79" y="80" text-anchor="middle" class="ink2 n">short random</text>
  <text x="79" y="96" text-anchor="middle" class="ink2 n">transactions,</text>
  <text x="79" y="112" text-anchor="middle" class="ink2 n">unique values</text>

  <rect x="156" y="30" width="126" height="92" rx="6" class="box"/>
  <text x="219" y="56" text-anchor="middle" class="ink t b">2  Run</text>
  <text x="219" y="80" text-anchor="middle" class="ink2 n">many clients at</text>
  <text x="219" y="96" text-anchor="middle" class="ink2 n">once, faults</text>
  <text x="219" y="112" text-anchor="middle" class="ink2 n">if you want</text>

  <rect x="296" y="30" width="126" height="92" rx="6" class="box"/>
  <text x="359" y="56" text-anchor="middle" class="ink t b">3  Record</text>
  <text x="359" y="80" text-anchor="middle" class="ink2 n">ops, results,</text>
  <text x="359" y="96" text-anchor="middle" class="ink2 n">ok / failed /</text>
  <text x="359" y="112" text-anchor="middle" class="ink2 n">unknown, times</text>

  <rect x="436" y="30" width="126" height="92" rx="6" class="box"/>
  <text x="499" y="56" text-anchor="middle" class="ink t b">4  Infer</text>
  <text x="499" y="80" text-anchor="middle" class="ink2 n">ww, wr, rw edges;</text>
  <text x="499" y="96" text-anchor="middle" class="ink2 n">process and</text>
  <text x="499" y="112" text-anchor="middle" class="ink2 n">real-time edges</text>

  <rect x="576" y="30" width="126" height="92" rx="6" class="box"/>
  <text x="639" y="56" text-anchor="middle" class="ink t b">5  Search</text>
  <text x="639" y="80" text-anchor="middle" class="ink2 n">find cycles,</text>
  <text x="639" y="96" text-anchor="middle" class="ink2 n">name them,</text>
  <text x="639" y="112" text-anchor="middle" class="ink2 n">explain them</text>

  <line x1="143" y1="76" x2="153" y2="76" class="line" marker-end="url(#arrow)"/>
  <line x1="283" y1="76" x2="293" y2="76" class="line" marker-end="url(#arrow)"/>
  <line x1="423" y1="76" x2="433" y2="76" class="line" marker-end="url(#arrow)"/>
  <line x1="563" y1="76" x2="573" y2="76" class="line" marker-end="url(#arrow)"/>

  <!-- who does what -->
  <path d="M16,138 V146 H282 V138" class="line"/>
  <text x="149" y="166" text-anchor="middle" class="ink n">the test drives the database</text>
  <path d="M296,138 V146 H422 V138" class="focus-s"/>
  <text x="359" y="166" text-anchor="middle" class="focus n b">the history</text>
  <path d="M436,138 V146 H702 V138" class="line"/>
  <text x="569" y="166" text-anchor="middle" class="ink n">the checker, offline</text>
</svg>
