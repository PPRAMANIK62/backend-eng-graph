<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="70" y="30" text-anchor="middle" class="ink t b">Client</text>
  <text x="270" y="30" text-anchor="middle" class="focus t b">S1 (leader)</text>
  <text x="480" y="30" text-anchor="middle" class="ink t b">S2</text>
  <text x="650" y="30" text-anchor="middle" class="ink t b">S3</text>
  <line x1="70" y1="42" x2="70" y2="330" class="line"/>
  <line x1="270" y1="42" x2="270" y2="330" class="line"/>
  <line x1="480" y1="42" x2="480" y2="330" class="line"/>
  <line x1="650" y1="42" x2="650" y2="330" class="line"/>

  <line x1="70" y1="60" x2="267" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="160" y="62" text-anchor="middle" class="ink n mono">GET x</text>
  <text x="262" y="104" text-anchor="end" class="focus n b">readIndex = 42</text>
  <text x="262" y="120" text-anchor="end" class="ink2 n">(its commit index)</text>

  <line x1="270" y1="130" x2="477" y2="160" class="line" marker-end="url(#arrow)"/>
  <line x1="270" y1="130" x2="647" y2="166" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="126" class="ink n">heartbeat round</text>
  <line x1="480" y1="176" x2="273" y2="206" class="line" marker-end="url(#arrow)"/>
  <text x="380" y="210" class="ink n">ack</text>
  <line x1="650" y1="190" x2="273" y2="250" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="236" class="ink2 n">ack, not needed</text>

  <rect x="96" y="214" width="166" height="40" rx="6" class="safe-box"/>
  <text x="179" y="230" text-anchor="middle" class="ink n b">S1 + S2: a majority,</text>
  <text x="179" y="246" text-anchor="middle" class="ink n b">still leader</text>
  <text x="262" y="276" text-anchor="end" class="ink2 n">wait until applied ≥ 42</text>
  <line x1="270" y1="290" x2="73" y2="312" class="line" marker-end="url(#arrow)"/>
  <text x="170" y="326" text-anchor="middle" class="ink n mono">x = 5</text>
  <text x="296" y="300" class="ink2 n">no log entry, no disk write</text>
</svg>
