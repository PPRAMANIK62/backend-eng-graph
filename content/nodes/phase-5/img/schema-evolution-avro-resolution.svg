<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="160" y="24" text-anchor="middle" class="ink t b">Writer's schema</text>
  <text x="160" y="42" text-anchor="middle" class="ink2 n">stored with the data, or looked up by ID</text>
  <text x="560" y="24" text-anchor="middle" class="ink t b">Reader's schema</text>
  <text x="560" y="42" text-anchor="middle" class="ink2 n">the one your code was built with</text>

  <!-- writer fields, in write order -->
  <rect x="40" y="64" width="240" height="36" rx="6" class="box"/>
  <text x="56" y="87" class="ink n mono">id: long</text>
  <rect x="40" y="114" width="240" height="36" rx="6" class="box"/>
  <text x="56" y="137" class="ink n mono">amount: int</text>
  <rect x="40" y="164" width="240" height="36" rx="6" class="box"/>
  <text x="56" y="187" class="ink2 n mono">note: string</text>

  <!-- reader fields, different order -->
  <rect x="440" y="64" width="240" height="36" rx="6" class="box"/>
  <text x="456" y="87" class="ink n mono">amount: long</text>
  <rect x="440" y="114" width="240" height="36" rx="6" class="box"/>
  <text x="456" y="137" class="ink n mono">id: long</text>
  <rect x="440" y="164" width="240" height="36" rx="6" class="safe-box"/>
  <text x="456" y="187" class="ink n mono">coupon: string = ""</text>

  <!-- matched by name -->
  <line x1="280" y1="82" x2="437" y2="130" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="280" y1="132" x2="437" y2="84" class="focus-s" marker-end="url(#arrow)"/>
  <text x="360" y="62" text-anchor="middle" class="focus n">matched by name</text>
  <text x="360" y="160" text-anchor="middle" class="ink2 n">amount: int promoted to long</text>

  <!-- unmatched -->
  <text x="160" y="226" text-anchor="middle" class="ink n b">Only the writer has it</text>
  <text x="160" y="244" text-anchor="middle" class="ink2 n">the reader skips the value</text>
  <text x="560" y="226" text-anchor="middle" class="ink n b">Only the reader has it</text>
  <text x="560" y="244" text-anchor="middle" class="ink2 n">the reader's default is used;</text>
  <text x="560" y="262" text-anchor="middle" class="ink2 n">no default means an error</text>
</svg>
