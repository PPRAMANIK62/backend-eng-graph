<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="180" y="26" text-anchor="middle" class="ink t b">Layer 4 balancer</text>
  <rect x="130" y="42" width="100" height="34" rx="6" class="box"/>
  <text x="180" y="64" text-anchor="middle" class="ink t">Client</text>
  <rect x="70" y="130" width="220" height="96" rx="6" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="ink t b">L4 balancer</text>
  <text x="180" y="172" text-anchor="middle" class="ink n mono">reads: src IP:port, dst IP:port</text>
  <text x="180" y="190" text-anchor="middle" class="ink2 n">payload: TLS bytes, not read</text>
  <text x="180" y="210" text-anchor="middle" class="focus n b">picks once per connection</text>
  <rect x="50" y="300" width="110" height="34" rx="6" class="box"/>
  <text x="105" y="322" text-anchor="middle" class="ink n">Backend A</text>
  <rect x="200" y="300" width="110" height="34" rx="6" class="box"/>
  <text x="255" y="322" text-anchor="middle" class="ink n">Backend B</text>
  <line x1="180" y1="76" x2="180" y2="127" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="160" y1="226" x2="110" y2="297" class="focus-s" marker-end="url(#arrow)"/>
  <text x="190" y="106" class="ink2 n">one TCP connection</text>
  <text x="105" y="356" text-anchor="middle" class="ink2 n">every request</text>
  <text x="105" y="370" text-anchor="middle" class="ink2 n">on this connection</text>
  <text x="255" y="356" text-anchor="middle" class="ink2 n">nothing from</text>
  <text x="255" y="370" text-anchor="middle" class="ink2 n">this client</text>
  <line x1="360" y1="20" x2="360" y2="370" class="line" stroke-dasharray="4 4"/>
  <text x="540" y="26" text-anchor="middle" class="ink t b">Layer 7 proxy</text>
  <rect x="490" y="42" width="100" height="34" rx="6" class="box"/>
  <text x="540" y="64" text-anchor="middle" class="ink t">Client</text>
  <rect x="430" y="130" width="220" height="96" rx="6" class="box"/>
  <text x="540" y="152" text-anchor="middle" class="ink t b">L7 proxy</text>
  <text x="540" y="172" text-anchor="middle" class="ink2 n">ends TCP and TLS</text>
  <text x="540" y="190" text-anchor="middle" class="ink n mono">reads: GET /api, GET /img</text>
  <text x="540" y="210" text-anchor="middle" class="focus n b">picks once per request</text>
  <rect x="410" y="300" width="110" height="34" rx="6" class="box"/>
  <text x="465" y="322" text-anchor="middle" class="ink n">Backend A</text>
  <rect x="560" y="300" width="110" height="34" rx="6" class="box"/>
  <text x="615" y="322" text-anchor="middle" class="ink n">Backend B</text>
  <line x1="540" y1="76" x2="540" y2="127" class="line" marker-end="url(#arrow)"/>
  <text x="550" y="106" class="ink2 n">connection 1 ends here</text>
  <line x1="510" y1="226" x2="470" y2="297" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="570" y1="226" x2="610" y2="297" class="focus-s" marker-end="url(#arrow)"/>
  <text x="465" y="356" text-anchor="middle" class="focus n b">request 1</text>
  <text x="465" y="370" text-anchor="middle" class="ink2 n">own connection</text>
  <text x="615" y="356" text-anchor="middle" class="focus n b">request 2</text>
  <text x="615" y="370" text-anchor="middle" class="ink2 n">own connection</text>
</svg>
