<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="290" y="30" width="140" height="48" rx="6" class="focus-box"/>
  <text x="360.0" y="51.0" text-anchor="middle" class="ink t b">root</text>
  <text x="360.0" y="68.0" text-anchor="middle" class="ink2 n">H(1, N01, N23)</text>
  <rect x="110" y="130" width="160" height="48" rx="6" class="box"/>
  <text x="190.0" y="151.0" text-anchor="middle" class="ink t b">N01</text>
  <text x="190.0" y="168.0" text-anchor="middle" class="ink2 n">H(1, L0, L1)</text>
  <rect x="450" y="130" width="160" height="48" rx="6" class="focus-box"/>
  <text x="530.0" y="151.0" text-anchor="middle" class="ink t b">N23</text>
  <text x="530.0" y="168.0" text-anchor="middle" class="ink2 n">H(1, L2, L3)</text>
  <rect x="40" y="230" width="140" height="48" rx="6" class="box"/>
  <text x="110.0" y="251.0" text-anchor="middle" class="ink t b">L0</text>
  <text x="110.0" y="268.0" text-anchor="middle" class="ink2 n">H(0, d0)</text>
  <rect x="60" y="320" width="100" height="36" rx="6" class="box"/>
  <text x="110.0" y="343.0" text-anchor="middle" class="ink t mono">d0</text>
  <line x1="110" y1="320" x2="110" y2="280" class="line"/>
  <rect x="200" y="230" width="140" height="48" rx="6" class="box"/>
  <text x="270.0" y="251.0" text-anchor="middle" class="ink t b">L1</text>
  <text x="270.0" y="268.0" text-anchor="middle" class="ink2 n">H(0, d1)</text>
  <rect x="220" y="320" width="100" height="36" rx="6" class="box"/>
  <text x="270.0" y="343.0" text-anchor="middle" class="ink t mono">d1</text>
  <line x1="270" y1="320" x2="270" y2="280" class="line"/>
  <rect x="380" y="230" width="140" height="48" rx="6" class="focus-box"/>
  <text x="450.0" y="251.0" text-anchor="middle" class="ink t b">L2</text>
  <text x="450.0" y="268.0" text-anchor="middle" class="ink2 n">H(0, d2)</text>
  <rect x="400" y="320" width="100" height="36" rx="6" class="focus-box"/>
  <text x="450.0" y="343.0" text-anchor="middle" class="ink t mono">d2</text>
  <line x1="450" y1="320" x2="450" y2="280" class="line"/>
  <rect x="540" y="230" width="140" height="48" rx="6" class="box"/>
  <text x="610.0" y="251.0" text-anchor="middle" class="ink t b">L3</text>
  <text x="610.0" y="268.0" text-anchor="middle" class="ink2 n">H(0, d3)</text>
  <rect x="560" y="320" width="100" height="36" rx="6" class="box"/>
  <text x="610.0" y="343.0" text-anchor="middle" class="ink t mono">d3</text>
  <line x1="610" y1="320" x2="610" y2="280" class="line"/>
  <line x1="110" y1="230" x2="170" y2="178" class="line"/>
  <line x1="270" y1="230" x2="210" y2="178" class="line"/>
  <line x1="450" y1="230" x2="510" y2="178" class="line"/>
  <line x1="610" y1="230" x2="550" y2="178" class="line"/>
  <line x1="190" y1="130" x2="310" y2="78" class="line"/>
  <line x1="530" y1="130" x2="410" y2="78" class="line"/>
  <line x1="450" y1="255" x2="450" y2="255" class="line"/>
  <path d="M450 320 L450 280 M450 230 L510 178 M530 130 L410 78" class="focus-s"/>
  <rect x="536" y="226" width="148" height="56" rx="8" class="safe-s" fill="none"/>
  <rect x="106" y="126" width="168" height="56" rx="8" class="safe-s" fill="none"/>
  <text x="610" y="374" text-anchor="middle" class="ink2 n">sent in the proof (L3)</text>
  <text x="100" y="158" text-anchor="end" class="ink2 n">sent in the proof</text>
  <text x="40" y="392" text-anchor="start" class="ink2 n">To prove d2 is in the log, the server sends L3 and N01. You hash d2 to get L2,</text>
  <text x="40" y="410" text-anchor="start" class="ink2 n">combine it with L3 to get N23, then with N01 to get the root, and compare it with the</text>
  <text x="40" y="428" text-anchor="start" class="ink2 n">root you already trust. One hash per level of the tree, never the other entries.</text>

</svg>
