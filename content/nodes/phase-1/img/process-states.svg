<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="100" y="40" width="160" height="56" rx="6" class="box"/>
  <text x="180" y="64" text-anchor="middle" class="ink t b">Running</text>
  <text x="180" y="84" text-anchor="middle" class="ink2 n">on a CPU</text>
  <rect x="460" y="40" width="160" height="56" rx="6" class="box"/>
  <text x="540" y="64" text-anchor="middle" class="ink t b">Ready</text>
  <text x="540" y="84" text-anchor="middle" class="ink2 n">could run, not picked</text>
  <rect x="280" y="210" width="160" height="56" rx="6" class="box"/>
  <text x="360" y="234" text-anchor="middle" class="ink t b">Blocked</text>
  <text x="360" y="254" text-anchor="middle" class="ink2 n">waiting for an event</text>

  <line x1="260" y1="54" x2="457" y2="54" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="44" text-anchor="middle" class="ink2 n">descheduled</text>
  <line x1="460" y1="82" x2="263" y2="82" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="102" text-anchor="middle" class="ink2 n">scheduled</text>

  <line x1="200" y1="96" x2="298" y2="207" class="line" marker-end="url(#arrow)"/>
  <text x="236" y="166" text-anchor="end" class="ink2 n">I/O starts</text>
  <line x1="422" y1="210" x2="520" y2="99" class="line" marker-end="url(#arrow)"/>
  <text x="484" y="166" class="ink2 n">I/O done</text>
</svg>
