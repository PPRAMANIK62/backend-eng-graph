<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- left: what depends on what -->
  <text x="150" y="24" text-anchor="middle" class="ink t b">What depends on what</text>
  <rect x="80" y="44" width="140" height="36" rx="6" class="focus-box"/>
  <text x="150" y="67" text-anchor="middle" class="ink t">A: "lunch?"</text>
  <rect x="10" y="150" width="130" height="36" rx="6" class="box"/>
  <text x="75" y="173" text-anchor="middle" class="ink t">B: "yes"</text>
  <rect x="160" y="150" width="130" height="36" rx="6" class="box"/>
  <text x="225" y="173" text-anchor="middle" class="ink t">C: "no"</text>
  <line x1="130" y1="82" x2="85" y2="147" class="line" marker-end="url(#arrow)"/>
  <line x1="170" y1="82" x2="215" y2="147" class="line" marker-end="url(#arrow)"/>
  <text x="150" y="122" text-anchor="middle" class="ink2 n">both replied</text>
  <text x="150" y="136" text-anchor="middle" class="ink2 n">after reading it</text>
  <text x="150" y="214" text-anchor="middle" class="ink2 n">"yes" and "no" are concurrent:</text>
  <text x="150" y="230" text-anchor="middle" class="ink2 n">neither saw the other</text>

  <!-- right: what a reader may see -->
  <text x="520" y="24" text-anchor="middle" class="ink t b">What a reader may see</text>
  <rect x="340" y="44" width="260" height="36" rx="6" class="safe-box"/>
  <text x="356" y="67" class="ink t mono">lunch?  yes  no</text>
  <text x="612" y="67" class="ink n">allowed</text>
  <rect x="340" y="96" width="260" height="36" rx="6" class="safe-box"/>
  <text x="356" y="119" class="ink t mono">lunch?  no  yes</text>
  <text x="612" y="119" class="ink n">allowed</text>
  <rect x="340" y="148" width="260" height="36" rx="6" class="safe-box"/>
  <text x="356" y="171" class="ink t mono">lunch?  yes</text>
  <text x="612" y="171" class="ink n">allowed (for now)</text>
  <rect x="340" y="200" width="260" height="36" rx="6" class="lost-box"/>
  <text x="356" y="223" class="ink t mono">yes  lunch?  no</text>
  <text x="612" y="223" class="ink n">never</text>
</svg>
