<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- root -->
  <rect x="210" y="20" width="300" height="64" rx="6" class="box"/>
  <text x="360" y="45" text-anchor="middle" class="ink t b mono">/sys/fs/cgroup</text>
  <text x="360" y="68" text-anchor="middle" class="ink2 n mono">cgroup.subtree_control: cpu memory</text>

  <!-- edges -->
  <line x1="300" y1="84" x2="180" y2="128" class="line"/>
  <line x1="420" y1="84" x2="530" y2="128" class="line"/>

  <!-- system.slice -->
  <rect x="40" y="128" width="280" height="64" rx="6" class="box"/>
  <text x="180" y="153" text-anchor="middle" class="ink t b mono">system.slice</text>
  <text x="180" y="176" text-anchor="middle" class="ink2 n">no processes of its own</text>
  <line x1="120" y1="192" x2="100" y2="232" class="line"/>
  <line x1="240" y1="192" x2="260" y2="232" class="line"/>
  <rect x="30" y="232" width="140" height="56" rx="6" class="box"/>
  <text x="100" y="256" text-anchor="middle" class="ink n mono">sshd.service</text>
  <text x="100" y="276" text-anchor="middle" class="ink2 n">its processes</text>
  <rect x="190" y="232" width="140" height="56" rx="6" class="box"/>
  <text x="260" y="256" text-anchor="middle" class="ink n mono">cron.service</text>
  <text x="260" y="276" text-anchor="middle" class="ink2 n">its processes</text>

  <!-- api -->
  <rect x="380" y="128" width="300" height="160" rx="6" class="box"/>
  <rect x="380" y="128" width="300" height="160" rx="6" class="focus-s"/>
  <text x="530" y="153" text-anchor="middle" class="focus t b mono">api</text>
  <text x="400" y="184" class="ink n mono">cpu.max</text><text x="510" y="184" class="ink n mono">200000 100000</text>
  <text x="400" y="206" class="ink n mono">memory.max</text><text x="510" y="206" class="ink n mono">1G</text>
  <text x="400" y="228" class="ink n mono">cgroup.procs</text><text x="510" y="228" class="ink n">the API server's PIDs</text>
  <text x="400" y="262" class="ink2 n">files for cpu and memory appear here</text>
  <text x="400" y="278" class="ink2 n">because the parent enabled them</text>
</svg>
