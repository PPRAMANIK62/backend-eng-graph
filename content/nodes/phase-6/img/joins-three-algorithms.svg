<line x1="64" y1="162" x2="154" y2="202" class="focus-s" marker-end="url(#arrow)"/>
<text x="120" y="272" text-anchor="middle" class="ink n">for each outer row,</text>
<text x="120" y="290" text-anchor="middle" class="ink n">look up matches in inner</text>
<text x="120" y="312" text-anchor="middle" class="ink2 n">any condition; fast with</text>
<text x="120" y="328" text-anchor="middle" class="ink2 n">few outer rows + an index</text>
<text x="290" y="58" text-anchor="middle" class="ink2 n">smaller</text>
<rect x="268" y="70" width="44" height="24" rx="4" class="box"/>
<text x="290.0" y="86" text-anchor="middle" class="ink n mono">3</text>
