  <text x="575.0" y="185" text-anchor="middle" class="ink n">page 2</text>
  <text x="670" y="185" class="ink2 n mono">6</text>
  <line x1="490" y1="172" x2="660" y2="172" class="line" stroke-opacity="0.45"/>
  <text x="670" y="203" class="ink2 n mono">7</text>
  <line x1="490" y1="190" x2="660" y2="190" class="line" stroke-opacity="0.45"/>
  <text x="670" y="221" class="ink2 n mono">8</text>
  <line x1="490" y1="208" x2="660" y2="208" class="line" stroke-opacity="0.45"/>
  <rect x="490" y="226" width="170" height="18" class="focus" fill-opacity="0.22"/>
