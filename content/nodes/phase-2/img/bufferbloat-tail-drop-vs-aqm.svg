<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="30" class="ink t b">Tail drop</text>
  <rect x="40" y="50" width="90" height="44" rx="6" class="box"/>
  <text x="85" y="77" text-anchor="middle" class="ink t">Sender</text>
  <line x1="132" y1="72" x2="156" y2="72" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="48" width="340" height="48" rx="6" class="box"/>
  <rect x="168" y="58" width="18" height="28" rx="2" class="focus"/>
  <rect x="193" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="218" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="243" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="268" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="293" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="318" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="343" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="368" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="393" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="418" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="443" y="58" width="18" height="28" rx="2" class="old"/>
  <rect x="468" y="58" width="18" height="28" rx="2" class="old"/>
  <line x1="502" y1="72" x2="536" y2="72" class="line" marker-end="url(#arrow)"/>
  <rect x="540" y="50" width="140" height="44" rx="6" class="box"/>
  <text x="610" y="77" text-anchor="middle" class="ink t">Slow link</text>
  <text x="40" y="120" class="ink2 n">The buffer stays full of the bulk upload (grey). A new small request (blue) waits behind all of it.</text>
  <text x="40" y="136" class="ink2 n">TCP only hears about it when the buffer overflows and drops a packet.</text>
  <text x="40" y="180" class="ink t b">Active queue management (CoDel, FQ-CoDel, PIE)</text>
  <rect x="40" y="200" width="90" height="44" rx="6" class="box"/>
  <text x="85" y="227" text-anchor="middle" class="ink t">Sender</text>
  <line x1="132" y1="222" x2="156" y2="222" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="198" width="340" height="48" rx="6" class="box"/>
  <rect x="401" y="208" width="18" height="28" rx="2" class="lost"/>
  <rect x="426" y="208" width="18" height="28" rx="2" class="focus"/>
  <rect x="451" y="208" width="18" height="28" rx="2" class="old"/>
  <rect x="476" y="208" width="18" height="28" rx="2" class="old"/>
  <line x1="502" y1="222" x2="536" y2="222" class="line" marker-end="url(#arrow)"/>
  <rect x="540" y="200" width="140" height="44" rx="6" class="box"/>
  <text x="610" y="227" text-anchor="middle" class="ink t">Slow link</text>
  <text x="40" y="270" class="ink2 n">One packet is dropped as soon as packets have waited too long. The sender slows down,</text>
  <text x="40" y="286" class="ink2 n">the queue stays short, and the small request goes almost straight through.</text>
  <text x="390" y="227" text-anchor="end" class="lost n b">dropped early</text>
</svg>
