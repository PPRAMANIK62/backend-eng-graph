<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">Series for </text><text x="104" y="24" class="ink t mono">node_filesystem_avail</text>
  <rect x="20" y="48" width="230" height="56" rx="6" class="box"/>
  <text x="34" y="72" class="ink t b">one node</text>
  <text x="34" y="92" class="ink2 n">one series per mounted filesystem</text>
  <line x1="252" y1="76" x2="316" y2="76" class="line" marker-end="url(#arrow)"/>
  <rect x="320" y="48" width="380" height="56" rx="6" class="box"/>
  <text x="334" y="72" class="ink t b">tens of series</text>
  <rect x="20" y="132" width="230" height="56" rx="6" class="box"/>
  <text x="34" y="156" class="ink t b">× 10,000 nodes</text>
  <text x="34" y="176" class="ink2 n">same labels, more machines</text>
  <line x1="252" y1="160" x2="316" y2="160" class="line" marker-end="url(#arrow)"/>
  <rect x="320" y="132" width="380" height="56" rx="6" class="safe-box"/>
  <text x="334" y="156" class="ink t b">about 100,000 series</text>
  <text x="334" y="176" class="ink2 n">fine for Prometheus</text>
  <rect x="20" y="216" width="230" height="56" rx="6" class="box"/>
  <text x="34" y="240" class="ink t b">× 10,000 users</text>
  <text x="34" y="260" class="ink2 n">add a per-user quota label</text>
  <line x1="252" y1="244" x2="316" y2="244" class="line" marker-end="url(#arrow)"/>
  <rect x="320" y="216" width="380" height="56" rx="6" class="box"/>
  <rect x="320" y="216" width="380" height="56" rx="6" class="lost-s"/>
  <text x="334" y="240" class="ink t b">tens of millions of series</text>
  <text x="334" y="260" class="lost n">too many for Prometheus</text>
  <text x="20" y="296" class="ink2 n">Each step multiplies the one before it. The label with the most distinct values dominates.</text>
</svg>
