<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
<text x="120" y="30" text-anchor="middle" class="ink t b">Minority side</text>
<text x="520" y="30" text-anchor="middle" class="ink t b">Majority side</text>
  <rect x="30" y="60" width="180" height="92" rx="6" class="box"/>
  <text x="44" y="84" class="ink2 n">Box 1</text>
  <text x="44" y="110" class="ink t b">M1: old primary</text>
  <text x="44" y="134" class="ink2 n">Sentinel S1</text>
  <rect x="340" y="60" width="180" height="92" rx="6" class="safe-box"/>
  <text x="354" y="84" class="ink2 n">Box 2</text>
  <text x="354" y="110" class="ink t b">R2: new primary</text>
  <text x="354" y="134" class="ink2 n">Sentinel S2</text>
  <rect x="530" y="60" width="180" height="92" rx="6" class="box"/>
  <text x="544" y="84" class="ink2 n">Box 3</text>
  <text x="544" y="110" class="ink t b">R3: replica</text>
  <text x="544" y="134" class="ink2 n">Sentinel S3</text>
  <line x1="270" y1="44" x2="270" y2="300" class="lost-s" stroke-dasharray="8 6"/>
  <text x="270" y="318" text-anchor="middle" class="lost n b">network partition</text>
  <rect x="30" y="210" width="180" height="44" rx="6" class="box"/>
  <text x="120" y="237" text-anchor="middle" class="ink t b">Client C1</text>
  <line x1="120" y1="208" x2="120" y2="156" class="focus-s" marker-end="url(#arrow)"/>
  <text x="130" y="186" class="focus n b">keeps writing to M1</text>
  <text x="430" y="186" class="ink n">S2 and S3 are a majority:</text>
  <text x="430" y="204" class="ink n">they authorize a failover</text>
  <text x="430" y="222" class="ink n">and promote R2</text>
  <rect x="30" y="340" width="660" height="48" rx="6" class="box"/>
  <text x="46" y="360" class="ink n b">When the partition heals, M1 is made a replica of R2 and drops its data.</text>
  <text x="46" y="378" class="lost n b">Everything C1 wrote to M1 during the partition is lost.</text>

</svg>
