<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="140" y="26" text-anchor="middle" class="ink t b">Alice (client)</text>
  <text x="580" y="26" text-anchor="middle" class="ink t b">Bob (server)</text>
  <text x="360" y="26" text-anchor="middle" class="ink2 n">the network: anyone can read</text>

  <rect x="30" y="40" width="220" height="56" rx="6" class="box"/>
  <text x="46" y="64" class="ink t b">private key a</text>
  <text x="46" y="84" class="ink2 n">32 random bytes, kept secret</text>
  <rect x="470" y="40" width="220" height="56" rx="6" class="box"/>
  <text x="486" y="64" class="ink t b">private key b</text>
  <text x="486" y="84" class="ink2 n">32 random bytes, kept secret</text>

  <line x1="250" y1="136" x2="467" y2="136" class="line" marker-end="url(#arrow)"/>
  <text x="358" y="128" text-anchor="middle" class="ink n mono">A = X25519(a, 9)</text>
  <line x1="470" y1="176" x2="253" y2="176" class="line" marker-end="url(#arrow)"/>
  <text x="362" y="168" text-anchor="middle" class="ink n mono">B = X25519(b, 9)</text>
  <text x="360" y="204" text-anchor="middle" class="ink2 n">an eavesdropper sees A and B</text>

  <rect x="30" y="226" width="220" height="56" rx="6" class="safe-box"/>
  <text x="46" y="250" class="ink n mono">X25519(a, B) = K</text>
  <text x="46" y="270" class="ink2 n">own private key + Bob's public</text>
  <rect x="470" y="226" width="220" height="56" rx="6" class="safe-box"/>
  <text x="486" y="250" class="ink n mono">X25519(b, A) = K</text>
  <text x="486" y="270" class="ink2 n">own private key + Alice's public</text>
  <text x="360" y="250" text-anchor="middle" class="ink n b">same K</text>
  <text x="360" y="270" text-anchor="middle" class="lost n">eavesdropper can't get K</text>

  <line x1="140" y1="284" x2="140" y2="323" class="line" marker-end="url(#arrow)"/>
  <line x1="580" y1="284" x2="580" y2="323" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="326" width="220" height="56" rx="6" class="box"/>
  <rect x="30" y="326" width="220" height="56" rx="6" class="focus-s"/>
  <text x="46" y="350" class="focus t b">key derivation</text>
  <text x="46" y="370" class="ink2 n">symmetric keys for the data</text>
  <rect x="470" y="326" width="220" height="56" rx="6" class="box"/>
  <rect x="470" y="326" width="220" height="56" rx="6" class="focus-s"/>
  <text x="486" y="350" class="focus t b">key derivation</text>
  <text x="486" y="370" class="ink2 n">symmetric keys for the data</text>

</svg>
