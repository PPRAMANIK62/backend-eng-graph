<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="440" y="44" width="264" height="196" rx="6" class="safe-box" style="stroke-dasharray:6 4"/>
  <text x="572" y="34" text-anchor="middle" class="ink n b">one transaction: both writes, or neither</text>
  <rect x="16" y="110" width="170" height="60" rx="6" class="box"/>
  <text x="101" y="134" text-anchor="middle" class="ink t mono">payments, p0</text>
  <text x="101" y="156" text-anchor="middle" class="ink2 n">offset 43: A</text>
  <rect x="236" y="110" width="160" height="60" rx="6" class="box"/>
  <rect x="236" y="110" width="160" height="60" rx="6" class="focus-s"/>
  <text x="316" y="134" text-anchor="middle" class="ink t b">fraud checker</text>
  <text x="316" y="156" text-anchor="middle" class="ink2 n mono">B = check(A)</text>
  <line x1="186" y1="140" x2="233" y2="140" class="line" marker-end="url(#arrow)"/>
  <text x="210" y="130" text-anchor="middle" class="ink2 n">read</text>
  <rect x="460" y="64" width="224" height="60" rx="6" class="box"/>
  <text x="572" y="88" text-anchor="middle" class="ink t mono">payment-checks</text>
  <text x="572" y="110" text-anchor="middle" class="ink2 n">write B</text>
  <rect x="460" y="160" width="224" height="60" rx="6" class="box"/>
  <text x="572" y="184" text-anchor="middle" class="ink t">offsets topic</text>
  <text x="572" y="206" text-anchor="middle" class="ink2 n">group checker, p0: next is 44</text>
  <line x1="396" y1="128" x2="457" y2="98" class="line" marker-end="url(#arrow)"/>
  <line x1="396" y1="152" x2="457" y2="186" class="line" marker-end="url(#arrow)"/>
  <rect x="236" y="284" width="160" height="52" rx="6" class="box"/>
  <text x="316" y="308" text-anchor="middle" class="ink t">transaction</text>
  <text x="316" y="326" text-anchor="middle" class="ink t">coordinator</text>
  <line x1="316" y1="170" x2="316" y2="281" class="line" marker-end="url(#arrow)"/>
  <text x="324" y="232" text-anchor="start" class="ink2 n">1. commit</text>
  <path d="M396,310 H572 V243" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="302" text-anchor="start" class="ink2 n">2. writes commit markers</text>

</svg>
