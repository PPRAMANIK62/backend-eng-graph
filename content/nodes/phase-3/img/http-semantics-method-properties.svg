<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="20" y="16" width="680" height="236" rx="6" class="line"/>
  <text x="32" y="36" class="ink2 n">All methods</text>
  <rect x="40" y="48" width="420" height="188" rx="6" class="safe-box"/>
  <text x="56" y="72" class="ink t b">Idempotent: same effect if repeated</text>
  <text x="56" y="98" xml:space="preserve" class="ink t mono">PUT   DELETE</text>
  <rect x="56" y="114" width="388" height="106" rx="6" class="box"/>
  <text x="72" y="140" class="ink t b">Safe: read-only by intent</text>
  <text x="72" y="168" xml:space="preserve" class="ink t mono">GET   HEAD   OPTIONS   TRACE</text>
  <text x="72" y="200" class="ink2 n">crawlers and prefetchers may send these freely</text>
  <text x="496" y="72" class="ink t b">Neither</text>
  <text x="496" y="98" xml:space="preserve" class="ink t mono">POST   PATCH   CONNECT</text>
  <text x="496" y="126" class="ink2 n">a repeat may do the work twice</text>
  <text x="20" y="280" class="ink2 n">A client may resend an idempotent request after a connection failure, and so may a proxy.</text>
  <text x="20" y="298" class="ink2 n">A proxy must never resend the others on its own; a client should not.</text>
</svg>
