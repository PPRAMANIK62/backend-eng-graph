<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="24" class="ink2 n b">What happens</text>
  <text x="410" y="24" text-anchor="middle" class="ink2 n b">Page in RAM</text>
  <text x="600" y="24" text-anchor="middle" class="ink2 n b">On disk</text>
  <line x1="20" y1="40" x2="20" y2="400" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="63" class="ink t">1  <tspan class="mono">write()</tspan></text>
  <rect x="330" y="42" width="160" height="36" rx="6" class="focus-s"/>
  <text x="410" y="65" text-anchor="middle" class="ink n">new data, dirty</text>
  <rect x="520" y="42" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="65" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="108" class="ink t">2  Write-back to the drive fails</text>
  <text x="40" y="126" class="lost n">I/O error</text>
  <rect x="330" y="94" width="160" height="36" rx="6" class="focus-s"/>
  <text x="410" y="117" text-anchor="middle" class="ink n">new data, dirty</text>
  <rect x="520" y="94" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="117" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="160" class="ink t">3  Kernel marks the page clean</text>
  <text x="40" y="178" class="ink2 n">the new data is still only in RAM</text>
  <rect x="330" y="146" width="160" height="36" rx="6" class="focus-s"/>
  <text x="410" y="169" text-anchor="middle" class="ink n">new data, clean</text>
  <rect x="520" y="146" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="169" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="212" class="ink t">4  <tspan class="mono">fsync()</tspan></text>
  <text x="40" y="230" class="lost n">returns EIO</text>
  <rect x="330" y="198" width="160" height="36" rx="6" class="focus-s"/>
  <text x="410" y="221" text-anchor="middle" class="ink n">new data, clean</text>
  <rect x="520" y="198" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="221" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="264" class="ink t">5  <tspan class="mono">fsync()</tspan> again</text>
  <text x="40" y="282" class="lost n">returns 0: nothing dirty, no new error</text>
  <rect x="330" y="250" width="160" height="36" rx="6" class="focus-s"/>
  <text x="410" y="273" text-anchor="middle" class="ink n">new data, clean</text>
  <rect x="520" y="250" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="273" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="316" class="ink t">6  Page evicted</text>
  <text x="40" y="334" class="ink2 n">any time, under memory pressure</text>
  <rect x="330" y="302" width="160" height="36" rx="6" class="line" stroke-dasharray="4 4"/>
  <text x="410" y="325" text-anchor="middle" class="ink n">not cached</text>
  <rect x="520" y="302" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="325" text-anchor="middle" class="ink n">old data</text>
  <text x="40" y="368" class="ink t">7  <tspan class="mono">read()</tspan></text>
  <text x="40" y="386" class="lost n">returns the old data</text>
  <rect x="330" y="354" width="160" height="36" rx="6" class="old"/>
  <text x="410" y="377" text-anchor="middle" class="ink n">old data</text>
  <rect x="520" y="354" width="160" height="36" rx="6" class="old"/>
  <text x="600" y="377" text-anchor="middle" class="ink n">old data</text>
</svg>
