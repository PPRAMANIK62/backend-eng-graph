<svg xmlns="http://www.w3.org/2000/svg" width="720" height="362" viewBox="0 0 720 362" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- concatenation -->
  <text x="20" y="28" class="ink t b">Concatenation</text>
  <rect x="20" y="42" width="430" height="44" rx="6" class="box"/>
  <text x="32" y="69" class="ink n mono">... WHERE owner = '<tspan class="lost b">x' OR '1'='1</tspan>'</text>
  <text x="32" y="104" class="ink2 n">one string: your SQL and the user's input, joined</text>
  <line x1="452" y1="64" x2="507" y2="64" class="line" marker-end="url(#arrow)"/>
  <rect x="510" y="42" width="190" height="44" rx="6" class="box"/>
  <text x="605" y="61" text-anchor="middle" class="ink n b">SQL parser</text>
  <text x="605" y="77" text-anchor="middle" class="lost n b">OR '1'='1' runs as code</text>
  <text x="605" y="104" text-anchor="middle" class="ink2 n">returns every account</text>

  <!-- parameters -->
  <text x="20" y="152" class="ink t b">Parameters</text>
  <rect x="20" y="166" width="430" height="44" rx="6" class="box"/>
  <text x="32" y="193" class="ink n mono">... WHERE owner = $1</text>
  <text x="300" y="193" class="ink2 n">SQL text, fixed</text>
  <line x1="452" y1="188" x2="507" y2="188" class="line" marker-end="url(#arrow)"/>
  <rect x="510" y="166" width="190" height="44" rx="6" class="box"/>
  <text x="605" y="193" text-anchor="middle" class="ink n b">SQL parser</text>

  <line x1="605" y1="212" x2="605" y2="237" class="line" marker-end="url(#arrow)"/>
  <rect x="510" y="240" width="190" height="44" rx="6" class="box"/>
  <text x="605" y="259" text-anchor="middle" class="ink n b">Execution</text>
  <text x="605" y="275" text-anchor="middle" class="ink2 n">compares owner with $1</text>

  <rect x="20" y="240" width="430" height="44" rx="6" class="box"/>
  <text x="32" y="267" class="focus n mono b">$1 = "x' OR '1'='1"</text>
  <text x="300" y="267" class="ink2 n">value, sent apart</text>
  <line x1="452" y1="262" x2="507" y2="262" class="focus-s" marker-end="url(#arrow)"/>
  <text x="32" y="302" class="ink2 n">the value skips the parser: it is only ever data</text>

  <rect x="510" y="304" width="190" height="44" rx="6" class="safe-box"/>
  <text x="605" y="323" text-anchor="middle" class="ink n b">no owner has that name</text>
  <text x="605" y="339" text-anchor="middle" class="ink2 n">zero rows</text>
  <line x1="605" y1="286" x2="605" y2="301" class="line" marker-end="url(#arrow)"/>
</svg>
