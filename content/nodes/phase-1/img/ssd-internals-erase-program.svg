<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="26" class="ink t b">Operation</text>
  <text x="200" y="26" class="ink t b">One erase block, four pages</text>
  <text x="238" y="50" text-anchor="middle" class="ink2 n">page 0</text>
  <text x="322" y="50" text-anchor="middle" class="ink2 n">page 1</text>
  <text x="406" y="50" text-anchor="middle" class="ink2 n">page 2</text>
  <text x="490" y="50" text-anchor="middle" class="ink2 n">page 3</text>
  <text x="40" y="85" class="ink t mono">Erase()</text>
  <rect x="200" y="62" width="76" height="36" rx="6" class="box"/>
  <text x="238" y="85" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="284" y="62" width="76" height="36" rx="6" class="box"/>
  <text x="322" y="85" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="368" y="62" width="76" height="36" rx="6" class="box"/>
  <text x="406" y="85" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="452" y="62" width="76" height="36" rx="6" class="box"/>
  <text x="490" y="85" text-anchor="middle" class="ink2 n">erased</text>
  <text x="552" y="77" class="ink2 n">Every page in the</text>
  <text x="552" y="93" class="ink2 n">block is erased</text>
  <text x="40" y="141" class="ink t mono">Program(0)</text>
  <rect x="200" y="118" width="76" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="200" y="118" width="76" height="36" rx="6" class="focus-s"/>
  <text x="238" y="141" text-anchor="middle" class="ink t">data</text>
  <rect x="284" y="118" width="76" height="36" rx="6" class="box"/>
  <text x="322" y="141" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="368" y="118" width="76" height="36" rx="6" class="box"/>
  <text x="406" y="141" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="452" y="118" width="76" height="36" rx="6" class="box"/>
  <text x="490" y="141" text-anchor="middle" class="ink2 n">erased</text>
  <text x="552" y="141" class="ink2 n">Page 0 now holds data</text>
  <text x="40" y="197" class="ink t mono">Program(0)</text>
  <rect x="200" y="174" width="76" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="200" y="174" width="76" height="36" rx="6" class="lost-s"/>
  <text x="238" y="197" text-anchor="middle" class="ink t">data</text>
  <rect x="284" y="174" width="76" height="36" rx="6" class="box"/>
  <text x="322" y="197" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="368" y="174" width="76" height="36" rx="6" class="box"/>
  <text x="406" y="197" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="452" y="174" width="76" height="36" rx="6" class="box"/>
  <text x="490" y="197" text-anchor="middle" class="ink2 n">erased</text>
  <text x="552" y="189" class="ink n">Refused: page 0 must</text>
  <text x="552" y="205" class="ink n">be erased first</text>
  <text x="40" y="213" class="ink2 n">again</text>
  <text x="40" y="253" class="ink t mono">Program(1)</text>
  <rect x="200" y="230" width="76" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="200" y="230" width="76" height="36" rx="6" class="focus-s"/>
  <text x="238" y="253" text-anchor="middle" class="ink t">data</text>
  <rect x="284" y="230" width="76" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="284" y="230" width="76" height="36" rx="6" class="focus-s"/>
  <text x="322" y="253" text-anchor="middle" class="ink t">data</text>
  <rect x="368" y="230" width="76" height="36" rx="6" class="box"/>
  <text x="406" y="253" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="452" y="230" width="76" height="36" rx="6" class="box"/>
  <text x="490" y="253" text-anchor="middle" class="ink2 n">erased</text>
  <text x="552" y="253" class="ink2 n">Page 1 now holds data</text>
  <text x="40" y="309" class="ink t mono">Erase()</text>
  <rect x="200" y="286" width="76" height="36" rx="6" class="box"/>
  <text x="238" y="309" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="284" y="286" width="76" height="36" rx="6" class="box"/>
  <text x="322" y="309" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="368" y="286" width="76" height="36" rx="6" class="box"/>
  <text x="406" y="309" text-anchor="middle" class="ink2 n">erased</text>
  <rect x="452" y="286" width="76" height="36" rx="6" class="box"/>
  <text x="490" y="309" text-anchor="middle" class="ink2 n">erased</text>
  <text x="552" y="301" class="ink2 n">Wipes pages 0 and 1</text>
  <text x="552" y="317" class="ink2 n">too: the whole block</text>
</svg>
