<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
    .old-f{fill:#b8b7b2;stroke:#8a8984;stroke-width:1.5}
    @media (prefers-color-scheme: dark){ .old-f{fill:#5c5b57} }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="26" class="ink t b">Snowflake ID: 64 bits</text>
  <text x="680" y="26" text-anchor="end" class="ink2 n">10 px = 1 bit</text>
  <rect x="40" y="46" width="10" height="34" class="old-f"/>
  <line x1="45.0" y1="80" x2="45.0" y2="90" class="line"/>
  <text x="45.0" y="104" text-anchor="middle" class="ink2 n">unused</text>
  <rect x="50" y="46" width="410" height="34" class="box"/>
  <text x="255.0" y="67.0" text-anchor="middle" class="focus n b">41 bits: milliseconds since a custom epoch</text>
  <rect x="50" y="46" width="410" height="34" class="focus-s"/>
  <rect x="460" y="46" width="50" height="34" class="box"/>
  <text x="485.0" y="67.0" text-anchor="middle" class="ink n">5</text>
  <line x1="485.0" y1="80" x2="485.0" y2="90" class="line"/>
  <text x="485.0" y="104" text-anchor="middle" class="ink2 n">datacenter</text>
  <rect x="510" y="46" width="50" height="34" class="box"/>
  <text x="535.0" y="67.0" text-anchor="middle" class="ink n">5</text>
  <line x1="535.0" y1="80" x2="535.0" y2="90" class="line"/>
  <text x="535.0" y="104" text-anchor="middle" class="ink2 n"></text>
  <text x="535.0" y="118" text-anchor="middle" class="ink2 n">worker</text>
  <rect x="560" y="46" width="120" height="34" class="box"/>
  <text x="620.0" y="67.0" text-anchor="middle" class="ink n">12: sequence</text>
  <line x1="620.0" y1="80" x2="620.0" y2="90" class="line"/>
  <text x="620.0" y="104" text-anchor="middle" class="ink2 n">restarts each ms</text>
  <text x="40" y="156" class="ink t b">UUIDv7: 128 bits</text>
  <text x="680" y="156" text-anchor="end" class="ink2 n">5 px = 1 bit</text>
  <rect x="40" y="176" width="240" height="34" class="box"/>
  <text x="160.0" y="197.0" text-anchor="middle" class="focus n b">48 bits: Unix milliseconds</text>
  <rect x="40" y="176" width="240" height="34" class="focus-s"/>
  <rect x="280" y="176" width="20" height="34" class="box"/>
  <line x1="290.0" y1="210" x2="290.0" y2="220" class="line"/>
  <text x="290.0" y="234" text-anchor="middle" class="ink2 n">ver</text>
  <rect x="300" y="176" width="60" height="34" class="box"/>
  <text x="330.0" y="197.0" text-anchor="middle" class="ink n">12 rand</text>
  <rect x="360" y="176" width="10" height="34" class="box"/>
  <line x1="365.0" y1="210" x2="365.0" y2="220" class="line"/>
  <text x="365.0" y="234" text-anchor="middle" class="ink2 n"></text>
  <text x="365.0" y="248" text-anchor="middle" class="ink2 n">var</text>
  <rect x="370" y="176" width="310" height="34" class="box"/>
  <text x="525.0" y="197.0" text-anchor="middle" class="ink n">62 random bits</text>
  <text x="40" y="282" class="ink2 n">In both, time comes first, so sorting the numbers sorts the IDs by when they were made.</text>
</svg>
