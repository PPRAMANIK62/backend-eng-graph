  <line x1="490" y1="100" x2="660" y2="100" class="line" stroke-opacity="0.45"/>
  <rect x="490" y="118" width="170" height="18" class="focus" fill-opacity="0.22"/>
  <text x="575.0" y="131" text-anchor="middle" class="ink n">page 0</text>
  <text x="670" y="131" class="ink2 n mono">3</text>
  <line x1="490" y1="118" x2="660" y2="118" class="line" stroke-opacity="0.45"/>
  <text x="670" y="149" class="ink2 n mono">4</text>
