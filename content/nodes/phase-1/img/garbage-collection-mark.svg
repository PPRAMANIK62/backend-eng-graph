<svg xmlns="http://www.w3.org/2000/svg" width="720" height="474" viewBox="0 0 720 474" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="30" y="28" class="ink t b">Roots</text>
  <text x="270" y="28" class="ink t b">Heap objects</text>
  <rect x="30" y="60" width="140" height="40" rx="6" class="box"/>
  <text x="100" y="85" text-anchor="middle" class="ink n">stack variable</text>
  <rect x="30" y="210" width="140" height="40" rx="6" class="box"/>
  <text x="100" y="235" text-anchor="middle" class="ink n">global variable</text>
  <rect x="270" y="60" width="80" height="40" rx="6" class="focus" fill-opacity="0.22"/>
  <rect x="270" y="60" width="80" height="40" rx="6" class="focus-s"/>
  <text x="310.0" y="85" text-anchor="middle" class="ink t b">A</text>
  <rect x="430" y="40" width="80" height="40" rx="6" class="focus" fill-opacity="0.22"/>
  <rect x="430" y="40" width="80" height="40" rx="6" class="focus-s"/>
  <text x="470.0" y="65" text-anchor="middle" class="ink t b">B</text>
  <rect x="430" y="140" width="80" height="40" rx="6" class="focus" fill-opacity="0.22"/>
  <rect x="430" y="140" width="80" height="40" rx="6" class="focus-s"/>
  <text x="470.0" y="165" text-anchor="middle" class="ink t b">C</text>
  <rect x="270" y="210" width="80" height="40" rx="6" class="focus" fill-opacity="0.22"/>
  <rect x="270" y="210" width="80" height="40" rx="6" class="focus-s"/>
  <text x="310.0" y="235" text-anchor="middle" class="ink t b">D</text>
  <rect x="590" y="120" width="80" height="40" rx="6" class="focus" fill-opacity="0.22"/>
  <rect x="590" y="120" width="80" height="40" rx="6" class="focus-s"/>
  <text x="630.0" y="145" text-anchor="middle" class="ink t b">E</text>
  <rect x="430" y="260" width="80" height="40" rx="6" class="old"/>
  <text x="470.0" y="285" text-anchor="middle" class="ink t b">F</text>
  <rect x="590" y="260" width="80" height="40" rx="6" class="old"/>
  <text x="630.0" y="285" text-anchor="middle" class="ink t b">G</text>
  <rect x="590" y="340" width="80" height="40" rx="6" class="old"/>
  <text x="630.0" y="365" text-anchor="middle" class="ink t b">H</text>
  <line x1="170" y1="80" x2="267" y2="80" class="line" marker-end="url(#arrow)"/>
  <line x1="170" y1="230" x2="267" y2="230" class="line" marker-end="url(#arrow)"/>
  <line x1="350" y1="80.0" x2="427" y2="60.0" class="line" marker-end="url(#arrow)"/>
  <line x1="350" y1="80.0" x2="427" y2="160.0" class="line" marker-end="url(#arrow)"/>
  <line x1="350" y1="230.0" x2="427" y2="160.0" class="line" marker-end="url(#arrow)"/>
  <line x1="510" y1="160.0" x2="587" y2="140.0" class="line" marker-end="url(#arrow)"/>
  <line x1="510" y1="280.0" x2="587" y2="280.0" class="line" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="300" x2="630.0" y2="337" class="line" marker-end="url(#arrow)"/>
  <path d="M 590 360 C 500 360, 470 345, 470 303" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="410" width="28" height="18" rx="4" class="focus" fill-opacity="0.22"/><rect x="30" y="410" width="28" height="18" rx="4" class="focus-s"/>
  <text x="68" y="424" class="ink n">marked: reachable from a root, kept</text>
  <rect x="340" y="410" width="28" height="18" rx="4" class="old"/>
  <text x="378" y="424" class="ink n">not reached: garbage, freed by the sweep</text>
  <text x="30" y="458" class="ink2 n">F, G and H point at each other, but nothing live points at them, so they are still garbage.</text>
</svg>
