<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="24" class="ink t b">A Postgres page (8 kB by default)</text>
  <rect x="40" y="130" width="640" height="70" rx="6" class="box"/>
  <rect x="40" y="130" width="112" height="70" rx="6" class="box"/>
  <text x="96" y="162" text-anchor="middle" class="ink t b">header</text>
  <text x="96" y="180" text-anchor="middle" class="ink2 n">24 bytes</text>
  <rect x="160" y="148" width="38" height="34" rx="6" class="box"/>
  <rect x="160" y="148" width="38" height="34" rx="6" class="focus-s"/>
  <text x="179" y="170" text-anchor="middle" class="focus t b">1</text>
  <rect x="204" y="148" width="38" height="34" rx="6" class="box"/>
  <rect x="204" y="148" width="38" height="34" rx="6" class="focus-s"/>
  <text x="223" y="170" text-anchor="middle" class="focus t b">2</text>
  <rect x="248" y="148" width="38" height="34" rx="6" class="box"/>
  <rect x="248" y="148" width="38" height="34" rx="6" class="focus-s"/>
  <text x="267" y="170" text-anchor="middle" class="focus t b">3</text>
  <text x="346" y="162" text-anchor="middle" class="ink2 t">free space</text>
  <text x="346" y="180" text-anchor="middle" class="ink2 n"></text>
  <rect x="420" y="140" width="64" height="50" rx="6" class="box"/>
  <text x="452.0" y="170" text-anchor="middle" class="ink t">row 3</text>
  <rect x="490" y="140" width="70" height="50" rx="6" class="box"/>
  <text x="525.0" y="170" text-anchor="middle" class="ink t">row 2</text>
  <rect x="566" y="140" width="68" height="50" rx="6" class="box"/>
  <text x="600.0" y="170" text-anchor="middle" class="ink t">row 1</text>
  <rect x="640" y="130" width="40" height="70" rx="6" class="box"/>
  <text x="660" y="218" text-anchor="middle" class="ink2 n">special</text>
  <text x="660" y="233" text-anchor="middle" class="ink2 n">space</text>
  <path d="M179,148 C179,112 603,112 603,138" class="focus-s" marker-end="url(#arrow)"/>
  <path d="M223,148 C223,90 525,90 525,138" class="focus-s" marker-end="url(#arrow)"/>
  <path d="M267,148 C267,68 452,68 452,138" class="focus-s" marker-end="url(#arrow)"/>
  <text x="40" y="56" class="ink2 n">Each item identifier (4 bytes: offset and length) points to its row.</text>
  <text x="40" y="72" class="ink2 n">Indexes point at (page, item number), so rows can move inside the page.</text>
  <line x1="290" y1="244" x2="290" y2="204" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="260" text-anchor="middle" class="ink n mono">pd_lower</text>
  <line x1="414" y1="244" x2="414" y2="204" class="line" marker-end="url(#arrow)"/>
  <text x="414" y="260" text-anchor="middle" class="ink n mono">pd_upper</text>
  <line x1="160" y1="222" x2="268" y2="222" class="line" marker-end="url(#arrow)"/>
  <text x="160" y="238" class="ink2 n">identifiers grow</text>
  <line x1="560" y1="222" x2="436" y2="222" class="line" marker-end="url(#arrow)"/>
  <text x="560" y="238" text-anchor="end" class="ink2 n">rows grow</text>
  <text x="40" y="284" class="ink2 n">Header fields include</text>
  <text x="40" y="300" class="ink n mono">pd_lsn  pd_checksum  pd_lower  pd_upper</text>
  <text x="40" y="320" class="ink2 n">The page is full when identifiers and rows meet.</text>

</svg>
