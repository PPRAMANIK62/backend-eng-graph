<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="96" y="22" text-anchor="middle" class="ink t b">Request lost</text>
<text x="96" y="40" text-anchor="middle" class="ink2 n">never arrived</text>
<text x="38" y="66" text-anchor="middle" class="ink n b">client</text>
<text x="136" y="66" text-anchor="middle" class="ink n b">server</text>
<line x1="38" y1="74" x2="38" y2="300" class="line"/>
<line x1="136" y1="74" x2="136" y2="300" class="line"/>
<line x1="16" y1="262" x2="60" y2="262" class="lost-s"/>
<text x="44" y="254" class="lost n b">timeout</text>
<line x1="38" y1="92" x2="98" y2="112" class="focus-s"/>
<text x="100" y="118" class="lost t b">✕</text>
<text x="40" y="88" class="focus n mono b">charge</text>
<text x="274" y="22" text-anchor="middle" class="ink t b">Server crashed</text>
<text x="274" y="40" text-anchor="middle" class="ink2 n">before doing the work</text>
<text x="216" y="66" text-anchor="middle" class="ink n b">client</text>
<text x="314" y="66" text-anchor="middle" class="ink n b">server</text>
<line x1="216" y1="74" x2="216" y2="300" class="line"/>
<line x1="314" y1="74" x2="314" y2="150" class="line"/>
<line x1="194" y1="262" x2="238" y2="262" class="lost-s"/>
<text x="222" y="254" class="lost n b">timeout</text>
<line x1="216" y1="92" x2="311" y2="130" class="focus-s" marker-end="url(#arrow)"/>
<text x="218" y="88" class="focus n mono b">charge</text>
<text x="307" y="160" class="lost t b">✕</text>
<text x="314" y="180" text-anchor="middle" class="ink2 n">crash</text>
<text x="452" y="22" text-anchor="middle" class="ink t b">Reply lost</text>
<text x="452" y="40" text-anchor="middle" class="ink2 n">after doing the work</text>
<text x="394" y="66" text-anchor="middle" class="ink n b">client</text>
<text x="492" y="66" text-anchor="middle" class="ink n b">server</text>
<line x1="394" y1="74" x2="394" y2="300" class="line"/>
<line x1="492" y1="74" x2="492" y2="300" class="line"/>
<line x1="372" y1="262" x2="416" y2="262" class="lost-s"/>
<text x="400" y="254" class="lost n b">timeout</text>
<line x1="394" y1="92" x2="489" y2="130" class="focus-s" marker-end="url(#arrow)"/>
<text x="396" y="88" class="focus n mono b">charge</text>
<rect x="454" y="138" width="76" height="26" rx="6" class="safe-box"/>
<text x="492" y="156" text-anchor="middle" class="ink n">card charged</text>
<line x1="492" y1="176" x2="432" y2="198" class="focus-s"/>
<text x="414" y="206" class="lost t b">✕</text>
<text x="488" y="194" text-anchor="end" class="focus n mono b">ok</text>
<text x="630" y="22" text-anchor="middle" class="ink t b">Server paused</text>
<text x="630" y="40" text-anchor="middle" class="ink2 n">reply comes too late</text>
<text x="572" y="66" text-anchor="middle" class="ink n b">client</text>
<text x="670" y="66" text-anchor="middle" class="ink n b">server</text>
<line x1="572" y1="74" x2="572" y2="300" class="line"/>
<line x1="670" y1="74" x2="670" y2="300" class="line"/>
<line x1="550" y1="262" x2="594" y2="262" class="lost-s"/>
<text x="578" y="254" class="lost n b">timeout</text>
<line x1="572" y1="92" x2="667" y2="130" class="focus-s" marker-end="url(#arrow)"/>
<text x="574" y="88" class="focus n mono b">charge</text>
<rect x="632" y="138" width="76" height="26" rx="6" class="safe-box"/>
<text x="670" y="156" text-anchor="middle" class="ink n">card charged</text>
<rect x="665" y="172" width="10" height="96" rx="2" class="box"/>
<text x="680" y="224" class="ink2 n">GC</text>
<line x1="670" y1="274" x2="575" y2="296" class="focus-s" marker-end="url(#arrow)"/>
<text x="666" y="270" text-anchor="end" class="focus n mono b">ok</text>
<text x="360" y="336" text-anchor="middle" class="ink t">From the client's side all four look the same: no reply before the timeout.</text>
<text x="360" y="354" text-anchor="middle" class="ink2 n">Only in the last two did the charge happen.</text>
</svg>