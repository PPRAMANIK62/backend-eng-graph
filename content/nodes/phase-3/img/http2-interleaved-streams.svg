<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="30" class="ink t b">Client to server</text>
  <rect x="40" y="42" width="86" height="46" rx="6" class="box"/>
  <text x="83" y="62" text-anchor="middle" class="ink n b">HEADERS</text>
  <text x="83" y="79" text-anchor="middle" class="ink n">stream 1</text>
  <rect x="132" y="42" width="86" height="46" rx="6" class="box"/>
  <text x="175" y="62" text-anchor="middle" class="focus n b">HEADERS</text>
  <text x="175" y="79" text-anchor="middle" class="focus n">stream 3</text>
  <rect x="224" y="42" width="86" height="46" rx="6" class="box"/>
  <text x="267" y="62" text-anchor="middle" class="ink n b">HEADERS</text>
  <text x="267" y="79" text-anchor="middle" class="ink n">stream 5</text>
  <text x="330" y="70" class="ink2 n">three requests sent back to back, END_STREAM on each</text>
  <text x="40" y="130" class="ink t b">Server to client</text>
  <rect x="40" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="83" y="162" text-anchor="middle" class="focus n b">HEADERS</text>
  <text x="83" y="179" text-anchor="middle" class="focus n">stream 3</text>
  <rect x="132" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="175" y="162" text-anchor="middle" class="ink n b">HEADERS</text>
  <text x="175" y="179" text-anchor="middle" class="ink n">stream 1</text>
  <rect x="224" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="267" y="162" text-anchor="middle" class="focus n b">DATA</text>
  <text x="267" y="179" text-anchor="middle" class="focus n">stream 3</text>
  <text x="267" y="206" text-anchor="middle" class="ink2 n">END_STREAM</text>
  <rect x="316" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="359" y="162" text-anchor="middle" class="ink n b">DATA</text>
  <text x="359" y="179" text-anchor="middle" class="ink n">stream 1</text>
  <rect x="408" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="451" y="162" text-anchor="middle" class="ink n b">HEADERS</text>
  <text x="451" y="179" text-anchor="middle" class="ink n">stream 5</text>
  <rect x="500" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="543" y="162" text-anchor="middle" class="ink n b">DATA</text>
  <text x="543" y="179" text-anchor="middle" class="ink n">stream 5</text>
  <text x="543" y="206" text-anchor="middle" class="ink2 n">END_STREAM</text>
  <rect x="592" y="142" width="86" height="46" rx="6" class="box"/>
  <text x="635" y="162" text-anchor="middle" class="ink n b">DATA</text>
  <text x="635" y="179" text-anchor="middle" class="ink n">stream 1</text>
  <text x="635" y="206" text-anchor="middle" class="ink2 n">END_STREAM</text>
  <text x="267" y="228" text-anchor="middle" class="focus n b">stream 3 done first</text>
  <line x1="40" y1="252" x2="680" y2="252" class="line" marker-end="url(#arrow)"/>
  <text x="680" y="272" text-anchor="end" class="ink2 n">time, one TCP connection</text>
</svg>
