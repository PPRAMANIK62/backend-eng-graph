<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<rect x="20" y="60" width="140" height="60" rx="6" class="box"/>
<rect x="20" y="60" width="140" height="60" rx="6" class="focus-s"/>
<text x="90" y="85" text-anchor="middle" class="focus n b">Response built at</text>
<text x="90" y="103" text-anchor="middle" class="focus n">the current version</text>
<rect x="200" y="60" width="140" height="60" rx="6" class="box"/>
<text x="270" y="85" text-anchor="middle" class="ink n b">Change module:</text>
<text x="270" y="103" text-anchor="middle" class="ink n">undo newest change</text>
<rect x="380" y="60" width="140" height="60" rx="6" class="box"/>
<text x="450" y="85" text-anchor="middle" class="ink n b">Change module:</text>
<text x="450" y="103" text-anchor="middle" class="ink n">undo the one before</text>
<rect x="560" y="60" width="140" height="60" rx="6" class="box"/>
<text x="630" y="85" text-anchor="middle" class="ink n b">Response in the</text>
<text x="630" y="103" text-anchor="middle" class="ink n">client’s version</text>
<line x1="162" y1="90" x2="198" y2="90" class="line" marker-end="url(#arrow)"/>
<line x1="342" y1="90" x2="378" y2="90" class="line" marker-end="url(#arrow)"/>
<line x1="522" y1="90" x2="558" y2="90" class="line" marker-end="url(#arrow)"/>
<text x="20" y="24" class="ink2 n">newer</text><text x="700" y="24" text-anchor="end" class="ink2 n">older</text>
<line x1="24" y1="36" x2="700" y2="36" class="line" marker-end="url(#arrow)"/>
<text x="360" y="24" text-anchor="middle" class="ink2 n">walk back through versions until the target is reached</text>
<text x="20" y="156" class="ink t b">Which version is the target?</text>
<text x="20" y="180" class="ink n">1.</text>
<text x="40" y="180" class="ink n">the <tspan class="mono">Stripe-Version</tspan> header, if the request sent one</text>
<text x="20" y="200" class="ink n">2.</text>
<text x="40" y="200" class="ink n">else the version of the OAuth app acting for the user</text>
<text x="20" y="220" class="ink n">3.</text>
<text x="40" y="220" class="ink n">else the version the account was pinned to on its first request</text>
</svg>
