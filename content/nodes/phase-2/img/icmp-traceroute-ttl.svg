<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="30" y="24" width="120" height="40" rx="6" class="box"/>
  <text x="90" y="49" text-anchor="middle" class="ink t b">Client</text>
  <rect x="210" y="24" width="120" height="40" rx="6" class="box"/>
  <text x="270" y="49" text-anchor="middle" class="ink t b">Router 1</text>
  <rect x="390" y="24" width="120" height="40" rx="6" class="box"/>
  <text x="450" y="49" text-anchor="middle" class="ink t b">Router 2</text>
  <rect x="570" y="24" width="120" height="40" rx="6" class="box"/>
  <text x="630" y="49" text-anchor="middle" class="ink t b">Server</text>
  <line x1="90" y1="64" x2="90" y2="330" class="line" stroke-dasharray="4 4"/>
  <line x1="270" y1="64" x2="270" y2="330" class="line" stroke-dasharray="4 4"/>
  <line x1="450" y1="64" x2="450" y2="330" class="line" stroke-dasharray="4 4"/>
  <line x1="630" y1="64" x2="630" y2="330" class="line" stroke-dasharray="4 4"/>

  <!-- TTL 1 -->
  <line x1="90" y1="100" x2="267" y2="100" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="92" text-anchor="middle" class="ink n">probe, TTL 1</text>
  <line x1="270" y1="126" x2="93" y2="126" class="focus-s" marker-end="url(#arrow)"/>
  <text x="180" y="144" text-anchor="middle" class="focus n">time exceeded</text>

  <!-- TTL 2 -->
  <line x1="90" y1="180" x2="447" y2="180" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="172" text-anchor="middle" class="ink n">probe, TTL 2</text>
  <line x1="450" y1="206" x2="93" y2="206" class="focus-s" marker-end="url(#arrow)"/>
  <text x="360" y="224" text-anchor="middle" class="focus n">time exceeded</text>

  <!-- TTL 3 -->
  <line x1="90" y1="262" x2="627" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="254" text-anchor="middle" class="ink n">probe, TTL 3</text>
  <line x1="630" y1="288" x2="93" y2="288" class="focus-s" marker-end="url(#arrow)"/>
  <text x="540" y="306" text-anchor="middle" class="focus n">port unreachable: arrived</text>
</svg>
