<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="34" text-anchor="start" class="ink t b">product dimension</text>
  <text x="40" y="62" text-anchor="start" class="ink2 n mono">product_key</text>
  <text x="150" y="62" text-anchor="start" class="ink2 n mono">sku</text>
  <text x="230" y="62" text-anchor="start" class="ink2 n mono">name</text>
  <text x="350" y="62" text-anchor="start" class="ink2 n mono">category</text>
  <text x="470" y="62" text-anchor="start" class="ink2 n mono">current</text>
  <rect x="30" y="74" width="500" height="34" rx="6" class="old-box"/>
  <text x="40" y="96" text-anchor="start" class="ink t mono">101</text>
  <text x="150" y="96" text-anchor="start" class="ink t mono">A-17</text>
  <text x="230" y="96" text-anchor="start" class="ink t mono">Robot kit</text>
  <text x="350" y="96" text-anchor="start" class="ink t mono">Toys</text>
  <text x="470" y="96" text-anchor="start" class="ink t mono">no</text>
  <rect x="30" y="118" width="500" height="34" rx="6" class="focus-box"/>
  <text x="40" y="140" text-anchor="start" class="ink t mono">245</text>
  <text x="150" y="140" text-anchor="start" class="ink t mono">A-17</text>
  <text x="230" y="140" text-anchor="start" class="ink t mono">Robot kit</text>
  <text x="350" y="140" text-anchor="start" class="ink t mono">Games</text>
  <text x="470" y="140" text-anchor="start" class="ink t mono">yes</text>
  <text x="545" y="97" text-anchor="start" class="ink2 n">before the change</text>
  <text x="545" y="141" text-anchor="start" class="ink2 n">after: new row, new key</text>
  <text x="40" y="200" text-anchor="start" class="ink t b">sales facts</text>
  <text x="40" y="228" text-anchor="start" class="ink2 n mono">sale</text>
  <text x="150" y="228" text-anchor="start" class="ink2 n mono">product_key</text>
  <text x="260" y="228" text-anchor="start" class="ink2 n mono">amount</text>
  <rect x="30" y="240" width="330" height="30" rx="6" class="box"/>
  <text x="40" y="260" text-anchor="start" class="ink t mono">1</text>
  <text x="150" y="260" text-anchor="start" class="ink t mono">101</text>
  <text x="260" y="260" text-anchor="start" class="ink t mono">20</text>
  <rect x="30" y="278" width="330" height="30" rx="6" class="box"/>
  <text x="40" y="298" text-anchor="start" class="ink t mono">2</text>
  <text x="150" y="298" text-anchor="start" class="ink t mono">101</text>
  <text x="260" y="298" text-anchor="start" class="ink t mono">35</text>
  <rect x="30" y="316" width="330" height="30" rx="6" class="box"/>
  <text x="40" y="336" text-anchor="start" class="ink t mono">3</text>
  <text x="150" y="336" text-anchor="start" class="ink t mono">245</text>
  <text x="260" y="336" text-anchor="start" class="ink t mono">20</text>
  <rect x="30" y="354" width="330" height="30" rx="6" class="box"/>
  <text x="40" y="374" text-anchor="start" class="ink t mono">4</text>
  <text x="150" y="374" text-anchor="start" class="ink t mono">245</text>
  <text x="260" y="374" text-anchor="start" class="ink t mono">50</text>
  <text x="40" y="412" text-anchor="start" class="ink2 n">Sales 1 and 2 keep pointing at key 101 (Toys); sales 3 and 4 use 245 (Games).</text>
  <text x="40" y="430" text-anchor="start" class="ink2 n">Totals by category stay correct for sales made before and after the change.</text>

</svg>
