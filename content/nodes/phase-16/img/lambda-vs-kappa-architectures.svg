<svg xmlns="http://www.w3.org/2000/svg" width="720" height="375" viewBox="0 0 720 375" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- Lambda -->
  <text x="20" y="24" class="ink t b">Lambda: the same logic twice, merged when you query</text>
  <rect x="20" y="70" width="120" height="50" rx="6" class="box"/>
  <text x="80" y="92" text-anchor="middle" class="ink n">immutable</text>
  <text x="80" y="108" text-anchor="middle" class="ink n">event log</text>

  <rect x="200" y="40" width="170" height="46" rx="6" class="box"/>
  <text x="285" y="60" text-anchor="middle" class="ink n">batch layer</text>
  <text x="285" y="76" text-anchor="middle" class="ink2 n">recompute from all data</text>
  <rect x="200" y="104" width="170" height="46" rx="6" class="focus-s"/>
  <text x="285" y="124" text-anchor="middle" class="ink n">realtime layer</text>
  <text x="285" y="140" text-anchor="middle" class="ink2 n">last few hours only</text>

  <rect x="420" y="40" width="120" height="46" rx="6" class="box"/>
  <text x="480" y="60" text-anchor="middle" class="ink n">batch view</text>
  <text x="480" y="76" text-anchor="middle" class="ink2 n">hours behind</text>
  <rect x="420" y="104" width="120" height="46" rx="6" class="box"/>
  <text x="480" y="124" text-anchor="middle" class="ink n">realtime view</text>
  <text x="480" y="140" text-anchor="middle" class="ink2 n">recent, may be rough</text>

  <rect x="590" y="70" width="110" height="50" rx="6" class="box"/>
  <text x="645" y="92" text-anchor="middle" class="ink n">query merges</text>
  <text x="645" y="108" text-anchor="middle" class="ink n">both views</text>

  <line x1="140" y1="88" x2="197" y2="64" class="line" marker-end="url(#arrow)"/>
  <line x1="140" y1="102" x2="197" y2="126" class="line" marker-end="url(#arrow)"/>
  <line x1="370" y1="63" x2="417" y2="63" class="line" marker-end="url(#arrow)"/>
  <line x1="370" y1="127" x2="417" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="63" x2="587" y2="86" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="127" x2="587" y2="104" class="line" marker-end="url(#arrow)"/>
  <text x="285" y="172" text-anchor="middle" class="ink2 n">two code bases, two systems to run</text>

  <!-- Kappa -->
  <text x="20" y="214" class="ink t b">Kappa: one stream job; reprocess by replaying the log</text>
  <rect x="20" y="258" width="120" height="50" rx="6" class="box"/>
  <text x="80" y="280" text-anchor="middle" class="ink n">log with long</text>
  <text x="80" y="296" text-anchor="middle" class="ink n">retention</text>

  <rect x="200" y="230" width="170" height="46" rx="6" class="box"/>
  <text x="285" y="250" text-anchor="middle" class="ink n">job v1</text>
  <text x="285" y="266" text-anchor="middle" class="ink2 n">reading the head</text>
  <rect x="200" y="292" width="170" height="46" rx="6" class="focus-s"/>
  <text x="285" y="312" text-anchor="middle" class="ink n">job v2 (new code)</text>
  <text x="285" y="328" text-anchor="middle" class="ink2 n">replaying from the start</text>

  <rect x="420" y="230" width="120" height="46" rx="6" class="box"/>
  <text x="480" y="258" text-anchor="middle" class="ink n">table v1</text>
  <rect x="420" y="292" width="120" height="46" rx="6" class="box"/>
  <text x="480" y="320" text-anchor="middle" class="ink n">table v2</text>

  <rect x="590" y="258" width="110" height="50" rx="6" class="box"/>
  <text x="645" y="280" text-anchor="middle" class="ink n">app reads v1,</text>
  <text x="645" y="296" text-anchor="middle" class="ink n">then v2</text>

  <line x1="140" y1="276" x2="197" y2="253" class="line" marker-end="url(#arrow)"/>
  <line x1="140" y1="290" x2="197" y2="314" class="line" marker-end="url(#arrow)"/>
  <line x1="370" y1="253" x2="417" y2="253" class="line" marker-end="url(#arrow)"/>
  <line x1="370" y1="315" x2="417" y2="315" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="253" x2="587" y2="275" class="line" marker-end="url(#arrow)"/>
  <line x1="540" y1="315" x2="587" y2="292" class="line" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <text x="285" y="360" text-anchor="middle" class="ink2 n">when v2 catches up: switch reads, stop v1, delete table v1</text>
</svg>
