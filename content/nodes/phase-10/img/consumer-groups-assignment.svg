  <rect x="644" y="160" width="56" height="40" rx="6" class="old"/>
  <text x="672" y="185" text-anchor="middle" class="ink t">C5</text>
  <text x="672" y="220" text-anchor="middle" class="ink2 n">idle</text>
  <line x1="415" y1="90" x2="408" y2="157" class="line" marker-end="url(#arrow)"/>
  <line x1="495" y1="90" x2="474" y2="157" class="line" marker-end="url(#arrow)"/>
  <line x1="575" y1="90" x2="540" y2="157" class="line" marker-end="url(#arrow)"/>
  <line x1="655" y1="90" x2="606" y2="157" class="line" marker-end="url(#arrow)"/>
