<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- document -->
  <rect x="20" y="30" width="150" height="52" rx="6" class="box"/>
  <text x="95" y="53" text-anchor="middle" class="ink t b">Document</text>
  <text x="95" y="71" text-anchor="middle" class="ink2 n">plaintext</text>

  <!-- encrypt step -->
  <rect x="250" y="30" width="160" height="52" rx="6" class="box"/>
  <text x="330" y="53" text-anchor="middle" class="ink t b">2  encrypt locally</text>
  <text x="330" y="71" text-anchor="middle" class="ink2 n mono">AES-256-GCM</text>
  <line x1="170" y1="56" x2="247" y2="56" class="line" marker-end="url(#arrow)"/>

  <!-- DEK -->
  <rect x="20" y="132" width="150" height="52" rx="6" class="box"/>
  <rect x="20" y="132" width="150" height="52" rx="6" class="focus-s"/>
  <text x="95" y="155" text-anchor="middle" class="focus t b">1  DEK</text>
  <text x="95" y="173" text-anchor="middle" class="ink2 n">new random key</text>
  <line x1="170" y1="150" x2="290" y2="85" class="focus-s" marker-end="url(#arrow)"/>

  <!-- KMS boundary -->
  <rect x="20" y="236" width="390" height="96" rx="6" class="box" stroke-dasharray="5 4"/>
  <text x="34" y="256" class="ink t b">KMS</text>
  <rect x="40" y="268" width="130" height="48" rx="6" class="box"/>
  <text x="105" y="290" text-anchor="middle" class="ink t b">KEK</text>
  <text x="105" y="307" text-anchor="middle" class="ink2 n">never leaves</text>
  <text x="290" y="290" text-anchor="middle" class="ink t">3  wrap the DEK</text>
  <text x="290" y="307" text-anchor="middle" class="ink2 n">with the KEK</text>
  <line x1="95" y1="184" x2="95" y2="233" class="focus-s" marker-end="url(#arrow)"/>
  <text x="105" y="214" class="ink2 n">send DEK</text>

  <!-- storage -->
  <rect x="480" y="30" width="220" height="302" rx="6" class="box"/>
  <text x="590" y="56" text-anchor="middle" class="ink t b">4  stored together</text>
  <rect x="500" y="76" width="180" height="52" rx="6" class="safe-box"/>
  <text x="590" y="107" text-anchor="middle" class="ink t">ciphertext</text>
  <rect x="500" y="264" width="180" height="52" rx="6" class="safe-box"/>
  <text x="590" y="295" text-anchor="middle" class="ink t">wrapped DEK</text>
  <text x="590" y="185" text-anchor="middle" class="ink2 n">plaintext DEK</text>
  <text x="590" y="201" text-anchor="middle" class="ink2 n">is thrown away,</text>
  <text x="590" y="217" text-anchor="middle" class="ink2 n">never stored</text>
  <line x1="410" y1="60" x2="497" y2="96" class="line" marker-end="url(#arrow)"/>
  <line x1="410" y1="290" x2="497" y2="290" class="line" marker-end="url(#arrow)"/>
</svg>
