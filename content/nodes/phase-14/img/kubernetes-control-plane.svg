<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- you -->
  <rect x="40" y="30" width="170" height="50" rx="6" class="box"/>
  <text x="56" y="52" class="ink t b">You</text>
  <text x="56" y="70" class="ink2 n mono">kubectl apply</text>

  <!-- etcd -->
  <rect x="285" y="30" width="150" height="50" rx="6" class="safe-box"/>
  <text x="360" y="52" text-anchor="middle" class="ink t b">etcd</text>
  <text x="360" y="70" text-anchor="middle" class="ink2 n">all cluster state</text>
  <line x1="360" y1="82" x2="360" y2="146" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="372" y="112" class="ink2 n">only the API server</text>
  <text x="372" y="127" class="ink2 n">reads and writes etcd</text>

  <!-- api server -->
  <rect x="270" y="150" width="180" height="70" rx="6" class="box"/>
  <rect x="270" y="150" width="180" height="70" rx="6" class="focus-s"/>
  <text x="360" y="180" text-anchor="middle" class="ink t b">API server</text>
  <text x="360" y="200" text-anchor="middle" class="ink2 n">validate, store, watch</text>
  <line x1="190" y1="82" x2="290" y2="146" class="line" marker-end="url(#arrow)"/>

  <!-- controller manager, scheduler -->
  <rect x="40" y="150" width="190" height="70" rx="6" class="box"/>
  <text x="56" y="178" class="ink t b">Controller manager</text>
  <text x="56" y="198" class="ink2 n">creates Pod objects</text>
  <line x1="232" y1="185" x2="266" y2="185" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="490" y="150" width="190" height="70" rx="6" class="box"/>
  <text x="506" y="178" class="ink t b">Scheduler</text>
  <text x="506" y="198" class="ink2 n">binds Pods to nodes</text>
  <line x1="454" y1="185" x2="486" y2="185" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- nodes -->
  <rect x="40" y="280" width="300" height="130" rx="6" class="box"/>
  <text x="56" y="302" class="ink t b">Node 1</text>
  <rect x="56" y="316" width="120" height="44" rx="6" class="box"/>
  <text x="116" y="343" text-anchor="middle" class="ink t">kubelet</text>
  <rect x="200" y="316" width="124" height="44" rx="6" class="box"/>
  <text x="262" y="336" text-anchor="middle" class="ink n">container</text>
  <text x="262" y="351" text-anchor="middle" class="ink n">runtime</text>
  <line x1="178" y1="338" x2="196" y2="338" class="line" marker-end="url(#arrow)"/>
  <text x="262" y="392" text-anchor="middle" class="ink2 n">starts containers</text>

  <rect x="380" y="280" width="300" height="130" rx="6" class="box"/>
  <text x="396" y="302" class="ink t b">Node 2</text>
  <rect x="396" y="316" width="120" height="44" rx="6" class="box"/>
  <text x="456" y="343" text-anchor="middle" class="ink t">kubelet</text>
  <rect x="540" y="316" width="124" height="44" rx="6" class="box"/>
  <text x="602" y="336" text-anchor="middle" class="ink n">container</text>
  <text x="602" y="351" text-anchor="middle" class="ink n">runtime</text>
  <line x1="518" y1="338" x2="536" y2="338" class="line" marker-end="url(#arrow)"/>
  <text x="602" y="392" text-anchor="middle" class="ink2 n">starts containers</text>

  <line x1="116" y1="314" x2="310" y2="224" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="470" y1="314" x2="414" y2="224" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="360" y="432" text-anchor="middle" class="ink2 n">Each kubelet watches for Pods bound to its node and reports their status back.</text>
</svg>
