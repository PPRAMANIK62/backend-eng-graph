<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="20" y="24" class="ink t b">Before: one table, key (part, warehouse)</text>
<text x="20" y="54" class="ink t b mono">inventory</text>
<rect x="20" y="62" width="420" height="96" rx="6" class="box"/>
<line x1="20" y1="86" x2="440" y2="86" class="line"/>
<text x="28" y="78" class="focus n b mono">part</text>
<text x="28" y="102" class="ink n mono">bolt</text>
<text x="28" y="126" class="ink n mono">nut</text>
<text x="28" y="150" class="ink n mono">bolt</text>
<line x1="90" y1="62" x2="90" y2="158" class="line"/>
<text x="98" y="78" class="focus n b mono">warehouse</text>
<text x="98" y="102" class="ink n mono">W1</text>
<text x="98" y="126" class="ink n mono">W1</text>
<text x="98" y="150" class="ink n mono">W2</text>
<line x1="190" y1="62" x2="190" y2="158" class="line"/>
<text x="198" y="78" class="ink n b mono">quantity</text>
<text x="198" y="102" class="ink n mono">500</text>
<text x="198" y="126" class="ink n mono">900</text>
<text x="198" y="150" class="ink n mono">200</text>
<line x1="280" y1="62" x2="280" y2="158" class="line"/>
<text x="288" y="78" class="ink n b mono">warehouse_address</text>
<text x="288" y="102" class="focus n mono b">1 Dock Rd</text>
<text x="288" y="126" class="focus n mono b">1 Dock Rd</text>
<text x="288" y="150" class="ink n mono">7 Mill Ln</text>
<text x="454" y="102" class="focus n b">W1's address stored twice:</text>
<text x="454" y="120" class="ink2 n">a move means two updates,</text>
<text x="454" y="136" class="ink2 n">and missing one leaves two</text>
<text x="454" y="152" class="ink2 n">addresses for one warehouse</text>
<text x="20" y="200" class="ink t b">After: each fact in one place</text>
<text x="20" y="230" class="ink t b mono">inventory</text>
<rect x="20" y="238" width="260" height="96" rx="6" class="box"/>
<line x1="20" y1="262" x2="280" y2="262" class="line"/>
<text x="28" y="254" class="focus n b mono">part</text>
<text x="28" y="278" class="ink n mono">bolt</text>
<text x="28" y="302" class="ink n mono">nut</text>
<text x="28" y="326" class="ink n mono">bolt</text>
<line x1="90" y1="238" x2="90" y2="334" class="line"/>
<text x="98" y="254" class="focus n b mono">warehouse</text>
<text x="98" y="278" class="ink n mono">W1</text>
<text x="98" y="302" class="ink n mono">W1</text>
<text x="98" y="326" class="ink n mono">W2</text>
<line x1="190" y1="238" x2="190" y2="334" class="line"/>
<text x="198" y="254" class="ink n b mono">quantity</text>
<text x="198" y="278" class="ink n mono">500</text>
<text x="198" y="302" class="ink n mono">900</text>
<text x="198" y="326" class="ink n mono">200</text>
<text x="420" y="230" class="ink t b mono">warehouses</text>
<rect x="420" y="238" width="220" height="72" rx="6" class="box"/>
<line x1="420" y1="262" x2="640" y2="262" class="line"/>
<text x="428" y="254" class="focus n b mono">warehouse</text>
<text x="428" y="278" class="ink n mono">W1</text>
<text x="428" y="302" class="ink n mono">W2</text>
<line x1="520" y1="238" x2="520" y2="310" class="line"/>
<text x="528" y="254" class="ink n b mono">address</text>
<text x="528" y="278" class="focus n mono b">1 Dock Rd</text>
<text x="528" y="302" class="ink n mono">7 Mill Ln</text>
<path d="M140,334 V360 H470 V313" class="line" marker-end="url(#arrow)"/>
<text x="305.0" y="378" text-anchor="middle" class="ink2 n">foreign key: inventory.warehouse → warehouses.warehouse</text>
</svg>
