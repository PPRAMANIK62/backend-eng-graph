<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="220" y="22" text-anchor="middle" class="ink t b">P</text>
  <text x="220" y="40" text-anchor="middle" class="ink2 n">proposer</text>
  <line x1="220" y1="50" x2="220" y2="520" class="line"/>
  <text x="340" y="22" text-anchor="middle" class="ink t b">A1</text>
  <text x="340" y="40" text-anchor="middle" class="ink2 n">acceptor</text>
  <line x1="340" y1="50" x2="340" y2="520" class="line"/>
  <text x="450" y="22" text-anchor="middle" class="ink t b">A2</text>
  <text x="450" y="40" text-anchor="middle" class="ink2 n">acceptor</text>
  <line x1="450" y1="50" x2="450" y2="520" class="line"/>
  <text x="560" y="22" text-anchor="middle" class="ink t b">A3</text>
  <text x="560" y="40" text-anchor="middle" class="ink2 n">acceptor</text>
  <line x1="560" y1="50" x2="560" y2="520" class="line"/>
  <text x="660" y="22" text-anchor="middle" class="ink t b">Q</text>
  <text x="660" y="40" text-anchor="middle" class="ink2 n">proposer</text>
  <line x1="660" y1="50" x2="660" y2="520" class="line"/>
  <text x="10" y="24" text-anchor="start" class="ink t b">Step</text>
  <text x="10" y="84" text-anchor="start" class="ink n mono">P: prepare(1)</text>
  <line x1="220" y1="72" x2="337" y2="88" class="line" marker-end="url(#arrow)"/>
  <line x1="220" y1="72" x2="447" y2="96" class="line" marker-end="url(#arrow)"/>
  <text x="10" y="134" text-anchor="start" class="ink n mono">A1, A2: promise(1),</text>
  <text x="10" y="150" text-anchor="start" class="ink2 n">nothing accepted yet</text>
  <line x1="340" y1="124" x2="223" y2="140" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="124" x2="223" y2="148" class="line" marker-end="url(#arrow)"/>
  <text x="10" y="194" text-anchor="start" class="focus n mono b">P: accept(1, X)</text>
  <line x1="220" y1="182" x2="337" y2="198" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="220" y1="182" x2="447" y2="206" class="focus-s" marker-end="url(#arrow)"/>
  <text x="10" y="244" text-anchor="start" class="ink n mono">A1, A2: accepted</text>
  <line x1="340" y1="234" x2="223" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="234" x2="223" y2="258" class="line" marker-end="url(#arrow)"/>
  <rect x="10" y="270" width="190" height="44" rx="6" class="safe-box"/>
  <text x="20" y="288" text-anchor="start" class="ink n b">X is chosen: A1 and A2</text>
  <text x="20" y="304" text-anchor="start" class="ink n">are a majority of three</text>
  <text x="10" y="344" text-anchor="start" class="ink n mono">Q: prepare(2)</text>
  <line x1="660" y1="332" x2="563" y2="348" class="line" marker-end="url(#arrow)"/>
  <line x1="660" y1="332" x2="453" y2="356" class="line" marker-end="url(#arrow)"/>
  <text x="10" y="394" text-anchor="start" class="focus n mono b">A2: promise(2), but I</text>
  <text x="10" y="410" text-anchor="start" class="focus n mono b">already accepted (1, X)</text>
  <line x1="450" y1="384" x2="657" y2="404" class="focus-s" marker-end="url(#arrow)"/>
  <text x="10" y="440" text-anchor="start" class="ink n mono">A3: promise(2), nothing</text>
  <line x1="560" y1="430" x2="657" y2="440" class="line" marker-end="url(#arrow)"/>
  <text x="10" y="480" text-anchor="start" class="focus n mono b">Q: accept(2, X)</text>
  <text x="10" y="496" text-anchor="start" class="ink2 n">Q must reuse X</text>
  <line x1="660" y1="468" x2="563" y2="484" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="660" y1="468" x2="453" y2="492" class="focus-s" marker-end="url(#arrow)"/>
</svg>
