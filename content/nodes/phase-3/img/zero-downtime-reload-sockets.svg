<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- left panel -->
  <text x="20" y="26" class="ink t b">SO_REUSEPORT alone: two sockets</text>
  <rect x="20" y="44" width="150" height="44" rx="6" class="box"/>
  <text x="95" y="71" text-anchor="middle" class="ink n">old process</text>
  <rect x="190" y="44" width="150" height="44" rx="6" class="box"/>
  <text x="265" y="71" text-anchor="middle" class="focus n b">new process</text>

  <rect x="20" y="130" width="150" height="70" rx="6" class="box"/>
  <text x="95" y="150" text-anchor="middle" class="ink n">socket 1, port 443</text>
  <rect x="34" y="162" width="56" height="26" rx="6" class="lost"/>
  <text x="62" y="180" text-anchor="middle" class="ink n mono">conn</text>
  <rect x="100" y="162" width="56" height="26" rx="6" class="lost"/>
  <text x="128" y="180" text-anchor="middle" class="ink n mono">conn</text>
  <rect x="190" y="130" width="150" height="70" rx="6" class="box"/>
  <text x="265" y="150" text-anchor="middle" class="ink n">socket 2, port 443</text>
  <rect x="204" y="162" width="56" height="26" rx="6" class="box"/>
  <text x="232" y="180" text-anchor="middle" class="ink n mono">conn</text>

  <line x1="95" y1="128" x2="95" y2="91" class="line" marker-end="url(#arrow)"/>
  <line x1="265" y1="128" x2="265" y2="91" class="line" marker-end="url(#arrow)"/>
  <text x="110" y="114" class="ink2 n">accept()</text>
  <text x="280" y="114" class="ink2 n">accept()</text>

  <text x="180" y="236" text-anchor="middle" class="ink2 n">kernel spreads new connections over both queues</text>
  <line x1="120" y1="226" x2="95" y2="203" class="line" marker-end="url(#arrow)"/>
  <line x1="240" y1="226" x2="265" y2="203" class="line" marker-end="url(#arrow)"/>
  <text x="20" y="266" class="lost n b">old process closes socket 1:</text>
  <text x="20" y="284" class="lost n b">the two connections in its queue are reset</text>

  <!-- divider -->
  <line x1="360" y1="20" x2="360" y2="290" class="line" stroke-dasharray="4 4"/>

  <!-- right panel -->
  <text x="380" y="26" class="ink t b">Passed socket: one socket, one queue</text>
  <rect x="380" y="44" width="150" height="44" rx="6" class="box"/>
  <text x="455" y="71" text-anchor="middle" class="ink n">old process</text>
  <rect x="550" y="44" width="150" height="44" rx="6" class="box"/>
  <text x="625" y="71" text-anchor="middle" class="focus n b">new process</text>

  <rect x="430" y="130" width="220" height="70" rx="6" class="safe-box"/>
  <text x="540" y="150" text-anchor="middle" class="ink n">the same socket, port 443</text>
  <rect x="448" y="162" width="56" height="26" rx="6" class="box"/>
  <text x="476" y="180" text-anchor="middle" class="ink n mono">conn</text>
  <rect x="512" y="162" width="56" height="26" rx="6" class="box"/>
  <text x="540" y="180" text-anchor="middle" class="ink n mono">conn</text>
  <rect x="576" y="162" width="56" height="26" rx="6" class="box"/>
  <text x="604" y="180" text-anchor="middle" class="ink n mono">conn</text>

  <line x1="500" y1="128" x2="480" y2="91" class="line" stroke-dasharray="4 4"/>
  <text x="472" y="114" text-anchor="end" class="ink2 n">stops accepting</text>
  <line x1="600" y1="128" x2="625" y2="91" class="line" marker-end="url(#arrow)"/>
  <text x="624" y="114" class="ink2 n">accept()</text>
  <text x="540" y="236" text-anchor="middle" class="ink2 n">both hold a file descriptor to it</text>
  <text x="380" y="266" class="ink n b">old process closes its descriptor:</text>
  <text x="380" y="284" class="ink n b">the socket stays open, nothing is lost</text>
</svg>
