<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="210" y="28" text-anchor="middle" class="ink t b">Client</text>
  <text x="640" y="28" text-anchor="middle" class="ink t b">Server</text>
  <line x1="210" y1="40" x2="210" y2="426" class="line"/>
  <line x1="640" y1="40" x2="640" y2="426" class="line"/>
  <text x="24" y="98" class="ink2 n">HTTP/1.1</text>
  <path d="M150,56 H142 V128 H150" class="line"/>
  <text x="24" y="270" class="ink2 n">WebSocket</text>
  <text x="24" y="286" class="ink2 n">frames</text>
  <path d="M150,150 H142 V414 H150" class="line"/>
  <line x1="210" y1="58" x2="637" y2="76" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="54" text-anchor="middle" class="ink n mono">GET /chat, Upgrade: websocket</text>
  <line x1="640" y1="100" x2="213" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="96" text-anchor="middle" class="ink n mono">101 Switching Protocols</text>
  <line x1="210" y1="152" x2="637" y2="170" class="focus-s" marker-end="url(#arrow)"/>
  <text x="425.0" y="148" text-anchor="middle" class="focus n mono b">text: "hello"</text>
  <line x1="640" y1="196" x2="213" y2="214" class="focus-s" marker-end="url(#arrow)"/>
  <text x="425.0" y="192" text-anchor="middle" class="focus n mono b">text: "hi, 2 online"</text>
  <line x1="640" y1="236" x2="213" y2="254" class="focus-s" marker-end="url(#arrow)"/>
  <text x="425.0" y="232" text-anchor="middle" class="focus n mono b">text: "bob joined"</text>
  <line x1="210" y1="280" x2="637" y2="298" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="276" text-anchor="middle" class="ink n mono">ping</text>
  <line x1="640" y1="318" x2="213" y2="336" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="314" text-anchor="middle" class="ink n mono">pong</text>
  <line x1="210" y1="356" x2="637" y2="374" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="352" text-anchor="middle" class="ink n mono">close</text>
  <line x1="640" y1="396" x2="213" y2="414" class="line" marker-end="url(#arrow)"/>
  <text x="425.0" y="392" text-anchor="middle" class="ink n mono">close</text>
</svg>
