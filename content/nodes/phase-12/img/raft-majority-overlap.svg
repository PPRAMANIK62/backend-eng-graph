<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="230" y="30" text-anchor="middle" class="ink t b">Majority that stored entry 7: committed</text>
  <rect x="50" y="44" width="360" height="126" rx="10" class="safe-box"/>
  <rect x="290" y="58" width="360" height="126" rx="10" class="focus-s" stroke-dasharray="6 4"/>

  <rect x="65" y="84" width="90" height="62" rx="6" class="box"/>
  <text x="110" y="106" text-anchor="middle" class="ink t b">S1</text>
  <text x="110" y="130" text-anchor="middle" class="ink n">has entry 7</text>
  <rect x="185" y="84" width="90" height="62" rx="6" class="box"/>
  <text x="230" y="106" text-anchor="middle" class="ink t b">S2</text>
  <text x="230" y="130" text-anchor="middle" class="ink n">has entry 7</text>
  <rect x="305" y="84" width="90" height="62" rx="6" class="box"/>
  <text x="350" y="106" text-anchor="middle" class="ink t b">S3</text>
  <text x="350" y="130" text-anchor="middle" class="ink n">has entry 7</text>
  <rect x="425" y="84" width="90" height="62" rx="6" class="box"/>
  <text x="470" y="106" text-anchor="middle" class="ink t b">S4</text>
  <text x="470" y="130" text-anchor="middle" class="ink2 n">log ends at 6</text>
  <rect x="545" y="84" width="90" height="62" rx="6" class="box"/>
  <text x="590" y="106" text-anchor="middle" class="ink t b">S5</text>
  <text x="590" y="130" text-anchor="middle" class="ink2 n">log ends at 6</text>

  <text x="515" y="206" text-anchor="middle" class="focus t b">Majority that votes in a later election</text>

  <line x1="350" y1="224" x2="350" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="350" y="244" text-anchor="middle" class="ink n">S3 is in both. It stores entry 7, so it refuses to vote</text>
  <text x="350" y="260" text-anchor="middle" class="ink n">for a candidate whose log is less up to date than its own.</text>
</svg>
