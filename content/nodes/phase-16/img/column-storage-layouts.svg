  <line x1="402.5" y1="74" x2="402.5" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="448.0" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="466.25" y="97" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="445.0" y1="74" x2="445.0" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="490.5" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="508.75" y="97" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="487.5" y1="74" x2="487.5" y2="110" class="line" stroke-opacity=".35"/>
  <text x="551.25" y="97" text-anchor="middle" class="ink2 n mono">4</text>
  <line x1="530.0" y1="74" x2="530.0" y2="110" class="line"/>
