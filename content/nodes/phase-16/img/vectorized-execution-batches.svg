<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" class="ink t b">One row at a time</text>
  <rect x="20" y="44" width="200" height="40" rx="6" class="box"/>
  <text x="120" y="69" text-anchor="middle" class="ink t mono">SUM(price)</text>
  <rect x="20" y="164" width="200" height="40" rx="6" class="box"/>
  <text x="120" y="189" text-anchor="middle" class="ink t mono">FILTER price &gt; 100</text>
  <rect x="20" y="284" width="200" height="40" rx="6" class="box"/>
  <text x="120" y="309" text-anchor="middle" class="ink t mono">SCAN sales</text>
  <line x1="80" y1="282" x2="80" y2="208" class="line" marker-end="url(#arrow)"/>
  <text x="94" y="249.0" class="ink2 n mono">next() → one row</text>
  <line x1="80" y1="162" x2="80" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="94" y="129.0" class="ink2 n mono">next() → one row</text>
  <text x="20" y="356" class="ink n">Every operator is called once per row,</text>
  <text x="20" y="374" class="ink n">and most of the time goes to the calls, not the work.</text>
  <text x="380" y="24" class="ink t b">A vector at a time</text>
  <rect x="380" y="44" width="200" height="40" rx="6" class="box"/>
  <text x="480" y="69" text-anchor="middle" class="ink t mono">SUM(price)</text>
  <rect x="380" y="164" width="200" height="40" rx="6" class="box"/>
  <text x="480" y="189" text-anchor="middle" class="ink t mono">FILTER price &gt; 100</text>
  <rect x="380" y="284" width="200" height="40" rx="6" class="box"/>
  <text x="480" y="309" text-anchor="middle" class="ink t mono">SCAN sales</text>
  <line x1="400" y1="282" x2="400" y2="208" class="line" marker-end="url(#arrow)"/>
  <rect x="414" y="232" width="270" height="26" rx="4" class="box"/>
  <text x="429.0" y="250" text-anchor="middle" class="ink2 n mono">12</text>
  <line x1="444" y1="232" x2="444" y2="258" class="line" stroke-opacity=".35"/>
  <text x="459.0" y="250" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="474" y1="232" x2="474" y2="258" class="line" stroke-opacity=".35"/>
  <text x="489.0" y="250" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="504" y1="232" x2="504" y2="258" class="line" stroke-opacity=".35"/>
  <text x="519.0" y="250" text-anchor="middle" class="ink2 n mono">12</text>
  <line x1="534" y1="232" x2="534" y2="258" class="line" stroke-opacity=".35"/>
  <text x="549.0" y="250" text-anchor="middle" class="ink2 n mono">95</text>
  <line x1="564" y1="232" x2="564" y2="258" class="line" stroke-opacity=".35"/>
  <text x="579.0" y="250" text-anchor="middle" class="ink2 n mono">2</text>
  <line x1="594" y1="232" x2="594" y2="258" class="line" stroke-opacity=".35"/>
  <text x="609.0" y="250" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="624" y1="232" x2="624" y2="258" class="line" stroke-opacity=".35"/>
  <text x="639.0" y="250" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="654" y1="232" x2="654" y2="258" class="line" stroke-opacity=".35"/>
  <text x="669.0" y="250" text-anchor="middle" class="ink2 n mono">…</text>
  <text x="414" y="226" class="ink2 n mono">next() → a vector of price values</text>
  <line x1="400" y1="162" x2="400" y2="88" class="line" marker-end="url(#arrow)"/>
  <rect x="414" y="112" width="270" height="26" rx="4" class="box"/>
  <text x="429.0" y="130" text-anchor="middle" class="ink2 n mono">12</text>
  <line x1="444" y1="112" x2="444" y2="138" class="line" stroke-opacity=".35"/>
  <text x="459.0" y="130" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="474" y1="112" x2="474" y2="138" class="line" stroke-opacity=".35"/>
  <rect x="476" y="114" width="26" height="22" rx="3" class="focus-box"/>
  <text x="489.0" y="130" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="504" y1="112" x2="504" y2="138" class="line" stroke-opacity=".35"/>
  <text x="519.0" y="130" text-anchor="middle" class="ink2 n mono">12</text>
  <line x1="534" y1="112" x2="534" y2="138" class="line" stroke-opacity=".35"/>
  <text x="549.0" y="130" text-anchor="middle" class="ink2 n mono">95</text>
  <line x1="564" y1="112" x2="564" y2="138" class="line" stroke-opacity=".35"/>
  <text x="579.0" y="130" text-anchor="middle" class="ink2 n mono">2</text>
  <line x1="594" y1="112" x2="594" y2="138" class="line" stroke-opacity=".35"/>
  <text x="609.0" y="130" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="624" y1="112" x2="624" y2="138" class="line" stroke-opacity=".35"/>
  <rect x="626" y="114" width="26" height="22" rx="3" class="focus-box"/>
  <text x="639.0" y="130" text-anchor="middle" class="ink2 n mono">210</text>
  <line x1="654" y1="112" x2="654" y2="138" class="line" stroke-opacity=".35"/>
  <text x="669.0" y="130" text-anchor="middle" class="ink2 n mono">…</text>
  <text x="414" y="106" class="ink2 n mono">same vector + selection [2, 7]</text>
  <text x="380" y="356" class="ink n">One call moves a whole vector (1,024 values in X100,</text>
  <text x="380" y="374" class="ink n">2,048 in current DuckDB). The work is a tight loop.</text>
</svg>
