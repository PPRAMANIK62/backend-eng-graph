<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<clipPath id="plot"><rect x="80" y="56" width="600" height="206"/></clipPath>
<text x="380" y="22" text-anchor="middle" class="ink t b">A 10-minute burst of 15% errors against a 99.9% SLO</text>
<text x="380" y="40" text-anchor="middle" class="ink2 n">Page rule: burn rate 14.4 over both the last hour and the last 5 minutes</text>
<rect x="80" y="56" width="80" height="204" class="lost" fill-opacity=".16" clip-path="url(#plot)"/>
<text x="208" y="76" class="ink n">shaded: 15% errors for 10 minutes (off the top of the scale)</text>
<line x1="80" y1="260" x2="684" y2="260" class="line"/><line x1="80" y1="260" x2="80" y2="56" class="line"/>
<text x="72" y="264" text-anchor="end" class="ink2 n">0%</text>
<text x="72" y="214" text-anchor="end" class="ink2 n">1%</text>
<text x="72" y="164" text-anchor="end" class="ink2 n">2%</text>
<text x="72" y="114" text-anchor="end" class="ink2 n">3%</text>
<text x="72" y="64" text-anchor="end" class="ink2 n">4%</text>
<text x="80" y="278" text-anchor="middle" class="ink2 n">0</text>
<text x="160" y="278" text-anchor="middle" class="ink2 n">10</text>
<text x="240" y="278" text-anchor="middle" class="ink2 n">20</text>
<text x="320" y="278" text-anchor="middle" class="ink2 n">30</text>
<text x="400" y="278" text-anchor="middle" class="ink2 n">40</text>
<text x="480" y="278" text-anchor="middle" class="ink2 n">50</text>
<text x="560" y="278" text-anchor="middle" class="ink2 n">60</text>
<text x="640" y="278" text-anchor="middle" class="ink2 n">70</text>
<text x="690" y="278" class="ink2 n">min</text>
<line x1="80" y1="188.0" x2="680" y2="188.0" class="line" stroke-dasharray="6 4"/>
<text x="240" y="206.0" class="ink n">dashed: threshold 14.4 × 0.1% = 1.44%</text>
<polyline points="80,260 120,-490 160,-490 200,260 680,260" class="line" stroke-width="2.5" clip-path="url(#plot)"/>
<text x="208" y="112" class="ink n">grey: 5-minute average</text>
<polyline points="80,260 160,135.0 560,135.0 640,260 680,260" class="focus-s" stroke-width="2.5"/>
<text x="320" y="127.0" class="ink n">blue: 1-hour average</text>
<rect x="126.08" y="300" width="70.08" height="14" rx="3" class="focus"/>
<text x="204.16" y="312" class="ink n">page fires: both averages over the line</text>
<text x="204.16" y="328" class="ink2 n">starts about 5 min in, stops about 5 min after the errors do</text>
<rect x="126.08" y="342" width="467.84" height="14" rx="3" class="old"/>
<text x="599.92" y="354" class="ink2 n">1 hour alone</text>
<text x="134.07999999999998" y="368" class="ink2 n">with the 1-hour window alone, it keeps firing about an hour after the errors stop</text>
</svg>