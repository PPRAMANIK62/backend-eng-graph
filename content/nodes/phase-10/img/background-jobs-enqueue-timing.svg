<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="40" y="30" class="ink t b">1. Push to Redis inside the transaction</text>
<text x="680" y="30" text-anchor="end" class="ink2 n">API request, left to right in time</text>
<line x1="40" y1="74" x2="680" y2="74" class="line" marker-end="url(#arrow)"/>
<line x1="80" y1="67" x2="80" y2="81" class="line"/>
<text x="80" y="60" text-anchor="middle" class="ink n mono">BEGIN</text>
<line x1="200" y1="67" x2="200" y2="81" class="line"/>
<text x="200" y="60" text-anchor="middle" class="ink n mono">INSERT user 42</text>
<line x1="330" y1="67" x2="330" y2="81" class="line"/>
<text x="330" y="60" text-anchor="middle" class="focus n mono">push job</text>
<line x1="560" y1="67" x2="560" y2="81" class="line"/>
<text x="560" y="60" text-anchor="middle" class="ink n mono">COMMIT</text>
<line x1="330" y1="82" x2="400" y2="108" class="line" marker-end="url(#arrow)"/>
<rect x="404" y="96" width="276" height="26" rx="6" class="box"/>
<text x="414" y="114" class="lost n b">worker: user 42 not found (not committed)</text>
<text x="40" y="170" class="ink t b">2. Push to Redis after the commit</text>
<line x1="40" y1="214" x2="680" y2="214" class="line" marker-end="url(#arrow)"/>
<line x1="80" y1="207" x2="80" y2="221" class="line"/>
<text x="80" y="200" text-anchor="middle" class="ink n mono">BEGIN</text>
<line x1="200" y1="207" x2="200" y2="221" class="line"/>
<text x="200" y="200" text-anchor="middle" class="ink n mono">INSERT user 42</text>
<line x1="330" y1="207" x2="330" y2="221" class="line"/>
<text x="330" y="200" text-anchor="middle" class="ink n mono">COMMIT</text>
<text x="440" y="220" text-anchor="middle" class="lost t b">X</text>
<text x="440" y="200" text-anchor="middle" class="lost n b">crash</text>
<line x1="560" y1="207" x2="560" y2="221" class="line"/>
<text x="560" y="200" text-anchor="middle" class="ink2 n mono">push job</text>
<text x="560" y="242" text-anchor="middle" class="ink2 n">never runs</text>
<text x="40" y="264" class="ink2 n">User 42 is saved, the job is gone, and nothing notices.</text>
<text x="40" y="310" class="ink t b">3. Insert the job row in the same database transaction</text>
<line x1="40" y1="354" x2="680" y2="354" class="line" marker-end="url(#arrow)"/>
<rect x="70" y="322" width="500" height="44" rx="6" class="safe-box"/>
<line x1="100" y1="347" x2="100" y2="361" class="line"/>
<text x="100" y="340" text-anchor="middle" class="ink n mono">BEGIN</text>
<line x1="230" y1="347" x2="230" y2="361" class="line"/>
<text x="230" y="340" text-anchor="middle" class="ink n mono">INSERT user 42</text>
<line x1="380" y1="347" x2="380" y2="361" class="line"/>
<text x="380" y="340" text-anchor="middle" class="focus n mono">INSERT job</text>
<line x1="520" y1="347" x2="520" y2="361" class="line"/>
<text x="520" y="340" text-anchor="middle" class="ink n mono">COMMIT</text>
<text x="40" y="386" class="ink2 n">Both rows commit together or roll back together. Workers can't see the job until COMMIT,</text>
<text x="40" y="404" class="ink2 n">so when they do, user 42 is there.</text>
</svg>