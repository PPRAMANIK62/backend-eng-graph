<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="115" y="28" text-anchor="middle" class="ink t b">Keys</text>
  <text x="350" y="28" text-anchor="middle" class="ink t b">Partitions</text>
  <text x="615" y="28" text-anchor="middle" class="ink t b">Machines</text>
  <text x="240" y="48" text-anchor="middle" class="ink2 n">range or hash</text>
  <text x="475" y="48" text-anchor="middle" class="ink2 n">placement map</text>
  <rect x="40" y="90" width="150" height="32" rx="6" class="box"/>
  <text x="115" y="111" text-anchor="middle" class="ink t mono">channel 17</text>
  <line x1="192" y1="106" x2="286" y2="103" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="166" width="150" height="32" rx="6" class="box"/>
  <rect x="40" y="166" width="150" height="32" rx="6" class="focus-s"/>
  <text x="115" y="187" text-anchor="middle" class="focus b t mono">channel 42</text>
  <line x1="192" y1="182" x2="286" y2="217" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="40" y="242" width="150" height="32" rx="6" class="box"/>
  <text x="115" y="263" text-anchor="middle" class="ink t mono">channel 99</text>
  <line x1="192" y1="258" x2="286" y2="65" class="line" marker-end="url(#arrow)"/>
  <text x="115" y="296" text-anchor="middle" class="ink2 t">…</text>
  <rect x="290" y="50" width="120" height="30" rx="6" class="box"/>
  <text x="350" y="70" text-anchor="middle" class="ink t">P1</text>
  <rect x="290" y="88" width="120" height="30" rx="6" class="box"/>
  <text x="350" y="108" text-anchor="middle" class="ink t">P2</text>
  <rect x="290" y="126" width="120" height="30" rx="6" class="box"/>
  <text x="350" y="146" text-anchor="middle" class="ink t">P3</text>
  <rect x="290" y="164" width="120" height="30" rx="6" class="box"/>
  <text x="350" y="184" text-anchor="middle" class="ink t">P4</text>
  <rect x="290" y="202" width="120" height="30" rx="6" class="box"/>
  <rect x="290" y="202" width="120" height="30" rx="6" class="focus-s"/>
  <text x="350" y="222" text-anchor="middle" class="focus b t">P5</text>
  <rect x="290" y="240" width="120" height="30" rx="6" class="box"/>
  <text x="350" y="260" text-anchor="middle" class="ink t">P6</text>
  <rect x="540" y="50" width="150" height="80" rx="6" class="box"/>
  <text x="615" y="80" text-anchor="middle" class="ink t b">Machine A</text>
  <text x="615" y="106" text-anchor="middle" class="ink2 t">P1 and P4</text>
  <line x1="412" y1="65" x2="537" y2="78" class="line" marker-end="url(#arrow)"/>
  <line x1="412" y1="179" x2="537" y2="102" class="line" marker-end="url(#arrow)"/>
  <rect x="540" y="145" width="150" height="80" rx="6" class="box"/>
  <text x="615" y="175" text-anchor="middle" class="ink t b">Machine B</text>
  <text x="615" y="201" text-anchor="middle" class="ink2 t">P2 and P5</text>
  <line x1="412" y1="103" x2="537" y2="173" class="line" marker-end="url(#arrow)"/>
  <line x1="412" y1="217" x2="537" y2="197" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="540" y="240" width="150" height="80" rx="6" class="box"/>
  <text x="615" y="270" text-anchor="middle" class="ink t b">Machine C</text>
  <text x="615" y="296" text-anchor="middle" class="ink2 t">P3 and P6</text>
  <line x1="412" y1="141" x2="537" y2="268" class="line" marker-end="url(#arrow)"/>
  <line x1="412" y1="255" x2="537" y2="292" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="352" text-anchor="middle" class="ink n">Map 1: changes rarely,</text>
  <text x="240" y="368" text-anchor="middle" class="ink2 n">because a change moves records</text>
  <text x="475" y="352" text-anchor="middle" class="ink n">Map 2: changes often,</text>
  <text x="475" y="368" text-anchor="middle" class="ink2 n">when machines join, leave or get busy</text>
</svg>
