<svg xmlns="http://www.w3.org/2000/svg" width="720" height="628" viewBox="0 0 720 628" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="110" y="20" width="180" height="40" rx="6" class="box"/>
  <text x="200.0" y="45.0" text-anchor="middle" class="ink t b">Load or store</text>
  <line x1="200" y1="60" x2="200" y2="87" class="line" marker-end="url(#arrow)"/>
  <polygon points="200,88.0 285.0,120 200,152.0 115.0,120" class="box" stroke-linejoin="round"/>
  <text x="200" y="125" text-anchor="middle" class="ink t">In the TLB?</text>
  <line x1="285" y1="120" x2="462" y2="120" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="112" text-anchor="start" class="ink2 n">yes</text>
  <line x1="200" y1="152" x2="200" y2="179" class="line" marker-end="url(#arrow)"/>
  <text x="210" y="172" text-anchor="start" class="ink2 n">no</text>
  <rect x="110" y="180" width="180" height="40" rx="6" class="box"/>
  <text x="200.0" y="205.0" text-anchor="middle" class="ink t">Walk the page tables</text>
  <line x1="200" y1="220" x2="200" y2="247" class="line" marker-end="url(#arrow)"/>
  <polygon points="200,248.0 315.0,285 200,322.0 85.0,285" class="box" stroke-linejoin="round"/>
  <text x="200" y="290" text-anchor="middle" class="ink t">Present and allowed?</text>
  <line x1="315" y1="285" x2="462" y2="285" class="line" marker-end="url(#arrow)"/>
  <text x="328" y="277" text-anchor="start" class="ink2 n">yes</text>
  <rect x="465" y="95" width="210" height="50" rx="6" class="safe-box"/>
  <text x="570.0" y="125.0" text-anchor="middle" class="ink t b">Access completes</text>
  <rect x="465" y="260" width="210" height="50" rx="6" class="safe-box"/>
  <text x="570.0" y="290.0" text-anchor="middle" class="ink t b">Access completes</text>
  <line x1="200" y1="322" x2="200" y2="353" class="line" marker-end="url(#arrow)"/>
  <text x="210" y="343" text-anchor="start" class="ink2 n">no: page fault</text>
  <rect x="90" y="354" width="220" height="48" rx="6" class="box"/>
  <text x="200.0" y="374.0" text-anchor="middle" class="ink t b">Kernel fault handler</text>
  <text x="200.0" y="392.0" text-anchor="middle" class="ink2 n mono">handle_mm_fault()</text>
  <line x1="200" y1="402" x2="200" y2="431" class="line" marker-end="url(#arrow)"/>
  <polygon points="200,432.0 305.0,466 200,500.0 95.0,466" class="box" stroke-linejoin="round"/>
  <text x="200" y="471" text-anchor="middle" class="ink t">Address valid?</text>
  <line x1="305" y1="466" x2="462" y2="466" class="line" marker-end="url(#arrow)"/>
  <text x="318" y="458" text-anchor="start" class="ink2 n">no</text>
  <rect x="465" y="441" width="210" height="50" rx="6" class="box"/>
  <rect x="465" y="441" width="210" height="50" rx="6" class="lost-s"/>
  <text x="570" y="462" text-anchor="middle" class="ink t b mono">SIGSEGV</text>
  <text x="570" y="480" text-anchor="middle" class="ink2 n">usually ends the process</text>
  <line x1="200" y1="500" x2="200" y2="531" class="line" marker-end="url(#arrow)"/>
  <text x="210" y="521" text-anchor="start" class="ink2 n">yes</text>
  <rect x="90" y="532" width="220" height="76" rx="6" class="box"/>
  <text x="200.0" y="557.0" text-anchor="middle" class="ink t">Map a zero page, or</text>
  <text x="200.0" y="575.0" text-anchor="middle" class="ink t">copy it (copy-on-write), or</text>
  <text x="200.0" y="593.0" text-anchor="middle" class="ink t">read it from disk</text>
  <path d="M 90 570 L 40 570 L 40 40 L 107 40" class="line" marker-end="url(#arrow)"/>
  <text x="30" y="305" class="ink2 n" transform="rotate(-90 30 305)" text-anchor="middle">retry the instruction</text>
</svg>
