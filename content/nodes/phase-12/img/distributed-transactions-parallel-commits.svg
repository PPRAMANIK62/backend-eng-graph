<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- time axis labels -->
  <text x="20" y="26" class="ink t b">Before: two-phase commit over Raft groups</text>

  <text x="20" y="62" class="ink2 n">range 1</text>
  <rect x="100" y="46" width="200" height="26" rx="6" class="box"/>
  <text x="110" y="64" class="ink n">intent write, replicated</text>
  <text x="20" y="96" class="ink2 n">range 2</text>
  <rect x="100" y="80" width="200" height="26" rx="6" class="box"/>
  <text x="110" y="98" class="ink n">intent write, replicated</text>
  <text x="20" y="130" class="ink2 n">txn record</text>
  <rect x="310" y="114" width="200" height="26" rx="6" class="focus-box"/>
  <text x="320" y="132" class="ink n">COMMITTED, replicated</text>
  <line x1="300" y1="106" x2="310" y2="114" class="line"/>
  <line x1="520" y1="127" x2="560" y2="127" class="line" marker-end="url(#arrow)"/>
  <text x="566" y="131" class="ink n b">ack client</text>

  <path d="M100,152 V160 H300 V152" class="line"/>
  <text x="200" y="176" text-anchor="middle" class="ink2 n">consensus round 1</text>
  <path d="M310,152 V160 H510 V152" class="line"/>
  <text x="410" y="176" text-anchor="middle" class="ink2 n">consensus round 2</text>

  <text x="20" y="220" class="ink t b">After: Parallel Commits (CockroachDB 19.2)</text>

  <text x="20" y="256" class="ink2 n">range 1</text>
  <rect x="100" y="240" width="200" height="26" rx="6" class="box"/>
  <text x="110" y="258" class="ink n">intent write, replicated</text>
  <text x="20" y="290" class="ink2 n">range 2</text>
  <rect x="100" y="274" width="200" height="26" rx="6" class="box"/>
  <text x="110" y="292" class="ink n">intent write, replicated</text>
  <text x="20" y="324" class="ink2 n">txn record</text>
  <rect x="100" y="308" width="200" height="26" rx="6" class="focus-box"/>
  <text x="110" y="326" class="ink n">STAGING + list of writes</text>
  <line x1="310" y1="287" x2="350" y2="287" class="line" marker-end="url(#arrow)"/>
  <text x="356" y="291" class="ink n b">ack client</text>
  <text x="440" y="258" class="ink2 n">later, in the background:</text>
  <text x="440" y="276" class="ink2 n">mark COMMITTED,</text>
  <text x="440" y="294" class="ink2 n">resolve the intents</text>

  <path d="M100,346 V354 H300 V346" class="line"/>
  <text x="200" y="370" text-anchor="middle" class="ink2 n">one consensus round</text>
</svg>
