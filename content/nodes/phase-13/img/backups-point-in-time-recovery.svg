<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="20" y="118" width="110" height="44" rx="6" class="safe-box"/>
  <text x="75" y="137" text-anchor="middle" class="ink t b">Base</text>
  <text x="75" y="154" text-anchor="middle" class="ink t b">backup</text>
  <rect x="140" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="174" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="208" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="242" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="276" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="310" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="344" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="378" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="412" y="126" width="30" height="28" rx="4" class="box"/>
  <rect x="446" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="480" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="514" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="548" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="582" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="616" y="126" width="30" height="28" rx="4" class="old"/>
  <rect x="650" y="126" width="30" height="28" rx="4" class="old"/>
  <text x="140" y="180" class="ink2 n">archived WAL segments, one after another</text>
  <line x1="140" y1="200" x2="700" y2="200" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="218" text-anchor="end" class="ink2 n">time</text>
  <line x1="480" y1="110" x2="480" y2="200" class="lost-s"/>
  <text x="486" y="104" class="lost t b">DROP TABLE</text>
  <line x1="458" y1="60" x2="458" y2="200" class="focus-s" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="452" y="104" text-anchor="end" class="focus t b">recovery target</text>
  <line x1="75" y1="60" x2="454" y2="60" class="focus-s" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="75" y="48" class="ink t">restore the base backup, then replay WAL up to the target</text>
  <path d="M 458 200 C 458 245, 498 250, 690 250" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="274" text-anchor="end" class="ink n">new timeline: the database runs on from here</text>
  <text x="690" y="180" text-anchor="end" class="ink2 n">grey: later WAL, kept in the archive</text>
</svg>
