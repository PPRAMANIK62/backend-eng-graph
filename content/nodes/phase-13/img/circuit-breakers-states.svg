<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- closed -->
  <rect x="30" y="40" width="210" height="80" rx="6" class="safe-box"/>
  <text x="135" y="68" text-anchor="middle" class="ink t b">Closed</text>
  <text x="135" y="90" text-anchor="middle" class="ink2 n">calls go through,</text>
  <text x="135" y="106" text-anchor="middle" class="ink2 n">outcomes are counted</text>

  <!-- open -->
  <rect x="480" y="40" width="210" height="80" rx="6" class="box"/>
  <rect x="480" y="40" width="210" height="80" rx="6" class="lost-s"/>
  <text x="585" y="68" text-anchor="middle" class="ink t b">Open</text>
  <text x="585" y="90" text-anchor="middle" class="ink2 n">calls fail at once,</text>
  <text x="585" y="106" text-anchor="middle" class="ink2 n">nothing is sent</text>

  <!-- half-open -->
  <rect x="255" y="210" width="210" height="80" rx="6" class="box"/>
  <rect x="255" y="210" width="210" height="80" rx="6" class="focus-s"/>
  <text x="360" y="238" text-anchor="middle" class="ink t b">Half-open</text>
  <text x="360" y="260" text-anchor="middle" class="ink2 n">a few trial calls go through,</text>
  <text x="360" y="276" text-anchor="middle" class="ink2 n">the rest fail at once</text>

  <!-- closed to open -->
  <line x1="242" y1="70" x2="477" y2="70" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="60" text-anchor="middle" class="ink n">failures pass the threshold</text>
  <text x="360" y="90" text-anchor="middle" class="ink2 n">(once enough calls are counted)</text>

  <!-- open to half-open -->
  <line x1="530" y1="122" x2="440" y2="207" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="160" text-anchor="end" class="ink n">wait time passes</text>

  <!-- half-open to open -->
  <line x1="465" y1="245" x2="628" y2="124" class="line" marker-end="url(#arrow)"/>
  <text x="572" y="210" class="ink n">a trial call fails</text>

  <!-- half-open to closed -->
  <line x1="253" y1="245" x2="120" y2="124" class="line" marker-end="url(#arrow)"/>
  <text x="178" y="215" text-anchor="end" class="ink n">trial calls succeed</text>
</svg>
