<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- row 1: the proxy's view -->
  <text x="20" y="28" class="ink t b">How the proxy reads it (Content-Length: 6)</text>
  <rect x="20" y="42" width="250" height="40" rx="6" class="box"/>
  <text x="145" y="60" text-anchor="middle" class="ink n mono">POST / HTTP/1.1</text>
  <text x="145" y="75" text-anchor="middle" class="ink2 n">headers: CL 6, TE chunked</text>
  <rect x="274" y="42" width="120" height="40" rx="6" class="box"/>
  <text x="334" y="67" text-anchor="middle" class="ink n mono">0 \r\n \r\n</text>
  <rect x="398" y="42" width="40" height="40" rx="6" class="box"/>
  <text x="418" y="67" text-anchor="middle" class="ink n mono b">G</text>
  <rect x="460" y="42" width="240" height="40" rx="6" class="box"/>
  <text x="580" y="60" text-anchor="middle" class="ink n mono">POST / HTTP/1.1</text>
  <text x="580" y="75" text-anchor="middle" class="ink2 n">another user's request</text>

  <path d="M20,92 V100 H438 V92" class="focus-s"/>
  <text x="229" y="118" text-anchor="middle" class="focus n b">request 1: body is the 6 bytes "0 \r\n \r\n G"</text>
  <path d="M460,92 V100 H700 V92" class="line"/>
  <text x="580" y="118" text-anchor="middle" class="ink n">request 2</text>

  <!-- arrow down -->
  <line x1="360" y1="136" x2="360" y2="164" class="line" marker-end="url(#arrow)"/>
  <text x="372" y="155" class="ink2 n">forwarded on one reused backend connection</text>

  <!-- row 2: the backend's view -->
  <text x="20" y="192" class="ink t b">How the backend reads it (Transfer-Encoding: chunked)</text>
  <rect x="20" y="206" width="250" height="40" rx="6" class="box"/>
  <text x="145" y="224" text-anchor="middle" class="ink n mono">POST / HTTP/1.1</text>
  <text x="145" y="239" text-anchor="middle" class="ink2 n">headers: CL 6, TE chunked</text>
  <rect x="274" y="206" width="120" height="40" rx="6" class="box"/>
  <text x="334" y="231" text-anchor="middle" class="ink n mono">0 \r\n \r\n</text>
  <rect x="398" y="206" width="40" height="40" rx="6" class="lost"/>
  <text x="418" y="231" text-anchor="middle" class="ink n mono b">G</text>
  <rect x="460" y="206" width="240" height="40" rx="6" class="box"/>
  <text x="580" y="224" text-anchor="middle" class="ink n mono">POST / HTTP/1.1</text>
  <text x="580" y="239" text-anchor="middle" class="ink2 n">another user's request</text>

  <path d="M20,256 V264 H394 V256" class="focus-s"/>
  <text x="207" y="282" text-anchor="middle" class="focus n b">request 1 ends at the zero-size chunk</text>
  <path d="M398,256 V264 H700 V256" class="lost-s"/>
  <text x="549" y="282" text-anchor="middle" class="ink n b">request 2 now starts with the leftover G:</text>
  <text x="549" y="300" text-anchor="middle" class="ink n mono">GPOST / HTTP/1.1</text>
</svg>
