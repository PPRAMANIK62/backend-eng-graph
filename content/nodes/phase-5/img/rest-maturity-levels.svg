<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<rect x="20" y="272" width="330" height="78" rx="6" class="box"/>
<text x="32" y="294" class="ink t b">Level 0</text>
<text x="100" y="294" class="ink2 n">one endpoint, RPC tunnelled in POST</text>
<text x="32" y="316" class="ink n mono">POST /appointmentService</text>
<text x="32" y="334" class="ink n mono">200 OK, even for a failure</text>
<rect x="140" y="188" width="330" height="78" rx="6" class="box"/>
<text x="152" y="210" class="ink t b">Level 1</text>
<text x="220" y="210" class="ink2 n">resources</text>
<text x="152" y="232" class="ink n mono">POST /doctors/mjones</text>
<text x="152" y="250" class="ink n mono">POST /slots/1234</text>
<rect x="260" y="104" width="330" height="78" rx="6" class="box"/>
<text x="272" y="126" class="ink t b">Level 2</text>
<text x="340" y="126" class="ink2 n">HTTP methods and status codes</text>
<text x="272" y="148" class="ink n mono">GET /doctors/mjones/slots?status=open</text>
<text x="272" y="166" class="ink n mono">POST /slots/1234 → 201 or 409</text>
<rect x="380" y="20" width="330" height="78" rx="6" class="box"/>
<rect x="380" y="20" width="330" height="78" rx="6" class="focus-s"/>
<text x="392" y="42" class="focus t b">Level 3</text>
<text x="460" y="42" class="ink2 n">hypermedia controls</text>
<text x="392" y="64" class="ink n mono">response lists links:</text>
<text x="392" y="82" class="ink n mono">rel="book" → /slots/1234</text>
<text x="20" y="40" class="ink2 n">Each level keeps</text><text x="20" y="56" class="ink2 n">everything below it.</text>
<text x="700" y="370" text-anchor="end" class="ink2 n">Fielding treats level 3 as a precondition for calling it REST.</text>
</svg>
