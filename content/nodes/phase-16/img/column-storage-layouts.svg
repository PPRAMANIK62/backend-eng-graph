  <line x1="232.5" y1="74" x2="232.5" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="278.0" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="296.25" y="97" text-anchor="middle" class="ink2 n mono">US</text>
  <line x1="275.0" y1="74" x2="275.0" y2="110" class="line" stroke-opacity=".35"/>
  <rect x="320.5" y="78" width="36.5" height="28" rx="3" class="focus-box"/>
  <text x="338.75" y="97" text-anchor="middle" class="ink2 n mono">40</text>
  <line x1="317.5" y1="74" x2="317.5" y2="110" class="line" stroke-opacity=".35"/>
  <text x="381.25" y="97" text-anchor="middle" class="ink2 n mono">3</text>
  <line x1="360.0" y1="74" x2="360.0" y2="110" class="line"/>
