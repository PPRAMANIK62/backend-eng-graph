<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="20" y="54" class="ink t b">Client 1</text>
  <line x1="130" y1="50" x2="560" y2="50" class="line"/>
  <text x="20" y="144" class="ink t b">Database</text>
  <line x1="130" y1="140" x2="560" y2="140" class="line"/>
  <text x="20" y="234" class="ink t b">Search index</text>
  <line x1="130" y1="230" x2="560" y2="230" class="line"/>
  <text x="20" y="324" class="ink t b">Client 2</text>
  <line x1="130" y1="320" x2="560" y2="320" class="line"/>
  <text x="560" y="360" text-anchor="end" class="ink2 n">time →</text>

  <!-- client 1: X=A to database, then to search index (arrives late) -->
  <line x1="160" y1="50" x2="188" y2="137" class="focus-s" marker-end="url(#arrow)"/>
  <text x="162" y="90" text-anchor="end" class="focus n mono b">X=A</text>
  <line x1="200" y1="50" x2="448" y2="227" class="focus-s" marker-end="url(#arrow)"/>
  <text x="330" y="118" class="focus n mono b">X=A</text>

  <!-- client 2: X=B to database, then to search index (arrives first) -->
  <line x1="250" y1="320" x2="278" y2="143" class="line" marker-end="url(#arrow)"/>
  <text x="252" y="276" text-anchor="end" class="ink n mono b">X=B</text>
  <line x1="300" y1="320" x2="328" y2="233" class="line" marker-end="url(#arrow)"/>
  <text x="322" y="290" class="ink n mono b">X=B</text>

  <!-- values held over time -->
  <text x="196" y="164" class="ink2 n">holds A</text>
  <text x="286" y="164" class="ink2 n">holds B</text>
  <text x="336" y="254" class="ink2 n">holds B</text>
  <text x="456" y="254" class="ink2 n">holds A</text>

  <!-- final state -->
  <rect x="590" y="118" width="116" height="44" rx="6" class="box"/>
  <text x="648" y="145" text-anchor="middle" class="ink t mono">X = B</text>
  <rect x="590" y="208" width="116" height="44" rx="6" class="box"/>
  <text x="648" y="235" text-anchor="middle" class="ink t mono">X = A</text>
  <line x1="648" y1="164" x2="648" y2="206" class="lost-s"/>
  <text x="648" y="282" text-anchor="middle" class="lost n b">stores disagree,</text>
  <text x="648" y="298" text-anchor="middle" class="lost n b">no error raised</text>
  <text x="648" y="100" text-anchor="middle" class="ink2 n">end state</text>
</svg>
