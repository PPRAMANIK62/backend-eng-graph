<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="110" y="28" text-anchor="middle" class="ink t b">Alice's request</text>
  <text x="390" y="28" text-anchor="middle" class="ink t b">Lookup by ID only</text>
  <text x="620" y="28" text-anchor="middle" class="ink t b">Lookup scoped to Alice</text>
  <text x="390" y="46" text-anchor="middle" class="ink2 n mono">WHERE id = $1</text>
  <text x="620" y="46" text-anchor="middle" class="ink2 n mono">WHERE id = $1 AND owner_id = $2</text>

  <!-- row 1 -->
  <rect x="20" y="66" width="180" height="44" rx="6" class="box"/>
  <text x="110" y="93" text-anchor="middle" class="ink t mono">GET /invoices/1041</text>
  <line x1="202" y1="88" x2="297" y2="88" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="66" width="180" height="44" rx="6" class="safe-box"/>
  <text x="390" y="86" text-anchor="middle" class="ink n b">200, invoice 1041</text>
  <text x="390" y="102" text-anchor="middle" class="ink2 n">Alice's own</text>
  <rect x="530" y="66" width="180" height="44" rx="6" class="safe-box"/>
  <text x="620" y="86" text-anchor="middle" class="ink n b">200, invoice 1041</text>
  <text x="620" y="102" text-anchor="middle" class="ink2 n">Alice's own</text>

  <!-- row 2 -->
  <rect x="20" y="136" width="180" height="44" rx="6" class="box"/>
  <text x="110" y="163" text-anchor="middle" class="focus t mono b">GET /invoices/1042</text>
  <line x1="202" y1="158" x2="297" y2="158" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="136" width="180" height="44" rx="6" class="box"/>
  <rect x="300" y="136" width="180" height="44" rx="6" fill="none" class="lost-s"/>
  <text x="390" y="156" text-anchor="middle" class="ink n b">200, invoice 1042</text>
  <text x="390" y="172" text-anchor="middle" class="ink2 n">Bob's, leaked</text>
  <rect x="530" y="136" width="180" height="44" rx="6" class="safe-box"/>
  <text x="620" y="156" text-anchor="middle" class="ink n b">404 Not Found</text>
  <text x="620" y="172" text-anchor="middle" class="ink2 n">no such invoice for Alice</text>

  <text x="20" y="212" class="ink2 n">Same valid session both times. Only the number changed.</text>
</svg>
