<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle" class="ink t b">Client/server (Postgres)</text>
  <text x="540" y="28" text-anchor="middle" class="ink t b">SQLite</text>
  <rect x="40" y="50" width="280" height="60" rx="6" class="box"/>
  <text x="180" y="76" text-anchor="middle" class="ink t">app process</text>
  <text x="180" y="96" text-anchor="middle" class="ink2 n">your code + driver</text>
  <line x1="180" y1="114" x2="180" y2="160" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="192" y="142" text-anchor="start" class="ink2 n">SQL over a socket</text>
  <rect x="40" y="164" width="280" height="60" rx="6" class="box"/>
  <text x="180" y="190" text-anchor="middle" class="ink t">server process</text>
  <text x="180" y="210" text-anchor="middle" class="ink2 n">parses, plans, runs</text>
  <line x1="180" y1="228" x2="180" y2="266" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="80" y="270" width="200" height="44" rx="6" class="box"/>
  <text x="180" y="297" text-anchor="middle" class="ink t">data files</text>
  <rect x="400" y="50" width="280" height="174" rx="6" class="box"/>
  <text x="540" y="76" text-anchor="middle" class="ink t">app process</text>
  <text x="540" y="96" text-anchor="middle" class="ink2 n">your code</text>
  <rect x="430" y="130" width="220" height="64" rx="6" class="box"/>
  <rect x="430" y="130" width="220" height="64" rx="6" class="focus-s"/>
  <text x="540" y="158" text-anchor="middle" class="focus t b">SQLite library</text>
  <text x="540" y="178" text-anchor="middle" class="ink2 n">function calls, no socket</text>
  <line x1="540" y1="198" x2="540" y2="266" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="440" y="270" width="200" height="44" rx="6" class="box"/>
  <text x="540" y="297" text-anchor="middle" class="ink t">one database file</text>
</svg>
