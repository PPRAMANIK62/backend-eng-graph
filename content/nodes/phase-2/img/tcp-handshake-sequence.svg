<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="180" y="30" text-anchor="middle" class="ink t b">Client</text>
  <text x="540" y="30" text-anchor="middle" class="ink t b">Server</text>
  <line x1="180" y1="42" x2="180" y2="335" class="line"/>
  <line x1="540" y1="42" x2="540" y2="335" class="line"/>
  <text x="168" y="62" text-anchor="end" class="ink2 n">CLOSED</text>
  <text x="552" y="62" class="ink2 n">LISTEN</text>

  <!-- round trip bracket -->
  <path d="M60,90 H68 V190 H60" class="line"/>
  <text x="74" y="144" class="ink2 n">1 round trip</text>

  <!-- SYN -->
  <line x1="180" y1="90" x2="537" y2="130" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="96" text-anchor="middle" class="ink n mono">SYN seq=100</text>
  <text x="168" y="96" text-anchor="end" class="ink n">SYN-SENT</text>
  <text x="552" y="134" class="ink n">SYN-RECEIVED</text>

  <!-- SYN-ACK -->
  <line x1="540" y1="150" x2="183" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="156" text-anchor="middle" class="ink n mono">SYN-ACK seq=300 ack=101</text>
  <text x="168" y="194" text-anchor="end" class="ink n b">ESTABLISHED</text>

  <!-- ACK -->
  <line x1="180" y1="210" x2="537" y2="250" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="216" text-anchor="middle" class="ink n mono">ACK seq=101 ack=301</text>
  <text x="552" y="254" class="ink n b">ESTABLISHED</text>

  <!-- data -->
  <line x1="180" y1="280" x2="537" y2="320" class="focus-s" marker-end="url(#arrow)"/>
  <text x="300" y="286" text-anchor="middle" class="focus n mono b">data seq=101</text>
</svg>
