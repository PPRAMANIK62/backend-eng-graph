<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the core -->
  <text x="24" y="50" class="ink t b">One core</text>
  <rect x="160" y="28" width="160" height="36" rx="6" class="box"/>
  <text x="240" y="51" text-anchor="middle" class="ink t b">A runs</text>
  <rect x="320" y="28" width="160" height="36" rx="6" class="box"/>
  <text x="400" y="51" text-anchor="middle" class="ink t b">B runs</text>
  <rect x="480" y="28" width="160" height="36" rx="6" class="box"/>
  <text x="560" y="51" text-anchor="middle" class="ink t b">C runs</text>
  <text x="400" y="84" text-anchor="middle" class="ink2 n">A isn't eligible; picked from B and C</text>

  <!-- checkpoints -->
  <line x1="160" y1="96" x2="160" y2="252" class="line" stroke-dasharray="4 4"/>
  <line x1="320" y1="96" x2="320" y2="252" class="line" stroke-dasharray="4 4"/>
  <line x1="640" y1="96" x2="640" y2="252" class="line" stroke-dasharray="4 4"/>
  <text x="160" y="272" text-anchor="middle" class="ink2 n">start</text>
  <text x="320" y="272" text-anchor="middle" class="ink2 n">after A's slice</text>
  <text x="640" y="272" text-anchor="middle" class="ink2 n">after all three</text>

  <!-- lag rows -->
  <text x="24" y="135" class="ink t">Lag of A</text>
  <text x="24" y="183" class="ink t">Lag of B</text>
  <text x="24" y="231" class="ink t">Lag of C</text>

  <rect x="120" y="112" width="80" height="34" rx="6" class="box"/>
  <text x="160" y="134" text-anchor="middle" class="ink t mono">0</text>
  <rect x="120" y="160" width="80" height="34" rx="6" class="box"/>
  <text x="160" y="182" text-anchor="middle" class="ink t mono">0</text>
  <rect x="120" y="208" width="80" height="34" rx="6" class="box"/>
  <text x="160" y="230" text-anchor="middle" class="ink t mono">0</text>

  <rect x="280" y="112" width="80" height="34" rx="6" class="old"/>
  <text x="320" y="134" text-anchor="middle" class="ink t mono b">&lt; 0</text>
  <rect x="280" y="160" width="80" height="34" rx="6" class="box"/>
  <text x="320" y="182" text-anchor="middle" class="ink t mono">&gt; 0</text>
  <rect x="280" y="208" width="80" height="34" rx="6" class="box"/>
  <text x="320" y="230" text-anchor="middle" class="ink t mono">&gt; 0</text>

  <rect x="596" y="112" width="88" height="34" rx="6" class="box"/>
  <text x="640" y="134" text-anchor="middle" class="ink t">about 0</text>
  <rect x="596" y="160" width="88" height="34" rx="6" class="box"/>
  <text x="640" y="182" text-anchor="middle" class="ink t">about 0</text>
  <rect x="596" y="208" width="88" height="34" rx="6" class="box"/>
  <text x="640" y="230" text-anchor="middle" class="ink t">about 0</text>

  <!-- legend -->
  <rect x="24" y="296" width="36" height="20" rx="6" class="box"/>
  <text x="70" y="311" class="ink2 n">eligible: lag 0 or more</text>
  <rect x="250" y="296" width="36" height="20" rx="6" class="old"/>
  <text x="296" y="311" class="ink2 n">not eligible: had more than its share</text>
</svg>
