<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" text-anchor="start" class="ink t b">Workflow code</text>
  <text x="230" y="24" text-anchor="start" class="ink t b">Replay after the crash</text>
  <text x="490" y="24" text-anchor="start" class="ink t b">History for this run</text>
  <rect x="20" y="44" width="170" height="48" rx="6" class="box"/>
  <text x="105.0" y="73.0" text-anchor="middle" class="ink t mono">chargeCard()</text>
  <line x1="190" y1="68" x2="228" y2="68" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="104" width="170" height="48" rx="6" class="box"/>
  <text x="105.0" y="133.0" text-anchor="middle" class="ink t mono">reserveStock()</text>
  <line x1="190" y1="128" x2="228" y2="128" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="164" width="170" height="48" rx="6" class="box"/>
  <text x="105.0" y="193.0" text-anchor="middle" class="ink t mono">sendEmail()</text>
  <line x1="190" y1="188" x2="228" y2="188" class="line" marker-end="url(#arrow)"/>
  <rect x="230" y="44" width="220" height="48" rx="6" class="safe-box"/>
  <text x="340.0" y="64.5" text-anchor="middle" class="ink n">returns r-17 from the history;</text>
  <text x="340.0" y="81.5" text-anchor="middle" class="ink n">the step doesn’t run</text>
  <rect x="230" y="104" width="220" height="48" rx="6" class="box"/>
  <text x="340.0" y="124.5" text-anchor="middle" class="ink n">no result recorded:</text>
  <text x="340.0" y="141.5" text-anchor="middle" class="ink n">the step runs now</text>
  <rect x="230" y="104" width="220" height="48" rx="6" class="focus-s"/>
  <rect x="230" y="164" width="220" height="48" rx="6" class="box"/>
  <text x="340.0" y="184.5" text-anchor="middle" class="ink n">runs next;</text>
  <text x="340.0" y="201.5" text-anchor="middle" class="ink n">its result is appended</text>
  <rect x="230" y="164" width="220" height="48" rx="6" class="focus-s"/>
  <rect x="490" y="44" width="210" height="24" rx="6" class="safe-box"/>
  <text x="595.0" y="61.0" text-anchor="middle" class="ink n mono">WorkflowStarted</text>
  <rect x="490" y="72" width="210" height="24" rx="6" class="safe-box"/>
  <text x="595.0" y="89.0" text-anchor="middle" class="ink n mono">chargeCard scheduled</text>
  <rect x="490" y="100" width="210" height="24" rx="6" class="safe-box"/>
  <text x="595.0" y="117.0" text-anchor="middle" class="ink n mono">chargeCard completed: r-17</text>
  <rect x="490" y="128" width="210" height="24" rx="6" class="safe-box"/>
  <text x="595.0" y="145.0" text-anchor="middle" class="ink n mono">reserveStock scheduled</text>
  <line x1="490" y1="164" x2="700" y2="164" class="lost-s"/>
  <text x="595" y="184" text-anchor="middle" class="ink n b">worker crashes here</text>
  <rect x="490" y="196" width="210" height="24" rx="6" class="box"/>
  <text x="595.0" y="213.0" text-anchor="middle" class="ink n mono">reserveStock completed</text>
  <rect x="490" y="196" width="210" height="24" rx="6" class="focus-s"/>
  <rect x="490" y="224" width="210" height="24" rx="6" class="box"/>
  <text x="595.0" y="241.0" text-anchor="middle" class="ink n mono">sendEmail scheduled</text>
  <rect x="490" y="224" width="210" height="24" rx="6" class="focus-s"/>
  <rect x="490" y="252" width="210" height="24" rx="6" class="box"/>
  <text x="595.0" y="269.0" text-anchor="middle" class="ink n mono">sendEmail completed</text>
  <rect x="490" y="252" width="210" height="24" rx="6" class="focus-s"/>
  <rect x="490" y="280" width="210" height="24" rx="6" class="box"/>
  <text x="595.0" y="297.0" text-anchor="middle" class="ink n mono">WorkflowCompleted</text>
  <rect x="490" y="280" width="210" height="24" rx="6" class="focus-s"/>
  <line x1="488" y1="112" x2="452" y2="72" class="line" marker-end="url(#arrow)"/>
  <line x1="452" y1="128" x2="488" y2="208" class="line" marker-end="url(#arrow)"/>
  <line x1="452" y1="188" x2="488" y2="264" class="line" marker-end="url(#arrow)"/>
  <text x="20" y="330" text-anchor="start" class="ink2 n">Green: already in the durable history, read back on replay. Blue: new work and the events it appends.</text>
  <text x="20" y="348" text-anchor="start" class="ink2 n">Orange: the crash. Before it, one step had finished and the next was only scheduled.</text>

</svg>
