  <text x="575.0" y="311" text-anchor="middle" class="ink n">page 7</text>
  <text x="670" y="311" class="ink2 n mono">13</text>
  <line x1="490" y1="298" x2="660" y2="298" class="line" stroke-opacity="0.45"/>
  <text x="670" y="329" class="ink2 n mono">14</text>
