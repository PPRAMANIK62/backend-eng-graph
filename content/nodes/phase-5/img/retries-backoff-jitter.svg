  <circle cx="294" cy="132" r="3.5" class="focus"/>
  <circle cx="294" cy="123" r="3.5" class="focus"/>
  <circle cx="294" cy="114" r="3.5" class="focus"/>
  <circle cx="294" cy="105" r="3.5" class="focus"/>
  <circle cx="294" cy="96" r="3.5" class="focus"/>
  <circle cx="606" cy="150" r="3.5" class="focus"/>
  <circle cx="606" cy="141" r="3.5" class="focus"/>
  <circle cx="606" cy="132" r="3.5" class="focus"/>
  <circle cx="606" cy="123" r="3.5" class="focus"/>
  <circle cx="606" cy="114" r="3.5" class="focus"/>
  <text x="216" y="120" text-anchor="middle" class="ink2 n">quiet gap</text>
  <text x="450" y="120" text-anchor="middle" class="ink2 n">quiet gap</text>
  <text x="40" y="248" class="ink t b">Exponential backoff with full jitter</text>
  <text x="40" y="266" class="ink2 n">each wait is random between zero and the backoff, so retries spread out</text>
  <line x1="60" y1="370" x2="690" y2="370" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="390" text-anchor="end" class="ink2 n">time</text>
  <path d="M54,352 L66,364 M66,352 L54,364" class="lost-s"/>
  <text x="60" y="390" text-anchor="middle" class="ink2 n">all fail</text>
  <circle cx="81" cy="360" r="3.5" class="focus"/>
  <circle cx="81" cy="351" r="3.5" class="focus"/>
