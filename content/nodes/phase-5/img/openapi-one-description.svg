<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<rect x="20" y="60" width="220" height="110" rx="6" class="box"/>
<rect x="20" y="60" width="220" height="110" rx="6" class="focus-s"/>
<text x="130" y="86" text-anchor="middle" class="focus t b mono">openapi.yaml</text>
<text x="130" y="110" text-anchor="middle" class="ink2 n">paths and operations</text>
<text x="130" y="127" text-anchor="middle" class="ink2 n">parameters, bodies</text>
<text x="130" y="144" text-anchor="middle" class="ink2 n">schemas (JSON Schema)</text>
<text x="130" y="161" text-anchor="middle" class="ink2 n">security, webhooks</text>
<path d="M240,115 C320,115 330,36 418,36" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="14" width="280" height="44" rx="6" class="box"/>
<text x="434" y="33" class="ink t b">Documentation</text>
<text x="434" y="50" class="ink2 n">pages a person can read</text>
<path d="M240,115 C320,115 330,92 418,92" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="70" width="280" height="44" rx="6" class="box"/>
<text x="434" y="89" class="ink t b">Client libraries</text>
<text x="434" y="106" class="ink2 n">one per language</text>
<path d="M240,115 C320,115 330,148 418,148" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="126" width="280" height="44" rx="6" class="box"/>
<text x="434" y="145" class="ink t b">Server stubs</text>
<text x="434" y="162" class="ink2 n">handlers left to fill in</text>
<path d="M240,115 C320,115 330,204 418,204" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="182" width="280" height="44" rx="6" class="box"/>
<text x="434" y="201" class="ink t b">Testing tools</text>
<text x="434" y="218" class="ink2 n">and many other uses</text>
</svg>
