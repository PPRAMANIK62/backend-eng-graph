<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- column titles -->
  <text x="125" y="26" text-anchor="middle" class="ink t b">RBAC</text>
  <text x="125" y="44" text-anchor="middle" class="ink2 n">look up the role</text>
  <text x="360" y="26" text-anchor="middle" class="ink t b">ABAC</text>
  <text x="360" y="44" text-anchor="middle" class="ink2 n">evaluate a rule over attributes</text>
  <text x="595" y="26" text-anchor="middle" class="ink t b">ReBAC</text>
  <text x="595" y="44" text-anchor="middle" class="ink2 n">look for a path of relationships</text>
  <line x1="242" y1="14" x2="242" y2="336" class="line" stroke-dasharray="3 4"/>
  <line x1="478" y1="14" x2="478" y2="336" class="line" stroke-dasharray="3 4"/>

  <!-- RBAC -->
  <rect x="45" y="66" width="160" height="40" rx="6" class="box"/>
  <text x="125" y="91" text-anchor="middle" class="ink t mono">user:bob</text>
  <line x1="125" y1="108" x2="125" y2="143" class="line" marker-end="url(#arrow)"/>
  <text x="133" y="130" class="ink2 n">assigned</text>
  <rect x="45" y="146" width="160" height="40" rx="6" class="box"/>
  <text x="125" y="171" text-anchor="middle" class="ink t mono">role:accountant</text>
  <line x1="125" y1="188" x2="125" y2="223" class="line" marker-end="url(#arrow)"/>
  <text x="133" y="210" class="ink2 n">grants</text>
  <rect x="45" y="226" width="160" height="56" rx="6" class="box"/>
  <text x="125" y="250" text-anchor="middle" class="ink n mono">invoice:read</text>
  <text x="125" y="268" text-anchor="middle" class="ink n mono">invoice:approve</text>
  <text x="125" y="312" text-anchor="middle" class="focus t b">approve is in the role</text>
  <text x="125" y="330" text-anchor="middle" class="ink2 n">so allow, for every invoice</text>

  <!-- ABAC -->
  <rect x="262" y="60" width="196" height="44" rx="6" class="box"/>
  <text x="274" y="78" class="ink2 n">subject</text>
  <text x="274" y="96" class="ink n mono">dept = finance</text>
  <rect x="262" y="110" width="196" height="44" rx="6" class="box"/>
  <text x="274" y="128" class="ink2 n">object: invoice 42</text>
  <text x="274" y="146" class="ink n mono">dept = finance</text>
  <rect x="262" y="160" width="196" height="44" rx="6" class="box"/>
  <text x="274" y="178" class="ink2 n">environment</text>
  <text x="274" y="196" class="ink n mono">time = 09:30</text>
  <line x1="360" y1="206" x2="360" y2="225" class="line" marker-end="url(#arrow)"/>
  <rect x="262" y="228" width="196" height="54" rx="6" class="box"/>
  <text x="360" y="249" text-anchor="middle" class="ink t b">policy</text>
  <text x="360" y="268" text-anchor="middle" class="ink n mono">subject.dept == object.dept</text>
  <text x="360" y="312" text-anchor="middle" class="focus t b">rule is true</text>
  <text x="360" y="330" text-anchor="middle" class="ink2 n">so allow, decided at request time</text>

  <!-- ReBAC -->
  <rect x="515" y="60" width="160" height="36" rx="6" class="box"/>
  <text x="595" y="83" text-anchor="middle" class="ink t mono">user:bob</text>
  <line x1="595" y1="96" x2="595" y2="119" class="focus-s" marker-end="url(#arrow)"/>
  <text x="604" y="113" class="ink2 n">member of</text>
  <rect x="515" y="122" width="160" height="36" rx="6" class="box"/>
  <text x="595" y="145" text-anchor="middle" class="ink t mono">team:finance</text>
  <line x1="595" y1="158" x2="595" y2="181" class="focus-s" marker-end="url(#arrow)"/>
  <text x="604" y="175" class="ink2 n">viewer of</text>
  <rect x="515" y="184" width="160" height="36" rx="6" class="box"/>
  <text x="595" y="207" text-anchor="middle" class="ink t mono">folder:q3</text>
  <line x1="595" y1="243" x2="595" y2="223" class="focus-s" marker-end="url(#arrow)"/>
  <text x="604" y="238" class="ink2 n">parent</text>
  <rect x="515" y="246" width="160" height="36" rx="6" class="box"/>
  <text x="595" y="269" text-anchor="middle" class="ink t mono">invoice:42</text>
  <text x="595" y="312" text-anchor="middle" class="focus t b">a path exists</text>
  <text x="595" y="330" text-anchor="middle" class="ink2 n">so allow, for this invoice only</text>
</svg>
