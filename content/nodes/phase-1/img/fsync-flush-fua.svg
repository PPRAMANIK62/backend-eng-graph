<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="680" y="24" text-anchor="end" class="ink2 n">time →</text>

  <!-- lane 1: cache flush -->
  <text x="40" y="24" class="ink t b">Drive with a volatile cache: writes, then a flush</text>
  <rect x="40" y="40" width="130" height="44" rx="6" class="box"/>
  <text x="105" y="67" text-anchor="middle" class="ink t mono">write A</text>
  <rect x="200" y="40" width="130" height="44" rx="6" class="box"/>
  <text x="265" y="67" text-anchor="middle" class="ink t mono">write B</text>
  <rect x="360" y="40" width="130" height="44" rx="6" class="focus-s"/>
  <text x="425" y="67" text-anchor="middle" class="ink t mono b">FLUSH</text>
  <rect x="520" y="40" width="160" height="44" rx="6" class="safe-box"/>
  <text x="600" y="67" text-anchor="middle" class="ink t b">fsync returns</text>
  <line x1="172" y1="62" x2="197" y2="62" class="line" marker-end="url(#arrow)"/>
  <line x1="332" y1="62" x2="357" y2="62" class="line" marker-end="url(#arrow)"/>
  <line x1="492" y1="62" x2="517" y2="62" class="line" marker-end="url(#arrow)"/>
  <text x="105" y="106" text-anchor="middle" class="ink2 n">drive says done</text>
  <text x="105" y="122" text-anchor="middle" class="lost n">but A is only in its cache</text>
  <text x="265" y="106" text-anchor="middle" class="ink2 n">drive says done</text>
  <text x="265" y="122" text-anchor="middle" class="lost n">but B is only in its cache</text>
  <text x="425" y="106" text-anchor="middle" class="ink2 n">completes once A and B</text>
  <text x="425" y="122" text-anchor="middle" class="ink2 n">are on flash</text>
  <text x="600" y="106" text-anchor="middle" class="ink2 n">A and B are durable</text>

  <line x1="40" y1="150" x2="680" y2="150" class="line" stroke-dasharray="4 4"/>

  <!-- lane 2: FUA -->
  <text x="40" y="186" class="ink t b">Same drive, a write with FUA set</text>
  <rect x="40" y="202" width="290" height="44" rx="6" class="focus-s"/>
  <text x="185" y="229" text-anchor="middle" class="ink t"><tspan class="mono">write C</tspan> with <tspan class="mono b">FUA</tspan></text>
  <rect x="520" y="202" width="160" height="44" rx="6" class="safe-box"/>
  <text x="600" y="229" text-anchor="middle" class="ink t b">fsync returns</text>
  <line x1="332" y1="224" x2="517" y2="224" class="line" marker-end="url(#arrow)"/>
  <text x="185" y="268" text-anchor="middle" class="ink2 n">drive says done only after C is on flash</text>
  <text x="600" y="268" text-anchor="middle" class="ink2 n">C is durable</text>
</svg>
