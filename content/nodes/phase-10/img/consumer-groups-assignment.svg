  <rect x="620" y="54" width="70" height="36" rx="6" class="box"/>
  <text x="655" y="77" text-anchor="middle" class="ink t mono">P3</text>
  <rect x="50" y="160" width="120" height="40" rx="6" class="box"/>
  <rect x="50" y="160" width="120" height="40" rx="6" class="focus-s"/>
  <text x="110" y="185" text-anchor="middle" class="ink t">consumer 1</text>
  <rect x="200" y="160" width="120" height="40" rx="6" class="box"/>
  <rect x="200" y="160" width="120" height="40" rx="6" class="focus-s"/>
  <text x="260" y="185" text-anchor="middle" class="ink t">consumer 2</text>
  <line x1="65" y1="90" x2="95" y2="157" class="line" marker-end="url(#arrow)"/>
