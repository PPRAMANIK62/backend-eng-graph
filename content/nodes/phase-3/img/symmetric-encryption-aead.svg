<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="30" y="24" class="ink t b">Encrypt</text>
  <rect x="30" y="36" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="56" class="ink n">key</text>
  <line x1="232" y1="51" x2="287" y2="73" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="74" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="94" class="ink n">nonce, never repeated</text>
  <line x1="232" y1="89" x2="287" y2="95" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="112" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="132" class="ink n">plaintext</text>
  <line x1="232" y1="127" x2="287" y2="117" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="150" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="170" class="ink n">associated data</text>
  <line x1="232" y1="165" x2="287" y2="139" class="line" marker-end="url(#arrow)"/>
  <rect x="290" y="56" width="120" height="100" rx="6" class="box"/>
  <text x="350" y="102" text-anchor="middle" class="ink t b">AEAD</text>
  <text x="350" y="120" text-anchor="middle" class="ink t b">encrypt</text>
  <line x1="412" y1="106" x2="467" y2="106" class="line" marker-end="url(#arrow)"/>
  <rect x="470" y="84" width="220" height="44" rx="6" class="box"/>
  <rect x="470" y="84" width="220" height="44" rx="6" class="focus-s"/>
  <text x="484" y="104" class="focus t b">ciphertext + tag</text>
  <text x="484" y="120" class="ink2 n">tag: 16 bytes for AES-GCM</text>
  <text x="470" y="150" class="ink2 n">associated data travels as is</text>

  <text x="30" y="214" class="ink t b">Decrypt</text>
  <rect x="30" y="226" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="246" class="ink n">key</text>
  <line x1="232" y1="241" x2="287" y2="263" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="264" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="284" class="ink n">the same nonce</text>
  <line x1="232" y1="279" x2="287" y2="285" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="302" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="322" class="ink n">ciphertext + tag</text>
  <line x1="232" y1="317" x2="287" y2="307" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="340" width="200" height="30" rx="6" class="box"/>
  <text x="44" y="360" class="ink n">associated data</text>
  <line x1="232" y1="355" x2="287" y2="329" class="line" marker-end="url(#arrow)"/>
  <rect x="290" y="246" width="120" height="100" rx="6" class="box"/>
  <text x="350" y="292" text-anchor="middle" class="ink t b">AEAD</text>
  <text x="350" y="310" text-anchor="middle" class="ink t b">decrypt</text>
  <line x1="412" y1="280" x2="467" y2="258" class="line" marker-end="url(#arrow)"/>
  <line x1="412" y1="312" x2="467" y2="334" class="line" marker-end="url(#arrow)"/>
  <rect x="470" y="236" width="220" height="44" rx="6" class="safe-box"/>
  <text x="484" y="256" class="ink t b">plaintext</text>
  <text x="484" y="272" class="ink2 n">nothing was changed</text>
  <rect x="470" y="312" width="220" height="44" rx="6" class="box"/>
  <rect x="470" y="312" width="220" height="44" rx="6" class="lost-s" style="stroke-width:1.5"/>
  <text x="484" y="332" class="lost t b">FAIL</text>
  <text x="484" y="348" class="ink2 n">any input was tampered with</text>

</svg>
