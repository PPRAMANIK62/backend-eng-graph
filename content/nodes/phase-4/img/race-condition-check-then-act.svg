<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- headers -->
  <text x="40" y="32" class="ink t b">Thread 1</text>
  <text x="300" y="32" class="ink t b">Thread 2</text>
  <text x="630" y="32" text-anchor="middle" class="ink t b">thd-&gt;proc_info</text>
  <line x1="24" y1="44" x2="696" y2="44" class="line"/>
  <line x1="280" y1="44" x2="280" y2="292" class="line" stroke-dasharray="2 4"/>
  <line x1="560" y1="44" x2="560" y2="292" class="line" stroke-dasharray="2 4"/>

  <!-- check -->
  <text x="40" y="72" class="focus t b">check</text>
  <text x="40" y="92" class="ink t mono" font-variant-ligatures="none">if (thd-&gt;proc_info)</text>
  <text x="40" y="110" class="ink2 n">not NULL, so go on</text>
  <text x="630" y="92" text-anchor="middle" class="ink t">a string</text>

  <rect x="24" y="124" width="672" height="30" rx="6" class="box"/>
  <text x="40" y="144" class="ink2 n">the scheduler switches to Thread 2 between the check and the use</text>

  <text x="300" y="182" class="ink t mono" font-variant-ligatures="none">thd-&gt;proc_info = NULL;</text>
  <text x="630" y="182" text-anchor="middle" class="ink t mono b">NULL</text>

  <rect x="24" y="198" width="672" height="30" rx="6" class="box"/>
  <text x="40" y="218" class="ink2 n">Thread 1 resumes, still trusting its check</text>

  <!-- act -->
  <text x="40" y="254" class="focus t b">act</text>
  <text x="40" y="274" class="ink t mono" font-variant-ligatures="none">fputs(thd-&gt;proc_info, ...)</text>
  <text x="630" y="274" text-anchor="middle" class="ink t mono" font-variant-ligatures="none">NULL</text>

  <line x1="24" y1="292" x2="696" y2="292" class="line"/>
  <text x="696" y="318" text-anchor="end" class="lost t b">Crash: the check was true when made, false when used</text>
</svg>
