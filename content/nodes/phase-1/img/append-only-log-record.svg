<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="24" class="ink t b">One record</text>
  <rect x="40" y="40" width="120" height="44" rx="6" class="box"/>
  <text x="100" y="60" text-anchor="middle" class="ink t">checksum</text>
  <text x="100" y="76" text-anchor="middle" class="ink2 n">4 bytes</text>
  <rect x="164" y="40" width="72" height="44" rx="6" class="box"/>
  <text x="200" y="60" text-anchor="middle" class="ink t">length</text>
  <text x="200" y="76" text-anchor="middle" class="ink2 n">2 bytes</text>
  <rect x="240" y="40" width="56" height="44" rx="6" class="box"/>
  <text x="268" y="60" text-anchor="middle" class="ink t">type</text>
  <text x="268" y="76" text-anchor="middle" class="ink2 n">1 byte</text>
  <rect x="300" y="40" width="380" height="44" rx="6" class="focus-s"/>
  <text x="490" y="60" text-anchor="middle" class="ink t">data</text>
  <text x="490" y="76" text-anchor="middle" class="ink2 n">length bytes</text>
  <path d="M40,94 v8 h256 v-8" class="line"/>
  <text x="168" y="120" text-anchor="middle" class="ink2 n">7-byte header</text>
  <text x="40" y="146" class="ink2 n">checksum: CRC32C of type and data, little-endian.  length: size of data, little-endian.</text>
  <text x="40" y="164" class="ink2 n">type: FULL, FIRST, MIDDLE or LAST.</text>

  <line x1="40" y1="190" x2="680" y2="190" class="line" stroke-dasharray="4 4"/>
  <text x="40" y="222" class="ink t b">The log after a crash</text>
  <rect x="40" y="240" width="42" height="36" rx="6" class="box"/><text x="61" y="263" text-anchor="middle" class="ink2 n">hdr</text>
  <rect x="84" y="240" width="110" height="36" rx="6" class="focus-s"/><text x="139" y="263" text-anchor="middle" class="ink n">data</text>
  <rect x="200" y="240" width="42" height="36" rx="6" class="box"/><text x="221" y="263" text-anchor="middle" class="ink2 n">hdr</text>
  <rect x="244" y="240" width="150" height="36" rx="6" class="focus-s"/><text x="319" y="263" text-anchor="middle" class="ink n">data</text>
  <rect x="400" y="240" width="42" height="36" rx="6" class="box"/><text x="421" y="263" text-anchor="middle" class="ink2 n">hdr</text>
  <rect x="444" y="240" width="70" height="36" rx="6" class="focus-s"/><text x="479" y="263" text-anchor="middle" class="ink n">data</text>
  <rect x="516" y="240" width="42" height="36" rx="6" class="box"/>
  <text x="537" y="263" text-anchor="middle" class="ink2 n">hdr</text>
  <rect x="560" y="240" width="60" height="36" rx="6" class="focus-s"/>
  <text x="590" y="263" text-anchor="middle" class="ink n">data</text>
  <rect x="620" y="240" width="60" height="36" rx="6" class="line" stroke-dasharray="4 4"/>
  <line x1="620" y1="232" x2="620" y2="284" class="lost-s"/>
  <text x="650" y="263" text-anchor="middle" class="ink2 n">cut off</text>

  <path d="M40,290 v8 h472 v-8" class="line"/>
  <text x="276" y="316" text-anchor="middle" class="ink n">good prefix: every record passes its checks</text>
  <path d="M516,290 v8 h164 v-8" class="line"/>
  <text x="598" y="316" text-anchor="middle" class="lost n">torn tail</text>
  <text x="598" y="332" text-anchor="middle" class="ink2 n">header whole, data not</text>
  <text x="514" y="222" text-anchor="middle" class="ink2 n">recovery cuts the file back to here</text>
  <line x1="514" y1="230" x2="514" y2="284" class="line" stroke-dasharray="3 3"/>
</svg>
