<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- lanes -->
  <text x="110" y="30" text-anchor="middle" class="ink t b">Alice</text>
  <text x="360" y="30" text-anchor="middle" class="ink t b">Server</text>
  <text x="610" y="30" text-anchor="middle" class="ink t b">Bob</text>
  <line x1="110" y1="42" x2="110" y2="440" class="line"/>
  <line x1="360" y1="42" x2="360" y2="192" class="line"/>
  <line x1="360" y1="234" x2="360" y2="317" class="line"/>
  <line x1="360" y1="359" x2="360" y2="440" class="line"/>
  <line x1="610" y1="42" x2="610" y2="440" class="line"/>

  <!-- both read -->
  <line x1="110" y1="70" x2="357" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="235" y="68" text-anchor="middle" class="ink n mono">GET /docs/7</text>
  <line x1="360" y1="100" x2="113" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="235" y="126" text-anchor="middle" class="ink n mono">200  ETag: "a1"</text>
  <line x1="610" y1="70" x2="363" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="68" text-anchor="middle" class="ink n mono">GET /docs/7</text>
  <line x1="360" y1="100" x2="607" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="126" text-anchor="middle" class="ink n mono">200  ETag: "a1"</text>

  <!-- Alice writes first -->
  <line x1="110" y1="165" x2="357" y2="183" class="line" marker-end="url(#arrow)"/>
  <text x="235" y="163" text-anchor="middle" class="focus n mono">PUT  If-Match: "a1"</text>
  <rect x="250" y="192" width="220" height="42" rx="6" class="safe-box"/>
  <text x="360" y="209" text-anchor="middle" class="ink n">current is "a1": match</text>
  <text x="360" y="226" text-anchor="middle" class="ink n">write it, new ETag "b2"</text>
  <line x1="360" y1="244" x2="113" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="235" y="272" text-anchor="middle" class="ink n mono">200  ETag: "b2"</text>

  <!-- Bob writes with a stale tag -->
  <line x1="610" y1="290" x2="363" y2="308" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="288" text-anchor="middle" class="focus n mono">PUT  If-Match: "a1"</text>
  <rect x="250" y="317" width="220" height="42" rx="6" class="box"/>
  <text x="360" y="334" text-anchor="middle" class="ink n">current is "b2": no match</text>
  <text x="360" y="351" text-anchor="middle" class="ink n">don't write anything</text>
  <line x1="360" y1="369" x2="607" y2="387" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="397" text-anchor="middle" class="lost n mono b">412 Precondition Failed</text>

  <text x="598" y="420" text-anchor="end" class="ink2 n">Bob re-reads, merges,</text>
  <text x="598" y="436" text-anchor="end" class="ink2 n">retries with If-Match: "b2"</text>
</svg>
