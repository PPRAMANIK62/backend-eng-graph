<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="120" y="26" text-anchor="middle" class="ink t b">Single leader</text>
  <text x="360" y="26" text-anchor="middle" class="ink t b">Multi-leader</text>
  <text x="600" y="26" text-anchor="middle" class="ink t b">Leaderless</text>
  <line x1="240" y1="14" x2="240" y2="290" class="line" stroke-dasharray="4 4"/>
  <line x1="480" y1="14" x2="480" y2="290" class="line" stroke-dasharray="4 4"/>
  <rect x="80" y="48" width="80" height="36" rx="6" class="box"/>
  <text x="120.0" y="71.0" text-anchor="middle" class="ink t b">Client</text>
  <line x1="120" y1="86" x2="120" y2="125" class="focus-s" marker-end="url(#arrow)"/>
  <text x="128" y="110" text-anchor="start" class="focus n b">write</text>
  <rect x="70" y="128" width="100" height="40" rx="6" class="box"/>
  <text x="120.0" y="153.0" text-anchor="middle" class="ink t b">Leader</text>
  <rect x="20" y="220" width="90" height="40" rx="6" class="box"/>
  <text x="65.0" y="245.0" text-anchor="middle" class="ink t b">Follower</text>
  <rect x="130" y="220" width="90" height="40" rx="6" class="box"/>
  <text x="175.0" y="245.0" text-anchor="middle" class="ink t b">Follower</text>
  <line x1="105" y1="170" x2="70" y2="217" class="line" marker-end="url(#arrow)"/>
  <line x1="135" y1="170" x2="170" y2="217" class="line" marker-end="url(#arrow)"/>
  <text x="120" y="285" text-anchor="middle" class="ink2 n">one server orders all writes</text>
  <rect x="255" y="48" width="80" height="36" rx="6" class="box"/>
  <text x="295.0" y="71.0" text-anchor="middle" class="ink t b">Client</text>
  <rect x="385" y="48" width="80" height="36" rx="6" class="box"/>
  <text x="425.0" y="71.0" text-anchor="middle" class="ink t b">Client</text>
  <line x1="295" y1="86" x2="295" y2="125" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="425" y1="86" x2="425" y2="125" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="250" y="128" width="90" height="40" rx="6" class="box"/>
  <text x="295.0" y="153.0" text-anchor="middle" class="ink t b">Leader</text>
  <rect x="380" y="128" width="90" height="40" rx="6" class="box"/>
  <text x="425.0" y="153.0" text-anchor="middle" class="ink t b">Leader</text>
  <line x1="343" y1="148" x2="377" y2="148" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="196" text-anchor="middle" class="lost n b">both change</text>
  <text x="360" y="212" text-anchor="middle" class="lost n b">the same row?</text>
  <text x="360" y="285" text-anchor="middle" class="ink2 n">conflicts must be resolved</text>
  <rect x="560" y="48" width="80" height="36" rx="6" class="box"/>
  <text x="600.0" y="71.0" text-anchor="middle" class="ink t b">Client</text>
  <rect x="500" y="190" width="64" height="40" rx="6" class="box"/>
  <text x="532.0" y="215.0" text-anchor="middle" class="ink n b">Replica</text>
  <rect x="568" y="190" width="64" height="40" rx="6" class="box"/>
  <text x="600.0" y="215.0" text-anchor="middle" class="ink n b">Replica</text>
  <rect x="636" y="190" width="64" height="40" rx="6" class="box"/>
  <text x="668.0" y="215.0" text-anchor="middle" class="ink n b">Replica</text>
  <line x1="580" y1="86" x2="535" y2="187" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="600" y1="86" x2="600" y2="187" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="620" y1="86" x2="666" y2="187" class="focus-s" marker-end="url(#arrow)"/>
  <text x="648" y="62" text-anchor="start" class="ink2 n">write to N,</text>
  <text x="648" y="78" text-anchor="start" class="ink2 n">wait for W</text>
  <text x="600" y="285" text-anchor="middle" class="ink2 n">reads ask R replicas</text>
</svg>
