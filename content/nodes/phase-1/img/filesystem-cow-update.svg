<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- superblock -->
  <rect x="260" y="16" width="160" height="40" rx="6" class="box"/>
  <text x="340" y="41" text-anchor="middle" class="ink t b">Superblock</text>
  <line x1="290" y1="58" x2="226" y2="105" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="244" y="76" text-anchor="end" class="ink2 n">before the commit</text>
  <line x1="390" y1="58" x2="466" y2="105" class="focus-s" marker-end="url(#arrow)"/>
  <text x="456" y="62" class="ink n">written last: now points</text>
  <text x="456" y="78" class="ink n">at the new root</text>

  <!-- roots -->
  <rect x="170" y="108" width="80" height="36" rx="6" class="old"/>
  <text x="210" y="131" text-anchor="middle" class="ink t">root</text>
  <rect x="440" y="108" width="80" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="440" y="108" width="80" height="36" rx="6" class="focus-s"/>
  <text x="480" y="131" text-anchor="middle" class="ink t">root′</text>

  <!-- internal nodes -->
  <rect x="80" y="208" width="80" height="36" rx="6" class="box"/>
  <text x="120" y="231" text-anchor="middle" class="ink t">A</text>
  <rect x="260" y="208" width="80" height="36" rx="6" class="old"/>
  <text x="300" y="231" text-anchor="middle" class="ink t">B</text>
  <rect x="500" y="208" width="80" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="500" y="208" width="80" height="36" rx="6" class="focus-s"/>
  <text x="540" y="231" text-anchor="middle" class="ink t">B′</text>

  <!-- leaves -->
  <rect x="40" y="308" width="70" height="36" rx="6" class="box"/>
  <text x="75" y="331" text-anchor="middle" class="ink t">leaf 1</text>
  <rect x="130" y="308" width="70" height="36" rx="6" class="box"/>
  <text x="165" y="331" text-anchor="middle" class="ink t">leaf 2</text>
  <rect x="230" y="308" width="70" height="36" rx="6" class="old"/>
  <text x="265" y="331" text-anchor="middle" class="ink t">leaf 3</text>
  <rect x="320" y="308" width="70" height="36" rx="6" class="box"/>
  <text x="355" y="331" text-anchor="middle" class="ink t">leaf 4</text>
  <rect x="540" y="308" width="80" height="36" rx="6" class="focus" fill-opacity=".18"/>
  <rect x="540" y="308" width="80" height="36" rx="6" class="focus-s"/>
  <text x="580" y="331" text-anchor="middle" class="ink t">leaf 3′</text>

  <!-- old tree edges -->
  <line x1="200" y1="146" x2="130" y2="205" class="line" marker-end="url(#arrow)"/>
  <line x1="220" y1="146" x2="290" y2="205" class="line" marker-end="url(#arrow)"/>
  <line x1="110" y1="246" x2="80" y2="305" class="line" marker-end="url(#arrow)"/>
  <line x1="130" y1="246" x2="160" y2="305" class="line" marker-end="url(#arrow)"/>
  <line x1="290" y1="246" x2="270" y2="305" class="line" marker-end="url(#arrow)"/>
  <line x1="310" y1="246" x2="350" y2="305" class="line" marker-end="url(#arrow)"/>

  <!-- new tree edges -->
  <line x1="450" y1="146" x2="162" y2="215" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="500" y1="146" x2="530" y2="205" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="510" y1="246" x2="392" y2="310" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="550" y1="246" x2="570" y2="305" class="focus-s" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="40" y="376" width="22" height="16" rx="4" class="old"/>
  <text x="70" y="389" class="ink2 n">old version, freed only after the commit</text>
  <rect x="330" y="376" width="22" height="16" rx="4" class="focus" fill-opacity=".18"/>
  <rect x="330" y="376" width="22" height="16" rx="4" class="focus-s"/>
  <text x="360" y="389" class="ink2 n">new copy</text>
  <rect x="440" y="376" width="22" height="16" rx="4" class="box"/>
  <text x="470" y="389" class="ink2 n">unchanged, shared by both trees</text>
  <text x="40" y="420" class="ink2 n">Changing leaf 3 copies the leaf, its parent and the root to new blocks. Those are flushed first; then the superblock is</text>
  <text x="40" y="436" class="ink2 n">rewritten to point at root′. A crash before that leaves the old tree whole.</text>
</svg>
