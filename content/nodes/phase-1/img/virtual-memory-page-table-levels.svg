  <text x="610.0" y="288" text-anchor="middle" class="ink t b">4 KiB page</text>
  <text x="610.0" y="172" text-anchor="middle" class="ink2 n">the byte you</text>
  <text x="610.0" y="190" text-anchor="middle" class="ink2 n">asked for</text>
  <line x1="610.0" y1="82" x2="610.0" y2="125" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="320" class="ink2 n">A CPU register points at this process's top-level table. Each index picks one entry,</text>
  <text x="40" y="338" class="ink2 n">which points at the next table down. The last entry points at the page; the offset picks the byte.</text>
