<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect x="20" y="60" width="90" height="36" rx="6" class="box"/>
  <text x="65" y="83" text-anchor="middle" class="ink t">client 1</text>
  <rect x="20" y="116" width="90" height="36" rx="6" class="box"/>
  <text x="65" y="139" text-anchor="middle" class="ink t">client 2</text>
  <rect x="20" y="172" width="90" height="36" rx="6" class="box"/>
  <text x="65" y="195" text-anchor="middle" class="ink t">client 3</text>
  <rect x="160" y="20" width="150" height="36" rx="6" class="box"/>
  <text x="235" y="43" text-anchor="middle" class="ink t b">postmaster</text>
  <text x="246" y="74" text-anchor="start" class="ink2 n">starts one</text>
  <text x="246" y="89" text-anchor="start" class="ink2 n">backend per</text>
  <text x="246" y="104" text-anchor="start" class="ink2 n">connection</text>
  <rect x="170" y="110" width="130" height="32" rx="6" class="box"/>
  <text x="235" y="131" text-anchor="middle" class="focus t b">backend 1</text>
  <line x1="112" y1="78" x2="168" y2="126" class="line" marker-end="url(#arrow)"/>
  <rect x="170" y="154" width="130" height="32" rx="6" class="box"/>
  <text x="235" y="175" text-anchor="middle" class="focus t b">backend 2</text>
  <line x1="112" y1="134" x2="168" y2="170" class="line" marker-end="url(#arrow)"/>
  <rect x="170" y="198" width="130" height="32" rx="6" class="box"/>
  <text x="235" y="219" text-anchor="middle" class="focus t b">backend 3</text>
  <line x1="112" y1="190" x2="168" y2="214" class="line" marker-end="url(#arrow)"/>
  <line x1="235" y1="58" x2="235" y2="106" class="line" marker-end="url(#arrow)"/>
  <rect x="350" y="20" width="114" height="32" rx="6" class="box"/>
  <text x="407" y="41" text-anchor="middle" class="ink n">WAL writer</text>
  <rect x="472" y="20" width="114" height="32" rx="6" class="box"/>
  <text x="529" y="41" text-anchor="middle" class="ink n">background writer</text>
  <rect x="594" y="20" width="114" height="32" rx="6" class="box"/>
  <text x="651" y="41" text-anchor="middle" class="ink n">checkpointer</text>
  <rect x="350" y="64" width="114" height="32" rx="6" class="box"/>
  <text x="407" y="85" text-anchor="middle" class="ink n">autovacuum</text>
  <rect x="472" y="64" width="114" height="32" rx="6" class="box"/>
  <text x="529" y="85" text-anchor="middle" class="ink n">I/O workers</text>
  <text x="530" y="122" text-anchor="middle" class="ink2 n">auxiliary and other background processes</text>
  <rect x="160" y="260" width="540" height="70" rx="6" class="box"/>
  <text x="430" y="282" text-anchor="middle" class="ink t b">shared memory</text>
  <rect x="180" y="292" width="300" height="28" rx="6" class="box"/>
  <text x="330" y="311" text-anchor="middle" class="ink n">shared buffers (8 kB pages)</text>
  <rect x="500" y="292" width="180" height="28" rx="6" class="box"/>
  <text x="590" y="311" text-anchor="middle" class="ink n">WAL buffers</text>
  <line x1="235" y1="232" x2="235" y2="258" class="line" marker-end="url(#arrow)"/>
  <text x="248" y="250" text-anchor="start" class="ink2 n">all attach</text>
  <line x1="530" y1="136" x2="530" y2="258" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="380" width="250" height="40" rx="6" class="box"/>
  <text x="285" y="405" text-anchor="middle" class="ink t">data files</text>
  <rect x="450" y="380" width="250" height="40" rx="6" class="box"/>
  <text x="575" y="405" text-anchor="middle" class="ink t">WAL files</text>
  <line x1="330" y1="322" x2="300" y2="378" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="360" text-anchor="end" class="ink2 n">background writer, checkpointer</text>
  <line x1="590" y1="322" x2="580" y2="378" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="360" text-anchor="start" class="ink2 n">WAL writer</text>
  <text x="430" y="448" text-anchor="middle" class="ink2 n">disk</text>
