<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- desired and observed -->
  <rect x="40" y="30" width="220" height="64" rx="6" class="box"/>
  <text x="56" y="56" class="ink t b">Desired state (spec)</text>
  <text x="56" y="78" class="ink2 n mono">replicas: 3</text>
  <rect x="40" y="210" width="220" height="64" rx="6" class="box"/>
  <text x="56" y="236" class="ink t b">Observed state (status)</text>
  <text x="56" y="258" class="ink2 n mono">replicas: 2</text>

  <!-- compare -->
  <rect x="300" y="120" width="140" height="64" rx="6" class="box"/>
  <rect x="300" y="120" width="140" height="64" rx="6" class="focus-s"/>
  <text x="370" y="146" text-anchor="middle" class="ink t b">Compare</text>
  <text x="370" y="168" text-anchor="middle" class="ink2 n">gap: 1 pod missing</text>

  <!-- act and world -->
  <rect x="490" y="120" width="190" height="64" rx="6" class="box"/>
  <text x="506" y="146" class="ink t b">Act</text>
  <text x="506" y="168" class="ink2 n">create 1 pod</text>
  <rect x="490" y="210" width="190" height="64" rx="6" class="box"/>
  <text x="506" y="236" class="ink t b">The world</text>
  <text x="506" y="258" class="ink2 n">pods running on nodes</text>

  <!-- arrows -->
  <line x1="262" y1="70" x2="304" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="262" y1="234" x2="304" y2="186" class="line" marker-end="url(#arrow)"/>
  <line x1="442" y1="152" x2="486" y2="152" class="line" marker-end="url(#arrow)"/>
  <line x1="585" y1="186" x2="585" y2="206" class="line" marker-end="url(#arrow)"/>
  <line x1="488" y1="242" x2="264" y2="242" class="line" marker-end="url(#arrow)"/>
  <text x="376" y="234" text-anchor="middle" class="ink2 n">observe again</text>

  <!-- other actors -->
  <line x1="640" y1="312" x2="640" y2="278" class="line" marker-end="url(#arrow)"/>
  <text x="626" y="316" text-anchor="end" class="ink2 n">people and other controllers change it too</text>
  <text x="370" y="24" text-anchor="middle" class="ink2 n">repeat forever</text>
</svg>
