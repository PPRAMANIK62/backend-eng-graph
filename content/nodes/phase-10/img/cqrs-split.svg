<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="28" class="ink t b">One model</text>
  <rect x="20" y="44" width="130" height="44" rx="6" class="box"/>
  <text x="85" y="71" text-anchor="middle" class="ink n">UI / API</text>
  <line x1="85" y1="90" x2="85" y2="124" class="line" marker-end="url(#arrow)"/>
  <line x1="105" y1="124" x2="105" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="115" y="112" class="ink2 n">writes and reads</text>
  <rect x="20" y="128" width="230" height="44" rx="6" class="box"/>
  <text x="135" y="155" text-anchor="middle" class="ink n b">one model</text>
  <line x1="135" y1="174" x2="135" y2="202" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="206" width="230" height="44" rx="6" class="box"/>
  <text x="135" y="233" text-anchor="middle" class="ink n">one store</text>

  <line x1="290" y1="20" x2="290" y2="290" class="line"/>

  <text x="330" y="28" class="ink t b">CQRS</text>
  <rect x="330" y="44" width="370" height="44" rx="6" class="box"/>
  <text x="515" y="71" text-anchor="middle" class="ink n">UI / API</text>
  <line x1="400" y1="90" x2="400" y2="124" class="line" marker-end="url(#arrow)"/>
  <text x="408" y="112" class="ink2 n">commands</text>
  <line x1="630" y1="124" x2="630" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="622" y="112" text-anchor="end" class="ink2 n">queries</text>
  <rect x="330" y="128" width="150" height="56" rx="6" class="box"/>
  <text x="405" y="152" text-anchor="middle" class="ink n b">write model</text>
  <text x="405" y="170" text-anchor="middle" class="ink2 n">validates rules</text>
  <rect x="550" y="128" width="150" height="56" rx="6" class="box"/>
  <text x="625" y="152" text-anchor="middle" class="focus n b">read model</text>
  <text x="625" y="170" text-anchor="middle" class="ink2 n">shaped per screen</text>
  <line x1="405" y1="186" x2="405" y2="214" class="line" marker-end="url(#arrow)"/>
  <rect x="330" y="218" width="150" height="44" rx="6" class="box"/>
  <text x="405" y="245" text-anchor="middle" class="ink n">normalized store</text>
  <rect x="550" y="218" width="150" height="44" rx="6" class="box"/>
  <text x="625" y="245" text-anchor="middle" class="ink n">denormalized views</text>
  <line x1="625" y1="216" x2="625" y2="188" class="line" marker-end="url(#arrow)"/>
  <line x1="482" y1="240" x2="546" y2="240" class="focus-s" marker-end="url(#arrow)"/>
  <text x="515" y="282" text-anchor="middle" class="focus n">changes, often as events,</text>
  <text x="515" y="298" text-anchor="middle" class="focus n">a moment later</text>
</svg>
