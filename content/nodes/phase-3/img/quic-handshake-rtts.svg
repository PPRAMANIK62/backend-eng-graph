<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="130" y="24" text-anchor="middle" class="ink t b">TCP + TLS 1.3</text>
  <text x="34" y="50" text-anchor="middle" class="ink2 n">client</text>
  <text x="226" y="50" text-anchor="middle" class="ink2 n">server</text>
  <line x1="34" y1="58" x2="34" y2="380" class="line"/>
  <line x1="226" y1="58" x2="226" y2="380" class="line"/>
  <line x1="34" y1="80" x2="223" y2="130" class="line" marker-end="url(#arrow)"/>
  <text x="218" y="82" text-anchor="end" class="ink n">SYN</text>
  <line x1="226" y1="140" x2="37" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="42" y="142" text-anchor="start" class="ink n">SYN-ACK</text>
  <line x1="34" y1="200" x2="223" y2="250" class="line" marker-end="url(#arrow)"/>
  <text x="218" y="202" text-anchor="end" class="ink n">ClientHello</text>
  <line x1="226" y1="260" x2="37" y2="310" class="line" marker-end="url(#arrow)"/>
  <text x="42" y="262" text-anchor="start" class="ink n">ServerHello</text>
  <text x="42" y="276" text-anchor="start" class="ink n">… Finished</text>
  <line x1="34" y1="320" x2="223" y2="370" class="focus-s" marker-end="url(#arrow)"/>
  <text x="218" y="322" text-anchor="end" class="focus n b">Finished</text>
  <text x="218" y="336" text-anchor="end" class="focus n b">+ request</text>
  <text x="130" y="404" text-anchor="middle" class="ink2 n">request after 2 round trips</text>
  <text x="366" y="24" text-anchor="middle" class="ink t b">QUIC, first visit</text>
  <text x="270" y="50" text-anchor="middle" class="ink2 n">client</text>
  <text x="462" y="50" text-anchor="middle" class="ink2 n">server</text>
  <line x1="270" y1="58" x2="270" y2="380" class="line"/>
  <line x1="462" y1="58" x2="462" y2="380" class="line"/>
  <line x1="270" y1="80" x2="459" y2="130" class="line" marker-end="url(#arrow)"/>
  <text x="454" y="82" text-anchor="end" class="ink n">Initial:</text>
  <text x="454" y="96" text-anchor="end" class="ink n">ClientHello</text>
  <line x1="462" y1="140" x2="273" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="278" y="142" text-anchor="start" class="ink n">Initial +</text>
  <text x="278" y="156" text-anchor="start" class="ink n">Handshake</text>
  <line x1="270" y1="200" x2="459" y2="250" class="focus-s" marker-end="url(#arrow)"/>
  <text x="454" y="202" text-anchor="end" class="focus n b">Finished</text>
  <text x="454" y="216" text-anchor="end" class="focus n b">+ request</text>
  <text x="366" y="404" text-anchor="middle" class="ink2 n">request after 1 round trip</text>
  <text x="602" y="24" text-anchor="middle" class="ink t b">QUIC, 0-RTT</text>
  <text x="506" y="50" text-anchor="middle" class="ink2 n">client</text>
  <text x="698" y="50" text-anchor="middle" class="ink2 n">server</text>
  <line x1="506" y1="58" x2="506" y2="380" class="line"/>
  <line x1="698" y1="58" x2="698" y2="380" class="line"/>
  <line x1="506" y1="80" x2="695" y2="130" class="focus-s" marker-end="url(#arrow)"/>
  <text x="690" y="82" text-anchor="end" class="focus n b">ClientHello</text>
  <text x="690" y="96" text-anchor="end" class="focus n b">+ request</text>
  <line x1="698" y1="140" x2="509" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="514" y="142" text-anchor="start" class="ink n">Initial +</text>
  <text x="514" y="156" text-anchor="start" class="ink n">Handshake</text>
  <line x1="506" y1="200" x2="695" y2="250" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="202" text-anchor="end" class="ink n">Finished</text>
  <text x="602" y="404" text-anchor="middle" class="ink2 n">request in the first flight</text>
</svg>
