<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- sites -->
  <rect x="40" y="30" width="180" height="64" rx="6" class="focus-box"/>
  <text x="130" y="55" text-anchor="middle" class="ink t b">Site in Europe</text>
  <text x="130" y="77" text-anchor="middle" class="ink2 n">announces <tspan class="mono">192.0.2.0/24</tspan></text>
  <rect x="270" y="30" width="180" height="64" rx="6" class="focus-box"/>
  <text x="360" y="55" text-anchor="middle" class="ink t b">Site in Asia</text>
  <text x="360" y="77" text-anchor="middle" class="ink2 n">announces <tspan class="mono">192.0.2.0/24</tspan></text>
  <rect x="500" y="30" width="180" height="64" rx="6" class="focus-box"/>
  <text x="590" y="55" text-anchor="middle" class="ink t b">Site in N. America</text>
  <text x="590" y="77" text-anchor="middle" class="ink2 n">announces <tspan class="mono">192.0.2.0/24</tspan></text>

  <!-- clients -->
  <rect x="40" y="190" width="180" height="44" rx="6" class="box"/>
  <text x="130" y="217" text-anchor="middle" class="ink t">Clients in Europe</text>
  <rect x="270" y="190" width="180" height="44" rx="6" class="box"/>
  <text x="360" y="217" text-anchor="middle" class="ink t">Clients in Asia</text>
  <rect x="500" y="190" width="180" height="44" rx="6" class="box"/>
  <text x="590" y="217" text-anchor="middle" class="ink t">Clients in N. America</text>

  <!-- requests -->
  <line x1="130" y1="188" x2="130" y2="98" class="line" marker-end="url(#arrow)"/>
  <text x="138" y="146" class="focus n mono">to 192.0.2.53</text>
  <line x1="360" y1="188" x2="360" y2="98" class="line" marker-end="url(#arrow)"/>
  <text x="368" y="146" class="focus n mono">to 192.0.2.53</text>
  <line x1="590" y1="188" x2="590" y2="98" class="line" marker-end="url(#arrow)"/>
  <text x="598" y="146" class="focus n mono">to 192.0.2.53</text>

  <!-- withdrawal note -->
  <text x="40" y="266" class="ink2 n">If the European site withdraws its route, its clients shift to the next-best site.</text>
  <text x="40" y="284" class="ink2 n">Same address everywhere; routing picks the site.</text>
</svg>
