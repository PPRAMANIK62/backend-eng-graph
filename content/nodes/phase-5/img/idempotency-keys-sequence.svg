<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="110" y="28" text-anchor="middle" class="ink t b">Client</text>
  <text x="400" y="28" text-anchor="middle" class="ink t b">Server</text>
  <text x="590" y="28" text-anchor="middle" class="ink t b">Row for key k1</text>
  <line x1="110" y1="40" x2="110" y2="440" class="line"/>
  <line x1="400" y1="40" x2="400" y2="440" class="line"/>
  <line x1="110" y1="70" x2="397" y2="100" class="focus-s" marker-end="url(#arrow)"/>
  <text x="122" y="64" class="focus n mono">POST, key k1  (attempt 1)</text>
  <rect x="480" y="84" width="220" height="46" rx="6" class="box"/>
  <text x="492" y="104" class="ink n b">inserted, in progress</text>
  <text x="492" y="121" class="ink2 n">locked, charge starts</text>
  <line x1="402" y1="107.0" x2="478" y2="107.0" class="line" stroke-dasharray="3 3"/>
  <rect x="393" y="104" width="14" height="150" rx="3" class="box"/>
  <circle cx="110" cy="150" r="4" class="ink"/>
  <text x="100" y="154" text-anchor="end" class="ink2 n">timeout</text>
  <line x1="110" y1="166" x2="397" y2="190" class="focus-s" marker-end="url(#arrow)"/>
  <text x="122" y="160" class="focus n mono">POST, key k1  (attempt 2)</text>
  <rect x="480" y="170" width="220" height="40" rx="6" class="box"/>
  <text x="492" y="190" class="ink n b">already in progress</text>
  <line x1="402" y1="190.0" x2="478" y2="190.0" class="line" stroke-dasharray="3 3"/>
  <line x1="400" y1="214" x2="113" y2="236" class="line" marker-end="url(#arrow)"/>
  <text x="388" y="208" text-anchor="end" class="ink n mono">409 Conflict</text>
  <rect x="480" y="250" width="220" height="46" rx="6" class="safe-box"/>
  <text x="492" y="270" class="ink n b">finished</text>
  <text x="492" y="287" class="ink2 n">201 and body stored</text>
  <line x1="402" y1="273.0" x2="478" y2="273.0" class="line" stroke-dasharray="3 3"/>
  <line x1="400" y1="270" x2="230" y2="287.58620689655174" class="line"/>
  <path d="M217,281.2068965517241 L231,295.2068965517241 M231,281.2068965517241 L217,295.2068965517241" class="lost-s"/>
  <text x="388" y="264" text-anchor="end" class="ink n mono">201 Created</text>
  <circle cx="110" cy="330" r="4" class="ink"/>
  <text x="100" y="334" text-anchor="end" class="ink2 n">retry later</text>
  <line x1="110" y1="356" x2="397" y2="380" class="focus-s" marker-end="url(#arrow)"/>
  <text x="122" y="350" class="focus n mono">POST, key k1  (attempt 3)</text>
  <rect x="480" y="362" width="220" height="46" rx="6" class="safe-box"/>
  <text x="492" y="382" class="ink n b">found finished</text>
  <text x="492" y="399" class="ink2 n">replay stored response</text>
  <line x1="402" y1="385.0" x2="478" y2="385.0" class="line" stroke-dasharray="3 3"/>
  <line x1="400" y1="400" x2="113" y2="426" class="line" marker-end="url(#arrow)"/>
  <text x="388" y="394" text-anchor="end" class="ink n mono">201 Created (stored)</text>
  <text x="400" y="462" text-anchor="middle" class="ink n">One charge in total. Attempt 2 did no work; attempt 3 got the saved answer.</text>
</svg>
