<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  
  <rect x="40" y="110" width="140" height="50" rx="6" class="box"/>
  <text x="110" y="140" text-anchor="middle" class="ink t b">Client</text>
  <rect x="470" y="20" width="120" height="36" rx="6" class="safe-box"/>
  <text x="530" y="43" text-anchor="middle" class="ink t b">Redis A</text>
  <line x1="182" y1="135" x2="466" y2="38" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="43" class="ink n b">OK</text>
  <rect x="470" y="70" width="120" height="36" rx="6" class="safe-box"/>
  <text x="530" y="93" text-anchor="middle" class="ink t b">Redis B</text>
  <line x1="182" y1="135" x2="466" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="93" class="ink n b">OK</text>
  <rect x="470" y="120" width="120" height="36" rx="6" class="safe-box"/>
  <text x="530" y="143" text-anchor="middle" class="ink t b">Redis C</text>
  <line x1="182" y1="135" x2="466" y2="138" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="143" class="ink n b">OK</text>
  <rect x="470" y="170" width="120" height="36" rx="6" class="box"/>
  <text x="530" y="193" text-anchor="middle" class="ink t b">Redis D</text>
  <line x1="182" y1="135" x2="466" y2="188" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="193" class="lost n b">no answer</text>
  <rect x="470" y="220" width="120" height="36" rx="6" class="box"/>
  <text x="530" y="243" text-anchor="middle" class="ink t b">Redis E</text>
  <line x1="182" y1="135" x2="466" y2="238" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="243" class="lost n b">no answer</text>
  <text x="200" y="60" text-anchor="middle" class="ink n mono">SET key val NX PX ttl</text>
  <text x="300" y="228" text-anchor="middle" class="ink2 n">same key and random value,</text>
  <text x="300" y="243" text-anchor="middle" class="ink2 n">sent to all five in parallel</text>
  <text x="40" y="200" class="focus n b">3 of 5 is a majority:</text>
  <text x="40" y="215" class="focus n b">lock acquired</text>
  <text x="40" y="286" class="ink t b">The lock's time-to-live</text>
  <rect x="40" y="300" width="130" height="34" rx="6" class="box"/>
  <text x="105" y="321" text-anchor="middle" class="ink2 n">time spent acquiring</text>
  <rect x="170" y="300" width="420" height="34" rx="6" class="box"/>
  <rect x="170" y="300" width="420" height="34" rx="6" class="focus-s"/>
  <text x="380" y="321" text-anchor="middle" class="focus n b">validity time: the client may work</text>
  <rect x="590" y="300" width="90" height="34" rx="6" class="box"/>
  <text x="635" y="315" text-anchor="middle" class="ink2 n">clock drift</text>
  <text x="635" y="328" text-anchor="middle" class="ink2 n">allowance</text>
  <text x="40" y="356" class="ink2 n">start: clock read before the first request</text>
  <text x="680" y="356" text-anchor="end" class="ink2 n">first key expires</text>
  <line x1="40" y1="372" x2="690" y2="372" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="390" class="ink2 n">time</text>
  </svg>
