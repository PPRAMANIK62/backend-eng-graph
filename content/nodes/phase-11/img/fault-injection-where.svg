<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<rect x="16" y="150" width="170" height="64" rx="6" class="box"/>
<text x="101" y="176" text-anchor="middle" class="ink t b">Test clients</text>
<text x="101" y="196" text-anchor="middle" class="ink2 n">record each op's start, end</text>
<rect x="16" y="300" width="170" height="64" rx="6" class="box"/>
<text x="101" y="326" text-anchor="middle" class="ink t b">Checker</text>
<text x="101" y="346" text-anchor="middle" class="ink2 n">is the history valid?</text>
<line x1="101" y1="216" x2="101" y2="297" class="focus-s" marker-end="url(#arrow)"/>
<text x="108" y="262" text-anchor="start" class="focus n b">history</text>
<rect x="222" y="162" width="112" height="40" rx="6" class="box"/>
<text x="278" y="187" text-anchor="middle" class="ink n b">Toxiproxy</text>
<line x1="188" y1="182" x2="219" y2="182" class="line" marker-end="url(#arrow)"/>
<rect x="16" y="40" width="170" height="64" rx="6" class="box"/>
<text x="101" y="66" text-anchor="middle" class="ink t b">Nemesis</text>
<text x="101" y="86" text-anchor="middle" class="ink2 n">schedules the faults</text>
<line x1="188" y1="72" x2="369" y2="72" class="line" marker-end="url(#arrow)"/>
<text x="278" y="64" text-anchor="middle" class="ink2 n">inject, heal</text>
<rect x="372" y="24" width="330" height="170" rx="6" class="box"/>
<text x="388" y="48" text-anchor="start" class="ink t b">Node A</text>
<text x="388" y="76" text-anchor="start" class="ink n b">Process</text>
<text x="452" y="76" text-anchor="start" class="lost n mono">kill -9 (crash), SIGSTOP (pause)</text>
<text x="388" y="106" text-anchor="start" class="ink n b">Clock</text>
<text x="452" y="106" text-anchor="start" class="lost n mono">NTP off, then bump or strobe</text>
<text x="388" y="136" text-anchor="start" class="ink n b">Disk</text>
<text x="452" y="136" text-anchor="start" class="lost n mono">bit flips, truncation, LazyFS</text>
<text x="388" y="172" text-anchor="start" class="ink n b">Network card</text>
<text x="478" y="172" text-anchor="start" class="lost n mono">tc netem: delay, loss, reorder</text>
<line x1="336" y1="182" x2="369" y2="160" class="line" marker-end="url(#arrow)"/>
<text x="342" y="236" text-anchor="start" class="lost n mono">latency, timeout,</text>
<text x="342" y="252" text-anchor="start" class="lost n mono">reset, bandwidth</text>
<line x1="300" y1="204" x2="340" y2="228" class="line"/>
<rect x="372" y="290" width="330" height="110" rx="6" class="box"/>
<text x="388" y="314" text-anchor="start" class="ink t b">Node B</text>
<text x="388" y="344" text-anchor="start" class="lost n mono">iptables -A INPUT -s A -j DROP</text>
<text x="388" y="364" text-anchor="start" class="ink2 n">drops all traffic from A; the mirror rule</text>
<text x="388" y="384" text-anchor="start" class="ink2 n">on A makes it a full partition</text>
<line x1="600" y1="196" x2="600" y2="287" class="lost-s" stroke-dasharray="6 5" style="stroke-width:2"/>
<text x="600" y="248" text-anchor="middle" class="lost t b">✕</text>
<text x="614" y="248" text-anchor="start" class="ink2 n">cut link</text>
</svg>