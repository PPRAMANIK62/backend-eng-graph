<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
    .lost-net{stroke:#eb6834;stroke-width:1.5;fill:none;stroke-dasharray:4}
    @media (prefers-color-scheme: dark){ .lost-net{stroke:#d95926} }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="110" y="24" text-anchor="middle" class="ink t b">Monolith</text>
  <rect x="10" y="36" width="200" height="188" rx="6" class="box"/>
  <text x="22" y="56" class="ink2 n">one process, one deploy</text>
  <rect x="24" y="72" width="80" height="44" rx="6" class="line"/>
  <text x="64" y="99" text-anchor="middle" class="ink n">catalogue</text>
  <rect x="116" y="72" width="80" height="44" rx="6" class="line"/>
  <text x="156" y="99" text-anchor="middle" class="ink n">orders</text>
  <rect x="24" y="150" width="80" height="44" rx="6" class="line"/>
  <text x="64" y="177" text-anchor="middle" class="ink n">payments</text>
  <rect x="116" y="150" width="80" height="44" rx="6" class="line"/>
  <text x="156" y="177" text-anchor="middle" class="ink n">shipping</text>
  <line x1="104" y1="94" x2="116" y2="94" class="line"/>
  <line x1="64" y1="116" x2="64" y2="150" class="line"/>
  <line x1="156" y1="116" x2="156" y2="150" class="line"/>
  <line x1="110" y1="224" x2="110" y2="244" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="246" width="160" height="36" rx="6" class="box"/>
  <text x="110" y="269" text-anchor="middle" class="ink n">one shared database</text>
  <text x="110" y="300" text-anchor="middle" class="ink2 n">any module can read</text>
  <text x="110" y="316" text-anchor="middle" class="ink2 n">any table</text>
  <text x="355" y="24" text-anchor="middle" class="ink t b">Modular monolith</text>
  <rect x="255" y="36" width="200" height="188" rx="6" class="box"/>
  <text x="267" y="56" class="ink2 n">one process, one deploy</text>
  <rect x="269" y="72" width="80" height="44" rx="6" class="focus-s"/>
  <text x="309" y="99" text-anchor="middle" class="ink n">catalogue</text>
  <rect x="361" y="72" width="80" height="44" rx="6" class="focus-s"/>
  <text x="401" y="99" text-anchor="middle" class="ink n">orders</text>
  <rect x="269" y="150" width="80" height="44" rx="6" class="focus-s"/>
  <text x="309" y="177" text-anchor="middle" class="ink n">payments</text>
  <rect x="361" y="150" width="80" height="44" rx="6" class="focus-s"/>
  <text x="401" y="177" text-anchor="middle" class="ink n">shipping</text>
  <line x1="349" y1="94" x2="361" y2="94" class="line"/>
  <line x1="309" y1="116" x2="309" y2="150" class="line"/>
  <line x1="401" y1="116" x2="401" y2="150" class="line"/>
  <line x1="355" y1="224" x2="355" y2="244" class="line" marker-end="url(#arrow)"/>
  <rect x="275" y="246" width="160" height="36" rx="6" class="box"/>
  <line x1="315" y1="246" x2="315" y2="282" class="line"/>
  <line x1="355" y1="246" x2="355" y2="282" class="line"/>
  <line x1="395" y1="246" x2="395" y2="282" class="line"/>
  <text x="355" y="300" text-anchor="middle" class="ink2 n">one database, but each</text>
  <text x="355" y="316" text-anchor="middle" class="ink2 n">module owns its own tables</text>
  <text x="600" y="24" text-anchor="middle" class="ink t b">Microservices</text>
  <rect x="496" y="40" width="90" height="44" rx="6" class="box"/>
  <text x="541" y="67" text-anchor="middle" class="ink n">orders</text>
  <rect x="536" y="92" width="50" height="24" rx="6" class="box"/>
  <text x="561" y="109" text-anchor="middle" class="ink2 n">data</text>
  <line x1="561" y1="84" x2="561" y2="92" class="line"/>
  <rect x="614" y="40" width="90" height="44" rx="6" class="box"/>
  <text x="659" y="67" text-anchor="middle" class="ink n">payments</text>
  <rect x="654" y="92" width="50" height="24" rx="6" class="box"/>
  <text x="679" y="109" text-anchor="middle" class="ink2 n">data</text>
  <line x1="679" y1="84" x2="679" y2="92" class="line"/>
  <rect x="496" y="168" width="90" height="44" rx="6" class="box"/>
  <text x="541" y="195" text-anchor="middle" class="ink n">shipping</text>
  <rect x="536" y="220" width="50" height="24" rx="6" class="box"/>
  <text x="561" y="237" text-anchor="middle" class="ink2 n">data</text>
  <line x1="561" y1="212" x2="561" y2="220" class="line"/>
  <rect x="614" y="168" width="90" height="44" rx="6" class="box"/>
  <text x="659" y="195" text-anchor="middle" class="ink n">catalogue</text>
  <rect x="654" y="220" width="50" height="24" rx="6" class="box"/>
  <text x="679" y="237" text-anchor="middle" class="ink2 n">data</text>
  <line x1="679" y1="212" x2="679" y2="220" class="line"/>
  <path d="M586 56 H612" class="lost-net" marker-end="url(#arrow)"/>
  <path d="M512 84 V166" class="lost-net" marker-end="url(#arrow)"/>
  <path d="M586 76 L612 180" class="lost-net" marker-end="url(#arrow)"/>
  <text x="600" y="272" text-anchor="middle" class="lost n b">every arrow is a network call:</text>
  <text x="600" y="288" text-anchor="middle" class="lost n b">it can be slow or fail</text>
  <text x="600" y="316" text-anchor="middle" class="ink2 n">own process, data and deploy each</text>
</svg>
