<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

<text x="360" y="26" text-anchor="middle" class="ink n mono">SELECT id FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED</text>
<text x="360" y="46" text-anchor="middle" class="ink2 n">each worker runs this in its own transaction, at the same moment</text>
<text x="350.0" y="76" text-anchor="middle" class="ink2 n">jobs table</text>
<rect x="250" y="84" width="200" height="44" rx="6" class="box"/>
<rect x="250" y="84" width="200" height="44" rx="6" class="focus-s" style="stroke-width:3"/>
<text x="264" y="103" class="ink t b">job 1</text>
<text x="264" y="120" class="ink2 n">send welcome email</text>
<text x="438" y="103" text-anchor="end" class="focus n b">locked by A</text>
<rect x="250" y="138" width="200" height="44" rx="6" class="box"/>
<rect x="250" y="138" width="200" height="44" rx="6" class="focus-s" style="stroke-width:3"/>
<text x="264" y="157" class="ink t b">job 2</text>
<text x="264" y="174" class="ink2 n">resize avatar</text>
<text x="438" y="157" text-anchor="end" class="focus n b">locked by B</text>
<rect x="250" y="192" width="200" height="44" rx="6" class="box"/>
<rect x="250" y="192" width="200" height="44" rx="6" class="focus-s" style="stroke-width:3"/>
<text x="264" y="211" class="ink t b">job 3</text>
<text x="264" y="228" class="ink2 n">charge invoice</text>
<text x="438" y="211" text-anchor="end" class="focus n b">locked by C</text>
<rect x="250" y="246" width="200" height="44" rx="6" class="box"/>
<text x="264" y="265" class="ink t b">job 4</text>
<text x="264" y="282" class="ink2 n">send receipt</text>
<text x="438" y="265" text-anchor="end" class="ink2 n">ready</text>
<rect x="250" y="300" width="200" height="44" rx="6" class="box"/>
<text x="264" y="319" class="ink t b">job 5</text>
<text x="264" y="336" class="ink2 n">rebuild search index</text>
<text x="438" y="319" text-anchor="end" class="ink2 n">ready</text>
<rect x="30" y="84" width="140" height="44" rx="6" class="box"/>
<text x="100" y="111" text-anchor="middle" class="ink t b">Worker A</text>
<line x1="172" y1="106" x2="246" y2="106" class="line" marker-end="url(#arrow)"/>
<rect x="30" y="138" width="140" height="44" rx="6" class="box"/>
<text x="100" y="165" text-anchor="middle" class="ink t b">Worker B</text>
<line x1="172" y1="160" x2="246" y2="160" class="line" marker-end="url(#arrow)"/>
<rect x="30" y="192" width="140" height="44" rx="6" class="box"/>
<text x="100" y="219" text-anchor="middle" class="ink t b">Worker C</text>
<line x1="172" y1="214" x2="246" y2="214" class="line" marker-end="url(#arrow)"/>
<text x="472" y="103" class="ink n b">job 1 is free:</text>
<text x="472" y="120" class="ink2 n">lock it and take it</text>
<text x="472" y="157" class="ink n b">job 1 is locked:</text>
<text x="472" y="174" class="ink2 n">skip it, lock job 2</text>
<text x="472" y="211" class="ink n b">jobs 1 and 2 are locked:</text>
<text x="472" y="228" class="ink2 n">skip both, lock job 3</text>
<text x="472" y="265" class="ink2 n">nobody waits on anybody;</text>
<text x="472" y="282" class="ink2 n">jobs 4 and 5 go to the next free worker</text>
<text x="360" y="372" text-anchor="middle" class="ink2 n">Without SKIP LOCKED, B and C would both wait on job 1's lock until A's transaction ends.</text>
</svg>