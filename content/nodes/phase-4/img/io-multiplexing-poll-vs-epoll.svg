<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- left: poll -->
  <text x="20" y="28" class="ink t b">poll / select: the whole list, every call</text>
  <text x="20" y="62" class="ink2 n">your program</text>
  <g>
    <rect x="20" y="72" width="36" height="28" rx="6" class="box"/><text x="38" y="91" text-anchor="middle" class="ink n mono">3</text>
    <rect x="60" y="72" width="36" height="28" rx="6" class="box"/><text x="78" y="91" text-anchor="middle" class="ink n mono">4</text>
    <rect x="100" y="72" width="36" height="28" rx="6" class="box"/><text x="118" y="91" text-anchor="middle" class="ink n mono">5</text>
    <rect x="140" y="72" width="36" height="28" rx="6" class="box"/><text x="158" y="91" text-anchor="middle" class="ink n mono">6</text>
    <rect x="180" y="72" width="36" height="28" rx="6" class="box"/><text x="198" y="91" text-anchor="middle" class="ink n mono">7</text>
    <rect x="220" y="72" width="36" height="28" rx="6" class="box"/><text x="238" y="91" text-anchor="middle" class="ink n mono">8</text>
    <text x="268" y="91" class="ink2 n">… N fds</text>
  </g>
  <line x1="20" y1="126" x2="330" y2="126" class="line" stroke-dasharray="4 4"/>
  <text x="336" y="130" class="ink2 n">kernel</text>
  <line x1="80" y1="104" x2="80" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="90" y="142" class="ink n">1  copy all N in</text>
  <rect x="20" y="166" width="296" height="32" rx="6" class="box"/>
  <text x="168" y="187" text-anchor="middle" class="ink n">2  check every fd (again after a wakeup)</text>
  <line x1="300" y1="162" x2="300" y2="106" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="158" text-anchor="end" class="ink n">3  copy all N out</text>
  <line x1="20" y1="212" x2="330" y2="212" class="line" stroke-dasharray="4 4"/>
  <text x="20" y="232" class="ink2 n">back in your program</text>
  <rect x="20" y="240" width="296" height="32" rx="6" class="box"/>
  <text x="168" y="261" text-anchor="middle" class="ink n">4  scan all N to find the ready few</text>
  <text x="20" y="300" class="ink2 n">Work grows with every fd you watch, busy or idle.</text>

  <!-- divider -->
  <line x1="372" y1="16" x2="372" y2="306" class="line"/>

  <!-- right: epoll -->
  <text x="390" y="28" class="ink t b">epoll: register once, get back the ready ones</text>
  <text x="390" y="62" class="ink2 n">your program</text>
  <rect x="390" y="72" width="140" height="28" rx="6" class="box"/>
  <text x="460" y="91" text-anchor="middle" class="ink n mono">epoll_ctl(ADD, fd)</text>
  <rect x="560" y="72" width="140" height="28" rx="6" class="box"/>
  <text x="630" y="91" text-anchor="middle" class="ink n mono">epoll_wait()</text>
  <line x1="390" y1="126" x2="700" y2="126" class="line" stroke-dasharray="4 4"/>
  <line x1="460" y1="104" x2="460" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="150" class="ink n">once per fd</text>
  <rect x="390" y="166" width="140" height="88" rx="6" class="box"/>
  <text x="460" y="186" text-anchor="middle" class="ink n b">interest list</text>
  <text x="460" y="208" text-anchor="middle" class="ink n mono">3 4 5 6 7 8 …</text>
  <text x="460" y="228" text-anchor="middle" class="ink2 n">every fd you</text>
  <text x="460" y="244" text-anchor="middle" class="ink2 n">registered</text>
  <line x1="534" y1="210" x2="556" y2="210" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="560" y="166" width="140" height="88" rx="6" class="box"/>
  <text x="630" y="186" text-anchor="middle" class="ink n b">ready list</text>
  <text x="630" y="208" text-anchor="middle" class="focus n mono b">5 8</text>
  <text x="630" y="228" text-anchor="middle" class="ink2 n">filled by the kernel</text>
  <text x="630" y="244" text-anchor="middle" class="ink2 n">as data arrives</text>
  <line x1="660" y1="162" x2="660" y2="106" class="focus-s" marker-end="url(#arrow)"/>
  <text x="652" y="150" text-anchor="end" class="focus n b">only 5 and 8</text>
  <text x="390" y="300" class="ink2 n">epoll_wait hands back only what is on the ready list.</text>
</svg>
