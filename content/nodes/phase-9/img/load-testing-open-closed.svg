<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
<text x="20" y="30" class="ink t b">Closed: a fixed number of clients</text>
<rect x="40" y="60" width="130" height="40" rx="6" class="box"/>
<text x="105" y="85" text-anchor="middle" class="ink t">N clients</text>
<line x1="172" y1="80" x2="286" y2="80" class="line" marker-end="url(#arrow)"/>
<text x="229" y="72" text-anchor="middle" class="ink2 n">send</text>
<rect x="290" y="60" width="120" height="40" rx="6" class="box"/>
<line x1="388" y1="66" x2="388" y2="94" class="line"/>
<line x1="366" y1="66" x2="366" y2="94" class="line"/>
<line x1="344" y1="66" x2="344" y2="94" class="line"/>
<text x="320" y="85" text-anchor="middle" class="ink2 n">queue</text>
<line x1="412" y1="80" x2="470" y2="80" class="line" marker-end="url(#arrow)"/>
<circle cx="500" cy="80" r="26" class="box"/>
<text x="500" y="85" text-anchor="middle" class="ink n b">server</text>
<path d="M526,80 H600 V140 H105 V104" class="line" marker-end="url(#arrow)"/>
<text x="350" y="160" text-anchor="middle" class="ink2 n">each client waits for its reply (and maybe thinks) before sending again</text>
<text x="610" y="84" class="focus n b">slow server,</text>
<text x="610" y="100" class="focus n b">fewer sends</text>
<text x="20" y="210" class="ink t b">Open: requests arrive on their own schedule</text>
<line x1="60" y1="236" x2="286" y2="250" class="line" marker-end="url(#arrow)"/>
<line x1="60" y1="256" x2="286" y2="255" class="line" marker-end="url(#arrow)"/>
<line x1="60" y1="276" x2="286" y2="260" class="line" marker-end="url(#arrow)"/>
<line x1="60" y1="296" x2="286" y2="265" class="line" marker-end="url(#arrow)"/>
<line x1="60" y1="316" x2="286" y2="270" class="line" marker-end="url(#arrow)"/>
<text x="40" y="340" class="ink2 n">new arrivals at a set rate, whatever the server is doing</text>
<rect x="290" y="240" width="120" height="40" rx="6" class="box"/>
<line x1="388" y1="246" x2="388" y2="274" class="line"/>
<line x1="366" y1="246" x2="366" y2="274" class="line"/>
<line x1="344" y1="246" x2="344" y2="274" class="line"/>
<text x="320" y="265" text-anchor="middle" class="ink2 n">queue</text>
<line x1="412" y1="260" x2="470" y2="260" class="line" marker-end="url(#arrow)"/>
<circle cx="500" cy="260" r="26" class="box"/>
<text x="500" y="265" text-anchor="middle" class="ink n b">server</text>
<line x1="526" y1="260" x2="600" y2="260" class="line" marker-end="url(#arrow)"/>
<text x="610" y="264" class="ink2 n">leave</text>
<text x="610" y="296" class="lost n b">slow server,</text>
<text x="610" y="312" class="lost n b">queue grows</text>
</svg>
