  <line x1="470" y1="132" x2="444" y2="132" class="line" marker-end="url(#arrow)"/>
  <text x="432" y="136" text-anchor="middle" class="ink2 n b">7</text>
  <line x1="422" y1="132" x2="396" y2="132" class="line" marker-end="url(#arrow)"/>
  <text x="384" y="136" text-anchor="middle" class="ink2 n b">6</text>
