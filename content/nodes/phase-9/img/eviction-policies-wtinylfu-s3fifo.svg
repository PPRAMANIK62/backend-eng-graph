<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="26" text-anchor="start" class="ink t b">W-TinyLFU</text>
  <text x="20" y="64" text-anchor="start" class="ink2 n">New item</text>
  <line x1="80" y1="60" x2="112" y2="60" class="line" marker-end="url(#arrow)"/>
  <rect x="115" y="40" width="120" height="42" rx="6" class="box"/>
  <text x="175.0" y="57" text-anchor="middle" class="ink n">Window LRU</text>
  <text x="175.0" y="73" text-anchor="middle" class="ink n">small</text>
  <line x1="235" y1="60" x2="282" y2="60" class="line" marker-end="url(#arrow)"/>
  <text x="258" y="52" text-anchor="middle" class="ink2 n">victim</text>
  <rect x="285" y="36" width="150" height="50" rx="6" class="box"/>
  <text x="360.0" y="57" text-anchor="middle" class="focus n">TinyLFU filter</text>
  <text x="360.0" y="73" text-anchor="middle" class="focus n">keeps the more frequent</text>
  <line x1="435" y1="60" x2="482" y2="60" class="line" marker-end="url(#arrow)"/>
  <rect x="485" y="30" width="215" height="62" rx="6" class="box"/>
  <text x="592" y="48" text-anchor="middle" class="ink n b">Main: segmented LRU</text>
  <rect x="495" y="56" width="70" height="28" rx="6" class="box"/>
  <text x="530" y="74" text-anchor="middle" class="ink n">probation</text>
  <rect x="572" y="56" width="120" height="28" rx="6" class="safe-box"/>
  <text x="632" y="74" text-anchor="middle" class="ink n">protected, 80%</text>
  <path d="M530,92 V118 H360 V89" class="line" marker-end="url(#arrow)"/>
  <text x="445" y="134" text-anchor="middle" class="ink2 n">main's victim competes too</text>
  <line x1="360" y1="36" x2="360" y2="14" class="line" marker-end="url(#arrow)"/>
  <text x="372" y="20" text-anchor="start" class="lost n">loser is evicted</text>
  <text x="20" y="180" text-anchor="start" class="ink t b">S3-FIFO</text>
  <text x="20" y="224" text-anchor="start" class="ink2 n">New item</text>
  <line x1="80" y1="220" x2="112" y2="220" class="line" marker-end="url(#arrow)"/>
  <rect x="115" y="198" width="130" height="44" rx="6" class="box"/>
  <text x="180.0" y="216" text-anchor="middle" class="ink n">Small FIFO</text>
  <text x="180.0" y="232" text-anchor="middle" class="ink n">10%</text>
  <line x1="245" y1="220" x2="452" y2="220" class="line" marker-end="url(#arrow)"/>
  <text x="348" y="212" text-anchor="middle" class="ink n">hit again: move</text>
  <rect x="455" y="198" width="160" height="44" rx="6" class="safe-box"/>
  <text x="535.0" y="216" text-anchor="middle" class="ink n">Main FIFO</text>
  <text x="535.0" y="232" text-anchor="middle" class="ink n">90%</text>
  <path d="M615,210 H650 V184 H535 V195" class="line" marker-end="url(#arrow)"/>
  <text x="660" y="190" text-anchor="start" class="ink2 n">hit: reinsert</text>
  <line x1="615" y1="232" x2="680" y2="232" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="236" text-anchor="start" class="lost n">out</text>
  <line x1="180" y1="242" x2="180" y2="292" class="line" marker-end="url(#arrow)"/>
  <text x="190" y="272" text-anchor="start" class="lost n">not hit: drop value</text>
  <rect x="115" y="295" width="130" height="44" rx="6" class="box"/>
  <text x="180.0" y="313" text-anchor="middle" class="ink2 n">Ghost FIFO</text>
  <text x="180.0" y="329" text-anchor="middle" class="ink2 n">keys only</text>
  <path d="M245,317 H535 V245" class="line" marker-end="url(#arrow)"/>
  <text x="390" y="310" text-anchor="middle" class="ink n">key seen again: straight to main</text>
</svg>
