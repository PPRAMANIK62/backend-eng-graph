<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="30" class="ink t b">1. Stacks, in the order sampled</text>
  <text x="20" y="62" class="ink n mono">main;serve;handle;parse</text>
  <text x="20" y="84" class="ink n mono">main;serve;handle;query</text>
  <text x="20" y="106" class="ink n mono">main;serve;handle;parse</text>
  <text x="20" y="128" class="ink n mono">gc;mark</text>
  <text x="20" y="150" class="ink n mono">main;serve;handle;render</text>
  <text x="20" y="172" class="ink n mono">main;serve;handle;parse</text>
  <text x="20" y="194" class="ink n mono">main;serve;handle;query</text>
  <text x="20" y="216" class="ink n mono">main;serve;handle;parse</text>
  <text x="20" y="250" class="ink2 n">one line per sample, root first</text>
  <line x1="215" y1="140" x2="285" y2="140" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="128" text-anchor="middle" class="ink2 n">sort, merge</text>
  <text x="300" y="30" class="ink t b">2. Flame graph</text>
  <rect x="320" y="202" width="43" height="25" rx="3" class="box"/>
  <text x="341.5" y="219" text-anchor="middle" class="ink n mono">gc</text>
  <rect x="320" y="174" width="43" height="25" rx="3" class="box"/>
  <text x="341.5" y="191" text-anchor="middle" class="ink n mono">mark</text>
  <rect x="365" y="202" width="313" height="25" rx="3" class="box"/>
  <text x="521.5" y="219" text-anchor="middle" class="ink n mono">main</text>
  <rect x="365" y="174" width="313" height="25" rx="3" class="box"/>
  <text x="521.5" y="191" text-anchor="middle" class="ink n mono">serve</text>
  <rect x="365" y="146" width="313" height="25" rx="3" class="box"/>
  <text x="521.5" y="163" text-anchor="middle" class="ink n mono">handle</text>
  <rect x="365" y="118" width="178" height="25" rx="3" class="box"/>
  <text x="454.0" y="135" text-anchor="middle" class="ink n mono">parse</text>
  <rect x="545" y="118" width="88" height="25" rx="3" class="box"/>
  <text x="589.0" y="135" text-anchor="middle" class="ink n mono">query</text>
  <rect x="635" y="118" width="43" height="25" rx="3" class="box"/>
  <text x="656.5" y="135" text-anchor="middle" class="ink n mono">render</text>
  <rect x="364" y="117" width="180" height="27" rx="3" class="focus-s" style="stroke-width:2.5"/>
  <text x="455" y="106" text-anchor="middle" class="ink n">widest top edge: most CPU time</text>
  <line x1="308" y1="230" x2="308" y2="112" class="line" marker-end="url(#arrow)"/>
  <text x="302" y="174" text-anchor="middle" class="ink2 n" transform="rotate(-90 302 174)">stack depth</text>
  <line x1="320" y1="240" x2="680" y2="240" class="line" marker-end="url(#arrow)"/>
  <text x="320" y="260" class="ink2 n">width = share of samples; order = alphabetical, not time</text>
</svg>
