<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- app -->
  <rect x="20" y="56" width="110" height="56" rx="6" class="box"/>
  <text x="75" y="80" text-anchor="middle" class="ink t b">App</text>
  <text x="75" y="98" text-anchor="middle" class="ink2 n">one write</text>
  <line x1="132" y1="84" x2="176" y2="84" class="line" marker-end="url(#arrow)"/>

  <!-- postgres -->
  <rect x="180" y="16" width="220" height="146" rx="6" class="box"/>
  <text x="290" y="38" text-anchor="middle" class="ink t b">Postgres</text>
  <rect x="194" y="50" width="192" height="30" rx="6" class="safe-box"/>
  <text x="290" y="70" text-anchor="middle" class="ink n">tables (source of truth)</text>
  <text x="290" y="100" text-anchor="middle" class="ink n">WAL, in commit order</text>
  <rect x="194" y="114" width="192" height="36" rx="6" class="box"/>
  <text x="290" y="137" text-anchor="middle" class="focus n b">slot + pgoutput</text>

  <!-- debezium -->
  <line x1="402" y1="132" x2="456" y2="132" class="line" marker-end="url(#arrow)"/>
  <rect x="460" y="70" width="240" height="92" rx="6" class="box"/>
  <text x="580" y="94" text-anchor="middle" class="ink t b">Debezium connector</text>
  <text x="580" y="112" text-anchor="middle" class="ink2 n">in Kafka Connect</text>
  <text x="580" y="132" text-anchor="middle" class="ink2 n">builds one event per row change</text>
  <text x="580" y="150" text-anchor="middle" class="ink2 n mono">offset = last LSN sent</text>

  <!-- kafka -->
  <path d="M580,164 V200 H340 V218" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="222" width="380" height="120" rx="6" class="box"/>
  <text x="36" y="246" class="ink t b">Kafka, one topic per table</text>
  <rect x="36" y="258" width="348" height="30" rx="6" class="box"/>
  <text x="48" y="278" class="focus n mono">server.public.orders</text>
  <rect x="36" y="296" width="348" height="30" rx="6" class="box"/>
  <text x="48" y="316" class="focus n mono">server.public.customers</text>
  <text x="380" y="246" text-anchor="end" class="ink2 n">key = primary key</text>

  <!-- consumers -->
  <rect x="470" y="222" width="230" height="34" rx="6" class="box"/>
  <text x="585" y="244" text-anchor="middle" class="ink n">search indexer</text>
  <rect x="470" y="266" width="230" height="34" rx="6" class="box"/>
  <text x="585" y="288" text-anchor="middle" class="ink n">cache updater</text>
  <rect x="470" y="310" width="230" height="34" rx="6" class="box"/>
  <text x="585" y="332" text-anchor="middle" class="ink n">warehouse loader</text>
  <line x1="402" y1="282" x2="466" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="402" y1="282" x2="466" y2="283" class="line" marker-end="url(#arrow)"/>
  <line x1="402" y1="282" x2="466" y2="326" class="line" marker-end="url(#arrow)"/>
  <text x="585" y="366" text-anchor="middle" class="ink2 n">each reads at its own pace</text>
</svg>
