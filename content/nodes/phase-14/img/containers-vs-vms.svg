<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="185" y="26" text-anchor="middle" class="ink t b">Virtual machines</text>
  <text x="535" y="26" text-anchor="middle" class="focus t b">Containers</text>

  <!-- VM side -->
  <rect x="20" y="300" width="330" height="40" rx="6" class="box"/>
  <text x="185" y="325" text-anchor="middle" class="ink t">Hardware</text>
  <rect x="20" y="250" width="330" height="40" rx="6" class="box"/>
  <text x="185" y="275" text-anchor="middle" class="ink t">Host kernel</text>
  <rect x="20" y="200" width="330" height="40" rx="6" class="box"/>
  <text x="185" y="225" text-anchor="middle" class="ink t">Hypervisor (virtual hardware)</text>
  <rect x="20" y="44" width="158" height="146" rx="6" class="line"/>
  <rect x="192" y="44" width="158" height="146" rx="6" class="line"/>
  <text x="99" y="64" text-anchor="middle" class="ink2 n">VM 1</text>
  <text x="271" y="64" text-anchor="middle" class="ink2 n">VM 2</text>
  <rect x="32" y="74" width="134" height="40" rx="6" class="box"/>
  <text x="99" y="99" text-anchor="middle" class="ink n">app processes</text>
  <rect x="32" y="130" width="134" height="46" rx="6" class="box"/>
  <text x="99" y="150" text-anchor="middle" class="ink n b">guest kernel</text>
  <text x="99" y="167" text-anchor="middle" class="ink2 n">its own</text>
  <rect x="204" y="74" width="134" height="40" rx="6" class="box"/>
  <text x="271" y="99" text-anchor="middle" class="ink n">app processes</text>
  <rect x="204" y="130" width="134" height="46" rx="6" class="box"/>
  <text x="271" y="150" text-anchor="middle" class="ink n b">guest kernel</text>
  <text x="271" y="167" text-anchor="middle" class="ink2 n">its own</text>

  <!-- container side -->
  <rect x="370" y="300" width="330" height="40" rx="6" class="box"/>
  <text x="535" y="325" text-anchor="middle" class="ink t">Hardware</text>
  <rect x="370" y="250" width="330" height="40" rx="6" class="box"/>
  <text x="535" y="275" text-anchor="middle" class="ink t b">One Linux kernel, shared by all</text>
  <rect x="370" y="44" width="158" height="146" rx="6" class="focus-s" stroke-dasharray="6 4"/>
  <rect x="542" y="44" width="158" height="146" rx="6" class="focus-s" stroke-dasharray="6 4"/>
  <text x="449" y="64" text-anchor="middle" class="ink2 n">container 1</text>
  <text x="621" y="64" text-anchor="middle" class="ink2 n">container 2</text>
  <rect x="382" y="74" width="134" height="40" rx="6" class="box"/>
  <text x="449" y="99" text-anchor="middle" class="ink n">app processes</text>
  <text x="449" y="140" text-anchor="middle" class="ink2 n">namespaces</text>
  <text x="449" y="158" text-anchor="middle" class="ink2 n">cgroup limits</text>
  <text x="449" y="176" text-anchor="middle" class="ink2 n">overlay root fs</text>
  <rect x="554" y="74" width="134" height="40" rx="6" class="box"/>
  <text x="621" y="99" text-anchor="middle" class="ink n">app processes</text>
  <text x="621" y="140" text-anchor="middle" class="ink2 n">namespaces</text>
  <text x="621" y="158" text-anchor="middle" class="ink2 n">cgroup limits</text>
  <text x="621" y="176" text-anchor="middle" class="ink2 n">overlay root fs</text>
  <line x1="449" y1="192" x2="449" y2="247" class="line" marker-end="url(#arrow)"/>
  <line x1="621" y1="192" x2="621" y2="247" class="line" marker-end="url(#arrow)"/>
  <text x="535" y="226" text-anchor="middle" class="ink2 n">system calls</text>
</svg>
