<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="focus"/>
    </marker>
  </defs>

  <!-- lane headers -->
  <text x="100" y="28" text-anchor="middle" class="ink t b">Your server</text>
  <text x="100" y="46" text-anchor="middle" class="ink2 n mono">192.0.2.10</text>
  <text x="420" y="28" text-anchor="middle" class="ink t b">Gateway</text>
  <text x="420" y="46" text-anchor="middle" class="ink2 n mono">192.0.2.1</text>
  <text x="640" y="28" text-anchor="middle" class="ink t b">Another host</text>
  <text x="640" y="46" text-anchor="middle" class="ink2 n mono">192.0.2.20</text>

  <!-- lifelines -->
  <line x1="100" y1="58" x2="100" y2="234" class="line" stroke-dasharray="4 4"/>
  <line x1="420" y1="58" x2="420" y2="290" class="line" stroke-dasharray="4 4"/>
  <line x1="640" y1="58" x2="640" y2="290" class="line" stroke-dasharray="4 4"/>

  <!-- 1: broadcast request -->
  <text x="260" y="88" text-anchor="middle" class="ink n mono">who has 192.0.2.1? tell 192.0.2.10</text>
  <line x1="100" y1="100" x2="416" y2="100" class="line" marker-end="url(#arrow)"/>
  <line x1="424" y1="100" x2="636" y2="100" class="line" marker-end="url(#arrow)"/>
  <text x="260" y="118" text-anchor="middle" class="ink2 n">request, broadcast to everyone</text>

  <!-- other host ignores -->
  <text x="630" y="140" text-anchor="end" class="ink2 n">not its address:</text>
  <text x="630" y="156" text-anchor="end" class="ink2 n">no reply</text>

  <!-- gateway learns -->
  <rect x="335" y="130" width="170" height="30" rx="6" class="safe-box"/>
  <text x="420" y="150" text-anchor="middle" class="ink n">learns the server's MAC</text>

  <!-- 2: unicast reply -->
  <text x="260" y="192" text-anchor="middle" class="focus n mono">192.0.2.1 is at aa:bb:cc:00:00:01</text>
  <line x1="420" y1="204" x2="104" y2="204" class="focus-s" marker-end="url(#arrow-f)"/>
  <text x="260" y="222" text-anchor="middle" class="ink2 n">reply, sent only to the asker</text>

  <!-- server caches and sends -->
  <rect x="10" y="240" width="190" height="30" rx="6" class="safe-box"/>
  <text x="105" y="260" text-anchor="middle" class="ink n">caches it, sends the packet</text>
</svg>
