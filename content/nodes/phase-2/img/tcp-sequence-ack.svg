<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="160" y="36" text-anchor="middle" class="ink t b">Client</text>
  <text x="560" y="36" text-anchor="middle" class="ink t b">Server</text>
  <line x1="160" y1="50" x2="160" y2="365" class="line"/>
  <line x1="560" y1="50" x2="560" y2="365" class="line"/>

  <!-- time axis -->
  <line x1="60" y1="60" x2="60" y2="360" class="line" marker-end="url(#arrow)"/>
  <text x="52" y="210" text-anchor="end" class="ink2 n">time</text>

  <!-- 1: seq 1 -->
  <line x1="160" y1="70" x2="557" y2="110" class="line" marker-end="url(#arrow)"/>
  <text x="260" y="72" text-anchor="middle" class="ink n mono">seq 1, 1000 bytes</text>

  <!-- 2: seq 1001 lost -->
  <line x1="160" y1="100" x2="376" y2="122" class="lost-s"/>
  <path d="M370,114 L386,130 M386,114 L370,130" class="lost-s"/>
  <text x="260" y="102" text-anchor="middle" class="lost n mono">seq 1001 (lost)</text>

  <!-- 3: seq 2001 -->
  <line x1="160" y1="130" x2="557" y2="170" class="line" marker-end="url(#arrow)"/>
  <text x="260" y="134" text-anchor="middle" class="ink n mono">seq 2001, 1000 bytes</text>

  <!-- 4: ACK 1001 -->
  <line x1="560" y1="115" x2="163" y2="155" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="119" text-anchor="middle" class="ink n mono">ACK 1001</text>

  <!-- server note -->
  <text x="572" y="168" class="ink2 n">holds 2001–3000,</text>
  <text x="572" y="184" class="ink2 n">still needs 1001</text>

  <!-- 5: ACK 1001 again -->
  <line x1="560" y1="190" x2="163" y2="230" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="194" text-anchor="middle" class="ink n mono">ACK 1001 again</text>

  <!-- 6: resend -->
  <line x1="160" y1="260" x2="557" y2="300" class="focus-s" marker-end="url(#arrow)"/>
  <text x="260" y="264" text-anchor="middle" class="focus n mono b">seq 1001, resent</text>

  <!-- 7: ACK 3001 -->
  <line x1="560" y1="310" x2="163" y2="350" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="314" text-anchor="middle" class="ink n mono">ACK 3001</text>
  <text x="572" y="314" class="ink2 n">everything</text>
  <text x="572" y="330" class="ink2 n">up to 3000</text>
</svg>
