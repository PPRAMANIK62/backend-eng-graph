<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="175" y="26" text-anchor="middle" class="ink t b">Client-side discovery</text>
  <rect x="20" y="50" width="120" height="40" rx="6" class="box"/>
  <text x="80" y="75" text-anchor="middle" class="ink t">Caller</text>
  <rect x="210" y="50" width="120" height="40" rx="6" class="box"/>
  <text x="270" y="75" text-anchor="middle" class="ink t">Registry</text>
  <line x1="140" y1="62" x2="207" y2="62" class="line" marker-end="url(#arrow)"/>
  <text x="174" y="54" text-anchor="middle" class="ink2 n">1. list?</text>
  <line x1="210" y1="80" x2="143" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="174" y="104" text-anchor="middle" class="ink2 n">2. three</text>
  <text x="174" y="118" text-anchor="middle" class="ink2 n">addresses</text>
  <rect x="12" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="60" y="272" text-anchor="middle" class="ink n">payments-1</text>
  <rect x="122" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="170" y="272" text-anchor="middle" class="ink n">payments-2</text>
  <rect x="232" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="280" y="272" text-anchor="middle" class="ink n">payments-3</text>
  <line x1="80" y1="90" x2="60" y2="247" class="focus-s" marker-end="url(#arrow)"/>
  <text x="88" y="170" class="focus n b">3. caller picks one</text>
  <line x1="360" y1="20" x2="360" y2="300" class="line" stroke-dasharray="4 4"/>
  <text x="545" y="26" text-anchor="middle" class="ink t b">Server-side discovery</text>
  <rect x="385" y="50" width="120" height="40" rx="6" class="box"/>
  <text x="445" y="75" text-anchor="middle" class="ink t">Caller</text>
  <rect x="390" y="150" width="150" height="40" rx="6" class="box"/>
  <text x="465" y="169" text-anchor="middle" class="ink n">Proxy or</text>
  <text x="465" y="184" text-anchor="middle" class="ink n">virtual IP</text>
  <rect x="590" y="150" width="110" height="40" rx="6" class="box"/>
  <text x="645" y="175" text-anchor="middle" class="ink t">Registry</text>
  <line x1="445" y1="90" x2="445" y2="147" class="line" marker-end="url(#arrow)"/>
  <text x="453" y="124" class="ink2 n">one stable address</text>
  <line x1="587" y1="170" x2="543" y2="170" class="line" marker-end="url(#arrow)"/>
  <rect x="378" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="426" y="272" text-anchor="middle" class="ink n">payments-1</text>
  <rect x="488" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="536" y="272" text-anchor="middle" class="ink n">payments-2</text>
  <rect x="598" y="250" width="96" height="34" rx="6" class="box"/>
  <text x="646" y="272" text-anchor="middle" class="ink n">payments-3</text>
  <line x1="465" y1="190" x2="536" y2="247" class="focus-s" marker-end="url(#arrow)"/>
  <text x="560" y="224" class="focus n b">forwards to one</text>
</svg>
