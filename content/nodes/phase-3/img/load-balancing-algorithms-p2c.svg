<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="250" y="16" width="220" height="44" rx="6" class="box"/>
  <text x="360" y="43" text-anchor="middle" class="ink t">Balancer: one new request</text>
  <rect x="110" y="110" width="100" height="36" rx="6" class="box"/>
  <text x="160" y="133" text-anchor="middle" class="ink t">A</text>
  <rect x="140" y="156" width="40" height="10" rx="2" class="box"/>
  <rect x="140" y="170" width="40" height="10" rx="2" class="box"/>
  <text x="160" y="202" text-anchor="middle" class="ink2 n">2 active</text>
  <rect x="260" y="110" width="100" height="36" rx="6" class="box"/>
  <rect x="260" y="110" width="100" height="36" rx="6" class="focus-s"/>
  <text x="310" y="133" text-anchor="middle" class="ink t b">B</text>
  <rect x="290" y="156" width="40" height="10" rx="2" class="box"/>
  <text x="310" y="188" text-anchor="middle" class="ink2 n">1 active</text>
  <rect x="410" y="110" width="100" height="36" rx="6" class="box"/>
  <text x="460" y="133" text-anchor="middle" class="ink t">C</text>
  <rect x="440" y="156" width="40" height="10" rx="2" class="box"/>
  <rect x="440" y="170" width="40" height="10" rx="2" class="box"/>
  <rect x="440" y="184" width="40" height="10" rx="2" class="box"/>
  <text x="460" y="216" text-anchor="middle" class="ink2 n">3 active</text>
  <rect x="560" y="110" width="100" height="36" rx="6" class="box"/>
  <text x="610" y="133" text-anchor="middle" class="ink t">D (slow)</text>
  <rect x="590" y="156" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="170" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="184" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="198" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="212" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="226" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="240" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="254" width="40" height="10" rx="2" class="box"/>
  <rect x="590" y="268" width="40" height="10" rx="2" class="box"/>
  <text x="610" y="300" text-anchor="middle" class="ink2 n">9 active</text>
  <line x1="330" y1="60" x2="310" y2="107" class="line" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <line x1="390" y1="60" x2="606" y2="107" class="line" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <text x="300" y="84" text-anchor="end" class="ink2 n">draw 1</text>
  <text x="520" y="78" class="ink2 n">draw 2</text>
  <text x="360" y="316" text-anchor="middle" class="focus n b">Compare the two draws: B has 1, D has 9. The request goes to B.</text>
</svg>
