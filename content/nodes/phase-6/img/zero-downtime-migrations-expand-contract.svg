<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="203" y="16" width="160" height="28" rx="6" class="box"/>
  <text x="283.0" y="35" text-anchor="middle" class="ink t b">Expand</text>
  <rect x="369" y="16" width="160" height="28" rx="6" class="box"/>
  <text x="449.0" y="35" text-anchor="middle" class="ink t b">Migrate</text>
  <rect x="535" y="16" width="160" height="28" rx="6" class="box"/>
  <text x="615.0" y="35" text-anchor="middle" class="ink t b">Contract</text>
  <text x="241.5" y="66" text-anchor="middle" class="ink n b">1</text>
  <text x="241.5" y="82" text-anchor="middle" class="ink2 n">add new</text>
  <text x="324.5" y="66" text-anchor="middle" class="ink n b">2</text>
  <text x="324.5" y="82" text-anchor="middle" class="ink2 n">write both</text>
  <text x="407.5" y="66" text-anchor="middle" class="ink n b">3</text>
  <text x="407.5" y="82" text-anchor="middle" class="ink2 n">backfill</text>
  <text x="490.5" y="66" text-anchor="middle" class="ink n b">4</text>
  <text x="490.5" y="82" text-anchor="middle" class="ink2 n">read new</text>
  <text x="573.5" y="66" text-anchor="middle" class="ink n b">5</text>
  <text x="573.5" y="82" text-anchor="middle" class="ink2 n">stop old write</text>
  <text x="656.5" y="66" text-anchor="middle" class="ink n b">6</text>
  <text x="656.5" y="82" text-anchor="middle" class="ink2 n">drop old</text>
  <text x="20" y="119" class="ink n">Column amount</text>
  <rect x="204" y="107" width="407" height="16" rx="4" class="old"/>
  <text x="20" y="149" class="ink n">Column amount_cents</text>
  <rect x="204" y="137" width="490" height="16" rx="4" class="focus"/>
  <text x="20" y="193" class="ink n">App writes amount</text>
  <rect x="204" y="181" width="324" height="16" rx="4" class="old"/>
  <text x="20" y="223" class="ink n">App writes amount_cents</text>
  <rect x="287" y="211" width="407" height="16" rx="4" class="focus"/>
  <text x="20" y="267" class="ink n">App reads amount</text>
  <rect x="204" y="255" width="241" height="16" rx="4" class="old"/>
  <text x="20" y="297" class="ink n">App reads amount_cents</text>
  <rect x="453" y="285" width="241" height="16" rx="4" class="focus"/>
  <line x1="200" y1="54" x2="200" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="283" y1="54" x2="283" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="366" y1="54" x2="366" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="449" y1="54" x2="449" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="532" y1="54" x2="532" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="615" y1="54" x2="615" y2="312" class="line" stroke-dasharray="2 4"/>
  <line x1="698" y1="54" x2="698" y2="312" class="line" stroke-dasharray="2 4"/>
  <text x="407.5" y="334" text-anchor="middle" class="ink2 n">old rows copied</text>
  <rect x="20" y="348" width="14" height="12" rx="3" class="old"/><text x="42" y="358" class="ink2 n">old column</text>
  <rect x="140" y="348" width="14" height="12" rx="3" class="focus"/><text x="162" y="358" class="ink2 n">new column</text>
</svg>
