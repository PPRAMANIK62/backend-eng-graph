<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="160" y="28" text-anchor="middle" class="ink t b">Browser</text>
  <line x1="160" y1="40" x2="160" y2="470" class="line"/>
  <text x="410" y="28" text-anchor="middle" class="ink t b">API server</text>
  <line x1="410" y1="40" x2="410" y2="470" class="line"/>
  <text x="640" y="28" text-anchor="middle" class="ink t b">Session store</text>
  <line x1="640" y1="40" x2="640" y2="470" class="line"/>
  <text x="20" y="62" class="ink t b">Log in</text>
  <line x1="160" y1="90" x2="407" y2="90" class="line" marker-end="url(#arrow)"/>
  <text x="285.0" y="83" text-anchor="middle" class="ink n mono">POST /login (user, password)</text>
  <text x="418" y="112" text-anchor="start" class="ink2 n">check password hash, make random ID</text>
  <line x1="410" y1="142" x2="637" y2="142" class="line" marker-end="url(#arrow)"/>
  <text x="525.0" y="135" text-anchor="middle" class="ink n mono">store id: user 42, login time</text>
  <line x1="410" y1="176" x2="163" y2="176" class="focus-s" marker-end="url(#arrow)"/>
  <text x="285.0" y="169" text-anchor="middle" class="focus n mono b">Set-Cookie: __Host-sid=id</text>
  <text x="20" y="212" class="ink t b">Later request</text>
  <line x1="160" y1="240" x2="407" y2="240" class="line" marker-end="url(#arrow)"/>
  <text x="285.0" y="233" text-anchor="middle" class="ink n mono">Cookie: __Host-sid=id</text>
  <line x1="410" y1="270" x2="637" y2="270" class="line" marker-end="url(#arrow)"/>
  <text x="525.0" y="263" text-anchor="middle" class="ink n mono">look up id</text>
  <line x1="640" y1="300" x2="413" y2="300" class="line" marker-end="url(#arrow)"/>
  <text x="525.0" y="293" text-anchor="middle" class="ink n mono">user 42, not expired</text>
  <line x1="410" y1="330" x2="163" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="285.0" y="323" text-anchor="middle" class="ink n mono">200 OK, user 42's notes</text>
  <text x="20" y="366" class="ink t b">Log out</text>
  <line x1="160" y1="394" x2="407" y2="394" class="line" marker-end="url(#arrow)"/>
  <text x="285.0" y="387" text-anchor="middle" class="ink n mono">POST /logout</text>
  <line x1="410" y1="424" x2="637" y2="424" class="line" marker-end="url(#arrow)"/>
  <text x="525.0" y="417" text-anchor="middle" class="ink n mono">delete id</text>
  <line x1="160" y1="458" x2="407" y2="458" class="line" marker-end="url(#arrow)"/>
  <text x="285.0" y="451" text-anchor="middle" class="ink n mono">Cookie: __Host-sid=id (old copy)</text>
  <text x="418" y="462" text-anchor="start" class="lost n b">no record: 401</text>
</svg>
