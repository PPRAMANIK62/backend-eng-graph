<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="26" class="ink t b">Active checks</text>
  <rect x="30" y="90" width="110" height="40" rx="6" class="safe-box"/>
  <text x="85" y="115" text-anchor="middle" class="ink t">Healthy</text>
  <rect x="250" y="90" width="110" height="40" rx="6" class="box"/>
  <text x="305" y="115" text-anchor="middle" class="lost t b">Unhealthy</text>
  <path d="M140,100 C180,70 210,70 247,100" class="line" marker-end="url(#arrow)"/>
  <text x="195" y="56" text-anchor="middle" class="ink2 n">fail N probes in a row</text>
  <text x="195" y="72" text-anchor="middle" class="ink2 n">(Kubernetes default: 3)</text>
  <path d="M250,122 C210,152 180,152 143,122" class="line" marker-end="url(#arrow)"/>
  <text x="195" y="166" text-anchor="middle" class="ink2 n">pass M probes in a row</text>
  <text x="20" y="210" class="ink2 n">Probe: TCP connect, HTTP GET /healthz,</text>
  <text x="20" y="226" class="ink2 n">or a gRPC health call, every few seconds</text>
  <line x1="390" y1="20" x2="390" y2="240" class="line" stroke-dasharray="4 4"/>
  <text x="410" y="26" class="ink t b">Passive checks (outlier ejection)</text>
  <text x="410" y="50" class="ink2 n">Errors in real traffic: consecutive 5xx,</text>
  <text x="410" y="66" class="ink2 n">timeouts, resets, or a low success rate</text>
  <line x1="410" y1="160" x2="700" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="178" text-anchor="end" class="ink2 n">time</text>
  <rect x="410" y="110" width="30" height="30" rx="6" class="box"/>
  <text x="425.0" y="130" text-anchor="middle" class="lost n b">1x</text>
  <rect x="470" y="110" width="60" height="30" rx="6" class="box"/>
  <text x="500.0" y="130" text-anchor="middle" class="lost n b">2x</text>
  <rect x="560" y="110" width="90" height="30" rx="6" class="box"/>
  <text x="605.0" y="130" text-anchor="middle" class="lost n b">3x</text>
  <text x="410" y="198" class="ink2 n">Each ejection in a row lasts one more base time,</text>
  <text x="410" y="214" class="ink2 n">up to a cap. Then the backend comes back on its own.</text>
</svg>
