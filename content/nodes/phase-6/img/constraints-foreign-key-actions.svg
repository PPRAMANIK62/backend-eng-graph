<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <rect x="30" y="40" width="190" height="96" rx="6" class="box"/>
  <text x="42" y="60" class="ink t b mono">products</text>
  <line x1="30" y1="68" x2="220" y2="68" class="line"/>
  <text x="42" y="86" class="ink n mono">product_no  PK</text>
  <text x="42" y="108" class="ink n mono">name</text>
  <text x="42" y="130" class="ink n mono">price</text>
  <rect x="500" y="40" width="190" height="74" rx="6" class="box"/>
  <text x="512" y="60" class="ink t b mono">orders</text>
  <line x1="500" y1="68" x2="690" y2="68" class="line"/>
  <text x="512" y="86" class="ink n mono">order_id  PK</text>
  <text x="512" y="108" class="ink n mono">shipping_address</text>
  <rect x="265" y="190" width="190" height="96" rx="6" class="box"/>
  <text x="277" y="210" class="ink t b mono">order_items</text>
  <line x1="265" y1="218" x2="455" y2="218" class="line"/>
  <text x="277" y="236" class="ink n mono">product_no  FK</text>
  <text x="277" y="258" class="ink n mono">order_id    FK</text>
  <text x="277" y="280" class="ink n mono">quantity</text>
  <line x1="300" y1="188" x2="175" y2="140" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="188" x2="585" y2="118" class="line" marker-end="url(#arrow)"/>
  <text x="165" y="178" class="ink n mono b" text-anchor="middle">ON DELETE RESTRICT</text>
  <text x="590" y="178" class="ink n mono b" text-anchor="middle">ON DELETE CASCADE</text>
  <rect x="30" y="310" width="310" height="58" rx="6" class="box"/>
  <rect x="30" y="310" width="6" height="58" class="lost"/>
  <text x="48" y="333" class="ink n b">DELETE a product that is still ordered</text>
  <text x="48" y="354" class="ink2 n">Error: the delete is refused</text>
  <rect x="380" y="310" width="310" height="58" rx="6" class="box"/>
  <text x="398" y="333" class="ink n b">DELETE an order</text>
  <text x="398" y="354" class="ink2 n">Its order_items rows are deleted too</text>
  <text x="30" y="24" class="ink2 n">Arrows point from the referencing table to the referenced one</text>
</svg>
