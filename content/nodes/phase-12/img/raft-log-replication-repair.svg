  <text x="528" y="87" text-anchor="middle" class="ink t b">6</text>
  <rect x="554" y="64" width="44" height="36" rx="4" class="focus"/>
  <text x="576" y="87" text-anchor="middle" class="ink t b">6</text>
  <text x="20" y="188" class="ink t b">Follower</text>
  <text x="20" y="204" class="ink2 n"></text>
  <rect x="122" y="170" width="44" height="36" rx="4" class="box"/>
  <text x="144" y="193" text-anchor="middle" class="ink t">1</text>
  <rect x="170" y="170" width="44" height="36" rx="4" class="box"/>
  <text x="192" y="193" text-anchor="middle" class="ink t">1</text>
  <rect x="218" y="170" width="44" height="36" rx="4" class="box"/>
  <text x="240" y="193" text-anchor="middle" class="ink t">1</text>
  <rect x="266" y="170" width="44" height="36" rx="4" class="old"/>
  <text x="288" y="193" text-anchor="middle" class="ink t">2</text>
  <rect x="314" y="170" width="44" height="36" rx="4" class="old"/>
  <text x="336" y="193" text-anchor="middle" class="ink t">2</text>
  <rect x="362" y="170" width="44" height="36" rx="4" class="old"/>
