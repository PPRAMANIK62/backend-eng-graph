<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- left: roles -->
  <text x="20" y="28" class="ink t b">Roles</text>
  <line x1="90" y1="44" x2="90" y2="66" class="line" marker-end="url(#arrow)"/>
  <text x="100" y="58" class="ink2 n">starts up</text>

  <rect x="30" y="70" width="120" height="40" rx="6" class="box"/>
  <text x="90" y="95" text-anchor="middle" class="ink t b">Follower</text>
  <rect x="200" y="180" width="120" height="40" rx="6" class="box"/>
  <text x="260" y="205" text-anchor="middle" class="ink t b">Candidate</text>
  <rect x="30" y="290" width="120" height="40" rx="6" class="box"/>
  <text x="90" y="315" text-anchor="middle" class="focus t b">Leader</text>

  <!-- follower to candidate -->
  <path d="M150,90 C215,95 250,130 252,176" class="line" marker-end="url(#arrow)"/>
  <text x="262" y="112" class="ink2 n">times out,</text>
  <text x="262" y="126" class="ink2 n">starts election</text>
  <!-- candidate self loop -->
  <path d="M320,192 C354,180 354,220 322,210" class="line" marker-end="url(#arrow)"/>
  <text x="326" y="166" class="ink2 n">times out,</text>
  <text x="326" y="180" class="ink2 n">new election</text>
  <!-- candidate to leader -->
  <path d="M252,222 C250,265 220,300 153,308" class="line" marker-end="url(#arrow)"/>
  <text x="258" y="270" class="ink2 n">votes from</text>
  <text x="258" y="284" class="ink2 n">a majority</text>
  <!-- candidate back to follower -->
  <path d="M200,190 C160,180 120,160 104,113" class="line" marker-end="url(#arrow)"/>
  <text x="142" y="224" text-anchor="middle" class="ink2 n">finds a leader</text>
  <text x="142" y="238" text-anchor="middle" class="ink2 n">or higher term</text>
  <!-- leader back to follower -->
  <path d="M40,290 C10,250 10,150 40,113" class="line" marker-end="url(#arrow)"/>
  <text x="52" y="202" text-anchor="middle" class="ink2 n" transform="rotate(-90 52 202)">sees higher term</text>

  <!-- right: terms -->
  <text x="430" y="28" class="ink t b">Terms</text>
  <text x="470" y="78" text-anchor="middle" class="ink n">term 1</text>
  <text x="550" y="78" text-anchor="middle" class="ink n">term 2</text>
  <text x="601" y="78" text-anchor="middle" class="ink n">term 3</text>
  <text x="662" y="78" text-anchor="middle" class="ink n">term 4</text>

  <rect x="430" y="88" width="20" height="36" class="focus"/>
  <rect x="450" y="88" width="60" height="36" class="box"/>
  <rect x="514" y="88" width="20" height="36" class="focus"/>
  <rect x="534" y="88" width="52" height="36" class="box"/>
  <rect x="590" y="88" width="22" height="36" class="focus"/>
  <rect x="616" y="88" width="20" height="36" class="focus"/>
  <rect x="636" y="88" width="64" height="36" class="box"/>

  <line x1="601" y1="128" x2="601" y2="146" class="line"/>
  <text x="601" y="162" text-anchor="middle" class="ink2 n">split vote:</text>
  <text x="601" y="176" text-anchor="middle" class="ink2 n">no leader, new term</text>

  <line x1="430" y1="210" x2="700" y2="210" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="228" text-anchor="end" class="ink2 n">time</text>

  <rect x="430" y="262" width="16" height="16" class="focus"/>
  <text x="454" y="275" class="ink n">election</text>
  <rect x="430" y="290" width="16" height="16" class="box"/>
  <text x="454" y="303" class="ink n">one leader, normal operation</text>
</svg>
