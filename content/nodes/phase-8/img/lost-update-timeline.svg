<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="130" y="30" text-anchor="middle" class="ink t b">T1 (adds 30)</text>
  <text x="360" y="30" text-anchor="middle" class="ink t b">Row x</text>
  <text x="590" y="30" text-anchor="middle" class="ink t b">T2 (adds 20)</text>
  <line x1="130" y1="42" x2="130" y2="320" class="line"/>
  <line x1="590" y1="42" x2="590" y2="320" class="line"/>
  <text x="30" y="30" class="ink2 n">time</text>
  <line x1="30" y1="42" x2="30" y2="320" class="line" marker-end="url(#arrow)"/>

  <!-- row values -->
  <rect x="310" y="56" width="100" height="36" rx="6" class="box"/>
  <text x="360" y="79" text-anchor="middle" class="ink t mono">100</text>
  <rect x="310" y="164" width="100" height="36" rx="6" class="box"/>
  <text x="360" y="187" text-anchor="middle" class="lost t mono b">120</text>
  <rect x="310" y="248" width="100" height="36" rx="6" class="box"/>
  <text x="360" y="271" text-anchor="middle" class="focus t mono b">130</text>

  <!-- T1 reads -->
  <line x1="308" y1="80" x2="134" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="220" y="72" text-anchor="middle" class="ink n">read x = 100</text>
  <!-- T2 reads -->
  <line x1="412" y1="116" x2="586" y2="116" class="line" marker-end="url(#arrow)"/>
  <text x="500" y="108" text-anchor="middle" class="ink n">read x = 100</text>
  <!-- T2 writes -->
  <line x1="590" y1="182" x2="414" y2="182" class="line" marker-end="url(#arrow)"/>
  <text x="500" y="174" text-anchor="middle" class="ink n mono">write x = 120</text>
  <text x="602" y="218" class="ink n b">commit</text>
  <!-- T1 writes -->
  <line x1="130" y1="266" x2="306" y2="266" class="focus-s" marker-end="url(#arrow)"/>
  <text x="220" y="258" text-anchor="middle" class="focus n mono b">write x = 130</text>
  <text x="220" y="284" text-anchor="middle" class="ink2 n">(100 it read + 30)</text>
  <text x="118" y="306" text-anchor="end" class="ink n b">commit</text>

  <!-- overwritten marker -->
  <line x1="420" y1="200" x2="420" y2="248" class="lost-s"/>
  <text x="430" y="230" class="lost n">T2's +20 overwritten</text>

  <!-- outcome -->
  <rect x="160" y="336" width="400" height="44" rx="6" class="box"/>
  <text x="360" y="363" text-anchor="middle" class="ink t">Final x = 130. Run one after the other: 150.</text>
</svg>
