<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe{fill:#1baf7a}
    .dash{stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe{fill:#199e70}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <!-- left panel: monotonic writes -->
  <text x="180" y="24" text-anchor="middle" class="ink t b">Monotonic writes, broken</text>
  <rect x="110" y="40" width="140" height="36" rx="6" class="focus-box"/>
  <text x="180" y="63" text-anchor="middle" class="ink t">Your session</text>

  <rect x="20" y="150" width="96" height="36" rx="6" class="box"/>
  <text x="68" y="173" text-anchor="middle" class="ink t">Replica A</text>
  <rect x="132" y="150" width="96" height="36" rx="6" class="box"/>
  <text x="180" y="173" text-anchor="middle" class="ink t">Replica B</text>
  <rect x="244" y="150" width="96" height="36" rx="6" class="lost-box"/>
  <text x="292" y="173" text-anchor="middle" class="ink t">Replica C</text>

  <line x1="140" y1="78" x2="76" y2="147" class="line" marker-end="url(#arrow)"/>
  <text x="100" y="108" text-anchor="end" class="focus n b">1. save v1</text>
  <line x1="190" y1="78" x2="184" y2="147" class="line" marker-end="url(#arrow)"/>
  <text x="194" y="118" class="focus n b">2. save v2</text>

  <line x1="228" y1="168" x2="241" y2="168" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="140" text-anchor="middle" class="ink2 n">gets v2 first</text>
  <path d="M68,188 C100,245 225,245 262,190" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="256" text-anchor="middle" class="ink2 n">v1 arrives later and overwrites it</text>
  <text x="306" y="210" text-anchor="middle" class="lost n b">C ends on v1</text>

  <text x="180" y="290" text-anchor="middle" class="ink n">Fix: C applies v2 only once it has v1.</text>

  <line x1="360" y1="20" x2="360" y2="296" class="line dash"/>

  <!-- right panel: writes follow reads -->
  <text x="540" y="24" text-anchor="middle" class="ink t b">Writes follow reads, broken</text>
  <rect x="470" y="40" width="140" height="36" rx="6" class="focus-box"/>
  <text x="540" y="63" text-anchor="middle" class="ink t">Your session</text>

  <rect x="380" y="150" width="96" height="36" rx="6" class="box"/>
  <text x="428" y="173" text-anchor="middle" class="ink t">Replica A</text>
  <rect x="492" y="150" width="96" height="36" rx="6" class="box"/>
  <text x="540" y="173" text-anchor="middle" class="ink t">Replica B</text>
  <rect x="604" y="150" width="96" height="36" rx="6" class="lost-box"/>
  <text x="652" y="173" text-anchor="middle" class="ink t">Replica C</text>

  <line x1="436" y1="147" x2="500" y2="79" class="line" marker-end="url(#arrow)"/>
  <text x="462" y="108" text-anchor="end" class="focus n b">1. read a post</text>
  <line x1="550" y1="78" x2="544" y2="147" class="line" marker-end="url(#arrow)"/>
  <text x="554" y="118" class="focus n b">2. write a reply</text>

  <line x1="588" y1="168" x2="601" y2="168" class="line" marker-end="url(#arrow)"/>
  <text x="650" y="140" text-anchor="middle" class="ink2 n">gets the reply first</text>
  <path d="M428,188 C460,245 585,245 622,190" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="256" text-anchor="middle" class="ink2 n">the post arrives later</text>
  <text x="666" y="210" text-anchor="middle" class="lost n b">shows a reply</text>
  <text x="666" y="225" text-anchor="middle" class="lost n b">with no post</text>

  <text x="540" y="290" text-anchor="middle" class="ink n">Fix: the reply goes after the post, everywhere.</text>
</svg>
