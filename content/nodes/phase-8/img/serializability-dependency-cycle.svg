<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="24" y="26" text-anchor="start" class="ink t b">The history, top to bottom in time</text>
  <text x="110" y="54" text-anchor="middle" class="ink t b">T1</text>
  <text x="270" y="54" text-anchor="middle" class="ink t b">T2</text>
  <line x1="110" y1="62" x2="110" y2="352" class="line"/>
  <line x1="270" y1="62" x2="270" y2="352" class="line"/>
  <rect x="48" y="72" width="124" height="28" rx="6" class="box"/>
  <text x="110" y="91" text-anchor="middle" class="ink n mono">read x = 50</text>
  <rect x="48" y="108" width="124" height="28" rx="6" class="box"/>
  <text x="110" y="127" text-anchor="middle" class="ink n mono">read y = 50</text>
  <rect x="208" y="144" width="124" height="28" rx="6" class="box"/>
  <text x="270" y="163" text-anchor="middle" class="ink n mono">read x = 50</text>
  <rect x="208" y="180" width="124" height="28" rx="6" class="box"/>
  <text x="270" y="199" text-anchor="middle" class="ink n mono">read y = 50</text>
  <rect x="48" y="216" width="124" height="28" rx="6" class="box"/>
  <rect x="48" y="216" width="124" height="28" rx="6" class="focus-s"/>
  <text x="110" y="235" text-anchor="middle" class="focus n mono b">write y = −40</text>
  <rect x="208" y="252" width="124" height="28" rx="6" class="box"/>
  <rect x="208" y="252" width="124" height="28" rx="6" class="focus-s"/>
  <text x="270" y="271" text-anchor="middle" class="focus n mono b">write x = −40</text>
  <rect x="48" y="288" width="124" height="28" rx="6" class="box"/>
  <text x="110" y="307" text-anchor="middle" class="ink n mono">commit</text>
  <rect x="208" y="324" width="124" height="28" rx="6" class="box"/>
  <text x="270" y="343" text-anchor="middle" class="ink n mono">commit</text>
  <text x="430" y="26" text-anchor="start" class="ink t b">Dependency graph</text>
  <circle cx="470" cy="170" r="30" class="box"/>
  <text x="470" y="175" text-anchor="middle" class="ink t b">T1</text>
  <circle cx="650" cy="170" r="30" class="box"/>
  <text x="650" y="175" text-anchor="middle" class="ink t b">T2</text>
  <path d="M490,146 Q560.0,70 628,146" class="lost-s" style="stroke-width:2" marker-end="url(#arrow)"/>
  <text x="560.0" y="72" text-anchor="middle" class="lost n b">rw on x</text>
  <text x="560.0" y="88" text-anchor="middle" class="ink2 n">T1 read x, then T2 wrote it</text>
  <path d="M630,194 Q560.0,270 492,194" class="lost-s" style="stroke-width:2" marker-end="url(#arrow)"/>
  <text x="560.0" y="256" text-anchor="middle" class="lost n b">rw on y</text>
  <text x="560.0" y="272" text-anchor="middle" class="ink2 n">T2 read y, then T1 wrote it</text>
  <text x="560" y="300" text-anchor="middle" class="lost n b">A cycle: T1 must come before T2,</text>
  <text x="560" y="318" text-anchor="middle" class="lost n b">and T2 before T1. No serial order fits.</text>
  <text x="560" y="346" text-anchor="middle" class="ink2 n">Final state x = −40, y = −40: the rule x + y &gt; 0 is broken.</text>
</svg>
