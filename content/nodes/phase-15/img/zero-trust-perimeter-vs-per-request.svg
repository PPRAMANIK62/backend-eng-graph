<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- left: trusted network -->
  <text x="185" y="24" text-anchor="middle" class="ink t b">Trusted network</text>
  <rect x="20" y="40" width="330" height="250" rx="6" class="line" stroke-dasharray="6 4"/>
  <text x="34" y="60" class="ink2 n">firewall at the edge, everything inside trusted</text>

  <rect x="210" y="76" width="125" height="40" rx="6" class="box"/>
  <text x="272" y="101" text-anchor="middle" class="ink t">payments</text>
  <rect x="210" y="156" width="125" height="40" rx="6" class="box"/>
  <text x="272" y="181" text-anchor="middle" class="ink t">orders</text>
  <rect x="210" y="236" width="125" height="40" rx="6" class="box"/>
  <text x="272" y="261" text-anchor="middle" class="ink t">users DB</text>

  <rect x="36" y="146" width="120" height="60" rx="6" class="box"/>
  <rect x="36" y="146" width="120" height="60" rx="6" class="lost-s" style="stroke-width:1.5"/>
  <text x="96" y="171" text-anchor="middle" class="lost t b">compromised</text>
  <text x="96" y="189" text-anchor="middle" class="lost t b">host</text>

  <line x1="156" y1="166" x2="207" y2="98" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <line x1="156" y1="176" x2="207" y2="176" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <line x1="156" y1="186" x2="207" y2="254" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>

  <text x="185" y="316" text-anchor="middle" class="ink2 n">Being inside is the credential.</text>
  <text x="185" y="334" text-anchor="middle" class="ink2 n">One bad host reaches everything.</text>

  <!-- right: zero trust -->
  <text x="535" y="24" text-anchor="middle" class="ink t b">Zero trust</text>
  <text x="384" y="60" class="ink2 n">every call carries an identity and is checked</text>

  <rect x="570" y="76" width="125" height="40" rx="6" class="box"/>
  <text x="632" y="101" text-anchor="middle" class="ink t">payments</text>
  <rect x="570" y="156" width="125" height="40" rx="6" class="box"/>
  <text x="632" y="181" text-anchor="middle" class="ink t">orders</text>
  <rect x="570" y="236" width="125" height="40" rx="6" class="box"/>
  <text x="632" y="261" text-anchor="middle" class="ink t">users DB</text>
  <!-- checks in front of each service -->
  <rect x="556" y="76" width="10" height="40" rx="2" class="focus"/>
  <rect x="556" y="156" width="10" height="40" rx="2" class="focus"/>
  <rect x="556" y="236" width="10" height="40" rx="2" class="focus"/>
  <text x="561" y="136" text-anchor="middle" class="focus n b">check</text>

  <rect x="384" y="146" width="120" height="60" rx="6" class="box"/>
  <rect x="384" y="146" width="120" height="60" rx="6" class="lost-s" style="stroke-width:1.5"/>
  <text x="444" y="168" text-anchor="middle" class="lost t b">compromised</text>
  <text x="444" y="185" text-anchor="middle" class="lost t b">host</text>
  <text x="444" y="200" text-anchor="middle" class="ink2 n mono">id: reports</text>

  <line x1="504" y1="166" x2="540" y2="112" class="lost-s" style="stroke-width:1.5"/>
  <text x="546" y="112" text-anchor="middle" class="lost t b">✕</text>
  <line x1="504" y1="176" x2="538" y2="176" class="lost-s" style="stroke-width:1.5"/>
  <text x="546" y="181" text-anchor="middle" class="lost t b">✕</text>
  <line x1="504" y1="186" x2="552" y2="248" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>

  <text x="540" y="316" text-anchor="middle" class="ink2 n">It reaches only what its identity may reach:</text>
  <text x="540" y="334" text-anchor="middle" class="ink2 n">here, the one thing reports is allowed to read.</text>
</svg>
