<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="34" class="ink t b">Save position, then process: at most once</text>
  <rect x="20" y="50" width="118" height="48" rx="6" class="box"/>
  <text x="79.0" y="70" text-anchor="middle" class="ink n b">read</text>
  <text x="79.0" y="87" text-anchor="middle" class="ink2 n">message 5</text>
  <line x1="140" y1="74" x2="157" y2="74" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="50" width="118" height="48" rx="6" class="box"/>
  <text x="219.0" y="70" text-anchor="middle" class="focus n b">save position</text>
  <text x="219.0" y="87" text-anchor="middle" class="ink2 n">next is 6</text>
  <line x1="280" y1="74" x2="297" y2="74" class="line" marker-end="url(#arrow)"/>
  <path d="M349.0,64 L369.0,84 M369.0,64 L349.0,84" class="lost-s"/>
  <text x="359.0" y="106" text-anchor="middle" class="lost n b">crash</text>
  <line x1="420" y1="74" x2="437" y2="74" class="line" marker-end="url(#arrow)"/>
  <rect x="440" y="50" width="118" height="48" rx="6" class="box"/>
  <text x="499.0" y="70" text-anchor="middle" class="ink n b">restart</text>
  <text x="499.0" y="87" text-anchor="middle" class="ink2 n">resume at 6</text>
  <line x1="560" y1="74" x2="577" y2="74" class="line" marker-end="url(#arrow)"/>
  <rect x="580" y="50" width="118" height="48" rx="6" class="box"/>
  <text x="639.0" y="70" text-anchor="middle" class="lost n b">message 5</text>
  <text x="639.0" y="87" text-anchor="middle" class="ink2 n">never processed</text>
  <text x="20" y="134" class="ink n">The crash came after the position moved on but before the work, so message 5 is skipped.</text>
  <text x="20" y="184" class="ink t b">Process, then save position: at least once</text>
  <rect x="20" y="200" width="118" height="48" rx="6" class="box"/>
  <text x="79.0" y="220" text-anchor="middle" class="ink n b">read</text>
  <text x="79.0" y="237" text-anchor="middle" class="ink2 n">message 5</text>
  <line x1="140" y1="224" x2="157" y2="224" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="200" width="118" height="48" rx="6" class="box"/>
  <text x="219.0" y="220" text-anchor="middle" class="focus n b">process</text>
  <text x="219.0" y="237" text-anchor="middle" class="ink2 n">message 5</text>
  <line x1="280" y1="224" x2="297" y2="224" class="line" marker-end="url(#arrow)"/>
  <path d="M349.0,214 L369.0,234 M369.0,214 L349.0,234" class="lost-s"/>
  <text x="359.0" y="256" text-anchor="middle" class="lost n b">crash</text>
  <line x1="420" y1="224" x2="437" y2="224" class="line" marker-end="url(#arrow)"/>
  <rect x="440" y="200" width="118" height="48" rx="6" class="box"/>
  <text x="499.0" y="220" text-anchor="middle" class="ink n b">restart</text>
  <text x="499.0" y="237" text-anchor="middle" class="ink2 n">resume at 5</text>
  <line x1="560" y1="224" x2="577" y2="224" class="line" marker-end="url(#arrow)"/>
  <rect x="580" y="200" width="118" height="48" rx="6" class="box"/>
  <text x="639.0" y="220" text-anchor="middle" class="lost n b">message 5</text>
  <text x="639.0" y="237" text-anchor="middle" class="ink2 n">processed twice</text>
  <text x="20" y="284" class="ink n">The crash came after the work but before the position moved on, so message 5 is done again.</text>
</svg>
