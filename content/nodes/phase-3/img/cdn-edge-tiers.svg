<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="70" y="24" text-anchor="middle" class="ink2 n">users</text>
  <text x="260" y="24" text-anchor="middle" class="ink2 n">edge locations (lower tier)</text>
  <text x="470" y="24" text-anchor="middle" class="ink2 n">upper tier</text>
  <text x="640" y="24" text-anchor="middle" class="ink2 n">your servers</text>

  <!-- users -->
  <rect x="20" y="44" width="100" height="44" rx="6" class="box"/>
  <text x="70" y="71" text-anchor="middle" class="ink n">user, Europe</text>
  <rect x="20" y="144" width="100" height="44" rx="6" class="box"/>
  <text x="70" y="171" text-anchor="middle" class="ink n">user, Asia</text>
  <rect x="20" y="244" width="100" height="44" rx="6" class="box"/>
  <text x="70" y="271" text-anchor="middle" class="ink n">user, Africa</text>

  <!-- edges -->
  <rect x="190" y="40" width="140" height="52" rx="6" class="safe-box"/>
  <text x="260" y="62" text-anchor="middle" class="ink t b">Edge 1</text>
  <text x="260" y="80" text-anchor="middle" class="ink n">hit: answers itself</text>
  <rect x="190" y="140" width="140" height="52" rx="6" class="safe-box"/>
  <text x="260" y="162" text-anchor="middle" class="ink t b">Edge 2</text>
  <text x="260" y="180" text-anchor="middle" class="ink n">hit: answers itself</text>
  <rect x="190" y="240" width="140" height="52" rx="6" class="box"/>
  <text x="260" y="262" text-anchor="middle" class="ink t b">Edge 3</text>
  <text x="260" y="280" text-anchor="middle" class="focus n b">miss</text>

  <line x1="122" y1="66" x2="187" y2="66" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="122" y1="166" x2="187" y2="166" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="122" y1="266" x2="187" y2="266" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- upper tier and origin -->
  <rect x="400" y="240" width="140" height="52" rx="6" class="box"/>
  <text x="470" y="262" text-anchor="middle" class="ink t b">Upper tier</text>
  <text x="470" y="280" text-anchor="middle" class="focus n b">miss</text>
  <rect x="590" y="240" width="110" height="52" rx="6" class="box"/>
  <text x="645" y="271" text-anchor="middle" class="ink t b">Origin</text>

  <line x1="332" y1="258" x2="397" y2="258" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="542" y1="258" x2="587" y2="258" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="587" y1="278" x2="542" y2="278" class="line" marker-end="url(#arrow)"/>
  <line x1="397" y1="278" x2="332" y2="278" class="line" marker-end="url(#arrow)"/>

  <text x="470" y="316" text-anchor="middle" class="ink2 n">response stored at the upper tier and at edge 3 on the way back</text>
  <text x="520" y="150" text-anchor="middle" class="ink2 n">only upper tiers talk to the origin,</text>
  <text x="520" y="168" text-anchor="middle" class="ink2 n">so it sees few requests and few connections</text>
</svg>
