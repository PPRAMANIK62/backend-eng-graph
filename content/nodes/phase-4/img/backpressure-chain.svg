<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="24" y="24" class="ink t b">Replies flow right. "Slow down" flows left, one hop at a time.</text>

  <!-- boxes -->
  <rect x="24" y="60" width="140" height="64" rx="6" class="box"/>
  <text x="94" y="86" text-anchor="middle" class="ink t b">Server loop</text>
  <text x="94" y="106" text-anchor="middle" class="ink2 n">reads commands,</text>
  <text x="94" y="120" text-anchor="middle" class="ink2 n">writes replies</text>

  <rect x="200" y="60" width="140" height="64" rx="6" class="box"/>
  <text x="270" y="86" text-anchor="middle" class="ink t b">Send buffer</text>
  <text x="270" y="106" text-anchor="middle" class="ink2 n">server kernel</text>

  <rect x="376" y="60" width="140" height="64" rx="6" class="box"/>
  <text x="446" y="86" text-anchor="middle" class="ink t b">Receive buffer</text>
  <text x="446" y="106" text-anchor="middle" class="ink2 n">client kernel</text>

  <rect x="552" y="60" width="144" height="64" rx="6" class="box"/>
  <text x="624" y="86" text-anchor="middle" class="ink t b">Client app</text>
  <text x="624" y="106" text-anchor="middle" class="ink2 n">reads replies</text>
  <text x="624" y="120" text-anchor="middle" class="lost n b">slowly</text>

  <!-- data arrows -->
  <line x1="166" y1="80" x2="196" y2="80" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="342" y1="80" x2="372" y2="80" class="focus-s" marker-end="url(#arrow)"/>
  <line x1="518" y1="80" x2="548" y2="80" class="focus-s" marker-end="url(#arrow)"/>

  <!-- push-back arrows -->
  <line x1="548" y1="150" x2="520" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="624" y="155" text-anchor="middle" class="ink n b">1</text>
  <text x="624" y="175" text-anchor="middle" class="ink2 n">buffer fills,</text>
  <text x="624" y="191" text-anchor="middle" class="ink2 n">window closes to 0</text>

  <line x1="372" y1="150" x2="344" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="446" y="155" text-anchor="middle" class="ink n b">2</text>
  <text x="446" y="175" text-anchor="middle" class="ink2 n">server TCP stops sending;</text>
  <text x="446" y="191" text-anchor="middle" class="ink2 n">send buffer fills</text>

  <line x1="196" y1="150" x2="168" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="270" y="155" text-anchor="middle" class="ink n b">3</text>
  <text x="270" y="175" text-anchor="middle" class="ink2 n mono">write()</text>
  <text x="270" y="191" text-anchor="middle" class="ink2 n">blocks, or EAGAIN</text>

  <text x="94" y="155" text-anchor="middle" class="ink n b">4</text>
  <text x="94" y="175" text-anchor="middle" class="ink2 n">your choice:</text>

  <!-- the choice -->
  <rect x="24" y="210" width="330" height="56" rx="6" class="safe-box"/>
  <text x="40" y="233" class="ink t b">Backpressure: stop reading commands</text>
  <text x="40" y="253" class="ink2 n">client's own sends then block. Memory stays bounded.</text>

  <rect x="366" y="210" width="330" height="56" rx="6" class="box"/>
  <text x="382" y="233" class="lost t b">Buffer replies in your process</text>
  <text x="382" y="253" class="ink2 n">memory grows for as long as the client lags</text>

  <rect x="24" y="280" width="672" height="56" rx="6" class="box"/>
  <text x="40" y="303" class="ink t b">Or shed: drop the data or close the connection</text>
  <text x="40" y="323" class="ink2 n">what Redis does to a Pub/Sub client past its output buffer limit</text>
</svg>
