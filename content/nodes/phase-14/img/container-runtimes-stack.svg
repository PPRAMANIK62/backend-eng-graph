<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="130" y="20" width="360" height="56" rx="6" class="box"/>
  <text x="310" y="44" text-anchor="middle" class="ink t b mono">kubelet</text>
  <text x="310" y="64" text-anchor="middle" class="ink2 n">one per Kubernetes node</text>
  <line x1="310" y1="76" x2="310" y2="107" class="line" marker-end="url(#arrow)"/>
  <text x="322" y="97" class="ink2 n mono">CRI: gRPC</text>
  <rect x="130" y="110" width="360" height="56" rx="6" class="box"/>
  <text x="310" y="134" text-anchor="middle" class="ink t b mono">containerd</text>
  <text x="310" y="154" text-anchor="middle" class="ink2 n">pulls the image, snapshotter lays out layers, writes the bundle</text>
  <line x1="310" y1="166" x2="310" y2="197" class="line" marker-end="url(#arrow)"/>
  <text x="322" y="187" class="ink2 n mono">ttRPC over a Unix socket</text>
  <rect x="130" y="200" width="360" height="56" rx="6" class="box"/>
  <text x="310" y="224" text-anchor="middle" class="ink t b mono">containerd-shim-runc-v2</text>
  <text x="310" y="244" text-anchor="middle" class="ink2 n">one shim can manage several containers</text>
  <line x1="310" y1="256" x2="310" y2="287" class="line" marker-end="url(#arrow)"/>
  <text x="322" y="277" class="ink2 n mono">fork/exec with the bundle</text>
  <rect x="130" y="290" width="360" height="56" rx="6" class="box"/>
  <rect x="130" y="290" width="360" height="56" rx="6" class="focus-s"/>
  <text x="310" y="314" text-anchor="middle" class="focus t b mono">runc (or crun)</text>
  <text x="310" y="334" text-anchor="middle" class="ink2 n">OCI runtime: create, start, kill, delete</text>
  <line x1="310" y1="346" x2="310" y2="377" class="line" marker-end="url(#arrow)"/>
  <text x="322" y="367" class="ink2 n mono">clone, cgroup, pivot_root, exec</text>
  <rect x="130" y="380" width="360" height="56" rx="6" class="box"/>
  <text x="310" y="404" text-anchor="middle" class="ink t b mono">container process</text>
  <text x="310" y="424" text-anchor="middle" class="ink2 n">namespaces, cgroup, overlay root; then execve</text>
  <text x="510" y="150" class="ink2 n">high-level runtime</text>
  <text x="510" y="320" class="focus n">low-level runtime</text>
</svg>
