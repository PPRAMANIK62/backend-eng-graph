  <text x="670" y="347" class="ink2 n mono">15</text>
  <line x1="490" y1="334" x2="660" y2="334" class="line" stroke-opacity="0.45"/>
  <rect x="490" y="64" width="170" height="288" rx="6" class="line"/>
  <rect x="60" y="66" width="170" height="32" rx="6" class="box"/>
  <text x="74" y="87" class="ink t b">page 0</text>
  <text x="216" y="87" text-anchor="end" class="ink2 n">code</text>
  <path d="M 230 82.0 C 350 82.0, 370 127.0, 487 127.0" class="line" marker-end="url(#arrow)"/>
  <rect x="60" y="102" width="170" height="32" rx="6" class="box"/>
