<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" class="ink t b">Run-length encoding</text>
  <text x="20" y="42" class="ink2 n">a sorted column: store each run once</text>
  <rect x="20" y="54" width="308" height="32" rx="6" class="box"/>
  <text x="42.0" y="75" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="64" y1="54" x2="64" y2="86" class="line" stroke-opacity=".35"/>
  <text x="86.0" y="75" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="108" y1="54" x2="108" y2="86" class="line" stroke-opacity=".35"/>
  <text x="130.0" y="75" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="152" y1="54" x2="152" y2="86" class="line" stroke-opacity=".35"/>
  <text x="174.0" y="75" text-anchor="middle" class="ink2 n mono">EU</text>
  <line x1="196" y1="54" x2="196" y2="86" class="line" stroke-opacity=".35"/>
  <text x="218.0" y="75" text-anchor="middle" class="ink2 n mono">US</text>
  <line x1="240" y1="54" x2="240" y2="86" class="line" stroke-opacity=".35"/>
  <text x="262.0" y="75" text-anchor="middle" class="ink2 n mono">US</text>
  <line x1="284" y1="54" x2="284" y2="86" class="line" stroke-opacity=".35"/>
  <text x="306.0" y="75" text-anchor="middle" class="ink2 n mono">APAC</text>
  <line x1="336" y1="70" x2="376" y2="70" class="line" marker-end="url(#arrow)"/>
  <rect x="384" y="54" width="228" height="32" rx="6" class="focus-box"/>
  <text x="422.0" y="75" text-anchor="middle" class="ink n mono">EU ×4</text>
  <line x1="460" y1="54" x2="460" y2="86" class="line" stroke-opacity=".35"/>
  <text x="498.0" y="75" text-anchor="middle" class="ink n mono">US ×2</text>
  <line x1="536" y1="54" x2="536" y2="86" class="line" stroke-opacity=".35"/>
  <text x="574.0" y="75" text-anchor="middle" class="ink n mono">APAC ×1</text>
  <text x="20" y="124" class="ink t b">Dictionary encoding</text>
  <text x="20" y="142" class="ink2 n">few distinct values: store small codes</text>
  <rect x="20" y="154" width="300" height="32" rx="6" class="box"/>
  <text x="45.0" y="175" text-anchor="middle" class="ink2 n mono">mug</text>
  <line x1="70" y1="154" x2="70" y2="186" class="line" stroke-opacity=".35"/>
  <text x="95.0" y="175" text-anchor="middle" class="ink2 n mono">lamp</text>
  <line x1="120" y1="154" x2="120" y2="186" class="line" stroke-opacity=".35"/>
  <text x="145.0" y="175" text-anchor="middle" class="ink2 n mono">mug</text>
  <line x1="170" y1="154" x2="170" y2="186" class="line" stroke-opacity=".35"/>
  <text x="195.0" y="175" text-anchor="middle" class="ink2 n mono">desk</text>
  <line x1="220" y1="154" x2="220" y2="186" class="line" stroke-opacity=".35"/>
  <text x="245.0" y="175" text-anchor="middle" class="ink2 n mono">mug</text>
  <line x1="270" y1="154" x2="270" y2="186" class="line" stroke-opacity=".35"/>
  <text x="295.0" y="175" text-anchor="middle" class="ink2 n mono">lamp</text>
  <line x1="336" y1="170" x2="376" y2="170" class="line" marker-end="url(#arrow)"/>
  <rect x="384" y="154" width="180" height="32" rx="6" class="focus-box"/>
  <text x="399.0" y="175" text-anchor="middle" class="ink n mono">0</text>
  <line x1="414" y1="154" x2="414" y2="186" class="line" stroke-opacity=".35"/>
  <text x="429.0" y="175" text-anchor="middle" class="ink n mono">1</text>
  <line x1="444" y1="154" x2="444" y2="186" class="line" stroke-opacity=".35"/>
  <text x="459.0" y="175" text-anchor="middle" class="ink n mono">0</text>
  <line x1="474" y1="154" x2="474" y2="186" class="line" stroke-opacity=".35"/>
  <text x="489.0" y="175" text-anchor="middle" class="ink n mono">2</text>
  <line x1="504" y1="154" x2="504" y2="186" class="line" stroke-opacity=".35"/>
  <text x="519.0" y="175" text-anchor="middle" class="ink n mono">0</text>
  <line x1="534" y1="154" x2="534" y2="186" class="line" stroke-opacity=".35"/>
  <text x="549.0" y="175" text-anchor="middle" class="ink n mono">1</text>
  <text x="384" y="204" class="ink2 n mono">dictionary: 0 = mug, 1 = lamp, 2 = desk</text>
  <text x="20" y="240" class="ink t b">Frame of reference</text>
  <text x="20" y="258" class="ink2 n">values close together: a base plus small offsets</text>
  <rect x="20" y="270" width="290" height="32" rx="6" class="box"/>
  <text x="49.0" y="291" text-anchor="middle" class="ink2 n mono">1003</text>
  <line x1="78" y1="270" x2="78" y2="302" class="line" stroke-opacity=".35"/>
  <text x="107.0" y="291" text-anchor="middle" class="ink2 n mono">1001</text>
  <line x1="136" y1="270" x2="136" y2="302" class="line" stroke-opacity=".35"/>
  <text x="165.0" y="291" text-anchor="middle" class="ink2 n mono">1007</text>
  <line x1="194" y1="270" x2="194" y2="302" class="line" stroke-opacity=".35"/>
  <text x="223.0" y="291" text-anchor="middle" class="ink2 n mono">1006</text>
  <line x1="252" y1="270" x2="252" y2="302" class="line" stroke-opacity=".35"/>
  <text x="281.0" y="291" text-anchor="middle" class="ink2 n mono">1004</text>
  <line x1="336" y1="286" x2="376" y2="286" class="line" marker-end="url(#arrow)"/>
  <rect x="384" y="270" width="300" height="32" rx="6" class="focus-box"/>
  <text x="409.0" y="291" text-anchor="middle" class="ink n mono">1000</text>
  <line x1="434" y1="270" x2="434" y2="302" class="line" stroke-opacity=".35"/>
  <text x="459.0" y="291" text-anchor="middle" class="ink n mono">3</text>
  <line x1="484" y1="270" x2="484" y2="302" class="line" stroke-opacity=".35"/>
  <text x="509.0" y="291" text-anchor="middle" class="ink n mono">1</text>
  <line x1="534" y1="270" x2="534" y2="302" class="line" stroke-opacity=".35"/>
  <text x="559.0" y="291" text-anchor="middle" class="ink n mono">7</text>
  <line x1="584" y1="270" x2="584" y2="302" class="line" stroke-opacity=".35"/>
  <text x="609.0" y="291" text-anchor="middle" class="ink n mono">6</text>
  <line x1="634" y1="270" x2="634" y2="302" class="line" stroke-opacity=".35"/>
  <text x="659.0" y="291" text-anchor="middle" class="ink n mono">4</text>
  <text x="384" y="320" class="ink2 n">base, then one small number per value</text>
</svg>
