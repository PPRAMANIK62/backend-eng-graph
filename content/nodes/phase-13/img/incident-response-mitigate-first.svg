<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="32" class="ink t b">Mitigate first</text>
  <text x="130" y="54" class="ink2 n">users see errors</text>
  <rect x="130" y="62" width="160" height="12" rx="3" class="lost"/>
  <text x="300" y="72" class="ink2 n">users fine while you dig for the cause</text>
  <line x1="40" y1="90" x2="690" y2="90" class="line" marker-end="url(#arrow)"/>
  <line x1="50" y1="84" x2="50" y2="96" class="line"/>
  <text x="50" y="114" text-anchor="middle" class="ink n">problem</text>
  <text x="50" y="130" text-anchor="middle" class="ink n">created</text>
  <line x1="130" y1="84" x2="130" y2="96" class="line"/>
  <text x="130" y="114" text-anchor="middle" class="ink n">damage</text>
  <text x="130" y="130" text-anchor="middle" class="ink n">starts</text>
  <line x1="210" y1="84" x2="210" y2="96" class="line"/>
  <text x="210" y="114" text-anchor="middle" class="ink n">on-call</text>
  <text x="210" y="130" text-anchor="middle" class="ink n">paged</text>
  <line x1="290" y1="84" x2="290" y2="96" class="line"/>
  <text x="290" y="114" text-anchor="middle" class="focus n b">generic</text>
  <text x="290" y="130" text-anchor="middle" class="focus n b">mitigation</text>
  <line x1="420" y1="84" x2="420" y2="96" class="line"/>
  <text x="420" y="114" text-anchor="middle" class="ink n">investigate</text>
  <line x1="530" y1="84" x2="530" y2="96" class="line"/>
  <text x="530" y="114" text-anchor="middle" class="ink n">final fix</text>
  <line x1="640" y1="84" x2="640" y2="96" class="line"/>
  <text x="640" y="114" text-anchor="middle" class="ink n">apply fix</text>
  <text x="20" y="192" class="ink t b">Investigate first</text>
  <text x="130" y="214" class="ink2 n">users see errors</text>
  <rect x="130" y="222" width="510" height="12" rx="3" class="lost"/>
  <line x1="40" y1="250" x2="690" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="50" y1="244" x2="50" y2="256" class="line"/>
  <text x="50" y="274" text-anchor="middle" class="ink n">problem</text>
  <text x="50" y="290" text-anchor="middle" class="ink n">created</text>
  <line x1="130" y1="244" x2="130" y2="256" class="line"/>
  <text x="130" y="274" text-anchor="middle" class="ink n">damage</text>
  <text x="130" y="290" text-anchor="middle" class="ink n">starts</text>
  <line x1="210" y1="244" x2="210" y2="256" class="line"/>
  <text x="210" y="274" text-anchor="middle" class="ink n">on-call</text>
  <text x="210" y="290" text-anchor="middle" class="ink n">paged</text>
  <line x1="360" y1="244" x2="360" y2="256" class="line"/>
  <text x="360" y="274" text-anchor="middle" class="ink n">investigate</text>
  <line x1="500" y1="244" x2="500" y2="256" class="line"/>
  <text x="500" y="274" text-anchor="middle" class="ink n">find the</text>
  <text x="500" y="290" text-anchor="middle" class="ink n">perfect fix</text>
  <line x1="640" y1="244" x2="640" y2="256" class="line"/>
  <text x="640" y="274" text-anchor="middle" class="focus n b">apply fix</text>
</svg>
