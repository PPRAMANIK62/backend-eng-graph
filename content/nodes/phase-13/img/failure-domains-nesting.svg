<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="360" height="290" rx="6" class="box"/>
  <text x="34" y="42" class="ink t b">Region</text>
  <rect x="40" y="54" width="320" height="240" rx="6" class="box"/>
  <text x="54" y="76" class="ink t b">Zone</text>
  <rect x="60" y="88" width="280" height="190" rx="6" class="box"/>
  <text x="74" y="110" class="ink t b">Rack</text>
  <rect x="80" y="122" width="240" height="140" rx="6" class="box"/>
  <text x="94" y="144" class="ink t b">Machine</text>
  <rect x="100" y="156" width="200" height="90" rx="6" class="safe-box"/>
  <text x="200" y="198" text-anchor="middle" class="ink t b">Disk</text>
  <text x="200" y="218" text-anchor="middle" class="ink2 n">one copy of your data</text>

  <text x="400" y="38" class="ink t">Zones share a geographic area</text>
  <line x1="380" y1="34" x2="396" y2="34" class="line"/>
  <text x="400" y="72" class="ink t">Racks share generators, cooling,</text>
  <text x="400" y="88" class="ink t">a power substation</text>
  <line x1="360" y1="68" x2="396" y2="68" class="line"/>
  <text x="400" y="114" class="ink t">Machines share a network switch</text>
  <text x="400" y="130" class="ink t">and power cabling</text>
  <line x1="340" y1="110" x2="396" y2="110" class="line"/>
  <text x="400" y="164" class="ink t">Disks share the machine: a kernel</text>
  <text x="400" y="180" class="ink t">crash or reboot takes them all</text>
  <line x1="320" y1="160" x2="396" y2="160" class="line"/>

  <rect x="20" y="326" width="680" height="36" rx="6" class="box"/>
  <rect x="20" y="326" width="6" height="36" class="lost"/>
  <text x="40" y="349" class="ink t"><tspan class="b">Software rollouts and planned upgrades</tspan> can hit every level at once</text>
</svg>
