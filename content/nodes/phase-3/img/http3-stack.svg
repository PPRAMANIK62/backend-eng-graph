<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="190" y="26" text-anchor="middle" class="ink t b">HTTP/2</text>
  <rect x="40" y="42" width="300" height="56" rx="6" class="box"/>
  <text x="56" y="66" class="ink t b">HTTP/2</text>
  <text x="56" y="86" class="ink2 n">frames, streams, flow control, HPACK</text>
  <rect x="40" y="106" width="300" height="56" rx="6" class="box"/>
  <text x="56" y="130" class="ink t b">TLS</text>
  <text x="56" y="150" class="ink2 n">encryption</text>
  <rect x="40" y="170" width="300" height="72" rx="6" class="box"/>
  <text x="56" y="194" class="ink t b">TCP</text>
  <text x="56" y="214" class="ink2 n">ordered bytes, loss recovery,</text>
  <text x="56" y="230" class="ink2 n">congestion control</text>
  <rect x="40" y="250" width="300" height="38" rx="6" class="box"/>
  <text x="56" y="274" class="ink t b">IP</text>
  <text x="530" y="26" text-anchor="middle" class="ink t b">HTTP/3</text>
  <rect x="380" y="42" width="300" height="56" rx="6" class="box"/>
  <text x="396" y="66" class="ink t b">HTTP/3</text>
  <text x="396" y="86" class="ink2 n">frames, QPACK</text>
  <rect x="380" y="106" width="300" height="82" rx="6" class="box"/>
  <text x="396" y="130" class="focus t b">QUIC, with TLS 1.3 inside</text>
  <text x="396" y="150" class="ink2 n">streams, flow control, encryption,</text>
  <text x="396" y="166" class="ink2 n">loss recovery, congestion control</text>
  <rect x="380" y="196" width="300" height="38" rx="6" class="box"/>
  <text x="396" y="220" class="ink t b">UDP</text>
  <rect x="380" y="242" width="300" height="38" rx="6" class="box"/>
  <text x="396" y="266" class="ink t b">IP</text>
</svg>
