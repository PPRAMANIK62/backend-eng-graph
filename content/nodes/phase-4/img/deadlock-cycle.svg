<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- the code -->
  <text x="24" y="30" class="ink t b">Thread 1</text>
  <text x="24" y="54" class="ink t mono">lock(L1)</text>
  <text x="24" y="76" class="ink t mono">lock(L2)</text>
  <text x="24" y="130" class="ink t b">Thread 2</text>
  <text x="24" y="154" class="ink t mono">lock(L2)</text>
  <text x="24" y="176" class="ink t mono">lock(L1)</text>
  <text x="24" y="228" class="ink2 n">Thread 1 got L1, then a</text>
  <text x="24" y="246" class="ink2 n">switch let Thread 2 get L2.</text>
  <text x="24" y="264" class="ink2 n">Each now waits on the other.</text>

  <!-- the graph -->
  <rect x="270" y="30" width="140" height="44" rx="6" class="box"/>
  <text x="340" y="57" text-anchor="middle" class="ink t b">Thread 1</text>
  <rect x="560" y="30" width="140" height="44" rx="6" class="box"/>
  <text x="630" y="57" text-anchor="middle" class="ink t b">Lock L2</text>
  <rect x="560" y="210" width="140" height="44" rx="6" class="box"/>
  <text x="630" y="237" text-anchor="middle" class="ink t b">Thread 2</text>
  <rect x="270" y="210" width="140" height="44" rx="6" class="box"/>
  <text x="340" y="237" text-anchor="middle" class="ink t b">Lock L1</text>

  <!-- Thread 1 waits for L2 -->
  <line x1="412" y1="52" x2="556" y2="52" class="lost-s" style="stroke-width:2" marker-end="url(#arrow)"/>
  <text x="484" y="42" text-anchor="middle" class="lost n b">waits for</text>
  <!-- L2 held by Thread 2 -->
  <line x1="630" y1="76" x2="630" y2="206" class="line" marker-end="url(#arrow)"/>
  <text x="642" y="146" class="ink2 n">held by</text>
  <!-- Thread 2 waits for L1 -->
  <line x1="558" y1="232" x2="414" y2="232" class="lost-s" style="stroke-width:2" marker-end="url(#arrow)"/>
  <text x="484" y="272" text-anchor="middle" class="lost n b">waits for</text>
  <!-- L1 held by Thread 1 -->
  <line x1="340" y1="208" x2="340" y2="78" class="line" marker-end="url(#arrow)"/>
  <text x="352" y="146" class="ink2 n">held by</text>

  <text x="485" y="146" text-anchor="middle" class="ink2 n">a cycle</text>
</svg>
