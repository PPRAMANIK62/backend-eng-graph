<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="28" class="ink t b">Namespace</text>
  <text x="260" y="28" text-anchor="middle" class="ink t b">What the host sees</text>
  <text x="565" y="28" text-anchor="middle" class="focus t b">What the process inside sees</text>
  <text x="20" y="81" class="ink t b">PID</text>
  <rect x="110" y="44" width="300" height="64" rx="6" class="box"/>
  <rect x="430" y="44" width="270" height="64" rx="6" class="box"/>
  <rect x="430" y="44" width="270" height="64" rx="6" class="focus-s"/>
  <text x="124" y="71" class="ink t">Web server is PID 4200</text>
  <text x="124" y="91" class="ink2 n">sees every process on the machine</text>
  <text x="444" y="71" class="ink t">Web server is PID 1</text>
  <text x="444" y="91" class="ink2 n">sees only the container's processes</text>
  <text x="20" y="157" class="ink t b">Network</text>
  <rect x="110" y="120" width="300" height="64" rx="6" class="box"/>
  <rect x="430" y="120" width="270" height="64" rx="6" class="box"/>
  <rect x="430" y="120" width="270" height="64" rx="6" class="focus-s"/>
  <text x="124" y="147" class="ink t">eth0, host routes, host port 80</text>
  <text x="124" y="167" class="ink2 n">plus veth0, the host end of a veth pair</text>
  <text x="444" y="147" class="ink t">lo and veth1 only</text>
  <text x="444" y="167" class="ink2 n">its own routes, its own port 80</text>
  <text x="20" y="233" class="ink t b">Mount</text>
  <rect x="110" y="196" width="300" height="64" rx="6" class="box"/>
  <rect x="430" y="196" width="270" height="64" rx="6" class="box"/>
  <rect x="430" y="196" width="270" height="64" rx="6" class="focus-s"/>
  <text x="124" y="223" class="ink t">/ is the host's root filesystem</text>
  <text x="124" y="243" class="ink2 n">the container's files are one directory</text>
  <text x="444" y="223" class="ink t">/ is the container's root filesystem</text>
  <text x="444" y="243" class="ink2 n">the host's other mounts are not there</text>
  <text x="20" y="309" class="ink t b">UTS</text>
  <rect x="110" y="272" width="300" height="64" rx="6" class="box"/>
  <rect x="430" y="272" width="270" height="64" rx="6" class="box"/>
  <rect x="430" y="272" width="270" height="64" rx="6" class="focus-s"/>
  <text x="124" y="309" class="ink t mono">hostname: node-7</text>
  <text x="444" y="309" class="ink t mono">hostname: web-1</text>
  <text x="20" y="385" class="ink t b">User</text>
  <rect x="110" y="348" width="300" height="64" rx="6" class="box"/>
  <rect x="430" y="348" width="270" height="64" rx="6" class="box"/>
  <rect x="430" y="348" width="270" height="64" rx="6" class="focus-s"/>
  <text x="124" y="375" class="ink t">Runs as UID 100000</text>
  <text x="124" y="395" class="ink2 n">an ordinary, unprivileged user</text>
  <text x="444" y="375" class="ink t">Same process is UID 0 (root)</text>
  <text x="444" y="395" class="ink2 n">but only over its own namespaces</text>
</svg>
