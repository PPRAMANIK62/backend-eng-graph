<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- small: listpack -->
  <text x="20" y="28" class="ink t b">Small hash: one flat listpack</text>
  <text x="20" y="48" class="ink2 n">at most 512 fields, no field or value over 64 bytes (the defaults)</text>
  <rect x="20" y="62" width="680" height="52" rx="6" fill="none" class="focus-s"/>
  <g class="n mono">
    <rect x="32" y="72" width="30" height="32" rx="4" class="box"/><text x="47" y="93" text-anchor="middle" class="ink2">4</text>
    <rect x="62" y="72" width="60" height="32" rx="4" class="box"/><text x="92" y="93" text-anchor="middle" class="ink">name</text>
    <rect x="130" y="72" width="30" height="32" rx="4" class="box"/><text x="145" y="93" text-anchor="middle" class="ink2">3</text>
    <rect x="160" y="72" width="54" height="32" rx="4" class="box"/><text x="187" y="93" text-anchor="middle" class="ink">ada</text>
    <rect x="222" y="72" width="30" height="32" rx="4" class="box"/><text x="237" y="93" text-anchor="middle" class="ink2">4</text>
    <rect x="252" y="72" width="60" height="32" rx="4" class="box"/><text x="282" y="93" text-anchor="middle" class="ink">city</text>
    <rect x="320" y="72" width="30" height="32" rx="4" class="box"/><text x="335" y="93" text-anchor="middle" class="ink2">4</text>
    <rect x="350" y="72" width="60" height="32" rx="4" class="box"/><text x="380" y="93" text-anchor="middle" class="ink">oslo</text>
    <rect x="418" y="72" width="30" height="32" rx="4" class="box"/><text x="433" y="93" text-anchor="middle" class="ink2">5</text>
    <rect x="448" y="72" width="60" height="32" rx="4" class="box"/><text x="478" y="93" text-anchor="middle" class="ink">score</text>
    <rect x="516" y="72" width="30" height="32" rx="4" class="box"/><text x="531" y="93" text-anchor="middle" class="ink2">2</text>
    <rect x="546" y="72" width="44" height="32" rx="4" class="box"/><text x="568" y="93" text-anchor="middle" class="ink">42</text>
  </g>
  <text x="604" y="93" class="ink2 n">...</text>
  <text x="20" y="138" class="ink2 n">Length-prefixed field, value, field, value in one allocation. HGET scans it: O(N), but N is small</text>
  <text x="20" y="156" class="ink2 n">and the bytes sit next to each other, so the CPU cache does well.</text>

  <!-- arrow down -->
  <line x1="360" y1="170" x2="360" y2="200" class="line" marker-end="url(#arrow)"/>
  <text x="372" y="190" class="ink2 n">field 513 added, or an entry over 64 bytes: converted</text>

  <!-- big: hash table -->
  <text x="20" y="224" class="ink t b">Big hash: a real hash table</text>
  <rect x="20" y="238" width="60" height="132" rx="6" class="box"/>
  <text x="50" y="258" text-anchor="middle" class="ink2 n">buckets</text>
  <line x1="28" y1="282" x2="72" y2="282" class="line"/>
  <line x1="28" y1="326" x2="72" y2="326" class="line"/>

  <line x1="80" y1="262" x2="138" y2="262" class="line" marker-end="url(#arrow)"/>
  <rect x="140" y="244" width="130" height="36" rx="6" class="box"/>
  <text x="205" y="267" text-anchor="middle" class="ink n mono">name: ada</text>
  <line x1="80" y1="306" x2="138" y2="306" class="line" marker-end="url(#arrow)"/>
  <rect x="140" y="288" width="130" height="36" rx="6" class="box"/>
  <text x="205" y="311" text-anchor="middle" class="ink n mono">city: oslo</text>
  <line x1="80" y1="350" x2="138" y2="350" class="line" marker-end="url(#arrow)"/>
  <rect x="140" y="332" width="130" height="36" rx="6" class="box"/>
  <text x="205" y="355" text-anchor="middle" class="ink n mono">score: 42</text>

  <text x="330" y="276" class="ink2 n">O(1) lookups, but entries are reached</text>
  <text x="330" y="294" class="ink2 n">through pointers, 8 bytes each on a</text>
  <text x="330" y="312" class="ink2 n">64-bit machine. The listpack above</text>
  <text x="330" y="330" class="ink2 n">can use up to 10 times less memory.</text>
</svg>
