<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <!-- time axis -->
  <line x1="150" y1="290" x2="700" y2="290" class="line" marker-end="url(#arrow)"/>
  <text x="160" y="312" class="ink2 n">pod deleted</text>
  <text x="640" y="312" text-anchor="middle" class="ink2 n">grace period ends</text>
  <text x="640" y="326" text-anchor="middle" class="ink2 n">(30 s by default)</text>
  <line x1="640" y1="40" x2="640" y2="290" class="lost-s" stroke-dasharray="6 5"/>
  <text x="646" y="36" class="lost n b">SIGKILL</text>

  <!-- lane 1: kubelet -->
  <text x="24" y="70" class="ink t b">Kubelet</text>
  <rect x="160" y="52" width="90" height="30" rx="6" class="box"/>
  <text x="205" y="72" text-anchor="middle" class="ink n">preStop hook</text>
  <line x1="252" y1="67" x2="276" y2="67" class="line" marker-end="url(#arrow)"/>
  <text x="282" y="72" class="ink n b mono">SIGTERM</text>
  <text x="282" y="90" class="ink2 n">to process 1</text>

  <!-- lane 2: load balancers -->
  <text x="24" y="140" class="ink t b">Load balancers</text>
  <rect x="160" y="122" width="200" height="30" rx="6" class="focus"/>
  <text x="170" y="142" class="ink n">still sending new work</text>
  <text x="370" y="142" class="ink2 n">endpoint marked not ready at the same time;</text>
  <text x="370" y="158" class="ink2 n">each load balancer catches up on its own</text>

  <!-- lane 3: your server -->
  <text x="24" y="210" class="ink t b">Your server</text>
  <rect x="160" y="192" width="200" height="30" rx="6" class="focus"/>
  <text x="170" y="212" class="ink n">keep accepting</text>
  <rect x="360" y="192" width="160" height="30" rx="6" class="safe-box"/>
  <text x="370" y="212" class="ink n">drain: finish in flight</text>
  <line x1="360" y1="180" x2="360" y2="232" class="line"/>
  <text x="360" y="248" text-anchor="middle" class="ink2 n">stop accepting</text>
  <line x1="520" y1="180" x2="520" y2="232" class="line"/>
  <text x="520" y="248" text-anchor="middle" class="ink2 n">exit</text>
  <text x="540" y="212" class="ink2 n">spare time</text>
</svg>
