<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="24" y="30" class="ink t b">Concurrent, one core</text>
  <text x="24" y="48" class="ink2 n">Tasks A and B are both in progress; the core takes turns</text>
  <text x="24" y="84" class="ink2 n">core 1</text>
  <rect x="100" y="64" width="92" height="30" rx="6" class="focus-s"/>
  <text x="146" y="84" text-anchor="middle" class="focus t b">A</text>
  <rect x="198" y="64" width="92" height="30" rx="6" class="box"/>
  <text x="244" y="84" text-anchor="middle" class="ink t b">B</text>
  <rect x="296" y="64" width="92" height="30" rx="6" class="focus-s"/>
  <text x="342" y="84" text-anchor="middle" class="focus t b">A</text>
  <rect x="394" y="64" width="92" height="30" rx="6" class="box"/>
  <text x="440" y="84" text-anchor="middle" class="ink t b">B</text>
  <rect x="492" y="64" width="92" height="30" rx="6" class="focus-s"/>
  <text x="538" y="84" text-anchor="middle" class="focus t b">A</text>
  <rect x="590" y="64" width="92" height="30" rx="6" class="box"/>
  <text x="636" y="84" text-anchor="middle" class="ink t b">B</text>
  <text x="24" y="140" class="ink t b">Parallel, two cores</text>
  <text x="24" y="158" class="ink2 n">A and B run at the same instant, each on its own core</text>
  <text x="24" y="194" class="ink2 n">core 1</text>
  <text x="24" y="234" class="ink2 n">core 2</text>
  <rect x="100" y="174" width="288" height="30" rx="6" class="focus-s"/>
  <text x="244" y="194" text-anchor="middle" class="focus t b">A</text>
  <rect x="100" y="214" width="288" height="30" rx="6" class="box"/>
  <text x="244" y="234" text-anchor="middle" class="ink t b">B</text>
  <line x1="100" y1="266" x2="696" y2="266" class="line" marker-end="url(#arrow)"/>
  <text x="696" y="286" text-anchor="end" class="ink2 n">time</text>
</svg>
