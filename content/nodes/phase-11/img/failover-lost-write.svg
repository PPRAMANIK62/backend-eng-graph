<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="110" y="28" text-anchor="middle" class="ink t b">Client</text>
  <text x="360" y="28" text-anchor="middle" class="ink t b">Old leader</text>
  <text x="580" y="28" text-anchor="middle" class="ink t b">Follower</text>
  <line x1="110" y1="40" x2="110" y2="370" class="line"/>
  <line x1="360" y1="40" x2="360" y2="176" class="line"/>
  <line x1="360" y1="176" x2="360" y2="270" class="line" stroke-dasharray="4 5"/>
  <line x1="360" y1="270" x2="360" y2="332" class="line"/>
  <line x1="580" y1="40" x2="580" y2="214" class="line"/>
  <line x1="580" y1="258" x2="580" y2="370" class="line"/>

  <!-- w1..w4 replicated -->
  <line x1="360" y1="62" x2="577" y2="82" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="62" text-anchor="middle" class="ink n mono">w1 … w4</text>
  <text x="592" y="86" class="ink2 n">has w1–w4</text>

  <!-- w5 -->
  <line x1="110" y1="108" x2="357" y2="124" class="focus-s" marker-end="url(#arrow)"/>
  <text x="235" y="106" text-anchor="middle" class="focus n mono b">write w5</text>
  <text x="372" y="128" class="ink2 n">stores w5 locally</text>
  <line x1="360" y1="138" x2="113" y2="154" class="focus-s" marker-end="url(#arrow)"/>
  <text x="235" y="140" text-anchor="middle" class="focus n mono b">OK</text>
  <text x="98" y="158" text-anchor="end" class="ink2 n">told saved</text>

  <!-- crash -->
  <path d="M350,166 L370,186 M370,166 L350,186" class="lost-s"/>
  <text x="378" y="174" class="lost n b">crashes</text>
  <text x="378" y="190" class="ink2 n">w5 never shipped</text>

  <!-- promote -->
  <rect x="470" y="214" width="220" height="44" rx="6" class="safe-box"/>
  <text x="580" y="234" text-anchor="middle" class="ink t b">promoted to leader</text>
  <text x="580" y="250" text-anchor="middle" class="ink2 n">has w1–w4, no w5</text>

  <!-- rejoin -->
  <text x="348" y="286" text-anchor="end" class="ink n b">comes back, rejoins as a follower</text>
  <line x1="580" y1="304" x2="363" y2="320" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="302" text-anchor="middle" class="ink2 n">new history, without w5</text>
  <rect x="210" y="332" width="300" height="30" rx="6" class="box"/>
  <text x="360" y="352" text-anchor="middle" class="lost n b">w5 discarded (MongoDB: rollback file)</text>

</svg>
