<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- row labels -->
  <text x="24" y="66" class="ink t b">Authoritative</text>
  <text x="24" y="84" class="ink2 n">the zone's data</text>
  <text x="24" y="146" class="ink t b">Resolver</text>
  <text x="24" y="164" class="ink2 n">its cache</text>

  <!-- authoritative row -->
  <rect x="180" y="50" width="220" height="40" rx="6" class="box"/>
  <text x="290" y="75" text-anchor="middle" class="ink n mono">A 192.0.2.1 (old)</text>
  <rect x="400" y="50" width="300" height="40" rx="6" class="safe-box"/>
  <text x="550" y="75" text-anchor="middle" class="ink n mono">A 198.51.100.7 (new)</text>

  <!-- resolver row -->
  <line x1="180" y1="150" x2="248" y2="150" class="line" stroke-dasharray="2 5"/>
  <text x="214" y="142" text-anchor="middle" class="ink2 n">empty</text>
  <rect x="250" y="130" width="270" height="40" rx="6" class="box"/>
  <text x="325" y="155" text-anchor="middle" class="ink n">old answer, TTL 300</text>
  <rect x="400" y="130" width="120" height="40" rx="6" class="lost-s"/>
  <rect x="520" y="130" width="180" height="40" rx="6" class="safe-box"/>
  <text x="610" y="155" text-anchor="middle" class="ink n">new answer cached</text>

  <!-- stale window bracket -->
  <path d="M400,180 V188 H520 V180" class="lost-s" style="stroke-width:1.5"/>
  <text x="460" y="204" text-anchor="middle" class="lost n b">stale window: clients still get the old address</text>

  <!-- event ticks -->
  <line x1="250" y1="120" x2="250" y2="222" class="line" stroke-dasharray="3 3"/>
  <line x1="400" y1="40" x2="400" y2="176" class="line" stroke-dasharray="3 3"/>
  <line x1="400" y1="212" x2="400" y2="222" class="line" stroke-dasharray="3 3"/>
  <line x1="520" y1="120" x2="520" y2="176" class="line" stroke-dasharray="3 3"/>
  <line x1="520" y1="212" x2="520" y2="222" class="line" stroke-dasharray="3 3"/>

  <!-- time axis -->
  <line x1="180" y1="225" x2="700" y2="225" class="line" marker-end="url(#arrow)"/>
  <text x="250" y="245" text-anchor="middle" class="ink2 n">first lookup</text>
  <text x="400" y="245" text-anchor="middle" class="ink2 n">record changed</text>
  <text x="520" y="245" text-anchor="middle" class="ink2 n">TTL runs out</text>
  <text x="700" y="262" text-anchor="end" class="ink2 n">time</text>
</svg>
