<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- clients -->
  <rect x="20" y="40" width="150" height="56" rx="6" class="box"/>
  <text x="95" y="64" text-anchor="middle" class="ink t b">Client A</text>
  <text x="95" y="82" text-anchor="middle" class="ink2 n">local copy</text>
  <rect x="20" y="140" width="150" height="56" rx="6" class="box"/>
  <text x="95" y="164" text-anchor="middle" class="ink t b">Client B</text>
  <text x="95" y="182" text-anchor="middle" class="ink2 n">local copy</text>
  <rect x="20" y="240" width="150" height="56" rx="6" class="box"/>
  <text x="95" y="264" text-anchor="middle" class="ink t b">Client C</text>
  <text x="95" y="282" text-anchor="middle" class="ink2 n">local copy</text>

  <!-- websocket links -->
  <line x1="172" y1="68" x2="285" y2="140" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="172" y1="168" x2="285" y2="168" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="172" y1="268" x2="285" y2="196" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="95" y="322" text-anchor="middle" class="ink2 n">each applies its own edits at once</text>
  <text x="228" y="190" text-anchor="middle" class="ink2 n">WebSockets</text>

  <!-- server -->
  <rect x="290" y="100" width="190" height="136" rx="6" class="box"/>
  <rect x="290" y="100" width="190" height="136" rx="6" class="focus-s"/>
  <text x="385" y="124" text-anchor="middle" class="ink t b">Document server</text>
  <text x="385" y="144" text-anchor="middle" class="ink2 n">one per document,</text>
  <text x="385" y="160" text-anchor="middle" class="ink2 n">state held in memory</text>
  <text x="302" y="186" class="ink n">1  validate and order</text>
  <text x="302" y="204" class="ink n">2  apply to its copy</text>
  <text x="302" y="222" class="ink n">3  broadcast to others</text>

  <!-- storage -->
  <rect x="540" y="60" width="160" height="70" rx="6" class="safe-box"/>
  <text x="620" y="86" text-anchor="middle" class="ink t b">Journal</text>
  <text x="620" y="104" text-anchor="middle" class="ink2 n">every change, with a</text>
  <text x="620" y="120" text-anchor="middle" class="ink2 n">sequence number</text>
  <rect x="540" y="200" width="160" height="70" rx="6" class="safe-box"/>
  <text x="620" y="226" text-anchor="middle" class="ink t b">Checkpoint</text>
  <text x="620" y="244" text-anchor="middle" class="ink2 n">the whole document,</text>
  <text x="620" y="260" text-anchor="middle" class="ink2 n">written now and then</text>
  <line x1="482" y1="140" x2="537" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="482" y1="200" x2="537" y2="230" class="line" marker-end="url(#arrow)"/>

  <text x="385" y="268" text-anchor="middle" class="ink2 n">after a crash: load the checkpoint,</text>
  <text x="385" y="284" text-anchor="middle" class="ink2 n">replay newer journal entries</text>
  <text x="620" y="150" text-anchor="middle" class="ink2 n">written only while holding</text>
  <text x="620" y="166" text-anchor="middle" class="ink2 n">the document's lock</text>
</svg>
