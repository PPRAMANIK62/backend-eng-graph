<svg xmlns="http://www.w3.org/2000/svg" width="720" height="454" viewBox="0 0 720 454" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="40" y="24" class="ink t">Program: append to file A, then append to file B</text>
  <text x="40" y="61" class="ink t b">Before</text>
  <text x="40" y="84" class="ink2 n"></text>
  <text x="380" y="61" class="ink2 n">file A</text>
  <rect x="430" y="44" width="90" height="24" rx="6" class="old"/><text x="475" y="61" text-anchor="middle" class="ink n">old</text>
  <text x="380" y="89" class="ink2 n">file B</text>
  <rect x="430" y="72" width="90" height="24" rx="6" class="old"/><text x="475" y="89" text-anchor="middle" class="ink n">old</text>
  <text x="40" y="137" class="ink t b">After, no crash</text>
  <text x="40" y="160" class="ink2 n">both appends on disk</text>
  <text x="380" y="137" class="ink2 n">file A</text>
  <rect x="430" y="120" width="90" height="24" rx="6" class="old"/><text x="475" y="137" text-anchor="middle" class="ink n">old</text>
  <rect x="524" y="120" width="90" height="24" rx="6" class="focus-s"/><text x="569" y="137" text-anchor="middle" class="ink n">new</text>
  <text x="380" y="165" class="ink2 n">file B</text>
  <rect x="430" y="148" width="90" height="24" rx="6" class="old"/><text x="475" y="165" text-anchor="middle" class="ink n">old</text>
  <rect x="524" y="148" width="90" height="24" rx="6" class="focus-s"/><text x="569" y="165" text-anchor="middle" class="ink n">new</text>
  <line x1="40" y1="194" x2="680" y2="194" class="line" stroke-dasharray="4 4"/>
  <text x="40" y="218" class="ink2 n b">Some states a crash can leave</text>
  <text x="40" y="251" class="lost t b">A: size grew, data didn’t</text>
  <text x="40" y="274" class="ink2 n">the new bytes are garbage</text>
  <text x="380" y="251" class="ink2 n">file A</text>
  <rect x="430" y="234" width="90" height="24" rx="6" class="old"/><text x="475" y="251" text-anchor="middle" class="ink n">old</text>
  <rect x="524" y="234" width="90" height="24" rx="6" class="lost"/><text x="569" y="251" text-anchor="middle" class="ink n">garbage</text>
  <text x="380" y="279" class="ink2 n">file B</text>
  <rect x="430" y="262" width="90" height="24" rx="6" class="old"/><text x="475" y="279" text-anchor="middle" class="ink n">old</text>
  <text x="40" y="327" class="lost t b">B: only part of the data</text>
  <text x="40" y="350" class="ink2 n">the append was not atomic</text>
  <text x="380" y="327" class="ink2 n">file A</text>
  <rect x="430" y="310" width="90" height="24" rx="6" class="old"/><text x="475" y="327" text-anchor="middle" class="ink n">old</text>
  <rect x="524" y="310" width="44" height="24" rx="6" class="focus-s"/><text x="546" y="327" text-anchor="middle" class="ink n">part</text>
  <text x="380" y="355" class="ink2 n">file B</text>
  <rect x="430" y="338" width="90" height="24" rx="6" class="old"/><text x="475" y="355" text-anchor="middle" class="ink n">old</text>
  <text x="40" y="403" class="lost t b">C: B’s append without A’s</text>
  <text x="40" y="426" class="ink2 n">the two were reordered</text>
  <text x="380" y="403" class="ink2 n">file A</text>
  <rect x="430" y="386" width="90" height="24" rx="6" class="old"/><text x="475" y="403" text-anchor="middle" class="ink n">old</text>
  <text x="380" y="431" class="ink2 n">file B</text>
  <rect x="430" y="414" width="90" height="24" rx="6" class="old"/><text x="475" y="431" text-anchor="middle" class="ink n">old</text>
  <rect x="524" y="414" width="90" height="24" rx="6" class="focus-s"/><text x="569" y="431" text-anchor="middle" class="ink n">new</text>
</svg>
