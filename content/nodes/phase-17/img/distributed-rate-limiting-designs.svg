<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="110" y="22" text-anchor="middle" class="ink t b">Each server alone</text>
  <text x="110" y="40" text-anchor="middle" class="ink2 n">own counter per server</text>
  <rect x="60" y="54" width="100" height="30" rx="6" class="box"/>
  <text x="110" y="74" text-anchor="middle" class="ink n">one client</text>
  <line x1="110" y1="84" x2="40" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="8" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="40" y="138" text-anchor="middle" class="ink n">server 1</text>
  <line x1="110" y1="84" x2="112" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="80" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="112" y="138" text-anchor="middle" class="ink n">server 2</text>
  <line x1="110" y1="84" x2="184" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="152" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="184" y="138" text-anchor="middle" class="ink n">server 3</text>
  <rect x="14" y="168" width="52" height="24" rx="6" class="box"/>
  <text x="40" y="184" text-anchor="middle" class="ink2 n">count</text>
  <line x1="40" y1="148" x2="40" y2="166" class="line"/>
  <rect x="86" y="168" width="52" height="24" rx="6" class="box"/>
  <text x="112" y="184" text-anchor="middle" class="ink2 n">count</text>
  <line x1="112" y1="148" x2="112" y2="166" class="line"/>
  <rect x="158" y="168" width="52" height="24" rx="6" class="box"/>
  <text x="184" y="184" text-anchor="middle" class="ink2 n">count</text>
  <line x1="184" y1="148" x2="184" y2="166" class="line"/>
  <text x="110" y="222" text-anchor="middle" class="lost n b">client gets up to</text>
  <text x="110" y="238" text-anchor="middle" class="lost n b">3 times the limit</text>
  <text x="360" y="22" text-anchor="middle" class="ink t b">Shared store</text>
  <text x="360" y="40" text-anchor="middle" class="ink2 n">checked on every request</text>
  <rect x="310" y="54" width="100" height="30" rx="6" class="box"/>
  <text x="360" y="74" text-anchor="middle" class="ink n">one client</text>
  <line x1="360" y1="84" x2="290" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="258" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="290" y="138" text-anchor="middle" class="ink n">server 1</text>
  <line x1="360" y1="84" x2="362" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="330" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="362" y="138" text-anchor="middle" class="ink n">server 2</text>
  <line x1="360" y1="84" x2="434" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="402" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="434" y="138" text-anchor="middle" class="ink n">server 3</text>
  <line x1="290" y1="148" x2="360" y2="188" class="line" marker-end="url(#arrow)"/>
  <line x1="362" y1="148" x2="360" y2="188" class="line" marker-end="url(#arrow)"/>
  <line x1="434" y1="148" x2="360" y2="188" class="line" marker-end="url(#arrow)"/>
  <rect x="290" y="190" width="140" height="30" rx="6" class="box"/>
  <rect x="290" y="190" width="140" height="30" rx="6" class="focus-s"/>
  <text x="360" y="210" text-anchor="middle" class="focus n b">Redis: atomic script</text>
  <text x="360" y="242" text-anchor="middle" class="ink2 n">exact, but a round trip per</text>
  <text x="360" y="258" text-anchor="middle" class="ink2 n">request, and Redis must be up</text>
  <text x="610" y="22" text-anchor="middle" class="ink t b">Local, then shared</text>
  <text x="610" y="40" text-anchor="middle" class="ink2 n">two stages</text>
  <rect x="560" y="54" width="100" height="30" rx="6" class="box"/>
  <text x="610" y="74" text-anchor="middle" class="ink n">one client</text>
  <line x1="610" y1="84" x2="540" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="508" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="540" y="138" text-anchor="middle" class="ink n">server 1</text>
  <line x1="610" y1="84" x2="612" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="580" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="612" y="138" text-anchor="middle" class="ink n">server 2</text>
  <line x1="610" y1="84" x2="684" y2="116" class="line" marker-end="url(#arrow)"/>
  <rect x="652" y="118" width="64" height="30" rx="6" class="box"/>
  <text x="684" y="138" text-anchor="middle" class="ink n">server 3</text>
  <rect x="514" y="160" width="52" height="24" rx="6" class="focus-s"/>
  <text x="540" y="176" text-anchor="middle" class="focus n">bucket</text>
  <line x1="540" y1="148" x2="540" y2="158" class="line"/>
  <line x1="540" y1="184" x2="610" y2="212" class="line" marker-end="url(#arrow)"/>
  <rect x="586" y="160" width="52" height="24" rx="6" class="focus-s"/>
  <text x="612" y="176" text-anchor="middle" class="focus n">bucket</text>
  <line x1="612" y1="148" x2="612" y2="158" class="line"/>
  <line x1="612" y1="184" x2="610" y2="212" class="line" marker-end="url(#arrow)"/>
  <rect x="658" y="160" width="52" height="24" rx="6" class="focus-s"/>
  <text x="684" y="176" text-anchor="middle" class="focus n">bucket</text>
  <line x1="684" y1="148" x2="684" y2="158" class="line"/>
  <line x1="684" y1="184" x2="610" y2="212" class="line" marker-end="url(#arrow)"/>
  <rect x="550" y="214" width="120" height="30" rx="6" class="box"/>
  <text x="610" y="234" text-anchor="middle" class="ink n">global check</text>
  <text x="610" y="266" text-anchor="middle" class="ink2 n">bursts stop locally;</text>
  <text x="610" y="282" text-anchor="middle" class="ink2 n">fewer shared checks</text>
</svg>
