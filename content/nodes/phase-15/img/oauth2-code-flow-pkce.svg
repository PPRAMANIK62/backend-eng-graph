<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <line x1="640" y1="40" x2="640" y2="545" class="line"/>
  <line x1="470" y1="527" x2="470" y2="545" class="line"/>
  <line x1="470" y1="487" x2="470" y2="512" class="line"/>
  <line x1="470" y1="437" x2="470" y2="472" class="line"/>
  <line x1="470" y1="406" x2="470" y2="422" class="line"/>
  <line x1="470" y1="347" x2="470" y2="366" class="line"/>
  <line x1="470" y1="232" x2="470" y2="332" class="line"/>
  <line x1="470" y1="181" x2="470" y2="192" class="line"/>
  <line x1="470" y1="40" x2="470" y2="166" class="line"/>
  <line x1="280" y1="437" x2="280" y2="545" class="line"/>
  <line x1="280" y1="347" x2="280" y2="422" class="line"/>
  <line x1="280" y1="297" x2="280" y2="332" class="line"/>
  <line x1="280" y1="259" x2="280" y2="282" class="line"/>
  <line x1="280" y1="181" x2="280" y2="244" class="line"/>
  <line x1="280" y1="157" x2="280" y2="166" class="line"/>
  <line x1="280" y1="92" x2="280" y2="142" class="line"/>
  <line x1="280" y1="40" x2="280" y2="52" class="line"/>
  <line x1="110" y1="297" x2="110" y2="545" class="line"/>
  <line x1="110" y1="181" x2="110" y2="282" class="line"/>
  <line x1="110" y1="40" x2="110" y2="166" class="line"/>
  <text x="110" y="28" text-anchor="middle" class="ink t b">User&#x27;s browser</text>
  <text x="280" y="28" text-anchor="middle" class="ink t b">Client (your app)</text>
  <text x="470" y="28" text-anchor="middle" class="ink t b">Authorization server</text>
  <text x="640" y="28" text-anchor="middle" class="ink t b">Resource server (API)</text>
  <rect x="202" y="52" width="156" height="40" rx="6" class="box"/>
  <text x="280" y="69" text-anchor="middle" class="ink n">makes a random</text>
  <text x="280" y="85" text-anchor="middle" class="focus n b">code_verifier, keeps it</text>
  <line x1="280" y1="122" x2="113" y2="122" class="line" marker-end="url(#arrow)"/>
  <text x="195.0" y="115" text-anchor="middle" class="ink n mono">302 to /authorize</text>
  <line x1="110" y1="160" x2="467" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="290.0" y="153" text-anchor="middle" class="ink n mono">GET /authorize?client_id, redirect_uri,</text>
  <text x="290.0" y="177" text-anchor="middle" class="focus n mono b">scope, state, code_challenge = SHA-256(verifier)</text>
  <rect x="390" y="192" width="160" height="40" rx="6" class="box"/>
  <text x="470" y="209" text-anchor="middle" class="ink n">user signs in</text>
  <text x="470" y="225" text-anchor="middle" class="ink n">and approves the scope</text>
  <line x1="470" y1="262" x2="113" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="290.0" y="255" text-anchor="middle" class="ink n mono">302 to redirect_uri?code=abc&amp;state=xyz</text>
  <line x1="110" y1="300" x2="277" y2="300" class="line" marker-end="url(#arrow)"/>
  <text x="195.0" y="293" text-anchor="middle" class="ink n mono">GET /callback?code&amp;state</text>
  <line x1="280" y1="350" x2="467" y2="350" class="focus-s" marker-end="url(#arrow)"/>
  <text x="375.0" y="343" text-anchor="middle" class="focus n mono b">POST /token: code + code_verifier</text>
  <rect x="390" y="366" width="160" height="40" rx="6" class="box"/>
  <text x="470" y="383" text-anchor="middle" class="ink n mono">SHA-256(verifier)</text>
  <text x="470" y="399" text-anchor="middle" class="ink n">matches the challenge?</text>
  <line x1="470" y1="440" x2="283" y2="440" class="line" marker-end="url(#arrow)"/>
  <text x="375.0" y="433" text-anchor="middle" class="ink n mono">access token (+ refresh token)</text>
  <line x1="280" y1="490" x2="637" y2="490" class="line" marker-end="url(#arrow)"/>
  <text x="460.0" y="483" text-anchor="middle" class="ink n mono">Authorization: Bearer &lt;access token&gt;</text>
  <line x1="640" y1="530" x2="283" y2="530" class="line" marker-end="url(#arrow)"/>
  <text x="460.0" y="523" text-anchor="middle" class="ink n mono">the data the token allows</text>
  <path d="M18,110 H26 V310 H18" class="line"/>
  <text x="32" y="200" class="ink2 n">front</text>
  <text x="32" y="215" class="ink2 n">channel:</text>
  <text x="32" y="230" class="ink2 n">via the</text>
  <text x="32" y="245" class="ink2 n">browser</text>
  <path d="M18,335 H26 V540 H18" class="line"/>
  <text x="32" y="430" class="ink2 n">back</text>
  <text x="32" y="445" class="ink2 n">channel:</text>
  <text x="32" y="460" class="ink2 n">direct,</text>
  <text x="32" y="475" class="ink2 n">over TLS</text>
</svg>
