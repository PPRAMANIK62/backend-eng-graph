  <rect x="368" y="240" width="50" height="34" rx="6" class="line" stroke-dasharray="4 3"/>
  <rect x="422" y="240" width="50" height="34" rx="6" class="line" stroke-dasharray="4 3"/>
  <rect x="476" y="240" width="50" height="34" rx="6" class="line" stroke-dasharray="4 3"/>
  <rect x="530" y="240" width="50" height="34" rx="6" class="line" stroke-dasharray="4 3"/>
  <text x="612" y="254" text-anchor="start" class="ink2 n">received: 1 to 4</text>
  <text x="612" y="270" text-anchor="start" class="ink n b">replayed: 1 to 3</text>
  <line x1="75" y1="76" x2="75" y2="137" class="line" marker-end="url(#arrow)"/>
  <text x="83" y="112" text-anchor="start" class="ink2 n">stream</text>
  <path d="M20,57 H8 V257 H17" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="312" width="26" height="18" rx="6" class="box"/>
  <text x="54" y="326" text-anchor="start" class="ink2 n">replayed: reads on this server see it</text>
  <rect x="300" y="312" width="26" height="18" rx="4" class="focus-s"/>
  <text x="334" y="326" text-anchor="start" class="ink2 n">received, not yet visible</text>
  <rect x="520" y="312" width="26" height="18" rx="4" class="line" stroke-dasharray="4 3"/>
  <text x="554" y="326" text-anchor="start" class="ink2 n">not received yet</text>
</svg>
