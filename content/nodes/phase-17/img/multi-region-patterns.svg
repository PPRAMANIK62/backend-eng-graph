<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="110" y="24" text-anchor="middle" class="ink t b">Active-passive</text>
  <text x="360" y="24" text-anchor="middle" class="ink t b">Read local, write global</text>
  <text x="610" y="24" text-anchor="middle" class="ink t b">Active-active</text>
  <rect x="15" y="50" width="190" height="64" rx="6" class="box"/>
  <rect x="15" y="50" width="190" height="64" rx="6" class="focus-s"/>
  <text x="110" y="72" text-anchor="middle" class="ink t b">Region A</text>
  <text x="110" y="90" text-anchor="middle" class="ink2 n">all reads and writes</text>
  <rect x="15" y="190" width="190" height="64" rx="6" class="box"/>
  <text x="110" y="212" text-anchor="middle" class="ink t b">Region B</text>
  <text x="110" y="230" text-anchor="middle" class="ink2 n">standby, copy only</text>
  <line x1="110" y1="116" x2="110" y2="187" class="line" marker-end="url(#arrow)"/>
  <text x="118" y="150" text-anchor="start" class="ink2 n">async copy</text>
  <text x="110" y="280" text-anchor="middle" class="ink n">on failure, DNS moves</text>
  <text x="110" y="296" text-anchor="middle" class="ink n">traffic to B; writes not</text>
  <text x="110" y="312" text-anchor="middle" class="ink n">yet copied are missing</text>
  <rect x="265" y="50" width="190" height="64" rx="6" class="box"/>
  <rect x="265" y="50" width="190" height="64" rx="6" class="focus-s"/>
  <text x="360" y="72" text-anchor="middle" class="ink t b">Region A</text>
  <text x="360" y="90" text-anchor="middle" class="ink2 n">reads and all writes</text>
  <rect x="265" y="190" width="190" height="64" rx="6" class="box"/>
  <text x="360" y="212" text-anchor="middle" class="ink t b">Region B</text>
  <text x="360" y="230" text-anchor="middle" class="ink2 n">local reads</text>
  <line x1="360" y1="116" x2="360" y2="187" class="line" marker-end="url(#arrow)"/>
  <text x="368" y="150" text-anchor="start" class="ink2 n">async copy</text>
  <text x="360" y="280" text-anchor="middle" class="ink n">users near B read B</text>
  <text x="360" y="296" text-anchor="middle" class="ink n">but write to A; their</text>
  <text x="360" y="312" text-anchor="middle" class="ink n">reads can be stale</text>
  <rect x="515" y="50" width="190" height="64" rx="6" class="box"/>
  <rect x="515" y="50" width="190" height="64" rx="6" class="focus-s"/>
  <text x="610" y="72" text-anchor="middle" class="ink t b">Region A</text>
  <text x="610" y="90" text-anchor="middle" class="ink2 n">reads and writes</text>
  <rect x="515" y="190" width="190" height="64" rx="6" class="box"/>
  <rect x="515" y="190" width="190" height="64" rx="6" class="focus-s"/>
  <text x="610" y="212" text-anchor="middle" class="ink t b">Region B</text>
  <text x="610" y="230" text-anchor="middle" class="ink2 n">reads and writes</text>
  <line x1="610" y1="118" x2="610" y2="187" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="618" y="150" text-anchor="start" class="ink2 n">copy both ways</text>
  <text x="610" y="280" text-anchor="middle" class="ink n">async: concurrent writes</text>
  <text x="610" y="296" text-anchor="middle" class="ink n">conflict. Sync: every</text>
  <text x="610" y="312" text-anchor="middle" class="ink n">write waits on a quorum</text>
  <line x1="240" y1="40" x2="240" y2="316" class="line" stroke-dasharray="4 4"/>
  <line x1="490" y1="40" x2="490" y2="316" class="line" stroke-dasharray="4 4"/>
</svg>
