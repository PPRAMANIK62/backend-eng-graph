<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="24" class="ink t b">Partition directory <tspan class="mono">my-topic-0/</tspan></text>

  <!-- oldest segment, expired -->
  <rect x="20" y="40" width="210" height="62" rx="6" class="old"/>
  <text x="32" y="62" class="ink n mono">00000000000000000000.log</text>
  <text x="32" y="80" class="ink2 n mono">.index  .timeindex</text>
  <text x="32" y="96" class="ink2 n">offsets 0 to 170409</text>
  <text x="125" y="122" text-anchor="middle" class="ink2 n">expired: retention deletes</text>
  <text x="125" y="138" text-anchor="middle" class="ink2 n">the whole file</text>

  <!-- the segment we read -->
  <rect x="255" y="40" width="210" height="62" rx="6" class="box"/>
  <rect x="255" y="40" width="210" height="62" rx="6" class="focus-s"/>
  <text x="267" y="62" class="ink n mono">00000000000000170410.log</text>
  <text x="267" y="80" class="ink2 n mono">.index  .timeindex</text>
  <text x="267" y="96" class="ink2 n">offsets 170410 to 340819</text>

  <!-- active segment -->
  <rect x="490" y="40" width="210" height="62" rx="6" class="box"/>
  <text x="502" y="62" class="ink n mono">00000000000000340820.log</text>
  <text x="502" y="80" class="ink2 n mono">.index  .timeindex</text>
  <text x="502" y="96" class="ink2 n">offsets 340820 onward</text>
  <text x="595" y="122" text-anchor="middle" class="ink2 n">active segment:</text>
  <text x="595" y="138" text-anchor="middle" class="ink2 n">all appends go here</text>

  <!-- step 1 -->
  <text x="360" y="126" text-anchor="middle" class="focus n b">1  fetch offset 170500:</text>
  <text x="360" y="142" text-anchor="middle" class="ink2 n">largest base offset ≤ 170500</text>

  <!-- step 2: the sparse index -->
  <text x="20" y="194" class="ink t b">2  Search the sparse <tspan class="mono">.index</tspan></text>
  <text x="20" y="212" class="ink2 n">target 170500 − 170410 = relative 90</text>
  <rect x="20" y="224" width="220" height="30" rx="6" class="box"/>
  <text x="36" y="244" class="ink n">relative offset</text>
  <text x="150" y="244" class="ink n">byte position</text>
  <text x="36" y="274" class="ink2 n mono">0</text><text x="150" y="274" class="ink2 n mono">0</text>
  <text x="36" y="298" class="ink2 n mono">41</text><text x="150" y="298" class="ink2 n mono">4130</text>
  <rect x="24" y="306" width="212" height="24" rx="6" class="focus-s"/>
  <text x="36" y="323" class="focus n mono b">85</text><text x="150" y="323" class="focus n mono b">8290</text>
  <text x="36" y="350" class="ink2 n mono">131</text><text x="150" y="350" class="ink2 n mono">12400</text>
  <text x="20" y="378" class="ink2 n">last entry ≤ 90, found by binary search</text>

  <!-- step 3: scan the .log -->
  <text x="300" y="194" class="ink t b">3  Scan the <tspan class="mono">.log</tspan> file forward</text>
  <text x="300" y="212" class="ink2 n">batches of records, one after another</text>
  <rect x="300" y="250" width="400" height="44" rx="6" class="box"/>
  <line x1="360" y1="250" x2="360" y2="294" class="line"/>
  <line x1="420" y1="250" x2="420" y2="294" class="line"/>
  <line x1="480" y1="250" x2="480" y2="294" class="line"/>
  <line x1="530" y1="250" x2="530" y2="294" class="line"/>
  <line x1="590" y1="250" x2="590" y2="294" class="line"/>
  <line x1="650" y1="250" x2="650" y2="294" class="line"/>
  <rect x="530" y="250" width="60" height="44" class="focus-s"/>
  <text x="560" y="277" text-anchor="middle" class="focus n b">170500</text>
  <!-- index entry points into the file -->
  <path d="M236,318 C300,318 300,320 420,300" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="242" text-anchor="middle" class="ink2 n mono">8290</text>
  <line x1="420" y1="316" x2="524" y2="316" class="focus-s" marker-end="url(#arrow)"/>
  <text x="472" y="336" text-anchor="middle" class="ink2 n">read batch headers</text>
  <text x="560" y="242" text-anchor="middle" class="ink2 n">send from here</text>
</svg>
