<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="40" y="26" class="ink t b">A GitHub OAuth token: 40 characters</text>
  <rect x="40" y="44" width="90" height="44" rx="6" class="box"/>
  <text x="85.0" y="72" text-anchor="middle" class="focus t mono b">gho_</text>
  <rect x="130" y="44" width="390" height="44" rx="6" class="box"/>
  <text x="325.0" y="72" text-anchor="middle" class="ink n">30 random Base62 characters</text>
  <rect x="520" y="44" width="160" height="44" rx="6" class="box"/>
  <text x="600.0" y="72" text-anchor="middle" class="ink n">6-char checksum</text>
  <text x="85" y="112" text-anchor="middle" class="ink2 n">type prefix + _</text>
  <text x="325" y="112" text-anchor="middle" class="ink2 n">the secret: about 178 bits</text>
  <text x="600" y="112" text-anchor="middle" class="ink2 n">32-bit CRC32, in Base62</text>
  <line x1="85" y1="122" x2="85" y2="168" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="122" x2="600" y2="168" class="line" marker-end="url(#arrow)"/>
  <line x1="325" y1="122" x2="325" y2="228" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="172" width="200" height="48" rx="6" class="box"/>
  <text x="120" y="192" text-anchor="middle" class="ink n">scanners find leaks</text>
  <text x="120" y="208" text-anchor="middle" class="ink n">by the prefix</text>
  <rect x="480" y="172" width="220" height="48" rx="6" class="box"/>
  <text x="590" y="192" text-anchor="middle" class="ink n">fakes rejected offline,</text>
  <text x="590" y="208" text-anchor="middle" class="ink n">no database lookup</text>
  <rect x="200" y="232" width="250" height="52" rx="6" class="safe-box"/>
  <text x="325" y="252" text-anchor="middle" class="ink n">the server keeps only a hash,</text>
  <text x="325" y="270" text-anchor="middle" class="ink n mono b">e.g. SHA-256(token)</text>
</svg>
