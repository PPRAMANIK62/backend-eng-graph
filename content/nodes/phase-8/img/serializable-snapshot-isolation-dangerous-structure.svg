<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>


  <text x="20" y="26" class="ink t b">Write skew: two rw edges make a cycle</text>
  <rect x="30" y="70" width="110" height="50" rx="6" class="box"/>
  <text x="85" y="92" text-anchor="middle" class="ink t b">T1</text>
  <text x="85" y="110" text-anchor="middle" class="ink2 n">Alice goes off</text>
  <rect x="220" y="70" width="110" height="50" rx="6" class="box"/>
  <text x="275" y="92" text-anchor="middle" class="ink t b">T2</text>
  <text x="275" y="110" text-anchor="middle" class="ink2 n">Bob goes off</text>
  <path d="M 110 68 C 140 30, 220 30, 250 68" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="60" text-anchor="middle" class="ink n mono">rw</text>
  <path d="M 250 122 C 220 160, 140 160, 110 122" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="142" text-anchor="middle" class="ink n mono">rw</text>
  <text x="20" y="198" class="ink2 n">T1 read Bob's row before T2 changed it,</text>
  <text x="20" y="216" class="ink2 n">so T1 must come first. T2 read Alice's row</text>
  <text x="20" y="234" class="ink2 n">before T1 changed it, so T2 must come first.</text>
  <text x="20" y="252" class="ink2 n">No serial order fits.</text>

  <line x1="360" y1="40" x2="360" y2="290" class="line" stroke-dasharray="4 4"/>

  <text x="380" y="26" class="ink t b">What SSI watches for</text>
  <rect x="380" y="70" width="90" height="50" rx="6" class="box"/>
  <text x="425" y="100" text-anchor="middle" class="ink t b">Tin</text>
  <rect x="500" y="70" width="90" height="50" rx="6" class="box"/>
  <rect x="500" y="70" width="90" height="50" rx="6" class="lost-s"/>
  <text x="545" y="92" text-anchor="middle" class="ink t b">Tpivot</text>
  <text x="545" y="110" text-anchor="middle" class="ink2 n">rolled back</text>
  <rect x="620" y="70" width="90" height="50" rx="6" class="box"/>
  <rect x="620" y="70" width="90" height="50" rx="6" class="focus-s"/>
  <text x="665" y="92" text-anchor="middle" class="ink t b">Tout</text>
  <text x="665" y="110" text-anchor="middle" class="ink2 n">commits first</text>
  <line x1="472" y1="95" x2="497" y2="95" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="86" text-anchor="middle" class="ink n mono">rw</text>
  <line x1="592" y1="95" x2="617" y2="95" class="line" marker-end="url(#arrow)"/>
  <text x="605" y="86" text-anchor="middle" class="ink n mono">rw</text>
  <path d="M 665 122 C 640 175, 450 175, 425 122" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="545" y="178" text-anchor="middle" class="ink2 n">any path back would close a cycle</text>
  <text x="380" y="216" class="ink2 n">Two rw edges in a row, between concurrent</text>
  <text x="380" y="234" class="ink2 n">transactions, and Tout committed first.</text>
  <text x="380" y="252" class="ink2 n">SSI doesn't look for the path back, so some</text>
  <text x="380" y="270" class="ink2 n">aborts are false positives.</text>
  <text x="20" y="290" class="ink2 n">In write skew, Tin and Tout are the same transaction.</text>

</svg>
