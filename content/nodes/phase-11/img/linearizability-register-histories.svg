<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .dash{stroke:#8a8984;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- panel 1 -->
  <text x="20" y="24" class="ink t b">A: linearizable</text>
  <text x="200" y="24" class="ink2 n">register starts at 0; a bar runs from call to return</text>
  <text x="20" y="62" class="ink t b">C0</text>
  <rect x="80" y="44" width="520" height="28" rx="6" class="box"/>
  <text x="340" y="63" text-anchor="middle" class="ink n mono">put(100)</text>
  <text x="20" y="102" class="ink t b">C1</text>
  <rect x="120" y="84" width="420" height="28" rx="6" class="box"/>
  <text x="460" y="103" text-anchor="middle" class="ink n mono">get() → 100</text>
  <text x="20" y="142" class="ink t b">C2</text>
  <rect x="160" y="124" width="220" height="28" rx="6" class="box"/>
  <text x="300" y="143" text-anchor="middle" class="ink n mono">get() → 0</text>

  <circle cx="190" cy="138" r="6" class="focus"/>
  <text x="190" y="170" text-anchor="middle" class="ink n b">1</text>
  <circle cx="250" cy="58" r="6" class="focus"/>
  <text x="250" y="170" text-anchor="middle" class="ink n b">2</text>
  <circle cx="330" cy="98" r="6" class="focus"/>
  <text x="330" y="170" text-anchor="middle" class="ink n b">3</text>
  <text x="380" y="176" class="ink2 n">One order works: C2 reads 0, then the put,</text>
  <text x="380" y="192" class="ink2 n">then C1 reads 100. Each dot sits inside its own bar.</text>

  <!-- panel 2 -->
  <text x="20" y="232" class="ink t b">B: not linearizable</text>
  <text x="20" y="290" class="ink t b">C0</text>
  <rect x="80" y="272" width="580" height="28" rx="6" class="box"/>
  <text x="560" y="291" text-anchor="middle" class="ink n mono">put(200)</text>
  <text x="20" y="330" class="ink t b">C1</text>
  <rect x="110" y="312" width="200" height="28" rx="6" class="box"/>
  <text x="240" y="331" text-anchor="middle" class="ink n mono">get() → 200</text>
  <text x="20" y="370" class="ink t b">C2</text>
  <rect x="380" y="352" width="220" height="28" rx="6" class="lost-box"/>
  <text x="490" y="371" text-anchor="middle" class="ink n mono">get() → 0</text>

  <circle cx="140" cy="286" r="6" class="focus"/>
  <circle cx="180" cy="326" r="6" class="focus"/>
  <line x1="310" y1="240" x2="310" y2="392" class="dash"/>
  <text x="318" y="232" class="ink2 n">C1 has returned 200, so the put has</text>
  <text x="318" y="246" class="ink2 n">taken effect before this line.</text>
  <text x="380" y="402" class="ink n">C2 starts after the line, so it must see 200.</text>
  <text x="380" y="416" class="ink n">No dot inside its bar can explain 0.</text>
</svg>
