<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="90" y="28" text-anchor="middle" class="ink t b">Alice</text>
  <text x="360" y="28" text-anchor="middle" class="ink t b">product 7</text>
  <text x="630" y="28" text-anchor="middle" class="ink t b">Bob</text>
  <line x1="90" y1="40" x2="90" y2="390" class="line"/>
  <line x1="360" y1="100" x2="360" y2="140" class="line"/>
  <line x1="630" y1="40" x2="630" y2="390" class="line"/>

  <!-- version 3 and reads -->
  <rect x="300" y="62" width="120" height="34" rx="6" class="box"/>
  <text x="360" y="84" text-anchor="middle" class="ink n mono">version 3</text>
  <line x1="298" y1="79" x2="94" y2="79" class="line" marker-end="url(#arrow)"/>
  <text x="195" y="71" text-anchor="middle" class="ink2 n">read: version 3</text>
  <line x1="422" y1="79" x2="626" y2="79" class="line" marker-end="url(#arrow)"/>
  <text x="525" y="71" text-anchor="middle" class="ink2 n">read: version 3</text>

  <!-- Alice writes -->
  <line x1="90" y1="160" x2="296" y2="160" class="focus-s" marker-end="url(#arrow)"/>
  <text x="195" y="152" text-anchor="middle" class="ink n mono">WHERE version = 3</text>
  <rect x="300" y="143" width="120" height="34" rx="6" class="box"/>
  <text x="360" y="165" text-anchor="middle" class="focus n mono b">version 4</text>
  <line x1="298" y1="200" x2="94" y2="200" class="focus-s" marker-end="url(#arrow)"/>
  <text x="195" y="192" text-anchor="middle" class="focus n b">UPDATE 1: saved</text>
  <line x1="360" y1="179" x2="360" y2="330" class="line"/>

  <!-- Bob writes -->
  <line x1="630" y1="240" x2="364" y2="240" class="line" marker-end="url(#arrow)"/>
  <text x="525" y="232" text-anchor="middle" class="ink n mono">WHERE version = 3</text>
  <line x1="360" y1="280" x2="626" y2="280" class="lost-s" style="stroke-width:1.5" marker-end="url(#arrow)"/>
  <text x="495" y="272" text-anchor="middle" class="lost n b">UPDATE 0: nothing matched</text>

  <!-- Bob re-reads -->
  <line x1="360" y1="320" x2="626" y2="320" class="line" marker-end="url(#arrow)"/>
  <text x="495" y="312" text-anchor="middle" class="ink2 n">re-read: version 4</text>
  <rect x="430" y="344" width="190" height="34" rx="6" class="safe-box"/>
  <text x="525" y="366" text-anchor="middle" class="ink n">retry with version = 4</text>
</svg>
