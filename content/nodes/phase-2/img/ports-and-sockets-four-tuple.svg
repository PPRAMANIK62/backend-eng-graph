<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- clients -->
  <text x="24" y="112" class="ink2 n">Remote side</text>
  <rect x="24" y="128" width="210" height="60" rx="6" class="box"/>
  <text x="40" y="152" class="ink t b">Client A</text>
  <text x="40" y="174" class="ink n mono">203.0.113.5:51000</text>
  <rect x="24" y="208" width="210" height="60" rx="6" class="box"/>
  <text x="40" y="232" class="ink t b">Client B</text>
  <text x="40" y="254" class="ink n mono">198.51.100.7:51000</text>

  <!-- server -->
  <rect x="296" y="20" width="400" height="300" rx="8" class="line"/>
  <text x="312" y="44" class="ink t b">Server 192.0.2.10</text>

  <rect x="316" y="56" width="360" height="52" rx="6" class="box"/>
  <text x="332" y="78" class="ink t b">fd 3: listening socket</text>
  <text x="332" y="98" class="ink n mono">0.0.0.0:8080</text>

  <rect x="316" y="128" width="360" height="60" rx="6" class="box"/>
  <text x="332" y="152" class="focus t b">fd 4: connected socket</text>
  <text x="332" y="174" class="ink n mono">192.0.2.10:8080 ↔ 203.0.113.5:51000</text>

  <rect x="316" y="208" width="360" height="60" rx="6" class="box"/>
  <text x="332" y="232" class="focus t b">fd 5: connected socket</text>
  <text x="332" y="254" class="ink n mono">192.0.2.10:8080 ↔ 198.51.100.7:51000</text>

  <text x="316" y="300" class="ink2 n">accept() made fd 4 and fd 5; fd 3 keeps listening</text>

  <!-- connections -->
  <line x1="236" y1="158" x2="313" y2="158" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="236" y1="238" x2="313" y2="238" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
