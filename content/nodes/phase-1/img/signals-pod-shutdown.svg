<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lane labels -->
  <text x="24" y="92" class="ink t b">Container</text>
  <text x="24" y="108" class="ink2 n">process 1</text>
  <text x="24" y="172" class="ink t b">Kubernetes</text>
  <text x="24" y="188" class="ink2 n">endpoints</text>

  <!-- pod deleted -->
  <text x="130" y="36" class="ink2 n">pod deleted</text>
  <line x1="130" y1="44" x2="130" y2="224" class="line"/>

  <!-- container lane -->
  <rect x="138" y="76" width="112" height="44" rx="6" class="box"/>
  <text x="194" y="97" text-anchor="middle" class="ink t">preStop hook</text>
  <text x="194" y="113" text-anchor="middle" class="ink2 n">if there is one</text>

  <line x1="262" y1="44" x2="262" y2="224" class="line" stroke-dasharray="4 4"/>
  <text x="262" y="36" text-anchor="middle" class="focus t b">SIGTERM</text>

  <rect x="270" y="76" width="290" height="44" rx="6" class="box"/>
  <text x="286" y="97" class="ink t">Drain: no new work, finish</text>
  <text x="286" y="113" class="ink t">in-flight requests, exit</text>

  <!-- kubernetes lane -->
  <rect x="270" y="156" width="290" height="44" rx="6" class="box"/>
  <text x="286" y="177" class="ink t">Out of endpoints, marked not ready</text>
  <text x="286" y="193" class="ink2 n">starts at the same time as SIGTERM</text>

  <!-- sigkill -->
  <line x1="580" y1="44" x2="580" y2="224" class="lost-s"/>
  <text x="580" y="36" text-anchor="middle" class="lost t b">SIGKILL</text>
  <text x="592" y="97" class="ink2 n">to anything</text>
  <text x="592" y="113" class="ink2 n">still running</text>

  <!-- grace period -->
  <path d="M130,236 V246 H580 V236" class="line"/>
  <text x="355" y="266" text-anchor="middle" class="ink t">grace period, 30 seconds by default</text>

  <line x1="130" y1="290" x2="696" y2="290" class="line" marker-end="url(#arrow)"/>
  <text x="696" y="310" text-anchor="end" class="ink2 n">time</text>
</svg>
