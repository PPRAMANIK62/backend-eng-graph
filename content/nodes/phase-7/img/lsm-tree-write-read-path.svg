<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:2}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984} .focushead{fill:#2a78d6}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
      .focushead{fill:#3987e5}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="focushead"/>
    </marker>
  </defs>
  <text x="20" y="26" class="ink t b">Memory</text>
  <line x1="20" y1="140" x2="700" y2="140" class="line" stroke-dasharray="4 4"/>
  <text x="20" y="164" class="ink t b">Disk</text>
  <text x="30" y="84" class="focus t mono b">put(k, v)</text>
  <rect x="210" y="56" width="170" height="48" rx="6" class="focus-box"/>
  <text x="295" y="77" text-anchor="middle" class="ink t b">memtable</text>
  <text x="295" y="95" text-anchor="middle" class="ink2 n">sorted, e.g. a skip list</text>
  <rect x="440" y="56" width="200" height="48" rx="6" class="box"/>
  <text x="540" y="77" text-anchor="middle" class="ink t b">immutable memtable</text>
  <text x="540" y="95" text-anchor="middle" class="ink2 n">full, waiting to be flushed</text>
  <line x1="112" y1="80" x2="206" y2="80" class="focus-s" marker-end="url(#farrow)"/>
  <text x="160" y="72" text-anchor="middle" class="ink2 n">2</text>
  <line x1="382" y1="80" x2="436" y2="80" class="line" marker-end="url(#arrow)"/>
  <text x="410" y="72" text-anchor="middle" class="ink2 n">freeze</text>
  <line x1="66" y1="92" x2="66" y2="186" class="focus-s" marker-end="url(#farrow)"/>
  <text x="74" y="130" class="ink2 n">1</text>
  <rect x="14" y="190" width="104" height="40" rx="6" class="safe-box"/>
  <text x="66" y="208" text-anchor="middle" class="ink t b">WAL</text>
  <text x="66" y="223" text-anchor="middle" class="ink2 n">append + fsync</text>
  <text x="216" y="202" text-anchor="end" class="ink t b">L0</text>
  <text x="216" y="218" text-anchor="end" class="ink2 n">files overlap</text>
  <rect x="230" y="186" width="60" height="30" rx="4" class="box"/>
  <text x="260.0" y="206" text-anchor="middle" class="ink n mono">a–z</text>
  <rect x="300" y="186" width="60" height="30" rx="4" class="box"/>
  <text x="330.0" y="206" text-anchor="middle" class="ink n mono">a–z</text>
  <rect x="370" y="186" width="60" height="30" rx="4" class="box"/>
  <text x="400.0" y="206" text-anchor="middle" class="ink n mono">a–z</text>
  <path d="M540,104 V160 H404 V182" class="line" marker-end="url(#arrow)"/>
  <text x="548" y="128" class="ink2 n">flush</text>
  <text x="216" y="272" text-anchor="end" class="ink t b">L1</text>
  <text x="216" y="288" text-anchor="end" class="ink2 n">one sorted run</text>
  <rect x="230" y="256" width="80" height="30" rx="4" class="box"/>
  <text x="270.0" y="276" text-anchor="middle" class="ink n mono">a–f</text>
  <rect x="320" y="256" width="80" height="30" rx="4" class="focus-box"/>
  <text x="360.0" y="276" text-anchor="middle" class="ink n mono">g–m</text>
  <rect x="410" y="256" width="80" height="30" rx="4" class="box"/>
  <text x="450.0" y="276" text-anchor="middle" class="ink n mono">n–s</text>
  <rect x="500" y="256" width="80" height="30" rx="4" class="box"/>
  <text x="540.0" y="276" text-anchor="middle" class="ink n mono">t–z</text>
  <text x="216" y="344" text-anchor="end" class="ink t b">L2</text>
  <text x="216" y="360" text-anchor="end" class="ink2 n">about 10× L1</text>
  <rect x="230" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="256.0" y="348" text-anchor="middle" class="ink n mono">a–c</text>
  <rect x="288" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="314.0" y="348" text-anchor="middle" class="ink n mono">d–f</text>
  <rect x="346" y="328" width="52" height="30" rx="4" class="focus-box"/>
  <text x="372.0" y="348" text-anchor="middle" class="ink n mono">g–i</text>
  <rect x="404" y="328" width="52" height="30" rx="4" class="focus-box"/>
  <text x="430.0" y="348" text-anchor="middle" class="ink n mono">j–m</text>
  <rect x="462" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="488.0" y="348" text-anchor="middle" class="ink n mono">n–p</text>
  <rect x="520" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="546.0" y="348" text-anchor="middle" class="ink n mono">q–s</text>
  <rect x="578" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="604.0" y="348" text-anchor="middle" class="ink n mono">t–v</text>
  <rect x="636" y="328" width="52" height="30" rx="4" class="box"/>
  <text x="662.0" y="348" text-anchor="middle" class="ink n mono">w–z</text>
  <line x1="330" y1="218" x2="330" y2="252" class="line" marker-end="url(#arrow)"/>
  <line x1="360" y1="288" x2="345" y2="324" class="focus-s" marker-end="url(#farrow)"/>
  <line x1="360" y1="288" x2="402" y2="324" class="focus-s" marker-end="url(#farrow)"/>
  <text x="230" y="378" class="ink2 n">compaction: one L1 file (g–m) is merged with the L2 files it overlaps</text>
  <text x="440" y="240" class="ink2 n">compaction: L0 into L1</text>
  <text x="20" y="412" class="ink t b">get(k)</text>
  <text x="80" y="412" class="ink n">looks newest to oldest: memtable, immutable memtable, each L0 file,</text>
  <text x="80" y="430" class="ink n">then one file per level. It stops at the first hit. A bloom filter per file skips most files.</text>
</svg>
