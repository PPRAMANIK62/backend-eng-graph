<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="120" y="28" text-anchor="middle" class="ink t b">1. Normal</text>
  <rect x="60" y="44" width="120" height="34" rx="6" class="box"/>
  <text x="120" y="66" text-anchor="middle" class="ink n">load balancer</text>
  <text x="360" y="28" text-anchor="middle" class="ink t b">2. Cluster B fails</text>
  <rect x="300" y="44" width="120" height="34" rx="6" class="box"/>
  <text x="360" y="66" text-anchor="middle" class="ink n">load balancer</text>
  <text x="600" y="28" text-anchor="middle" class="ink t b">3. A falls over too</text>
  <rect x="540" y="44" width="120" height="34" rx="6" class="box"/>
  <text x="600" y="66" text-anchor="middle" class="ink n">load balancer</text>
  <line x1="100" y1="78" x2="65" y2="128" class="line" marker-end="url(#arrow)"/>
  <line x1="140" y1="78" x2="175" y2="128" class="line" marker-end="url(#arrow)"/>
  <rect x="15" y="130" width="100" height="60" rx="6" class="box"/>
  <text x="65" y="154" text-anchor="middle" class="ink t b">Cluster A</text>
  <text x="65" y="174" text-anchor="middle" class="ink2 n">1,000 QPS, fine</text>
  <rect x="125" y="130" width="100" height="60" rx="6" class="box"/>
  <text x="175" y="154" text-anchor="middle" class="ink t b">Cluster B</text>
  <text x="175" y="174" text-anchor="middle" class="ink2 n">fine</text>
  <line x1="340" y1="78" x2="305" y2="128" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="255" y="130" width="100" height="60" rx="6" class="focus-box"/>
  <text x="305" y="154" text-anchor="middle" class="ink t b">Cluster A</text>
  <text x="305" y="174" text-anchor="middle" class="ink2 n">1,200 QPS</text>
  <rect x="365" y="130" width="100" height="60" rx="6" class="lost-box"/>
  <text x="415" y="154" text-anchor="middle" class="ink t b">Cluster B</text>
  <text x="415" y="174" text-anchor="middle" class="lost n b">down</text>
  <text x="255" y="212" text-anchor="start" class="ink2 n">A is over capacity: slow,</text>
  <text x="255" y="228" text-anchor="start" class="ink2 n">missed deadlines, retries.</text>
  <text x="255" y="244" text-anchor="start" class="ink2 n">Its successful rate drops</text>
  <text x="255" y="260" text-anchor="start" class="ink2 n">well below 1,000 QPS.</text>
  <line x1="620" y1="78" x2="655" y2="128" class="focus-s" marker-end="url(#arrow)"/>
  <rect x="495" y="130" width="100" height="60" rx="6" class="lost-box"/>
  <text x="545" y="154" text-anchor="middle" class="ink t b">Cluster A</text>
  <text x="545" y="174" text-anchor="middle" class="lost n b">crashing</text>
  <rect x="605" y="130" width="100" height="60" rx="6" class="focus-box"/>
  <text x="655" y="154" text-anchor="middle" class="ink t b">Cluster C</text>
  <text x="655" y="174" text-anchor="middle" class="ink2 n">gets A's load</text>
  <text x="495" y="212" text-anchor="start" class="ink2 n">The balancer moves A's traffic</text>
  <text x="495" y="228" text-anchor="start" class="ink2 n">to the next cluster, which</text>
  <text x="495" y="244" text-anchor="start" class="ink2 n">overloads the same way.</text>
  <text x="495" y="260" text-anchor="start" class="ink2 n">Within minutes.</text>
  <line x1="232" y1="110" x2="246" y2="110" class="line" marker-end="url(#arrow)"/>
  <line x1="472" y1="110" x2="486" y2="110" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="305" text-anchor="middle" class="ink t">Each failure puts more load on what is left: positive feedback.</text>
</svg>
