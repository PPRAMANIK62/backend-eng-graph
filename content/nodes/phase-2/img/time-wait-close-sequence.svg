<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <text x="200" y="30" text-anchor="middle" class="ink t b">Client (closes first)</text>
  <text x="520" y="30" text-anchor="middle" class="ink t b">Server</text>
  <line x1="200" y1="42" x2="200" y2="400" class="line"/>
  <line x1="520" y1="42" x2="520" y2="400" class="line"/>
  <text x="188" y="66" text-anchor="end" class="ink2 n">ESTABLISHED</text>
  <text x="532" y="66" class="ink2 n">ESTABLISHED</text>

  <!-- FIN from client -->
  <text x="188" y="84" text-anchor="end" class="ink2 n">close()</text>
  <line x1="200" y1="90" x2="517" y2="130" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="96" text-anchor="middle" class="ink n mono">FIN</text>
  <text x="188" y="104" text-anchor="end" class="ink n">FIN-WAIT-1</text>
  <text x="532" y="134" class="ink n">CLOSE-WAIT</text>

  <!-- ACK from server -->
  <line x1="520" y1="145" x2="203" y2="185" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="151" text-anchor="middle" class="ink n mono">ACK</text>
  <text x="188" y="189" text-anchor="end" class="ink n">FIN-WAIT-2</text>

  <!-- FIN from server -->
  <text x="532" y="200" class="ink2 n">close()</text>
  <line x1="520" y1="215" x2="203" y2="255" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="221" text-anchor="middle" class="ink n mono">FIN</text>
  <text x="532" y="219" class="ink n">LAST-ACK</text>

  <!-- final ACK -->
  <line x1="200" y1="270" x2="517" y2="310" class="line" marker-end="url(#arrow)"/>
  <text x="300" y="276" text-anchor="middle" class="ink n mono">ACK</text>
  <text x="532" y="314" class="ink n b">CLOSED</text>

  <!-- TIME-WAIT -->
  <rect x="194" y="262" width="12" height="112" rx="3" class="focus"/>
  <text x="182" y="266" text-anchor="end" class="focus t b">TIME-WAIT</text>
  <text x="182" y="318" text-anchor="end" class="ink2 n">spec: 2 × MSL</text>
  <text x="182" y="334" text-anchor="end" class="ink2 n">Linux: fixed 60 s</text>
  <text x="188" y="394" text-anchor="end" class="ink n b">CLOSED</text>
</svg>
