<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .old{fill:#b8b7b2}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .old{fill:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="200" y="28" text-anchor="middle" class="ink t b">One thread</text>
  <text x="530" y="28" text-anchor="middle" class="ink t b">Two threads</text>

  <!-- left: single-threaded -->
  <rect x="110" y="44" width="180" height="60" rx="6" class="box"/>
  <text x="200" y="79" text-anchor="middle" class="ink t">Code</text>
  <rect x="110" y="110" width="180" height="44" rx="6" class="box"/>
  <text x="200" y="137" text-anchor="middle" class="ink t">Heap</text>
  <rect x="110" y="160" width="180" height="136" rx="6" class="line" stroke-dasharray="4 4"/>
  <rect x="110" y="302" width="180" height="44" rx="6" class="box"/>
  <text x="200" y="329" text-anchor="middle" class="focus t b">Stack</text>
  <text x="46" y="70" class="ink t mono b">PC</text>
  <line x1="72" y1="66" x2="107" y2="66" class="line" marker-end="url(#arrow)"/>

  <!-- right: two threads -->
  <rect x="440" y="44" width="180" height="60" rx="6" class="box"/>
  <text x="530" y="79" text-anchor="middle" class="ink t">Code (shared)</text>
  <rect x="440" y="110" width="180" height="44" rx="6" class="box"/>
  <text x="530" y="137" text-anchor="middle" class="ink t">Heap (shared)</text>
  <rect x="440" y="160" width="180" height="40" rx="6" class="line" stroke-dasharray="4 4"/>
  <rect x="440" y="206" width="180" height="44" rx="6" class="box"/>
  <text x="530" y="233" text-anchor="middle" class="focus t b">Stack of thread 2</text>
  <rect x="440" y="256" width="180" height="40" rx="6" class="line" stroke-dasharray="4 4"/>
  <rect x="440" y="302" width="180" height="44" rx="6" class="box"/>
  <text x="530" y="329" text-anchor="middle" class="focus t b">Stack of thread 1</text>
  <text x="350" y="62" class="ink t mono b">PC 1</text>
  <line x1="394" y1="58" x2="437" y2="58" class="line" marker-end="url(#arrow)"/>
  <text x="350" y="94" class="ink t mono b">PC 2</text>
  <line x1="394" y1="90" x2="437" y2="90" class="line" marker-end="url(#arrow)"/>

  <text x="200" y="374" text-anchor="middle" class="ink2 n">one program counter, one stack</text>
  <text x="530" y="374" text-anchor="middle" class="ink2 n">same code and heap; a PC and a stack per thread</text>
</svg>
