<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="20" y="22" class="ink t b">On the wire: traceparent at each hop</text>
  <rect x="20" y="50" width="110" height="36" rx="6" class="box"/><text x="75" y="73" text-anchor="middle" class="ink t">proxy</text>
  <rect x="210" y="50" width="110" height="36" rx="6" class="box"/><text x="265" y="73" text-anchor="middle" class="ink t">API</text>
  <rect x="400" y="50" width="110" height="36" rx="6" class="box"/><text x="455" y="73" text-anchor="middle" class="ink t">payment</text>
  <rect x="590" y="50" width="110" height="36" rx="6" class="box"/><text x="645" y="73" text-anchor="middle" class="ink t">database</text>
  <rect x="400" y="140" width="110" height="36" rx="6" class="box"/><text x="455" y="163" text-anchor="middle" class="ink t">inventory</text>
  <line x1="132" y1="68" x2="206" y2="68" class="line" marker-end="url(#arrow)"/>
  <text x="169" y="100" text-anchor="middle" class="ink2 n mono">4bf92f35…</text>
  <text x="169" y="115" text-anchor="middle" class="focus n mono">00f067aa…</text>
  <line x1="322" y1="68" x2="396" y2="68" class="line" marker-end="url(#arrow)"/>
  <text x="359" y="100" text-anchor="middle" class="ink2 n mono">4bf92f35…</text>
  <text x="359" y="115" text-anchor="middle" class="focus n mono">b7ad6b71…</text>
  <line x1="512" y1="68" x2="586" y2="68" class="line" marker-end="url(#arrow)"/>
  <text x="549" y="100" text-anchor="middle" class="ink2 n mono">4bf92f35…</text>
  <text x="549" y="115" text-anchor="middle" class="focus n mono">b9c7c989…</text>
  <path d="M265,88 V158 H396" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="182" text-anchor="middle" class="ink2 n mono">4bf92f35…</text><text x="330" y="197" text-anchor="middle" class="focus n mono">b7ad6b71…</text>
  <text x="20" y="160" class="ink2 n">upper line: trace id,</text><text x="20" y="175" class="ink2 n">the same on every hop</text>
  <text x="20" y="194" class="focus n">lower line: parent id,</text><text x="20" y="209" class="focus n">the caller's span id</text>
  <line x1="20" y1="224" x2="700" y2="224" class="line"/>
  <text x="20" y="250" class="ink t b">In the trace: spans on a time axis</text>
  <text x="20" y="283" class="ink n mono">proxy</text>
  <rect x="150" y="270" width="540" height="18" rx="4" class="box"/>
  <text x="32" y="313" class="ink n mono">API</text>
  <rect x="166" y="300" width="510" height="18" rx="4" class="box"/>
  <text x="44" y="343" class="ink n mono">payment</text>
  <rect x="182" y="330" width="468" height="18" rx="4" class="box"/>
  <text x="56" y="373" class="focus b n mono">database</text>
  <rect x="198" y="360" width="432" height="18" rx="4" class="focus-s"/>
  <text x="206" y="373" class="focus n b">most of the time is here</text>
  <text x="44" y="403" class="ink n mono">inventory</text>
  <rect x="182" y="390" width="80" height="18" rx="4" class="box"/>
  <text x="120" y="283" text-anchor="end" class="ink2 n">root</text>
  <line x1="150" y1="426" x2="696" y2="426" class="line" marker-end="url(#arrow)"/>
  <text x="150" y="444" class="ink2 n">time</text>
  <text x="276" y="403" class="ink2 n">inventory runs in parallel with payment and ends early</text>
</svg>
