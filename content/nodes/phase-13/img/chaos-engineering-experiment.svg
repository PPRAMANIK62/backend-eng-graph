<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="210" height="62" rx="6" class="box"/>
  <text x="125.0" y="42" text-anchor="middle" class="ink t b">1 Steady state</text>
  <text x="125.0" y="60" text-anchor="middle" class="ink2 n">stream starts per second</text>
  <rect x="255" y="20" width="210" height="62" rx="6" class="box"/>
  <text x="360.0" y="42" text-anchor="middle" class="ink t b">2 Hypothesis</text>
  <text x="360.0" y="60" text-anchor="middle" class="ink2 n">SPS stays the same</text>
  <rect x="490" y="20" width="210" height="62" rx="6" class="box"/>
  <text x="595.0" y="42" text-anchor="middle" class="ink t b">3 Small slice of users</text>
  <text x="595.0" y="60" text-anchor="middle" class="ink2 n">split into two groups</text>
  <line x1="231" y1="51" x2="252" y2="51" class="line" marker-end="url(#arrow)"/>
  <line x1="466" y1="51" x2="487" y2="51" class="line" marker-end="url(#arrow)"/>
  <rect x="280" y="130" width="190" height="62" rx="6" class="box"/>
  <text x="375.0" y="152" text-anchor="middle" class="ink t b">Control group</text>
  <text x="375.0" y="170" text-anchor="middle" class="ink2 n">no fault</text>
  <rect x="500" y="130" width="200" height="62" rx="6" class="box"/>
  <rect x="500" y="130" width="200" height="62" rx="6" class="focus-s" stroke-width="2.5"/>
  <text x="600.0" y="152" text-anchor="middle" class="ink t b">Experiment group</text>
  <text x="600.0" y="170" text-anchor="middle" class="ink2 n">4 fault: bookmark calls fail</text>
  <line x1="560" y1="84" x2="390" y2="127" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="84" x2="600" y2="127" class="line" marker-end="url(#arrow)"/>
  <rect x="380" y="240" width="220" height="62" rx="6" class="box"/>
  <text x="490.0" y="262" text-anchor="middle" class="ink t b">5 Compare SPS</text>
  <text x="490.0" y="280" text-anchor="middle" class="ink2 n">try to disprove the hypothesis</text>
  <line x1="375" y1="194" x2="450" y2="237" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="194" x2="540" y2="237" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="200" width="250" height="44" rx="6" class="safe-box"/>
  <text x="145.0" y="227" text-anchor="middle" class="ink t b">Same: more confidence</text>
  <rect x="20" y="262" width="250" height="44" rx="6" class="box"/>
  <rect x="20" y="262" width="250" height="44" rx="6" class="lost-s"/>
  <text x="145.0" y="289" text-anchor="middle" class="ink t b">Different: weakness found</text>
  <line x1="378" y1="262" x2="273" y2="224" class="line" marker-end="url(#arrow)"/>
  <line x1="378" y1="280" x2="273" y2="284" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="322" width="680" height="44" rx="6" class="line" stroke-dasharray="6 4"/>
  <text x="40" y="349" class="ink t b">Stop condition</text>
  <text x="160" y="349" class="ink2 n">watches the whole run: if an alarm fires, halt the fault and revert</text>
</svg>
