<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle" class="ink t b">Three servers</text>
  <circle cx="180" cy="175" r="105" class="line"/>
  <circle cx="270.9" cy="122.5" r="6" class="old"/>
  <circle cx="285.0" cy="175.0" r="6" class="old"/>
  <circle cx="270.9" cy="227.5" r="6" class="old"/>
  <circle cx="144.1" cy="273.7" r="6" class="old"/>
  <circle cx="89.1" cy="122.5" r="6" class="old"/>
  <circle cx="144.1" cy="76.3" r="6" class="old"/>
  <rect x="217.5" y="69.1" width="30" height="30" rx="6" class="box"/>
  <text x="232.5" y="89.1" text-anchor="middle" class="ink b t">A</text>
  <rect x="217.5" y="250.9" width="30" height="30" rx="6" class="box"/>
  <text x="232.5" y="270.9" text-anchor="middle" class="ink b t">B</text>
  <rect x="63.6" y="187.2" width="30" height="30" rx="6" class="box"/>
  <text x="78.6" y="207.2" text-anchor="middle" class="ink b t">C</text>
  <path d="M150,173 A30,30 0 1 1 180,203" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="225" text-anchor="middle" class="ink2 n">clockwise</text>
  <text x="540" y="30" text-anchor="middle" class="ink t b">Add server D</text>
  <circle cx="540" cy="175" r="105" class="line"/>
  <path d="M605.9,73.5 A121,121 0 0 1 658.4,200.2" class="focus-s"/>
  <circle cx="630.9" cy="122.5" r="6" class="focus"/>
  <circle cx="645.0" cy="175.0" r="6" class="focus"/>
  <circle cx="630.9" cy="227.5" r="6" class="old"/>
  <circle cx="504.1" cy="273.7" r="6" class="old"/>
  <circle cx="449.1" cy="122.5" r="6" class="old"/>
  <circle cx="504.1" cy="76.3" r="6" class="old"/>
  <rect x="577.5" y="69.1" width="30" height="30" rx="6" class="box"/>
  <text x="592.5" y="89.1" text-anchor="middle" class="ink b t">A</text>
  <rect x="626.4" y="187.2" width="30" height="30" rx="6" class="box"/>
  <rect x="626.4" y="187.2" width="30" height="30" rx="6" class="focus-s"/>
  <text x="641.4" y="207.2" text-anchor="middle" class="focus b t">D</text>
  <rect x="577.5" y="250.9" width="30" height="30" rx="6" class="box"/>
  <text x="592.5" y="270.9" text-anchor="middle" class="ink b t">B</text>
  <rect x="423.6" y="187.2" width="30" height="30" rx="6" class="box"/>
  <text x="438.6" y="207.2" text-anchor="middle" class="ink b t">C</text>
  <text x="712" y="59" text-anchor="end" class="focus n b">D takes these</text>
  <text x="712" y="75" text-anchor="end" class="focus n b">two keys from B</text>
  <circle cx="200" cy="326" r="6" class="old"/>
  <text x="212" y="330" class="ink2 n">key that stays put</text>
  <circle cx="350" cy="326" r="6" class="focus"/>
  <text x="362" y="330" class="ink2 n">key that moves</text>
  <rect x="470" y="316" width="18" height="18" rx="4" class="box"/>
  <text x="496" y="330" class="ink2 n">server</text>
  <text x="360" y="356" text-anchor="middle" class="ink2 n">Each key belongs to the first server clockwise from it. No key moves between A, B and C.</text>
</svg>
