<svg xmlns="http://www.w3.org/2000/svg" width="720" height="196" viewBox="0 30 720 196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- idle stretch, with a break to show it's not to scale -->
  <line x1="40" y1="100" x2="150" y2="100" class="line"/>
  <path d="M146,110 L156,90 M156,110 L166,90" class="line"/>
  <line x1="170" y1="100" x2="300" y2="100" class="line"/>
  <circle cx="40" cy="100" r="5" class="ink"/>
  <text x="40" y="128" class="ink n">last data</text>
  <text x="165" y="58" text-anchor="middle" class="ink t b">Idle, nothing sent</text>
  <text x="165" y="76" text-anchor="middle" class="ink2 n mono">tcp_keepalive_time: 2 h</text>

  <!-- probe stretch -->
  <line x1="300" y1="100" x2="656" y2="100" class="line" marker-end="url(#arrow)"/>
  <g class="focus-s">
    <line x1="300" y1="88" x2="300" y2="112"/>
    <line x1="340" y1="88" x2="340" y2="112"/>
    <line x1="380" y1="88" x2="380" y2="112"/>
    <line x1="420" y1="88" x2="420" y2="112"/>
    <line x1="460" y1="88" x2="460" y2="112"/>
    <line x1="500" y1="88" x2="500" y2="112"/>
    <line x1="540" y1="88" x2="540" y2="112"/>
    <line x1="580" y1="88" x2="580" y2="112"/>
    <line x1="620" y1="88" x2="620" y2="112"/>
  </g>
  <g class="focus n" text-anchor="middle">
    <text x="300" y="128">1</text><text x="340" y="128">2</text><text x="380" y="128">3</text>
    <text x="420" y="128">4</text><text x="460" y="128">5</text><text x="500" y="128">6</text>
    <text x="540" y="128">7</text><text x="580" y="128">8</text><text x="620" y="128">9</text>
  </g>
  <text x="460" y="58" text-anchor="middle" class="ink t b">9 unanswered probes</text>
  <text x="460" y="76" text-anchor="middle" class="ink2 n mono">tcp_keepalive_intvl: 75 s apart</text>

  <!-- give up -->
  <circle cx="665" cy="100" r="6" class="lost"/>
  <text x="680" y="58" text-anchor="end" class="lost t b">Give up</text>
  <text x="680" y="76" text-anchor="end" class="ink2 n mono">ETIMEDOUT</text>

  <!-- bracket under the probing -->
  <path d="M300,142 L300,150 L665,150 L665,142" class="line"/>
  <text x="482" y="170" text-anchor="middle" class="ink2 n">about 11 minutes of probing with Linux defaults</text>

  <text x="40" y="206" class="ink2 n">A probe answered with an ACK means the peer's TCP still has the connection. An RST means it doesn't.</text>
</svg>
