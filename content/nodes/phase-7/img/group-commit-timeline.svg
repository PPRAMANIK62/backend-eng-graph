<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .box{fill:#f0efec;stroke:#8a8984;stroke-width:1.5}
    .focus{fill:#2a78d6} .focus-s{stroke:#2a78d6;fill:none;stroke-width:1.5}
    .lost{fill:#eb6834} .lost-s{stroke:#eb6834;fill:none;stroke-width:3}
    .safe-box{fill:#1baf7a;fill-opacity:.18;stroke:#1baf7a;stroke-width:1.5}
    .focus-box{fill:#2a78d6;fill-opacity:.14;stroke:#2a78d6;stroke-width:1.5}
    .lost-box{fill:#eb6834;fill-opacity:.18;stroke:#eb6834;stroke-width:1.5}
    .safe-s{stroke:#1baf7a;fill:none;stroke-width:3}
    .old{fill:#b8b7b2}
    .old-box{fill:none;stroke:#b8b7b2;stroke-width:1.5;stroke-dasharray:4 3}
    .line{stroke:#8a8984;stroke-width:1.5;fill:none}
    .arrowhead{fill:#8a8984}
    .t{font-size:14px} .n{font-size:12px} .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .b{font-weight:600}
    @media (prefers-color-scheme: dark){
      .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .box{fill:#2a2a28;stroke:#8a8984}
      .focus{fill:#3987e5} .focus-s{stroke:#3987e5}
      .lost{fill:#d95926} .lost-s{stroke:#d95926}
      .safe-box{fill:#199e70;stroke:#199e70}
      .focus-box{fill:#3987e5;stroke:#3987e5}
      .lost-box{fill:#d95926;stroke:#d95926}
      .safe-s{stroke:#199e70}
      .old{fill:#5c5b57} .old-box{stroke:#5c5b57}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="20" y="24" class="ink t b">One fsync per commit</text>
  <text x="20" y="62" class="ink t">A</text>
  <text x="20" y="96" class="ink t">B</text>
  <text x="20" y="130" class="ink t">C</text>
  <line x1="50" y1="146" x2="700" y2="146" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="164" text-anchor="end" class="ink2 n">time</text>
  <rect x="60" y="44" width="180" height="28" rx="6" class="focus-s"/>
  <text x="150" y="63" text-anchor="middle" class="ink n">fsync</text>
  <line x1="80" y1="92" x2="240" y2="92" class="line" stroke-dasharray="4 4"/>
  <rect x="240" y="78" width="180" height="28" rx="6" class="focus-s"/>
  <text x="330" y="97" text-anchor="middle" class="ink n">fsync</text>
  <line x1="100" y1="126" x2="420" y2="126" class="line" stroke-dasharray="4 4"/>
  <rect x="420" y="112" width="180" height="28" rx="6" class="focus-s"/>
  <text x="510" y="131" text-anchor="middle" class="ink n">fsync</text>
  <text x="604" y="63" class="ink2 n">3 fsyncs, one after</text>
  <text x="604" y="79" class="ink2 n">another</text>

  <text x="20" y="206" class="ink t b">Group commit</text>
  <text x="20" y="244" class="ink t">A</text>
  <text x="20" y="278" class="ink t">B</text>
  <text x="20" y="312" class="ink t">C</text>
  <line x1="50" y1="328" x2="700" y2="328" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="346" text-anchor="end" class="ink2 n">time</text>
  <rect x="60" y="226" width="180" height="28" rx="6" class="focus-s"/>
  <text x="150" y="245" text-anchor="middle" class="ink n">fsync (A leads)</text>
  <line x1="80" y1="274" x2="240" y2="274" class="line" stroke-dasharray="4 4"/>
  <line x1="100" y1="308" x2="240" y2="308" class="line" stroke-dasharray="4 4"/>
  <rect x="240" y="260" width="180" height="62" rx="6" class="focus-s"/>
  <text x="330" y="287" text-anchor="middle" class="ink n">one fsync</text>
  <text x="330" y="305" text-anchor="middle" class="ink n">covers B and C</text>
  <text x="436" y="287" class="ink2 n">2 fsyncs instead of 3; C is durable</text>
  <text x="436" y="305" class="ink2 n">a whole fsync sooner</text>

  <line x1="80" y1="364" x2="120" y2="364" class="line" stroke-dasharray="4 4"/>
  <text x="128" y="368" class="ink2 n">commit record written, waiting for a flush</text>
  <rect x="420" y="354" width="40" height="20" rx="6" class="focus-s"/>
  <text x="468" y="368" class="ink2 n">fsync of the log; replies go out when it ends</text>
</svg>
